// ── PROFILE EDITOR (students & teachers) ──────────────────────
function ProfileModal({user, classes, open, onClose, onSaved}) {
  const [name,setName]=useState(user.name||"");
  const [email,setEmail]=useState(user.email||"");
  const [studentId,setStudentId]=useState(user.studentId||"");
  const [classId,setClassId]=useState(user.classId||"");
  const [password,setPassword]=useState("");
  const [msg,setMsg]=useState("");
  const [saving,setSaving]=useState(false);
  const [aiKeyInput,setAiKeyInput]=useState(()=>getAIKey());
  const [aiKeyMsg,setAiKeyMsg]=useState("");

  useEffect(()=>{ if(open){ setName(user.name||"");setEmail(user.email||"");setStudentId(user.studentId||"");setClassId(user.classId||"");setPassword("");setMsg("");setAiKeyInput(getAIKey());setAiKeyMsg(""); } },[open]);

  async function save(){
    setMsg("");
    if(!name.trim()){setMsg("Name cannot be empty.");return;}
    if(user.role==="student" && !studentId.trim()){setMsg("Student ID cannot be empty.");return;}
    setSaving(true);
    try {
      const all = await fsAll("users");
      if(user.role==="student" && all.find(u=>u.id!==user.id && (u.studentId||"")===studentId.trim())){setMsg("That Student ID is already used by someone else.");setSaving(false);return;}
      if(email.trim() && all.find(u=>u.id!==user.id && (u.email||"").toLowerCase()===email.trim().toLowerCase())){setMsg("That email is already used.");setSaving(false);return;}
      const updated = {...user, name:name.trim(), email:email.trim().toLowerCase()};
      if(user.role==="student"){ updated.studentId=studentId.trim(); updated.classId=classId; }
      if(password.trim()) updated.password=password.trim();
      await fsSet("users", user.id, updated);
      saveSession(updated);
      await onSaved(updated);
      setMsg("✅ Saved!");
      setTimeout(()=>{ onClose(); }, 600);
    } catch(e){ setMsg("Error saving: "+(e.message||e)); }
    setSaving(false);
  }

  async function saveAIKey(){
    const k=aiKeyInput.trim();
    setAIKey(k);
    await saveAIKeyToCloud(k);
    setAiKeyMsg(k?"✅ AI Key saved & shared with students!":"✅ AI Key cleared.");
    setTimeout(()=>setAiKeyMsg(""),3000);
  }

  const inp={width:"100%",padding:"10px 12px",borderRadius:"8px",border:"1px solid "+C.br,fontSize:"13px",outline:"none",background:"#f8fafc",color:C.tx,fontFamily:F,boxSizing:"border-box",marginBottom:"9px"};

  return (
    <Modal open={open} onClose={onClose} title="⚙️ My Profile">
      {msg && <div style={{background:msg.startsWith("✅")?"#f0fdf4":"#fef2f2",border:"1px solid "+(msg.startsWith("✅")?"#86efac":"#fca5a5"),borderRadius:"7px",padding:"8px 11px",color:msg.startsWith("✅")?"#166534":"#991b1b",fontSize:"12px",marginBottom:"10px",fontFamily:F}}>{msg}</div>}
      <Label text="Full Name *"/>
      <input value={name} onChange={e=>setName(e.target.value)} style={inp}/>
      {user.role==="student" && <>
        <Label text="Student ID *"/>
        <input value={studentId} onChange={e=>setStudentId(e.target.value)} style={inp}/>
        <Label text="Class"/>
        <select value={classId} onChange={e=>setClassId(e.target.value)} style={inp}>
          <option value="">No class</option>
          {classes.map(c=><option key={c.id} value={c.id}>{c.name}{c.grade?" ("+c.grade+")":""}</option>)}
        </select>
      </>}
      <Label text={"Email "+(user.role==="student"?"(optional)":"*")}/>
      <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="email@example.com" style={inp}/>
      <Label text="New Password (leave blank to keep current)"/>
      <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" style={inp}/>
      <Btn onClick={save} disabled={saving} style={{width:"100%",marginTop:"4px"}}>{saving?"Saving…":"💾 Save Changes"}</Btn>
      {user.role==="teacher" && <div style={{marginTop:"16px",paddingTop:"14px",borderTop:"1px solid "+C.br}}>
        <div style={{fontSize:"12px",fontWeight:"800",color:C.tx,fontFamily:F,marginBottom:"6px"}}>🤖 Claude AI Key</div>
        <div style={{fontSize:"11px",color:C.mu,fontFamily:F,marginBottom:"8px",background:"#eff6ff",padding:"8px",borderRadius:"7px"}}>هذا المفتاح يُشارك تلقائياً مع الطلاب عبر Firebase لتمكين Reading Theory. الطلاب لا يرون المفتاح.</div>
        <input type="password" value={aiKeyInput} onChange={e=>setAiKeyInput(e.target.value)} placeholder="sk-ant-..." style={{...inp,marginBottom:"7px",fontFamily:"monospace"}}/>
        {aiKeyMsg&&<div style={{fontSize:"11px",color:C.s,fontWeight:"700",marginBottom:"7px",fontFamily:F}}>{aiKeyMsg}</div>}
        <Btn color={C.s} onClick={saveAIKey} style={{width:"100%"}}>💾 Save & Share AI Key with Students</Btn>
      </div>}
    </Modal>
  );
}

// ── REVIEW PAST QUIZ (see mistakes anytime) ───────────────────
function ReviewModal({response, quiz, open, onClose}) {
  if (!open || !response || !quiz) return null;
  const p = pct(response.score, response.totalQ);
  return (
    <Modal open={open} onClose={onClose} title={"📋 Review: "+quiz.title}>
      <div style={{textAlign:"center",marginBottom:"12px",padding:"10px",background:gc(p)+"15",borderRadius:"9px"}}>
        <div style={{fontSize:"26px",fontWeight:"900",color:gc(p),fontFamily:F}}>{response.score}/{response.totalQ} <span style={{fontSize:"16px"}}>({p}%)</span></div>
        <div style={{fontSize:"11px",color:C.mu,fontFamily:F}}>{quiz.type} · {response.completedAt} · Attempt #{response.attempt}</div>
      </div>
      {quiz.questions.map((q,idx)=>{
        const sel = response.answers ? response.answers[q.id] : undefined;
        const answered = sel!==undefined;
        const isLabelNum = quiz.type==="Image Labeling" && quiz.labelAnswerMode==="number";
        const isLabelWrite = quiz.type==="Image Labeling" && quiz.labelAnswerMode==="write";
        const isMatch = quiz.type==="Listening" && quiz.listenMatch;
        let isC;
        if(isLabelNum){ const cn=q.correctNum||String(idx+1); isC=String(sel).trim()===String(cn).trim(); }
        else if(isLabelWrite){ isC=String(sel||"").trim().toLowerCase()===String(q.correctLabel||"").trim().toLowerCase(); }
        else if(isMatch){ isC=String(sel||"").trim().toLowerCase()===String(q.correctLabel||"").trim().toLowerCase(); }
        else { isC = sel===q.correct; }
        if(isLabelNum || isLabelWrite || isMatch){
          const correctVal = isLabelNum ? (q.correctNum||String(idx+1)) : q.correctLabel;
          const labelWord = isLabelNum ? (q.correctLabel||q.text) : isMatch ? ((idx+1)+". "+q.text) : ("Part "+(idx+1));
          return (
            <div key={q.id} style={{marginBottom:"10px",padding:"10px",borderRadius:"9px",border:"2px solid "+(isC?C.s:C.d),background:isC?"#f0fdf4":"#fef2f2"}}>
              <div style={{display:"flex",gap:"7px",alignItems:"center"}}>
                <span style={{minWidth:"22px",height:"22px",borderRadius:"50%",background:isC?C.s:C.d,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"700",fontSize:"11px",flexShrink:0}}>{isC?"✓":"✗"}</span>
                <div style={{flex:1,fontSize:"13px",fontFamily:F,color:C.tx}}>
                  <strong>{labelWord}</strong>
                  <div style={{fontSize:"12px",marginTop:"3px"}}>
                    {isLabelNum?"Your number: ":isMatch?"Your letter: ":"Your answer: "}<strong style={{color:isC?"#166534":"#991b1b"}}>{answered?sel:"—"}</strong>
                    {!isC && <span style={{color:"#166534"}}>{" · Correct: "}<strong>{correctVal}</strong></span>}
                  </div>
                </div>
              </div>
              {!answered && <p style={{margin:"5px 0 0",fontSize:"11px",color:C.mu,fontStyle:"italic",fontFamily:F}}>You did not answer this.</p>}
            </div>
          );
        }
        return (
          <div key={q.id} style={{marginBottom:"12px",padding:"10px",borderRadius:"9px",border:"2px solid "+(isC?C.s:C.d),background:isC?"#f0fdf4":"#fef2f2"}}>
            <div style={{display:"flex",gap:"7px",marginBottom:"6px"}}>
              <span style={{minWidth:"22px",height:"22px",borderRadius:"50%",background:isC?C.s:C.d,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"700",fontSize:"11px",flexShrink:0}}>{isC?"✓":"✗"}</span>
              <div style={{flex:1}}>
                <span style={{fontSize:"9px",background:C.p+"18",color:C.p,padding:"1px 7px",borderRadius:"999px",fontWeight:"600",fontFamily:F}}>{q.skill}</span>
                <p style={{margin:"5px 0",fontSize:"13px",fontWeight:"600",color:C.tx,lineHeight:"1.5",fontFamily:F}}>{idx+1}. {q.text}</p>
              </div>
            </div>
            <div style={{display:"grid",gap:"4px"}}>
              {q.options.map((opt,i)=>{
                const isCorrect = i===q.correct;
                const isPicked = i===sel;
                let bg="#fff",bdr="1px solid "+C.br,col=C.tx;
                if(isCorrect){bg="#dcfce7";bdr="2px solid "+C.s;col="#166534";}
                else if(isPicked){bg="#fee2e2";bdr="2px solid "+C.d;col="#991b1b";}
                return (
                  <div key={i} style={{padding:"7px 10px",borderRadius:"7px",background:bg,border:bdr,color:col,fontSize:"12px",display:"flex",alignItems:"center",gap:"6px",fontFamily:F}}>
                    <span style={{fontWeight:"700"}}>{String.fromCharCode(65+i)}.</span>
                    <span style={{flex:1}}>{opt}</span>
                    {isCorrect && <span>✅</span>}
                    {isPicked && !isCorrect && <span>❌ your answer</span>}
                  </div>
                );
              })}
            </div>
            {!answered && <p style={{margin:"5px 0 0",fontSize:"11px",color:C.mu,fontStyle:"italic",fontFamily:F}}>You did not answer this question.</p>}
          </div>
        );
      })}
      <Btn onClick={onClose} style={{width:"100%",marginTop:"4px"}} color={C.mu}>Close</Btn>
    </Modal>
  );
}


// ── PROJECTS ADDON V1: Project assessments, submissions, AI review, Gradebook approval ──
const PROJECT_TYPES = [
  "Short Research Project","Presentation","Poster / Infographic","Writing Report","Vocabulary Project","Reading Response","Speaking / Video Project","Free Project"
];
function projectRubricFor(type){
  if(type==="Reading Response") return [
    {key:"understanding",label:"Understanding the Reading",points:3,student:"Show that you understood the main idea and important details."},
    {key:"personal",label:"Personal Response",points:2,student:"Give your opinion, feeling, or reaction clearly."},
    {key:"evidence",label:"Evidence from Text",points:2,student:"Support your answer with examples or details from the reading."},
    {key:"organization",label:"Organization",points:1,student:"Make your response organized and easy to follow."},
    {key:"language",label:"Language",points:2,student:"Use clear sentences with acceptable grammar and spelling."}
  ];
  return [
    {key:"content",label:"Content",points:3,student:"Your project is related to the topic and gives enough clear information."},
    {key:"organization",label:"Organization",points:2,student:"Your work is organized with clear parts such as title, introduction, body, and conclusion when needed."},
    {key:"language",label:"Language",points:2,student:"Your English is clear with acceptable grammar, spelling, and sentence structure."},
    {key:"requirements",label:"Requirements",points:2,student:"You followed the teacher's instructions and included the required parts."},
    {key:"creativity",label:"Creativity",points:1,student:"Your work shows effort, examples, suitable design, or a personal touch."}
  ];
}
function projectMaxScore(p){ return Math.max(1, Number(p && p.maxScore)||10); }
function projectAssignedToStudent(p, student){
  if(!p || !student) return false;
  if(p.status==="deleted") return false;
  if(p.assignMode==="student") return (p.studentIds||[]).includes(student.id);
  if(p.assignMode==="class") return (p.classIds||[]).some(cid=>sameClassId(cid, student.classId));
  return true;
}
function projectTargetStudents(p, students){ return (students||[]).filter(s=>projectAssignedToStudent(p,s)); }
function projectDateStatus(p){
  const now=new Date();
  const start=p&&p.startDate?new Date(p.startDate+"T00:00:00"):null;
  const end=p&&p.endDate?new Date(p.endDate+"T23:59:59"):null;
  if(start && now<start) return "not_started";
  if(end && now>end) return "ended";
  return "open";
}
function projectSubmissionMatchesStudent(sub, st){ return sub && st && (String(sub.studentId||"")===String(st.id)||String(sub.studentNumber||"")===String(st.studentId||"")); }
function projectSubmissionsForStudent(list, projectId, st){ return (list||[]).filter(s=>String(s.projectId)===String(projectId)&&projectSubmissionMatchesStudent(s,st)).sort((a,b)=>(b.attempt||0)-(a.attempt||0)||String(b.submittedAt||"").localeCompare(String(a.submittedAt||""))); }
function projectAllowedToResubmit(p, st, subs){
  const latest=projectSubmissionsForStudent(subs,p.id,st)[0];
  if(!latest) return false;
  if(latest.status==="resubmit_allowed") return true;
  return (p.resubmitStudentIds||[]).includes(st.id) || (p.resubmitClassIds||[]).some(cid=>sameClassId(cid,st.classId));
}
function projectSimilarityThreshold(rule){
  if(rule==="strict") return 75;
  if(rule==="lenient") return 90;
  return 85;
}
function projectNormalizeText(t){
  return String(t||"").toLowerCase()
    .replace(/[إأآا]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[ؤئ]/g,"ء")
    .replace(/[^a-z0-9\u0600-\u06ff\s]+/g," ")
    .replace(/\s+/g," ").trim();
}
function projectUsefulWords(t){
  const stop={the:1,a:1,an:1,and:1,or:1,to:1,of:1,in:1,on:1,for:1,is:1,are:1,was:1,were:1,be:1,with:1,this:1,that:1,it:1,as:1,by:1,from:1,at:1,عن:1,في:1,من:1,الى:1,إلى:1,على:1,و:1,او:1,أو:1,هو:1,هي:1,هذا:1,هذه:1,ان:1,أن:1};
  return projectNormalizeText(t).split(" ").filter(w=>w && w.length>2 && !stop[w]);
}
function projectNgrams(words,n){
  const arr=[]; for(let i=0;i<=words.length-n;i++) arr.push(words.slice(i,i+n).join(" ")); return arr;
}
function projectSimilarityScore(a,b){
  const wa=projectUsefulWords(a), wb=projectUsefulWords(b);
  if(wa.length<18 || wb.length<18) return 0;
  const sa=new Set(wa), sb=new Set(wb);
  let inter=0; sa.forEach(x=>{if(sb.has(x)) inter++;});
  const wordDice=(2*inter)/(sa.size+sb.size||1);
  const na=new Set(projectNgrams(wa,4)), nb=new Set(projectNgrams(wb,4));
  let ninter=0; na.forEach(x=>{if(nb.has(x)) ninter++;});
  const gramDice=(2*ninter)/(na.size+nb.size||1);
  return Math.round(Math.max(wordDice*100, gramDice*100));
}
function projectSimilarityEvidence(a,b){
  const wa=projectUsefulWords(a), wb=projectUsefulWords(b);
  for(let n=16;n>=8;n--){
    const nb=new Set(projectNgrams(wb,n));
    for(const g of projectNgrams(wa,n)){
      if(nb.has(g)) return g.split(" ").slice(0,32).join(" ");
    }
  }
  const nb6=new Set(projectNgrams(wb,6));
  const hit=projectNgrams(wa,6).find(x=>nb6.has(x));
  return hit||"Similar wording and repeated phrases were found.";
}
function projectCheckCopiedFromClassmate({project, submissions, currentStudent, currentText}){
  const text=String(currentText||"").trim();
  if(projectNormalizeText(text).length<120) return null;
  const threshold=projectSimilarityThreshold(project && project.similarityRule);
  let best=null;
  (submissions||[]).forEach(s=>{
    if(String(s.projectId)!==String(project.id)) return;
    if(String(s.studentId||"")===String(currentStudent.id||"")) return;
    if(["submitted","ai_corrected","approved","resubmit_allowed"].indexOf(s.status)<0) return;
    const otherText=String(s.text||s.fileText||"").trim();
    if(projectNormalizeText(otherText).length<120) return;
    const score=projectSimilarityScore(text, otherText);
    if(!best || score>best.score){
      best={score,threshold,matchedStudentName:s.studentName||"another student",matchedStudentId:s.studentNumber||s.studentId||"",evidenceCurrent:projectSimilarityEvidence(text, otherText),evidenceMatched:projectSimilarityEvidence(otherText, text),matchedSubmissionId:s.id};
    }
  });
  if(best && best.score>=threshold) return {...best,blocked:true,checkedAt:new Date().toISOString()};
  if(best && best.score>=70) return {...best,blocked:false,checkedAt:new Date().toISOString()};
  return null;
}
async function projectUploadFile(file, projectId, studentId){
  if(!file) return {url:"",name:"",size:0,type:""};
  const meta={name:file.name,size:file.size,type:file.type||""};
  if(FIREBASE_OK && storage && storage.ref){
    const clean=String(file.name||"project-file").replace(/[^a-zA-Z0-9._-]+/g,"_").slice(-80);
    const path="projectSubmissions/"+String(projectId||"project")+"/"+String(studentId||"student")+"/"+Date.now()+"_"+clean;
    const ref=storage.ref().child(path);
    await ref.put(file,{contentType:file.type||"application/octet-stream"});
    meta.url=await ref.getDownloadURL();
    meta.path=path;
  }
  return meta;
}
function projectRubricText(rubric){ return (rubric||[]).map(x=>"- "+x.label+": "+x.points+" marks. "+(x.student||"")).join("\n"); }
async function aiCorrectProjectSubmission({project, submission, student}){
  let apiKey=getAIKey();
  if(!apiKey){ apiKey=await loadAIKeyFromCloud(); if(apiKey) setAIKey(apiKey); }
  if(!apiKey) throw new Error("No AI key found. Save the Claude AI key first.");
  const rubric=project.rubric||projectRubricFor(project.type);
  const submittedText=String(submission.text || submission.fileText || "").trim();
  if(!submittedText){
    throw new Error("AI cannot read this submission content. Use Manual Grade, or ask the student to submit text/readable file.");
  }
  const prompt = `You are an English teacher assistant. Grade this student project strictly using the teacher's project type, instructions, and rubric.\n\nProject title: ${project.title}\nProject type: ${project.type}\nMax score: ${projectMaxScore(project)}\nTeacher instructions:\n${project.instructions||"No extra instructions."}\n\nRubric:\n${projectRubricText(rubric)}\n\nStudent name: ${student?student.name:(submission.studentName||"Student")}\nSubmission mode: ${submission.submissionMode||"text"}\nStudent submission:\n${submittedText.slice(0,12000)}\n\nReturn ONLY valid JSON in this exact format:\n{"score":8,"total":10,"criteria":[{"label":"Content","score":2.5,"max":3,"comment":"short comment"}],"studentFeedback":"2-3 short friendly sentences for the student","teacherNote":"short note for teacher about missing requirements or concerns"}\nUse decimal scores if needed. Do not exceed each criterion max. Requirements must be judged against the teacher instructions.`;
  const resp = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-3-5-sonnet-20241022",max_tokens:1400,temperature:0.2,messages:[{role:"user",content:prompt}]})
  });
  const json=await resp.json().catch(()=>null);
  if(!resp.ok) throw new Error((json&&json.error&&json.error.message)||("AI correction failed: "+resp.status));
  let text=(json.content&&json.content[0]&&json.content[0].text)||"";
  text=text.replace(/```json/g,"").replace(/```/g,"").trim();
  const start=text.indexOf("{"); const end=text.lastIndexOf("}"); if(start>=0&&end>start) text=text.slice(start,end+1);
  const parsed=eqParseJsonObject(text);
  const total=projectMaxScore(project);
  const score=Math.max(0,Math.min(total,Number(parsed.score)||0));
  return {...parsed,score,total,correctedAt:new Date().toISOString(),source:"ai"};
}

  async function approve(p,s,score,feedback){

    const gbId="project_grade_"+p.id;
    const q={id:gbId,code:"PRJ"+String(p.id).slice(-4).toUpperCase(),teacherId:user.id,title:p.title,type:"Project",difficulty:"Project",subject:"Project",classIds:p.assignMode==="class"?p.classIds:[],assignedStudents:p.assignMode==="student"?p.studentIds:[],status:"closed",questions:[{id:1,text:p.title,options:["Project"],correct:0,skill:"Project",difficulty:"Project"}],mode:"normal",masteryThreshold:60,importedIncludeInAverage:true,projectId:p.id,createdAt:p.createdAt||today(),updatedAt:today()};
    await fsSet("quizzes",gbId,q);
    const respId="project_response_"+s.id;
    await fsSet("responses",respId,{id:respId,quizId:gbId,studentId:s.studentId,studentName:s.studentName,score:finalScore,totalQ:10,attempt:s.attempt||1,mode:"project",projectId:p.id,projectSubmissionId:s.id,completedAt:new Date().toLocaleString(),ts:Date.now(),approvedAt:new Date().toISOString()});
    await fsSet("projectSubmissions",s.id,{...s,finalScore,teacherFeedback:feedback||s.teacherFeedback||s.aiReview?.studentFeedback||"",status:"approved",gradebookResponseId:respId,approvedAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    setMsg("✅ Approved and added to Gradebook."); await reload();
  }
  async function manualGrade(p,s){ const v=prompt("Final score out of 10:", s.finalScore!=null?s.finalScore:(s.aiReview&&s.aiReview.score)||""); if(v===null)return; const fb=prompt("Feedback for student:", s.teacherFeedback || (s.aiReview&&s.aiReview.studentFeedback)||"")||""; await approve(p,s,v,fb); }
  async function allowResubmit(p,s){ await fsSet("projectSubmissions",s.id,{...s,status:"resubmit_allowed",resubmitAllowedAt:new Date().toISOString(),updatedAt:new Date().toISOString()}); setMsg("✅ Resubmission allowed for "+(s.studentName||"student")); await reload(); }
  if(screen==="create"||screen==="edit") return <ProjectCreateForm user={user} data={data} myClasses={myClasses} myStudents={myStudents} editProject={screen==="edit"?editProject:null} onSaved={async()=>{await reload();setScreen("list");setEditProject(null);}} onCancel={()=>{setScreen("list");setEditProject(null);}}/>;
  return <div>
    <Card style={{marginBottom:"11px",background:"linear-gradient(135deg,"+C.dk+","+C.md+")",border:"none"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"8px"}}><div><strong style={{color:"#fff",fontSize:"14px",fontFamily:F}}>🧩 Projects</strong><p style={{margin:"4px 0 0",color:C.mu,fontSize:"11px",fontFamily:F}}>10-mark project assessments · AI suggests · teacher approves · Gradebook after approval.</p></div><Btn color={C.s} onClick={()=>setScreen("create")}>+ Project</Btn></div></Card>
    {msg&&<div style={{background:msg.startsWith("✅")?"#f0fdf4":msg.startsWith("⏳")?"#eff6ff":"#fef2f2",border:"1px solid "+(msg.startsWith("✅")?"#86efac":msg.startsWith("⏳")?"#93c5fd":"#fca5a5"),borderRadius:"9px",padding:"9px",fontSize:"12px",marginBottom:"9px",whiteSpace:"pre-wrap",fontFamily:F}}>{msg}</div>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"8px",marginBottom:"10px"}}><Stat icon="🧩" label="Projects" value={projects.length} color={C.p}/><Stat icon="📥" label="Submitted" value={subs.length} color={C.s}/><Stat icon="⏳" label="Need Approval" value={subs.filter(s=>s.status==="submitted"||s.status==="ai_corrected").length} color={C.w}/><Stat icon="✅" label="Approved" value={subs.filter(s=>s.status==="approved").length} color={C.s}/></div>
    <Card style={{marginBottom:"10px"}}><div style={{display:"flex",gap:"7px",flexWrap:"wrap"}}><select value={fProject} onChange={e=>setFProject(e.target.value)} style={{flex:2,minWidth:"150px",padding:"9px",borderRadius:"8px",border:"1px solid "+C.br,fontFamily:F}}><option value="all">All Projects</option>{projects.map(p=><option key={p.id} value={p.id}>{p.title}</option>)}</select><select value={fClass} onChange={e=>setFClass(e.target.value)} style={{flex:1,minWidth:"120px",padding:"9px",borderRadius:"8px",border:"1px solid "+C.br,fontFamily:F}}><option value="all">All Classes</option>{myClasses.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select><select value={fStatus} onChange={e=>setFStatus(e.target.value)} style={{flex:1,minWidth:"120px",padding:"9px",borderRadius:"8px",border:"1px solid "+C.br,fontFamily:F}}><option value="all">All Status</option><option value="submitted">Submitted</option><option value="ai_corrected">AI Corrected</option><option value="approved">Approved</option><option value="resubmit_allowed">Resubmission Allowed</option></select></div></Card>
    <strong style={{fontSize:"13px",color:C.tx,fontFamily:F,display:"block",marginBottom:"8px"}}>Project List</strong>
    {projects.length===0?<Card><p style={{textAlign:"center",color:C.mu,fontFamily:F,padding:"14px"}}>No projects yet.</p></Card>:projects.map(p=>{const targets=projectTargetStudents(p,myStudents);const ps=subs.filter(s=>s.projectId===p.id);const status=projectDateStatus(p);return <Card key={p.id} style={{marginBottom:"8px"}}><div style={{display:"flex",gap:"8px",alignItems:"flex-start"}}><div style={{fontSize:"22px"}}>🧩</div><div style={{flex:1}}><div style={{fontSize:"13px",fontWeight:"900",color:C.tx,fontFamily:F}}>{p.title}</div><div style={{fontSize:"10px",color:C.mu,fontFamily:F}}>{p.type} · {p.assignMode} · {targets.length} students · {p.startDate||"—"} → {p.endDate||"—"} · {status}</div><div style={{fontSize:"10px",fontWeight:"800",color:C.p,fontFamily:F}}>Submitted {ps.length} · Approved {ps.filter(x=>x.status==="approved").length}</div></div><div style={{display:"flex",gap:"5px",flexWrap:"wrap",justifyContent:"flex-end"}}><Btn size="sm" color={C.pu} onClick={()=>{setEditProject(p);setScreen("edit");}}>Edit</Btn><Btn size="sm" color={C.d} onClick={()=>delProject(p)}>Delete</Btn></div></div></Card>})}
    <strong style={{fontSize:"13px",color:C.tx,fontFamily:F,display:"block",margin:"12px 0 8px"}}>Submissions</strong>
    {visibleSubs.length===0?<Card><p style={{textAlign:"center",color:C.mu,fontFamily:F,padding:"14px"}}>No submissions for this filter.</p></Card>:visibleSubs.map(s=>{const p=projects.find(x=>x.id===s.projectId);const st=myStudents.find(x=>projectSubmissionMatchesStudent(s,x));const cls=st&&data.classes.find(c=>c.id===st.classId);const ai=s.aiReview;return <Card key={s.id} style={{marginBottom:"9px",border:"1px solid "+(s.status==="approved"?"#86efac":s.status==="ai_corrected"?"#93c5fd":C.br)}}><div style={{display:"flex",gap:"8px",alignItems:"flex-start"}}><div style={{flex:1}}><div style={{fontSize:"13px",fontWeight:"900",color:C.tx,fontFamily:F}}>{st?st.name:s.studentName} <span style={{fontSize:"10px",color:C.mu,fontWeight:"500"}}>#{st?st.studentId:s.studentNumber}</span></div><div style={{fontSize:"10px",color:C.mu,fontFamily:F}}>{cls?cls.name:"—"} · {p?p.title:"Unknown project"} · Attempt {s.attempt||1} · {s.submissionMode} · {s.status}</div>{s.fileName&&<div style={{fontSize:"10px",color:C.p,fontFamily:F}}>📎 {s.fileUrl?<a href={s.fileUrl} target="_blank">{s.fileName}</a>:s.fileName}</div>}{s.similarityCheck&&<div style={{fontSize:"10px",color:s.similarityCheck.score>=70?C.w:C.mu,fontWeight:"800",fontFamily:F}}>Similarity check: {s.similarityCheck.score}% with {s.similarityCheck.matchedStudentName||"another student"}</div>}</div>{s.finalScore!=null&&<div style={{fontSize:"18px",fontWeight:"900",color:gc(s.finalScore*10),fontFamily:F}}>{s.finalScore}/10</div>}</div>{s.text&&<details style={{marginTop:"8px"}}><summary style={{fontSize:"11px",fontWeight:"800",color:C.p,cursor:"pointer",fontFamily:F}}>View text</summary><div style={{whiteSpace:"pre-wrap",fontSize:"11px",background:"#f8fafc",border:"1px solid "+C.br,borderRadius:"8px",padding:"8px",marginTop:"5px",maxHeight:"180px",overflowY:"auto",fontFamily:F}}>{s.text}</div></details>}{s.similarityCheck&&<details style={{marginTop:"8px"}}><summary style={{fontSize:"11px",fontWeight:"800",color:C.w,cursor:"pointer",fontFamily:F}}>Similarity evidence</summary><div style={{fontSize:"11px",background:"#fffbeb",border:"1px solid #fde68a",borderRadius:"8px",padding:"8px",marginTop:"5px",fontFamily:F}}><b>Matched student:</b> {s.similarityCheck.matchedStudentName} #{s.similarityCheck.matchedStudentId}<br/><b>Similarity:</b> {s.similarityCheck.score}%<br/><b>Current evidence:</b><br/>{s.similarityCheck.evidenceCurrent}<br/><b>Matched evidence:</b><br/>{s.similarityCheck.evidenceMatched}</div></details>}{ai&&<div style={{marginTop:"8px",background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:"9px",padding:"8px"}}><div style={{fontSize:"12px",fontWeight:"900",color:C.p,fontFamily:F}}>AI Suggested Score: {ai.score}/10</div>{(ai.criteria||[]).map((c,i)=><div key={i} style={{fontSize:"11px",color:C.tx,fontFamily:F,padding:"3px 0"}}><b>{c.label}:</b> {c.score}/{c.max} — {c.comment}</div>)}{ai.studentFeedback&&<div style={{fontSize:"11px",color:C.tx,fontFamily:F,marginTop:"5px"}}>Feedback: {ai.studentFeedback}</div>}</div>}<div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginTop:"9px"}}>{s.status!=="approved"&&<><Btn size="sm" color={C.p} onClick={()=>runAI(p,s)}>AI Correct</Btn><Btn size="sm" color={C.s} onClick={()=>approve(p,s,(ai&&ai.score)||s.finalScore||0,(ai&&ai.studentFeedback)||s.teacherFeedback||"")}>Approve AI Score</Btn><Btn size="sm" color={C.w} onClick={()=>manualGrade(p,s)}>Manual / Edit</Btn></>}<Btn size="sm" color={C.pu} onClick={()=>allowResubmit(p,s)}>Allow Resubmission</Btn></div></Card>})}
  </div>;
}

function StudentApp({user, data, onLogout, reload, directQuiz, clearDirect}) {
  const [tab,setTab] = useState("home");
  const [taking,setTaking] = useState(directQuiz||null);
  const [profileOpen,setProfileOpen] = useState(false);
  const [reviewResp,setReviewResp] = useState(null);

  const myResps = responsesForStudent(data.responses,user);
  const myClass = data.classes.find(c=>c.id===user.classId);
  const available = data.quizzes.filter(q=>{
    // Private quiz: only assigned students can see it
    if(q.assignedStudents && q.assignedStudents.length>0){
      if(!q.assignedStudents.includes(user.id)) return false;
    } else {
      // Otherwise use class targeting (empty = everyone)
      const forMe=!q.classIds||q.classIds.length===0||q.classIds.includes(user.classId);
      if(!forMe) return false;
    }
    const open=q.status!=="closed"&&(!q.closeDate||new Date(q.closeDate)>=new Date());
    return open;
  });
  const myAnn = data.announcements.filter(a=>!a.classIds||a.classIds.length===0||a.classIds.includes(user.classId));
  const skills = calcSkills(myResps,data.quizzes);
  const badges = calcBadges(myResps,data.quizzes);
  const board = data.users.filter(u=>u.role==="student").map(s=>{
    const rs=responsesForStudent(data.responses,s);
    return {...s,avg:rs.length?Math.round(rs.reduce((a,r)=>a+pct(r.score,r.totalQ),0)/rs.length):0,total:rs.length};
  }).filter(s=>s.total>0).sort((a,b)=>b.avg-a.avg||(b.total-a.total));
  const allowedAttemptsForQuiz = q => 1 + (q.allowRetake ? Math.max(0,Number(q.maxRetakes ?? 2)||0) : 0);
  const canReviewQuizResponse = (q) => myResps.filter(r=>r.quizId===q.id).length >= allowedAttemptsForQuiz(q);

  if(taking){
    const TakeComponent = (taking.mode!=="game") ? TakeQuiz : GameQuiz;
    return <TakeComponent quiz={taking} student={user} allResponses={data.responses} onSaved={reload} onDone={()=>{setTaking(null);if(clearDirect)clearDirect();}}/>;
  }

  const tabs=[{id:"home",icon:"🏠",label:"Home"},{id:"projects",icon:"🧩",label:"Projects"},{id:"reading",icon:"📖",label:"Reading"},{id:"readingTheory",icon:"📚",label:"Theory"},{id:"progress",icon:"📈",label:"Progress"},{id:"mastery",icon:"🎯",label:"Mastery"},{id:"badges",icon:"🏆",label:"Badges"},{id:"board",icon:"👑",label:"Leaderboard"}];

  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",fontFamily:F,background:C.bg}}>
      <HDR title={"Hi, "+user.name.split(" ")[0]+"! 👋"} sub={myClass?myClass.name:"ID: "+user.studentId}
        right={<><Btn size="sm" onClick={()=>{if(confirm("Update to the latest version? The app will reload."))forceUpdate();}} color={C.mu}>🔄</Btn><Btn size="sm" onClick={()=>setProfileOpen(true)} color={C.p}>⚙️</Btn><Btn size="sm" onClick={onLogout} color="#475569">Logout</Btn></>}/>
      <TabBar tabs={tabs} active={tab} onChange={setTab}/>
      <div style={{flex:1,overflowY:"auto"}}>
      <div style={{maxWidth:"780px",margin:"0 auto",padding:"14px"}}>
        {tab==="home" && <div>
          {(()=>{ const newQuizzes=available.filter(q=>!myResps.some(r=>r.quizId===q.id)); if(newQuizzes.length===0) return null; return (
            <div style={{background:"linear-gradient(135deg,#3b82f6,#2563eb)",borderRadius:"11px",padding:"12px 15px",marginBottom:"11px",display:"flex",alignItems:"center",gap:"11px"}}>
              <div style={{fontSize:"24px"}}>🔔</div>
              <div style={{flex:1}}>
                <div style={{fontWeight:"800",fontSize:"13px",color:"#fff",fontFamily:F}}>{newQuizzes.length} new quiz{newQuizzes.length>1?"zes":""} for you!</div>
                <div style={{fontSize:"11px",color:"#dbeafe",fontFamily:F,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{newQuizzes.map(q=>q.title).join(", ")}</div>
              </div>
            </div>
          );})()}
          {myAnn.map(a=><div key={a.id} style={{background:"#fffbeb",border:"1px solid #fbbf24",borderRadius:"9px",padding:"9px 13px",marginBottom:"9px"}}>
            <div style={{fontWeight:"700",fontSize:"12px",color:"#92400e",fontFamily:F}}>📣 {a.title}</div>
            <div style={{fontSize:"12px",color:"#78350f",marginTop:"2px",fontFamily:F}}>{a.text}</div>
          </div>)}
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"9px",marginBottom:"14px"}}>
            <Stat icon="📝" label="Done" value={myResps.length} color={C.p}/>
            <Stat icon="🎯" label="Avg" value={myResps.length?Math.round(myResps.reduce((a,r)=>a+pct(r.score,r.totalQ),0)/myResps.length)+"%":"—"} color={C.s}/>
            <Stat icon="🏅" label="Badges" value={badges.length+"/"+BADGE_DEFS.length} color={C.w}/>
          </div>
          <strong style={{fontSize:"13px",color:C.tx,display:"block",marginBottom:"9px",fontFamily:F}}>📚 Available Quizzes</strong>
          {available.length===0?<Card><p style={{textAlign:"center",color:C.mu,fontFamily:F,padding:"14px"}}>No quizzes available yet.</p></Card>
          :available.map((quiz,i)=>{
            const done=myResps.filter(r=>r.quizId===quiz.id);
            const last=done.length?pct(done[done.length-1].score,done[done.length-1].totalQ):null;
            const totalAllowedAttempts=allowedAttemptsForQuiz(quiz);
            const locked=done.length>=totalAllowedAttempts;
            const col=COLORS[i%COLORS.length];
            const icon=quiz.type==="Listening"?"🎧":quiz.type==="Grammar"?"✏️":quiz.type==="Vocabulary"?"📚":"📖";
            return <Card key={quiz.id} style={{marginBottom:"8px",border:"1px solid "+col+"30",opacity:locked?0.6:1}}>
              <div style={{display:"flex",alignItems:"center",gap:"11px"}}>
                <div style={{width:"38px",height:"38px",borderRadius:"9px",background:col+"20",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"17px",flexShrink:0}}>{icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:"700",color:C.tx,fontSize:"13px",fontFamily:F,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{quiz.mode==="game"&&<span style={{marginRight:"4px"}}>🎮</span>}{quiz.title}{done.length===0&&<span style={{marginLeft:"6px",fontSize:"9px",background:C.d,color:"#fff",padding:"1px 7px",borderRadius:"999px",fontWeight:"800",verticalAlign:"middle"}}>NEW</span>}</div>
                  <div style={{fontSize:"10px",color:C.mu,fontFamily:F}}>{quiz.mode==="game"?"🎮 Game · ":""}{quiz.type} · {quiz.difficulty} · {quiz.questions.length}Q · Pass:{quiz.masteryThreshold??MASTERY_DEFAULT}% · Retakes:{quiz.allowRetake?(quiz.maxRetakes??2):0}</div>
                  {last!==null && <div style={{fontSize:"10px",fontWeight:"600",color:gc(last),fontFamily:F}}>Last: {last}%{done.length>1?" · "+done.length+" attempts":""} · Attempts: {done.length}/{totalAllowedAttempts}</div>}
                </div>
                <Btn size="sm" onClick={()=>!locked&&setTaking(quiz)} color={locked?"#94a3b8":col} disabled={locked}>{locked?"Done":done.length?"Retry":"Start"}</Btn>
              </div>
            </Card>;
          })}
        </div>}

        {tab==="reading" && <ReadingProgressStudent user={user} data={data} reload={reload} onHome={()=>setTab("home")} onReading={()=>setTab("reading")}/>}
        {tab==="readingTheory" && <ReadingTheoryStudent user={user} data={data} reload={reload}/>}
        {tab==="projects" && <StudentProjects user={user} data={data} reload={reload}/>}

        {tab==="progress" && <div>
          {myResps.length===0?<Card><p style={{textAlign:"center",color:C.mu,fontFamily:F,padding:"18px"}}>Complete quizzes to see progress.</p></Card>:<>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"9px",marginBottom:"12px"}}>
              <Stat icon="✅" label="Done" value={myResps.length} color={C.p}/>
              <Stat icon="⭐" label="Best" value={Math.max(...myResps.map(r=>pct(r.score,r.totalQ)))+"%"} color={C.s}/>
              <Stat icon="📊" label="Avg" value={Math.round(myResps.reduce((a,r)=>a+pct(r.score,r.totalQ),0)/myResps.length)+"%"} color={C.w}/>
            </div>
            <Card style={{marginBottom:"11px"}}>
              <strong style={{fontSize:"12px",color:C.tx,display:"block",marginBottom:"9px",fontFamily:F}}>📈 Score History</strong>
              <ResponsiveContainer width="100%" height={170}>
                <LineChart data={myResps.map((r,i)=>({n:"#"+(i+1),s:pct(r.score,r.totalQ)}))}>
                  <XAxis dataKey="n" tick={{fontSize:10,fill:C.mu}} axisLine={false} tickLine={false}/>
                  <YAxis domain={[0,100]} tickFormatter={v=>v+"%"} tick={{fontSize:9,fill:C.mu}}/>
                  <Tooltip formatter={v=>[v+"%"]}/>
                  <Line type="monotone" dataKey="s" stroke={C.p} strokeWidth={2} dot={{fill:C.p,r:3}}/>
                </LineChart>
              </ResponsiveContainer>
            </Card>
            <Card><strong style={{fontSize:"12px",color:C.tx,display:"block",marginBottom:"9px",fontFamily:F}}>📋 All Attempts</strong>
              {[...myResps].reverse().map((r,i)=>{let quiz =data.quizzes.find(q=>q.id===r.quizId);const p=pct(r.score,r.totalQ);return(
                <div key={r.id} onClick={()=>{if(!quiz)return;if(canReviewQuizResponse(quiz))setReviewResp({response:r,quiz});else alert("Answer review will open after your final allowed attempt.");}} style={{display:"flex",alignItems:"center",gap:"9px",padding:"9px 4px",borderBottom:i<myResps.length-1?"1px solid "+C.br:"none",cursor:quiz?"pointer":"default",borderRadius:"7px"}}>
                  <div style={{width:"32px",height:"32px",borderRadius:"50%",background:gc(p)+"20",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:"10px",fontWeight:"800",color:gc(p),fontFamily:F}}>{p}%</span></div>
                  <div style={{flex:1}}><div style={{fontWeight:"600",fontSize:"12px",color:C.tx,fontFamily:F}}>{quiz?.title||"Unknown"}</div><div style={{fontSize:"10px",color:C.mu,fontFamily:F}}>{quiz?.type} · {r.completedAt} · #{r.attempt}</div></div>
                  {r.selfRating>0&&<span style={{fontSize:"11px"}}>{Array(r.selfRating).fill("⭐").join("")}</span>}
                  {quiz&&canReviewQuizResponse(quiz)&&<span style={{fontSize:"11px",color:C.p,fontWeight:"700",fontFamily:F}}>Review →</span>}
                  {quiz&&!canReviewQuizResponse(quiz)&&<span style={{fontSize:"10px",color:C.w,fontWeight:"700",fontFamily:F}}>Locked</span>}
                </div>
              );})}
            </Card>
          </>}
        </div>}

        {tab==="mastery" && <div>
          <Card style={{marginBottom:"11px",background:"linear-gradient(135deg,"+C.dk+","+C.md+")",border:"none"}}>
            <strong style={{color:"#fff",fontSize:"14px",display:"block",marginBottom:"3px",fontFamily:F}}>🎯 Skill Mastery</strong>
            <p style={{margin:0,color:C.mu,fontSize:"11px",fontFamily:F}}>80%+ = Mastered · 60–79% = Developing · below 60% = Needs Work</p>
          </Card>
          {skills.length===0?<Card><p style={{textAlign:"center",color:C.mu,fontFamily:F,padding:"18px"}}>Complete quizzes to unlock your mastery map.</p></Card>:<>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"9px",marginBottom:"11px"}}>
              <Stat icon="✅" label="Mastered" value={skills.filter(s=>s.score>=80).length} color={C.s}/>
              <Stat icon="🟡" label="Developing" value={skills.filter(s=>s.score>=60&&s.score<80).length} color={C.w}/>
              <Stat icon="🔴" label="Needs Work" value={skills.filter(s=>s.score<60).length} color={C.d}/>
            </div>
            <Card style={{marginBottom:"11px"}}>{skills.map(s=><SBar key={s.skill} {...s}/>)}</Card>
            <Card><strong style={{fontSize:"12px",color:C.tx,display:"block",marginBottom:"9px",fontFamily:F}}>🗺️ Skill Radar</strong>
              <ResponsiveContainer width="100%" height={190}><RadarChart data={skills}><PolarGrid stroke={C.br}/><PolarAngleAxis dataKey="skill" tick={{fontSize:8,fill:C.mu}}/><Radar dataKey="score" stroke={C.p} fill={C.p} fillOpacity={0.25}/></RadarChart></ResponsiveContainer>
            </Card>
          </>}
        </div>}

        {tab==="badges" && <div>
          <Card style={{marginBottom:"11px",background:"linear-gradient(135deg,"+C.dk+","+C.md+")",border:"none"}}>
            <strong style={{color:"#fff",fontSize:"14px",display:"block",marginBottom:"2px",fontFamily:F}}>🏆 Badges</strong>
            <p style={{margin:0,color:C.mu,fontSize:"11px",fontFamily:F}}>{badges.length} of {BADGE_DEFS.length} earned</p>
          </Card>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"9px"}}>
            {BADGE_DEFS.map(b=>{const e=badges.includes(b.id);return(

  function parseRows(rows){
    setErr("");
    if(!rows||!rows.length){setErr("No rows found.");return;}

    // Auto-detect skill. For Grammar/Vocab quiz types, FORCE the skill to match the type
    // (ignore any "Main Idea" etc. that came from the file or AI).
    function autoSkill(text, providedSkill) {
      return detectSkill(text, providedSkill, type);
    }

    // Try to detect a header row and map columns by name
    const first = rows[0] || [];
    const headerText = first.map(c=>String(c||"").trim().toLowerCase());
    const looksHeader = headerText.some(h => h.includes("question")||h.includes("option")||h.includes("answer")||h.includes("correct"));

    let colMap = null;
    if (looksHeader) {
      colMap = {q:-1,a:-1,b:-1,c:-1,d:-1,correct:-1,skill:-1,diff:-1};
      headerText.forEach((h,i)=>{
        if (colMap.q<0 && (h==="question"||h.includes("question text")||(h.includes("question")&&!h.includes("no")&&!h.includes("type")&&!h.includes("number"))) ) colMap.q=i;
        else if (h==="a"||h==="option a"||h.includes("option a")||h==="opt a") colMap.a=i;
        else if (h==="b"||h==="option b"||h.includes("option b")||h==="opt b") colMap.b=i;
        else if (h==="c"||h==="option c"||h.includes("option c")||h==="opt c") colMap.c=i;
        else if (h==="d"||h==="option d"||h.includes("option d")||h==="opt d") colMap.d=i;
        else if (h.includes("correct")||h.includes("answer")||h==="key") colMap.correct=i;
        else if (h.includes("skill")) colMap.skill=i;
        else if (h.includes("difficulty")||h.includes("level")) colMap.diff=i;
      });
      // If we couldn't find proper option columns by name, fall back to position
      if (colMap.q<0||colMap.a<0||colMap.b<0) colMap = null;
    }

    let startRow = looksHeader ? 1 : 0;
    let data = rows.slice(startRow).filter(r=>r&&r.length&&String(r[colMap?colMap.q:0]||"").trim());
    if(!data.length){setErr("No question rows found. Each row needs a question, 4 options, and the correct answer.");return;}

    let result =[],skipped=[];
    data.forEach((r,i)=>{
      let q,a,b,c,d,cl,sk,df;
      if (colMap) {
        q=String(r[colMap.q]||"").trim();
        a=String(r[colMap.a]||"").trim();
        b=String(r[colMap.b]||"").trim();
        c=colMap.c>=0?String(r[colMap.c]||"").trim():"";
        d=colMap.d>=0?String(r[colMap.d]||"").trim():"";
        cl=colMap.correct>=0?String(r[colMap.correct]||"A").trim().toUpperCase():"A";
        sk=colMap.skill>=0?String(r[colMap.skill]||"").trim():"";
        df=colMap.diff>=0?String(r[colMap.diff]||"").trim():"";
      } else {
        q=String(r[0]||"").trim();a=String(r[1]||"").trim();b=String(r[2]||"").trim();c=String(r[3]||"").trim();d=String(r[4]||"").trim();
        cl=String(r[5]||"A").trim().toUpperCase();sk=String(r[6]||"").trim();df=String(r[7]||"").trim();
      }
      if(!q||!a||!b||!c||!d){skipped.push(i+startRow+1);return;}
      // correct can be a letter (A-D) or a number (1-4) or the answer text
      let ci = ["A","B","C","D"].indexOf(cl);
      if (ci<0) { const n=parseInt(cl); if(n>=1&&n<=4) ci=n-1; }
      if (ci<0) { const opts=[a,b,c,d].map(x=>x.toLowerCase()); const f=opts.indexOf(cl.toLowerCase()); if(f>=0) ci=f; }
      if (ci<0) ci=0;
      result.push({id:result.length+1,text:q,options:[a,b,c,d],correct:ci,skill:autoSkill(q,sk),difficulty:DIFFICULTIES.includes(df)?df:diff});
    });
    if(!result.length){setErr("Could not read questions. Make sure your file has columns: Question, Option A, B, C, D, and Correct answer.");return;}
    if(skipped.length)setErr("Imported "+result.length+". Skipped rows "+skipped.join(", ")+" (missing data).");
    setPreview(result);setShowImport(true);
  }
  function handleFile(e){
    const file=e.target.files[0];if(!file)return;setErr("");setPreview(null);
    const isCSV=file.name.toLowerCase().endsWith(".csv");const reader=new FileReader();
    reader.onerror=()=>setErr("Could not read file. Try CSV.");
    reader.onload=ev=>{try{
      let rows=[];
      if(isCSV){const lines=ev.target.result.trim().split(/[\r\n]+/).filter(l=>l.trim());rows=lines.map(parseCsvLine);}
      else{const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellText:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:false});}
      parseRows(rows);
    }catch(ex){setErr("Import failed: "+ex.message+". Try CSV.");}};
    e.target.value="";if(isCSV)reader.readAsText(file);else reader.readAsArrayBuffer(file);
  }
  function parseCsvLine(line){const cols=[];let cur="",inQ=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"')inQ=!inQ;else if(ch===","&&!inQ){cols.push(cur.trim());cur="";}else cur+=ch;}cols.push(cur.trim());return cols;}
  function parsePaste(){
    if(!csvPaste.trim()){setErr("Paste your questions first.");return;}
    setErr("");setPreview(null);
    const lines=csvPaste.trim().split(/[\r\n]+/).filter(l=>l.trim());
    const useTab=lines[0].includes("\t");
    const rows=lines.map(l=>useTab?l.split("\t").map(x=>x.trim()):parseCsvLine(l));
    parseRows(rows);
  }
  function applyPreview(){setQuestions(preview);setPreview(null);setShowImport(false);setShowPaste(false);setCsvPaste("");}
  function save(){
    if(!title.trim()){setErr("⚠️ Add a quiz title.");window.scrollTo(0,0);return;}
    let valid;
    if(type==="Image Labeling"){
      if(!labelImage){setErr("⚠️ Add an image first (upload or paste a URL).");window.scrollTo(0,0);return;}
      // Each part needs a correct label. If choose-mode, options must be filled.
      valid=questions.filter(q=>(q.correctLabel||"").trim());
      if(!valid.length){setErr("⚠️ Add at least one word with its correct name.");return;}
      if(labelAnswerMode==="number"){
        const bad=valid.find(q=>!String(q.correctNum||"").trim());
        if(bad){setErr("⚠️ Each word needs its number (the number it matches on the image).");return;}
      }
      if(labelAnswerMode==="choose"){
        const bad=valid.find(q=>!q.options.every(o=>o.trim()));
        if(bad){setErr("⚠️ In choose mode, fill all 4 options for each part.");return;}
        // ensure correct index points to the correctLabel
        valid=valid.map(q=>{const ci=q.options.findIndex(o=>o.trim().toLowerCase()===(q.correctLabel||"").trim().toLowerCase());return {...q,correct:ci>=0?ci:0};});
      }
    } else if(type==="Listening" && listenMatch){
      const ans=matchAnswers.filter(a=>a.trim());
      if(ans.length<2){setErr("⚠️ Add at least 2 answer choices (a, b, c…).");return;}
      valid=questions.filter(q=>q.text.trim()&&String(q.correctLabel||"").trim());
      if(!valid.length){setErr("⚠️ Add at least one question with its correct letter.");return;}
      // normalize correct letter to lowercase
      valid=valid.map(q=>({...q,correctLabel:String(q.correctLabel).trim().toLowerCase()}));
    } else {
      valid=questions.filter(q=>q.text.trim()&&q.options.every(o=>o.trim()));
      if(!valid.length){setErr("⚠️ Add at least one complete question or import.");return;}
      const incomplete=questions.filter(q=>q.text.trim()||q.options.some(o=>o.trim())).filter(q=>!q.text.trim()||q.options.some(o=>!o.trim()));
      if(incomplete.length){setErr("⚠️ Some questions are incomplete.");return;}
    }
    // Safety: block oversized embedded audio (Firestore limit ~1MB per quiz)
    if(type==="Listening" && audioFile && audioFile.startsWith("data:") && audioFile.length>900000){
      setErr("⚠️ The uploaded audio is too large to save. Paste a ready MP3 link like your old tests.");window.scrollTo(0,0);return;
    }
    // Do not save worker-tts for students. It causes slow loading because it calls Worker/OpenAI every time.
    if(type==="Listening" && audioFile && String(audioFile).startsWith("worker-tts:")){
      setErr("⚠️ This old temporary AI voice cannot be saved. Generate AI Voice again to create a ready MP3 link, or use Device Voice.");window.scrollTo(0,0);return;
    }
    onSave({id:E.id||uid(),code:E.code||shortCode(),teacherId:teacher.id,title:title.trim(),type,difficulty:diff,subject,classIds,timer,masteryThreshold:thresh,allowRetake:retake,maxRetakes:retake?Math.max(0,Number(maxRetakes)||0):0,shuffle,mode,instantFeedback,reviewAnswers,gameTimerType,gameTimerSec,assignedStudents:visibility==="private"?assignedStudents:[],closeDate,passage,readingTimeMode:type==="Reading"?readingTimeMode:"auto",readingCustomMinutes:type==="Reading"?Math.max(0,Number(readingCustomMinutes)||0):0,labelImage:type==="Image Labeling"?labelImage:"",labelAnswerMode:type==="Image Labeling"?labelAnswerMode:"",audioFile:type==="Listening"&&audioFile&&!String(audioFile).startsWith("worker-tts:")?audioFile:"",voiceMode:type==="Listening"?voiceMode:"device",ttsVoice:type==="Listening"?ttsVoice:"",ttsVoiceStyle:type==="Listening"?ttsVoiceStyle:"single",ttsTone:type==="Listening"?ttsTone:"natural",listenLimit:type==="Listening"?listenLimit:0,listenMatch:type==="Listening"?listenMatch:false,matchShuffle:type==="Listening"&&listenMatch?matchShuffle:false,matchAnswers:type==="Listening"&&listenMatch?matchAnswers.filter(a=>a.trim()):[],audioControls:type==="Listening"?audioControls:null,questions:valid,status:E.id?(E.status||"open"):"open",createdAt:E.createdAt||today()});
  }

                  <div style={{fontSize:"11px",color:"#64748b",marginTop:"5px"}}>Mixed Emotions = fear, reassurance, light laugh, sadness, mild pain, controlled anger, joy.</div>
              <div style={{fontSize:"10px",color:"#6b21a8",margin:"-3px 0 8px",fontFamily:F}}>Multi‑Voice works best when the script uses labels like Dad:, Mom:, Boy:, Girl:, Speaker A:, Speaker B:</div>
              <input value={ttsWorkerUrl} onChange={e=>{setTtsWorkerUrl(e.target.value);localStorage.setItem("eq_tts_worker_url",e.target.value.trim());}} placeholder="🔗 AI Voice Worker URL" style={{...inp,marginBottom:"8px",fontSize:"11px"}}/>
              <Btn size="sm" color={C.pu} onClick={handleGenerateAIVoice} disabled={ttsBusy}>{ttsBusy?"⏳ Creating MP3…":"✨ Generate AI MP3 Voice"}</Btn>
              {ttsMsg && <p style={{fontSize:"11px",color:ttsMsg.startsWith("✅")?"#166534":"#92400e",margin:"8px 0 0",fontFamily:F}}>{ttsMsg}</p>}
            </div>}
            <div style={{borderTop:"1px solid "+C.br,paddingTop:"10px",marginTop:"4px"}}>
              <Label text="🎙️ Ready MP3 audio link/file (fastest for students)"/>
              <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:"7px",padding:"8px 11px",fontSize:"11px",color:"#92400e",marginBottom:"8px",fontFamily:F}}>💡 Fastest for students: use a ready MP3 link/file like your old tests. This plays directly without Worker/OpenAI delay. Upload only works for small clips (under ~700KB).</div>
              <input value={audioFile.startsWith("data:")?"":audioFile} onChange={e=>setAudioFile(e.target.value)} placeholder="🔗 Paste audio URL (https://…)" style={{...inp,marginBottom:"8px"}}/>
              <label htmlFor="audioUp" style={{display:"block",padding:"10px",background:audioFile.startsWith("data:")?"#f0fdf4":"#f3e8ff",color:audioFile.startsWith("data:")?"#166534":C.pu,borderRadius:"8px",fontWeight:"700",fontSize:"12px",cursor:"pointer",textAlign:"center",fontFamily:F,marginBottom:"7px"}}>{audioFile.startsWith("data:")?"✅ Small audio uploaded — tap to replace":"📤 Or upload a small clip (under ~700KB)"}</label>
              <input id="audioUp" type="file" accept="audio/*" ref={audioFileRef} onChange={handleAudioUpload} style={{display:"none"}}/>
              {audioFile && <div style={{marginBottom:"8px"}}><audio ref={tPreviewRef} controls src={String(audioFile||"").startsWith("worker-tts:")?"":audioFile} style={{display:"none"}}/><div><Btn size="sm" color={C.d} onClick={()=>setAudioFile("")}>Remove audio</Btn></div></div>}
              <Label text="How many times can a student listen? (0 = unlimited)"/>
              <input type="number" min="0" value={listenLimit} onChange={e=>setListenLimit(Math.max(0,Number(e.target.value)))} style={{...inp,marginBottom:"11px"}}/>
              <div style={{borderTop:"1px solid "+C.br,paddingTop:"10px"}}>
                <Label text="🎛️ Audio controls students can use"/>
                <div style={{display:"flex",gap:"6px",marginBottom:"9px",flexWrap:"wrap"}}>
                  <Btn size="sm" color={C.s} onClick={applyEasyMode}>🟢 Easy (all controls)</Btn>
                  <Btn size="sm" color={C.d} onClick={applyHardMode}>🔴 Hard (no controls)</Btn>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"7px"}}>
                  {[{k:"pause",l:"⏸ Pause"},{k:"restart",l:"🔁 Restart"},{k:"seek",l:"⏪⏩ Skip 10s"},{k:"speed",l:"⚡ Speed"}].map(o=>(
                    <label key={o.k} style={{display:"flex",alignItems:"center",gap:"7px",fontSize:"12px",color:C.tx,fontFamily:F,background:"#f8fafc",padding:"8px 10px",borderRadius:"8px",cursor:"pointer"}}>
                      <input type="checkbox" checked={!!audioControls[o.k]} onChange={e=>setAC(o.k,e.target.checked)} style={{width:"16px",height:"16px"}}/>
                      {o.l}
                    </label>
                  ))}
                </div>
                <p style={{fontSize:"10px",color:C.mu,margin:"7px 0 0",fontFamily:F}}>💡 For top students, use 🔴 Hard to make listening more challenging (play once, no pausing or slowing down).</p>
              </div>
              <div style={{borderTop:"1px solid "+C.br,paddingTop:"10px",marginTop:"10px"}}>
                <label style={{display:"flex",alignItems:"center",gap:"9px",cursor:"pointer",marginBottom:listenMatch?"10px":"0"}}>
                  <input type="checkbox" checked={listenMatch} onChange={e=>setListenMatch(e.target.checked)} style={{width:"18px",height:"18px"}}/>
                  <span style={{fontSize:"13px",fontWeight:"700",color:C.tx,fontFamily:F}}>🔗 Matching mode (students write a letter for each question)</span>
                </label>
                {listenMatch && <div style={{background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:"9px",padding:"11px"}}>
                  <p style={{fontSize:"11px",color:"#1e40af",margin:"0 0 9px",fontFamily:F}}>Add the answer choices (a, b, c…). You can add MORE answers than questions (extra ones become distractors). Below, for each question type the correct letter.</p>
                  <Label text="Answer choices"/>
                  {matchAnswers.map((ans,i)=>(
                    <div key={i} style={{display:"flex",gap:"6px",alignItems:"center",marginBottom:"6px"}}>
                      <span style={{minWidth:"24px",height:"24px",borderRadius:"6px",background:"#1e40af",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"800",fontSize:"12px",flexShrink:0,fontFamily:F}}>{String.fromCharCode(97+i)}</span>
                      <input value={ans} onChange={e=>updMatchAnswer(i,e.target.value)} placeholder={"Answer "+String.fromCharCode(97+i)+" (e.g. A margherita pizza)"} style={inp}/>
                      {matchAnswers.length>1 && <button onClick={()=>remMatchAnswer(i)} style={{background:"none",border:"none",color:C.d,fontSize:"16px",cursor:"pointer",flexShrink:0}}>✕</button>}
                    </div>
                  ))}
                  <button onClick={addMatchAnswer} style={{width:"100%",padding:"8px",background:"#fff",color:"#1e40af",border:"2px dashed #bae6fd",borderRadius:"8px",fontSize:"12px",fontWeight:"700",cursor:"pointer",fontFamily:F}}>+ Add answer choice</button>
                  <label style={{display:"flex",alignItems:"center",gap:"8px",cursor:"pointer",marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #bae6fd"}}>
                    <input type="checkbox" checked={matchShuffle} onChange={e=>setMatchShuffle(e.target.checked)} style={{width:"16px",height:"16px"}}/>
                    <span style={{fontSize:"12px",color:"#1e40af",fontFamily:F}}>🔀 Shuffle the answer choices for each student (recommended for exams)</span>
                  </label>
                </div>}
              </div>
            </div>
          </>}
        </Card>}

        {type==="Reading" && <Card style={{marginBottom:"11px",border:"1px solid "+C.br,background:"#f8fafc"}}>
          <strong style={{fontSize:"13px",color:C.tx,fontFamily:F,display:"block",marginBottom:"9px"}}>⏱️ Minimum reading time before Submit</strong>
          <div style={{display:"flex",gap:"6px",marginBottom:"9px"}}>
            <button onClick={()=>setReadingTimeMode("auto")} style={{flex:1,padding:"9px",borderRadius:"8px",border:"2px solid "+(readingTimeMode==="auto"?C.p:C.br),background:readingTimeMode==="auto"?"#eff6ff":"#fff",color:readingTimeMode==="auto"?C.p:C.mu,fontWeight:"800",fontSize:"12px",cursor:"pointer",fontFamily:F}}>Auto by text length</button>
            <button onClick={()=>setReadingTimeMode("manual")} style={{flex:1,padding:"9px",borderRadius:"8px",border:"2px solid "+(readingTimeMode==="manual"?C.p:C.br),background:readingTimeMode==="manual"?"#eff6ff":"#fff",color:readingTimeMode==="manual"?C.p:C.mu,fontWeight:"800",fontSize:"12px",cursor:"pointer",fontFamily:F}}>Manual</button>
          </div>
          {readingTimeMode==="manual" && <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",alignItems:"end"}}>
            <div><Label text="Minutes before Submit"/><input type="number" min="0" step="0.5" value={readingCustomMinutes} onChange={e=>setReadingCustomMinutes(Math.max(0,Math.min(15,Number(e.target.value)||0)))} style={inp}/></div>
            <div style={{fontSize:"11px",color:C.mu,fontFamily:F}}>الطالب يستطيع الحل مباشرة، لكن لا يستطيع التسليم إلا بعد هذا الوقت.</div>
          </div>}
          {readingTimeMode==="auto" && <div style={{fontSize:"11px",color:C.mu,fontFamily:F}}>Auto يحسب الوقت حسب عدد كلمات النص. الطالب يستطيع الحل مباشرة، والوقت فقط يمنع التسليم المبكر.</div>}
        </Card>}

        <Card style={{marginBottom:"11px",border:"2px solid "+C.pu,background:"#faf5ff"}}>
          <div onClick={()=>setShowAI(v=>!v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
            <strong style={{fontSize:"13px",color:C.pu,fontFamily:F}}>🤖 Generate with AI</strong><span style={{color:C.pu}}>{showAI?"▲":"▼"}</span>
          </div>
          {showAI && <div style={{marginTop:"10px"}}>
            {aiMsg && <div style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:"7px",padding:"8px 11px",color:"#991b1b",fontSize:"11px",marginBottom:"9px",fontFamily:F}}>{aiMsg}</div>}
            <div style={{background:"#f3e8ff",borderRadius:"7px",padding:"9px 11px",marginBottom:"10px",fontSize:"11px",color:"#6b21a8",fontFamily:F}}>AI creates questions for you automatically. It uses the <strong>Type</strong> & <strong>Difficulty</strong> you chose above. Cost: about 1–2 cents per quiz.</div>

            <Label text="Create questions from:"/>
            <div style={{display:"flex",gap:"6px",marginBottom:"10px",flexWrap:"wrap"}}>
              {[{v:"topic",l:"📝 A Topic"},{v:"passage",l:"📄 Pasted Text"},{v:"extract",l:"📋 Extract My Questions"},{v:"photo",l:"📷 From a Photo"},{v:"rule",l:"✍️ Suggest on a Rule"},{v:"file",l:"📂 A File"}].map(o=>(
                <button key={o.v} onClick={()=>setAiSource(o.v)} style={{padding:"6px 12px",borderRadius:"8px",border:"2px solid "+(aiSource===o.v?C.pu:C.br),background:aiSource===o.v?"#f3e8ff":"#fff",color:aiSource===o.v?C.pu:C.mu,fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:F}}>{o.l}</button>
              ))}
            </div>

            {type==="Listening" && <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:"7px",padding:"8px 11px",fontSize:"11px",color:"#1e40af",marginBottom:"9px",fontFamily:F}}>🎧 Listening options: <b>A Topic</b> = AI writes script + questions. Choose text type, length, and difficulty. <b>Pasted Text</b> = paste the script + attach your audio, AI makes questions. <b>Extract My Questions</b> = attach your audio + paste your ready questions.{listenMatch && <span><br/><b>🔗 Matching is ON:</b> AI will build the answer bank (a, b, c…) + questions automatically.</span>}</div>}
            {aiSource==="topic" && <div style={{marginBottom:"10px"}}>
              <input value={aiTopic} onChange={e=>setAiTopic(e.target.value)} placeholder={type==="Listening"?"e.g. Lost Bag at Airport":type==="Reading"?"Choose a short title, e.g. Smart Homes":"e.g. Present perfect tense, or Animals vocabulary"} style={inp}/>
              {type==="Reading" && <>
                <div style={{marginTop:"8px"}}>
                  <Btn size="sm" color={C.p} onClick={fetchTopicIdeas} disabled={aiLoading}>💡 Suggest 10 short reading titles</Btn>
                </div>
                {aiTopicIdeas.length>0 && <div style={{display:"flex",flexWrap:"wrap",gap:"6px",marginTop:"8px"}}>
                  {aiTopicIdeas.map((t,i)=><button key={i} onClick={()=>setAiTopic(t)} style={{padding:"6px 11px",borderRadius:"999px",border:"1px solid "+C.pu,background:aiTopic===t?C.pu:"#fff",color:aiTopic===t?"#fff":C.pu,fontSize:"11px",fontWeight:"600",cursor:"pointer",fontFamily:F}}>{t}</button>)}
                </div>}
              </> }
              {type==="Listening" && <>
                <div style={{marginTop:"8px"}}>
                  <Btn size="sm" color={C.p} onClick={fetchTopicIdeas} disabled={aiLoading}>💡 Suggest listening topics</Btn>
                </div>
                {aiTopicIdeas.length>0 && <div style={{display:"flex",flexWrap:"wrap",gap:"6px",marginTop:"8px"}}>
                  {aiTopicIdeas.map((t,i)=><button key={i} onClick={()=>setAiTopic(t)} style={{padding:"6px 11px",borderRadius:"999px",border:"1px solid "+C.pu,background:aiTopic===t?C.pu:"#fff",color:aiTopic===t?"#fff":C.pu,fontSize:"11px",fontWeight:"600",cursor:"pointer",fontFamily:F}}>{t}</button>)}
                </div>}
                <div style={{marginTop:"10px"}}>
                  <Label text="🎚️ Listening level"/>
                  <select value={aiListenLevel} onChange={e=>setAiListenLevel(e.target.value)} style={{...inp,marginBottom:"8px"}}>
                    <option value="auto">Auto – use quiz difficulty ({diff})</option>
                    <option value="easy">Easy / A1-A2</option>
                    <option value="intermediate">Intermediate / B1</option>
                    <option value="advanced">Advanced / B2</option>
                  </select>
                  <Label text="🎭 Listening text type"/>
                  <select value={aiListenType} onChange={e=>setAiListenType(e.target.value)} style={{...inp,marginBottom:"8px"}}>
                    <option value="auto">Auto – choose best style</option>
                    <option value="dialogue">Dialogue – two speakers</option>
                    <option value="phone_call">Phone Call</option>
                    <option value="announcement">Announcement</option>
                    <option value="interview">Interview</option>
                    <option value="instructions">Instructions</option>
                    <option value="story">Short Story / Narrative</option>
                    <option value="public_conversation">Public Conversation</option>
                  </select>
                  <div style={{fontSize:"10px",color:"#475569",fontFamily:F,marginBottom:"8px"}}>
                    Difficulty used now: <b>{aiListenLevel==="auto"?diff:aiListenLevel}</b> — Hard = Advanced. Titles are kept short: 3–7 words.
                    <br/>Voice mode now: <b>Single Voice</b>. Multi‑Voice for Dad/Mom/Boy/Girl dialogues will be added next.
                  </div>
                  <Label text="🎧 Listening length"/>
                  <div style={{display:"flex",gap:"6px"}}>
                    {[{v:"short",l:"Short ~30s"},{v:"medium",l:"Medium ~60s"},{v:"long",l:"Long ~90s"}].map(o=>(
                      <button key={o.v} onClick={()=>setAiLength(o.v)} style={{flex:1,padding:"9px 6px",borderRadius:"8px",border:"2px solid "+(aiLength===o.v?C.pu:C.br),background:aiLength===o.v?"#f3e8ff":"#fff",color:aiLength===o.v?C.pu:C.mu,fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:F}}>{o.l}</button>
                    ))}
                  </div>
                </div>
              </>}
            </div>}
            {aiSource==="passage" && <div style={{marginBottom:"10px"}}>
              {type==="Listening" && <div style={{marginBottom:"9px"}}>
                <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:"7px",padding:"8px 11px",fontSize:"11px",color:"#1e40af",marginBottom:"8px",fontFamily:F}}>📝 Paste the SCRIPT (what is said in the audio). AI makes questions from it. Then attach your real audio below so students hear it.</div>
                <Label text="🎙️ Attach the listening audio (students will hear this)"/>
                <input value={aiAudioUrl} onChange={e=>setAiAudioUrl(e.target.value)} placeholder="🔗 Paste audio URL (https://…)" style={{...inp,marginBottom:"7px"}}/>
                <label htmlFor="aiAudioUp2" style={{display:"block",padding:"10px",background:aiAudioFile?"#f0fdf4":"#f3e8ff",color:aiAudioFile?"#166534":C.pu,borderRadius:"8px",fontWeight:"700",fontSize:"12px",cursor:"pointer",textAlign:"center",fontFamily:F}}>{aiAudioFile?"✅ Audio uploaded — tap to replace":"📤 Or upload small clip (under ~700KB)"}</label>
                <input id="aiAudioUp2" type="file" accept="audio/*" onChange={handleAiAudio} style={{display:"none"}}/>
                {(aiAudioUrl.trim()||aiAudioFile) && <audio controls src={aiAudioUrl.trim()||aiAudioFile} style={{display:"none"}}/>}
              </div>}
              <textarea value={aiText} onChange={e=>setAiText(e.target.value)} rows={4} placeholder={type==="Listening"?"Paste the audio script (what is said) here. AI will make listening questions from it.":"Paste a reading passage or any text. AI will make questions from it."} style={{...inp,resize:"vertical",lineHeight:"1.6"}}/>
            </div>}
            {aiSource==="extract" && <div style={{marginBottom:"10px"}}>
              <div style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:"7px",padding:"8px 11px",fontSize:"11px",color:"#166534",marginBottom:"8px",fontFamily:F}}>📋 Paste your questions (with A B C D options). The AI keeps them exactly as written and just finds the correct answer for each.</div>
              {type==="Listening" && <div style={{marginBottom:"9px"}}>
                <Label text="🎙️ Attach the listening audio (students will hear this)"/>
                <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:"7px",padding:"7px 10px",fontSize:"10px",color:"#92400e",marginBottom:"7px",fontFamily:F}}>💡 Best: paste an audio LINK (no size limit). Or upload a small clip under ~700KB.</div>
                <input value={aiAudioUrl} onChange={e=>setAiAudioUrl(e.target.value)} placeholder="🔗 Paste audio URL (https://…)" style={{...inp,marginBottom:"7px"}}/>
                <label htmlFor="aiAudioUp" style={{display:"block",padding:"10px",background:aiAudioFile?"#f0fdf4":"#f3e8ff",color:aiAudioFile?"#166534":C.pu,borderRadius:"8px",fontWeight:"700",fontSize:"12px",cursor:"pointer",textAlign:"center",fontFamily:F}}>{aiAudioFile?"✅ Audio uploaded — tap to replace":"📤 Or upload small clip (under ~700KB)"}</label>
                <input id="aiAudioUp" type="file" accept="audio/*" ref={aiAudioRef} onChange={handleAiAudio} style={{display:"none"}}/>
                {(aiAudioUrl.trim()||aiAudioFile) && <audio controls src={aiAudioUrl.trim()||aiAudioFile} style={{display:"none"}}/>}
              </div>}
              <textarea value={aiText} onChange={e=>setAiText(e.target.value)} rows={6} placeholder={type==="Listening"?"Paste your listening questions here. Example:\n\n1. Where is the speaker?\nA. ...\nB. ...\nC. ...\nD. ...\n\n2. ...":"Paste your passage and questions here. Example:\n\n[Passage text...]\n\n1. What is the main idea?\nA. ...\nB. ...\nC. ...\nD. ...\n\n2. ..."} style={{...inp,resize:"vertical",lineHeight:"1.6"}}/>
            </div>}
            {aiSource==="photo" && <div style={{marginBottom:"10px"}}>
              <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:"7px",padding:"8px 11px",fontSize:"11px",color:"#1e40af",marginBottom:"8px",fontFamily:F}}>📷 Take or upload a clear photo of grammar/vocabulary questions. The AI reads them, decides each type, and builds a quiz. Works best with printed text.</div>
              <label htmlFor="aiImgInput" style={{display:"block",padding:"12px",background:aiImage?"#f0fdf4":C.pu,color:aiImage?"#166534":"#fff",borderRadius:"9px",fontWeight:"700",fontSize:"13px",cursor:"pointer",textAlign:"center",fontFamily:F,boxSizing:"border-box"}}>{aiImage?"✅ Photo ready — tap to replace":"📷 Upload / Take a photo"}</label>
              <input id="aiImgInput" type="file" accept="image/*" ref={aiImageRef} onChange={handleAiImage} style={{display:"none"}}/>
              {aiImage && <div style={{marginTop:"8px",textAlign:"center"}}><img src={aiImage} alt="questions" style={{maxWidth:"100%",maxHeight:"220px",borderRadius:"9px",border:"1px solid "+C.br}}/></div>}
            </div>}
            {aiSource==="rule" && <div style={{marginBottom:"10px"}}>
              <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:"7px",padding:"8px 11px",fontSize:"11px",color:"#1e40af",marginBottom:"8px",fontFamily:F}}>✍️ Type a grammar rule and the AI will create practice questions about it.</div>
              <input value={aiRule} onChange={e=>setAiRule(e.target.value)} placeholder="e.g. Present Perfect, Comparatives, Articles a/an/the" style={{...inp,marginBottom:"9px"}}/>
              <Label text="Question format"/>
              <div style={{display:"flex",gap:"6px"}}>
                <button onClick={()=>setAiQFormat("mcq")} style={{flex:1,padding:"9px",borderRadius:"8px",border:"2px solid "+(aiQFormat==="mcq"?C.pu:C.br),background:aiQFormat==="mcq"?"#f3e8ff":"#fff",color:aiQFormat==="mcq"?C.pu:C.mu,fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:F}}>🔘 Multiple Choice</button>
                <button onClick={()=>setAiQFormat("truefalse")} style={{flex:1,padding:"9px",borderRadius:"8px",border:"2px solid "+(aiQFormat==="truefalse"?C.pu:C.br),background:aiQFormat==="truefalse"?"#f3e8ff":"#fff",color:aiQFormat==="truefalse"?C.pu:C.mu,fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:F}}>✓✗ True / False</button>
              </div>
            </div>}
            {aiSource==="file" && <div style={{marginBottom:"10px"}}>
              <label htmlFor="aiFileInput" style={{display:"block",width:"100%",padding:"13px 16px",background:C.pu,color:"#fff",borderRadius:"9px",fontWeight:"700",fontSize:"13px",cursor:"pointer",fontFamily:F,textAlign:"center",boxSizing:"border-box"}}>📂 Choose File (.txt best)</label>
              <input id="aiFileInput" type="file" accept=".txt,.csv,.xlsx,.xls,.docx,.pdf" ref={aiFileRef} onChange={runAIFile} style={{display:"block",width:"100%",marginTop:"6px",fontSize:"12px",fontFamily:F}}/>
              <p style={{fontSize:"10px",color:C.mu,margin:"6px 0 0",fontFamily:F}}>Tip: .txt files work best. For Word/PDF, copy the text and use "Pasted Text" instead.</p>
            </div>}

            {type==="Reading" && (aiSource==="topic" || aiSource==="passage" || aiSource==="file") && <div style={{background:"#fff",border:"1px solid "+C.br,borderRadius:"8px",padding:"10px",marginBottom:"10px"}}>
              <strong style={{fontSize:"12px",color:C.tx,fontFamily:F,display:"block",marginBottom:"8px"}}>📖 Reading settings</strong>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"8px"}}>
                <div><Label text="Level"/><select value={aiReadingLevel} onChange={e=>setAiReadingLevel(e.target.value)} style={inp}>
                  <option value="level1">Level 1 Easy</option>
                  <option value="level2">Level 2 Basic</option>
                  <option value="level3">Level 3 Intermediate</option>
                  <option value="level4">Level 4 Advanced</option>
                </select></div>
                <div><Label text="Words"/><input type="number" value={aiReadingWords} onChange={e=>setAiReadingWords(Math.max(60,Math.min(500,Number(e.target.value)||120)))} style={inp}/></div>
              </div>
              <Label text="Question type mode"/>
              <div style={{display:"flex",gap:"6px",marginBottom:"8px"}}>
                <button onClick={()=>setAiReadingQMode("auto")} style={{flex:1,padding:"8px",borderRadius:"8px",border:"2px solid "+(aiReadingQMode==="auto"?C.pu:C.br),background:aiReadingQMode==="auto"?"#f3e8ff":"#fff",color:aiReadingQMode==="auto"?C.pu:C.mu,fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:F}}>Auto</button>
                <button onClick={()=>setAiReadingQMode("manual")} style={{flex:1,padding:"8px",borderRadius:"8px",border:"2px solid "+(aiReadingQMode==="manual"?C.pu:C.br),background:aiReadingQMode==="manual"?"#f3e8ff":"#fff",color:aiReadingQMode==="manual"?C.pu:C.mu,fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:F}}>Manual</button>
              </div>
              {aiReadingQMode==="manual" && <div style={{display:"flex",flexWrap:"wrap",gap:"6px"}}>
                {readingTypeOptions.map(t=><button key={t} onClick={()=>toggleReadingType(t)} style={{padding:"6px 9px",borderRadius:"999px",border:"1px solid "+(aiReadingTypes.includes(t)?C.pu:C.br),background:aiReadingTypes.includes(t)?"#f3e8ff":"#fff",color:aiReadingTypes.includes(t)?C.pu:C.mu,fontWeight:"700",fontSize:"10px",cursor:"pointer",fontFamily:F}}>{aiReadingTypes.includes(t)?"✓ ":""}{t}</button>)}
              </div>}

        </div>
        {questions.map((q,qi)=>(

                <div style={{width:"22px",height:"22px",borderRadius:"50%",background:C.p,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"700",fontSize:"11px",fontFamily:F}}>{qi+1}</div>

            {(type==="Listening" && listenMatch) ? (

                <Label text="Correct letter:"/>

              </div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px"}}>
              {q.options.map((opt,oi)=>(
                <div key={oi} style={{display:"flex",alignItems:"center",gap:"5px"}}>
                  <button onClick={()=>updQ(qi,"correct",oi)} style={{minWidth:"20px",height:"20px",borderRadius:"50%",border:"2px solid "+(q.correct===oi?C.s:C.br),background:q.correct===oi?C.s:"#fff",color:q.correct===oi?"#fff":C.mu,fontWeight:"700",fontSize:"10px",cursor:"pointer",flexShrink:0}}>{String.fromCharCode(65+oi)}</button>
                  <input value={opt} onChange={e=>updO(qi,oi,e.target.value)} placeholder={"Option "+String.fromCharCode(65+oi)} style={{...inp,border:q.correct===oi?"2px solid "+C.s:"1px solid "+C.br}}/>
                </div>
              ))}
            </div>
            <p style={{margin:"5px 0 0",fontSize:"10px",color:C.mu,fontFamily:F}}>Tap a letter to mark the correct answer</p>
            </>)}
          </Card>
        ))}
        <button onClick={addQ} style={{width:"100%",padding:"10px",background:"#f1f5f9",color:C.mu,border:"2px dashed "+C.br,borderRadius:"9px",fontSize:"13px",fontWeight:"600",cursor:"pointer",marginBottom:"9px",fontFamily:F}}>+ Add Question</button>
        <Btn size="lg" onClick={save} style={{width:"100%"}}>💾 Save Quiz</Btn>
        </>)}
      </div></div>
    </div>
  );
}
