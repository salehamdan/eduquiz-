  return (
    <Modal open={open} onClose={onClose} title={"📋 Review: "+quiz.title}>
      <div style={{textAlign:"center",marginBottom:"12px",padding:"10px",background:gc(p)+"15",borderRadius:"9px"}}>
        <div style={{fontSize:"26px",fontWeight:"900",color:gc(p),fontFamily:F}}>{response.score}/{response.totalQ} <span style={{fontSize:"16px"}}>({p}%)</span></div>
        <div style={{fontSize:"11px",color:C.mu,fontFamily:F}}>{quiz.type} · {response.completedAt} · Attempt #{response.attempt}</div>
      </div>
      {quiz.questions.map((q,idx)=>{
        const sel = response.answers ? response.answers[q.id] : undefined;
        const answered = sel!==undefined;
        const isLabelNum = quiz.type==="Image Labeling" && quiz.labelAnswerMode==="number";
        const isLabelWrite = quiz.type==="Image Labeling" && quiz.labelAnswerMode==="write";
        const isMatch = quiz.type==="Listening" && quiz.listenMatch;
        let isC;
        if(isLabelNum){ const cn=q.correctNum||String(idx+1); isC=String(sel).trim()===String(cn).trim(); }
        else if(isLabelWrite){ isC=String(sel||"").trim().toLowerCase()===String(q.correctLabel||"").trim().toLowerCase(); }
        else if(isMatch){ isC=String(sel||"").trim().toLowerCase()===String(q.correctLabel||"").trim().toLowerCase(); }
        else { isC = sel===q.correct; }
        if(isLabelNum || isLabelWrite || isMatch){
          const correctVal = isLabelNum ? (q.correctNum||String(idx+1)) : q.correctLabel;
          const labelWord = isLabelNum ? (q.correctLabel||q.text) : isMatch ? ((idx+1)+". "+q.text) : ("Part "+(idx+1));
          return (
            <div key={q.id} style={{marginBottom:"10px",padding:"10px",borderRadius:"9px",border:"2px solid "+(isC?C.s:C.d),background:isC?"#f0fdf4":"#fef2f2"}}>
              <div style={{display:"flex",gap:"7px",alignItems:"center"}}>
                <span style={{minWidth:"22px",height:"22px",borderRadius:"50%",background:isC?C.s:C.d,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"700",fontSize:"11px",flexShrink:0}}>{isC?"✓":"✗"}</span>
                <div style={{flex:1,fontSize:"13px",fontFamily:F,color:C.tx}}>
                  <strong>{labelWord}</strong>
                  <div style={{fontSize:"12px",marginTop:"3px"}}>
                    {isLabelNum?"Your number: ":isMatch?"Your letter: ":"Your answer: "}<strong style={{color:isC?"#166534":"#991b1b"}}>{answered?sel:"—"}</strong>
                    {!isC && <span style={{color:"#166534"}}>{" · Correct: "}<strong>{correctVal}</strong></span>}
                  </div>
                </div>
              </div>
              {!answered && <p style={{margin:"5px 0 0",fontSize:"11px",color:C.mu,fontStyle:"italic",fontFamily:F}}>You did not answer this.</p>}
            </div>
          );
        }
        return (
          <div key={q.id} style={{marginBottom:"12px",padding:"10px",borderRadius:"9px",border:"2px solid "+(isC?C.s:C.d),background:isC?"#f0fdf4":"#fef2f2"}}>
            <div style={{display:"flex",gap:"7px",marginBottom:"6px"}}>
              <span style={{minWidth:"22px",height:"22px",borderRadius:"50%",background:isC?C.s:C.d,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"700",fontSize:"11px",flexShrink:0}}>{isC?"✓":"✗"}</span>
              <div style={{flex:1}}>
                <span style={{fontSize:"9px",background:C.p+"18",color:C.p,padding:"1px 7px",borderRadius:"999px",fontWeight:"600",fontFamily:F}}>{q.skill}</span>
                <p style={{margin:"5px 0",fontSize:"13px",fontWeight:"600",color:C.tx,lineHeight:"1.5",fontFamily:F}}>{idx+1}. {q.text}</p>
              </div>
            </div>
            <div style={{display:"grid",gap:"4px"}}>
              {q.options.map((opt,i)=>{
                const isCorrect = i===q.correct;
                const isPicked = i===sel;
                let bg="#fff",bdr="1px solid "+C.br,col=C.tx;
                if(isCorrect){bg="#dcfce7";bdr="2px solid "+C.s;col="#166534";}
                else if(isPicked){bg="#fee2e2";bdr="2px solid "+C.d;col="#991b1b";}
                return (
                  <div key={i} style={{padding:"7px 10px",borderRadius:"7px",background:bg,border:bdr,color:col,fontSize:"12px",display:"flex",alignItems:"center",gap:"6px",fontFamily:F}}>
                    <span style={{fontWeight:"700"}}>{String.fromCharCode(65+i)}.</span>
                    <span style={{flex:1}}>{opt}</span>
                    {isCorrect && <span>✅</span>}
                    {isPicked && !isCorrect && <span>❌ your answer</span>}
                  </div>
                );
              })}
            </div>
            {!answered && <p style={{margin:"5px 0 0",fontSize:"11px",color:C.mu,fontStyle:"italic",fontFamily:F}}>You did not answer this question.</p>}
          </div>
        );
      })}
      <Btn onClick={onClose} style={{width:"100%",marginTop:"4px"}} color={C.mu}>Close</Btn>
    </Modal>
  );
}

const PROJECT_TYPES = [
  "Short Research Project","Presentation","Poster / Infographic","Writing Report","Vocabulary Project","Reading Response","Speaking / Video Project","Free Project"
];
function projectRubricFor(type){
  if(type==="Reading Response") return [
    {key:"understanding",label:"Understanding the Reading",points:3,student:"Show that you understood the main idea and important details."},
    {key:"personal",label:"Personal Response",points:2,student:"Give your opinion, feeling, or reaction clearly."},
    {key:"evidence",label:"Evidence from Text",points:2,student:"Support your answer with examples or details from the reading."},
    {key:"organization",label:"Organization",points:1,student:"Make your response organized and easy to follow."},
    {key:"language",label:"Language",points:2,student:"Use clear sentences with acceptable grammar and spelling."}
  ];
  return [
    {key:"content",label:"Content",points:3,student:"Your project is related to the topic and gives enough clear information."},
    {key:"organization",label:"Organization",points:2,student:"Your work is organized with clear parts such as title, introduction, body, and conclusion when needed."},
    {key:"language",label:"Language",points:2,student:"Your English is clear with acceptable grammar, spelling, and sentence structure."},
    {key:"requirements",label:"Requirements",points:2,student:"You followed the teacher's instructions and included the required parts."},
    {key:"creativity",label:"Creativity",points:1,student:"Your work shows effort, examples, suitable design, or a personal touch."}
  ];
}
function projectMaxScore(p){ return Math.max(1, Number(p && p.maxScore)||10); }
function projectAssignedToStudent(p, student){
  if(!p || !student) return false;
  if(p.status==="deleted") return false;
  if(p.assignMode==="student") return (p.studentIds||[]).includes(student.id);
  if(p.assignMode==="class") return (p.classIds||[]).some(cid=>sameClassId(cid, student.classId));
  return true;
}
function projectTargetStudents(p, students){ return (students||[]).filter(s=>projectAssignedToStudent(p,s)); }
function projectDateStatus(p){
  const now=new Date();
  const start=p&&p.startDate?new Date(p.startDate+"T00:00:00"):null;
  const end=p&&p.endDate?new Date(p.endDate+"T23:59:59"):null;
  if(start && now<start) return "not_started";
  if(end && now>end) return "ended";
  return "open";
}
function projectSubmissionMatchesStudent(sub, st){ return sub && st && (String(sub.studentId||"")===String(st.id)||String(sub.studentNumber||"")===String(st.studentId||"")); }
function projectSubmissionsForStudent(list, projectId, st){ return (list||[]).filter(s=>String(s.projectId)===String(projectId)&&projectSubmissionMatchesStudent(s,st)).sort((a,b)=>(b.attempt||0)-(a.attempt||0)||String(b.submittedAt||"").localeCompare(String(a.submittedAt||""))); }
function projectAllowedToResubmit(p, st, subs){
  const latest=projectSubmissionsForStudent(subs,p.id,st)[0];
  if(!latest) return false;
  if(latest.status==="resubmit_allowed") return true;
  return (p.resubmitStudentIds||[]).includes(st.id) || (p.resubmitClassIds||[]).some(cid=>sameClassId(cid,st.classId));
}
function projectSimilarityThreshold(rule){
  if(rule==="strict") return 75;
  if(rule==="lenient") return 90;
  return 85;
}
function projectNormalizeText(t){
  return String(t||"").toLowerCase()
    .replace(/[إأآا]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[ؤئ]/g,"ء")
    .replace(/[^a-z0-9\u0600-\u06ff\s]+/g," ")
    .replace(/\s+/g," ").trim();
}
function projectUsefulWords(t){
  const stop={the:1,a:1,an:1,and:1,or:1,to:1,of:1,in:1,on:1,for:1,is:1,are:1,was:1,were:1,be:1,with:1,this:1,that:1,it:1,as:1,by:1,from:1,at:1,عن:1,في:1,من:1,الى:1,إلى:1,على:1,و:1,او:1,أو:1,هو:1,هي:1,هذا:1,هذه:1,ان:1,أن:1};
  return projectNormalizeText(t).split(" ").filter(w=>w && w.length>2 && !stop[w]);
}
function projectNgrams(words,n){
  const arr=[]; for(let i=0;i<=words.length-n;i++) arr.push(words.slice(i,i+n).join(" ")); return arr;
}
function projectSimilarityScore(a,b){
  const wa=projectUsefulWords(a), wb=projectUsefulWords(b);
  if(wa.length<18 || wb.length<18) return 0;
  const sa=new Set(wa), sb=new Set(wb);
  let inter=0; sa.forEach(x=>{if(sb.has(x)) inter++;});
  const wordDice=(2*inter)/(sa.size+sb.size||1);
  const na=new Set(projectNgrams(wa,4)), nb=new Set(projectNgrams(wb,4));
  let ninter=0; na.forEach(x=>{if(nb.has(x)) ninter++;});
  const gramDice=(2*ninter)/(na.size+nb.size||1);
  return Math.round(Math.max(wordDice*100, gramDice*100));
}
function projectSimilarityEvidence(a,b){
  const wa=projectUsefulWords(a), wb=projectUsefulWords(b);
  for(let n=16;n>=8;n--){
    const nb=new Set(projectNgrams(wb,n));
    for(const g of projectNgrams(wa,n)){
      if(nb.has(g)) return g.split(" ").slice(0,32).join(" ");
    }
  }
  const nb6=new Set(projectNgrams(wb,6));
  const hit=projectNgrams(wa,6).find(x=>nb6.has(x));
  return hit||"Similar wording and repeated phrases were found.";
}
function projectCheckCopiedFromClassmate({project, submissions, currentStudent, currentText}){
  const text=String(currentText||"").trim();
  if(projectNormalizeText(text).length<120) return null;
  const threshold=projectSimilarityThreshold(project && project.similarityRule);
  let best=null;
  (submissions||[]).forEach(s=>{
    if(String(s.projectId)!==String(project.id)) return;
    if(String(s.studentId||"")===String(currentStudent.id||"")) return;
    if(["submitted","ai_corrected","approved","resubmit_allowed"].indexOf(s.status)<0) return;
    const otherText=String(s.text||s.fileText||"").trim();
    if(projectNormalizeText(otherText).length<120) return;
    const score=projectSimilarityScore(text, otherText);
    if(!best || score>best.score){
      best={score,threshold,matchedStudentName:s.studentName||"another student",matchedStudentId:s.studentNumber||s.studentId||"",evidenceCurrent:projectSimilarityEvidence(text, otherText),evidenceMatched:projectSimilarityEvidence(otherText, text),matchedSubmissionId:s.id};
    }
  });
  if(best && best.score>=threshold) return {...best,blocked:true,checkedAt:new Date().toISOString()};
  if(best && best.score>=70) return {...best,blocked:false,checkedAt:new Date().toISOString()};
  return null;
}
async function projectUploadFile(file, projectId, studentId){
  if(!file) return {url:"",name:"",size:0,type:""};
  const meta={name:file.name,size:file.size,type:file.type||""};
  if(FIREBASE_OK && storage && storage.ref){
    const clean=String(file.name||"project-file").replace(/[^a-zA-Z0-9._-]+/g,"_").slice(-80);
    const path="projectSubmissions/"+String(projectId||"project")+"/"+String(studentId||"student")+"/"+Date.now()+"_"+clean;
    const ref=storage.ref().child(path);
    await ref.put(file,{contentType:file.type||"application/octet-stream"});
    meta.url=await ref.getDownloadURL();
    meta.path=path;
  }
  return meta;
}
function projectRubricText(rubric){ return (rubric||[]).map(x=>"- "+x.label+": "+x.points+" marks. "+(x.student||"")).join("\n"); }
async function aiCorrectProjectSubmission({project, submission, student}){
  let apiKey=getAIKey();
  if(!apiKey){ apiKey=await loadAIKeyFromCloud(); if(apiKey) setAIKey(apiKey); }
  if(!apiKey) throw new Error("No AI key found. Save the Claude AI key first.");
  const rubric=project.rubric||projectRubricFor(project.type);
  const submittedText=String(submission.text || submission.fileText || "").trim();
  if(!submittedText){
    throw new Error("AI cannot read this submission content. Use Manual Grade, or ask the student to submit text/readable file.");
  }
  const prompt = `You are an English teacher assistant. Grade this student project strictly using the teacher's project type, instructions, and rubric.\n\nProject title: ${project.title}\nProject type: ${project.type}\nMax score: ${projectMaxScore(project)}\nTeacher instructions:\n${project.instructions||"No extra instructions."}\n\nRubric:\n${projectRubricText(rubric)}\n\nStudent name: ${student?student.name:(submission.studentName||"Student")}\nSubmission mode: ${submission.submissionMode||"text"}\nStudent submission:\n${submittedText.slice(0,12000)}\n\nReturn ONLY valid JSON in this exact format:\n{"score":8,"total":10,"criteria":[{"label":"Content","score":2.5,"max":3,"comment":"short comment"}],"studentFeedback":"2-3 short friendly sentences for the student","teacherNote":"short note for teacher about missing requirements or concerns"}\nUse decimal scores if needed. Do not exceed each criterion max. Requirements must be judged against the teacher instructions.`;
  const resp = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-3-5-sonnet-20241022",max_tokens:1400,temperature:0.2,messages:[{role:"user",content:prompt}]})
  });
  const json=await resp.json().catch(()=>null);
  if(!resp.ok) throw new Error((json&&json.error&&json.error.message)||("AI correction failed: "+resp.status));
  let text=(json.content&&json.content[0]&&json.content[0].text)||"";
  text=text.replace(/```json/g,"").replace(/```/g,"").trim();
  const start=text.indexOf("{"); const end=text.lastIndexOf("}"); if(start>=0&&end>start) text=text.slice(start,end+1);
  const parsed=eqParseJsonObject(text);
  const total=projectMaxScore(project);
  const score=Math.max(0,Math.min(total,Number(parsed.score)||0));
  return {...parsed,score,total,correctedAt:new Date().toISOString(),source:"ai"};
}

function ProjectCreateForm({user,data,myClasses,myStudents,onSaved,onCancel,editProject}){

function StudentProjects({user,data,reload}){

  const projects=(data.projects||[]).filter(p=>projectAssignedToStudent(p,user)).sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
  const submissions=data.projectSubmissions||[];

  async function submitProject(p){
    setMsg("");
    const dstat=projectDateStatus(p);
    if(dstat==="not_started"){setMsg("Project submission has not started yet.");return;}
    if(dstat==="ended"&&!projectAllowedToResubmit(p,user,submissions)){setMsg("Project submission time has ended.");return;}
    const submitMode = p.submissionType==="bothChoice" ? mode : (p.submissionType==="file"?"file":"text");
    if(submitMode==="text"&&!text.trim()){setMsg("Write your project text first.");return;}
    if(submitMode==="file"&&!file){setMsg("Choose a file first.");return;}
    let fileMeta={}; let fileText="";
    if(submitMode==="file"&&file){
      try{ fileText=(await extractFileText(file)||"").trim().slice(0,12000); }catch(e){ fileText=""; }
    }
    const currentProjectText = submitMode==="text" ? text.trim() : fileText;
    const copyCheck = projectCheckCopiedFromClassmate({project:p,submissions,currentStudent:user,currentText:currentProjectText});
    if(copyCheck && copyCheck.blocked){
      setMsg("Submission rejected. Your project is very similar to another submitted project ("+copyCheck.score+"%). Evidence: "+copyCheck.evidenceCurrent.slice(0,180)+"... Please rewrite it in your own words.");
      return;
    }
    if(submitMode==="file"&&file){
      try{ fileMeta=await projectUploadFile(file,p.id,user.id); }catch(e){ fileMeta={name:file.name,size:file.size,type:file.type||"",uploadError:e.message||String(e)}; }

    setMsg("✅ Project submitted. Waiting for teacher review."); setText(""); setFile(null); await reload(); setTimeout(()=>setOpenProject(null),700);
  }

      {disabled&&<Card style={{marginBottom:"10px",background:dstat==="not_started"?"#fffbeb":"#fef2f2",border:"1px solid "+(dstat==="not_started"?"#fbbf24":"#fecaca")}}><b style={{fontSize:"12px",color:dstat==="not_started"?"#92400e":C.d,fontFamily:F}}>{dstat==="not_started"?"Project submission has not started yet.":"Project submission time has ended."}</b></Card>}
      <Card style={{marginBottom:"10px"}}><b style={{fontSize:"12px",color:C.tx,fontFamily:F}}>Instructions</b><div style={{whiteSpace:"pre-wrap",fontSize:"12px",color:C.tx,marginTop:"6px",fontFamily:F}}>{p.instructions||"No extra instructions."}</div><ProjectRubricView type={p.type}/></Card>
      {latest&&<Card style={{marginBottom:"10px",background:latest.status==="approved"?"#f0fdf4":"#f8fafc",border:"1px solid "+(latest.status==="approved"?"#86efac":C.br)}}><b style={{fontSize:"12px",color:C.tx,fontFamily:F}}>Last submission</b><div style={{fontSize:"11px",color:C.mu,fontFamily:F}}>Attempt {latest.attempt} · {latest.status} · {latest.submittedAt}</div>{latest.finalScore!=null&&<div style={{fontSize:"16px",fontWeight:"900",color:gc(latest.finalScore*10),fontFamily:F}}>Score: {latest.finalScore}/10</div>}{latest.teacherFeedback&&<div style={{fontSize:"12px",color:C.tx,marginTop:"5px",fontFamily:F}}>Feedback: {latest.teacherFeedback}</div>}</Card>}
      {!disabled&&(!latest||canResubmit)&&<Card>
        {p.submissionType==="bothChoice"&&<><Label text="Choose one submission method"/><div style={{display:"flex",gap:"8px",marginBottom:"10px"}}><button onClick={()=>setMode("text")} style={{flex:1,padding:"10px",borderRadius:"9px",border:"2px solid "+(mode==="text"?C.p:C.br),background:mode==="text"?"#eff6ff":"#fff",fontWeight:"800",fontFamily:F}}>Write Text</button><button onClick={()=>setMode("file")} style={{flex:1,padding:"10px",borderRadius:"9px",border:"2px solid "+(mode==="file"?C.p:C.br),background:mode==="file"?"#eff6ff":"#fff",fontWeight:"800",fontFamily:F}}>Upload File</button></div></>}
        {submitMode==="text"?<><Label text="Write your project here"/><textarea value={text} onChange={e=>setText(e.target.value)} style={{...input,minHeight:"170px",resize:"vertical"}}/></>:<><Label text="Upload your project file"/><input type="file" onChange={e=>setFile(e.target.files&&e.target.files[0])} style={input}/><div style={{fontSize:"10px",color:C.mu,marginTop:"5px",fontFamily:F}}>AI can grade readable text files best. PDF/Word may need teacher review if text cannot be extracted.</div></>}

  </div>;

er",fontFamily:F}}>Similarity evidence</summary><div style={{fontSize:"11px",background:"#fffbeb",border:"1px solid #fde68a",borderRadius:"8px",padding:"8px",marginTop:"5px",fontFamily:F}}><b>Matched student:</b> {s.similarityCheck.matchedStudentName} #{s.similarityCheck.matchedStudentId}<br/><b>Similarity:</b> {s.similarityCheck.score}%<br/><b>Current evidence:</b><br/>{s.similarityCheck.evidenceCurrent}<br/><b>Matched evidence:</b><br/>{s.similarityCheck.evidenceMatched}</div></details>}{ai&&<div style={{marginTop:"8px",background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:"9px",padding:"8px"}}><div style={{fontSize:"12px",fontWeight:"900",color:C.p,fontFamily:F}}>AI Suggested Score: {ai.score}/10</div>{(ai.criteria||[]).map((c,i)=><div key={i} style={{fontSize:"11px",color:C.tx,fontFamily:F,padding:"3px 0"}}><b>{c.label}:</b> {c.score}/{c.max} — {c.comment}</div>)}{ai.studentFeedback&&<div style={{fontSize:"11px",color:C.tx,fontFamily:F,marginTop:"5px"}}>Feedback: {ai.studentFeedback}</div>}</div>}<div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginTop:"9px"}}>{s.status!=="approved"&&<><Btn size="sm" color={C.p} onClick={()=>runAI(p,s)}>AI Correct</Btn><Btn size="sm" color={C.s} onClick={()=>approve(p,s,(ai&&ai.score)||s.finalScore||0,(ai&&ai.studentFeedback)||s.teacherFeedback||"")}>Approve AI Score</Btn><Btn size="sm" color={C.w} onClick={()=>manualGrade(p,s)}>Manual / Edit</Btn></>}<Btn size="sm" color={C.pu} onClick={()=>allowResubmit(p,s)}>Allow Resubmission</Btn></div></Card>})}
  </div>;
}

function StudentApp({user, data, onLogout, reload, directQuiz, clearDirect}) {

              <strong style={{fontSize:"12px",color:C.tx,display:"block",marginBottom:"9px",fontFamily:F}}>📈 Score History</strong>
              <ResponsiveContainer width="100%" height={170}>

                <div style={{fontWeight:"800",color:gc(s.avg),fontSize:"15px",fontFamily:F}}>{s.avg}%</div>

      </div></div>

    </div>
  );
}

  const [visibility,setVisibility]=useState(E.assignedStudents&&E.assignedStudents.length?"private":"classes");
  const [assignedStudents,setAssignedStudents]=useState(E.assignedStudents||[]);
  const [stuSearch,setStuSearch]=useState("");
  const [labelImage,setLabelImage]=useState(E.labelImage||"");
  const [labelAnswerMode,setLabelAnswerMode]=useState(E.labelAnswerMode||"number");

    if(familyAge) return "Single Voice cannot use family/age roles such as Dad/Mom/child. Choose Multi-Voice Dialogue, then press Generate AI MP3 Voice again.";

  function parseRows(rows){
    setErr("");
    if(!rows||!rows.length){setErr("No rows found.");return;}

    // Auto-detect skill. For Grammar/Vocab quiz types, FORCE the skill to match the type
    // (ignore any "Main Idea" etc. that came from the file or AI).
    function autoSkill(text, providedSkill) {
      return detectSkill(text, providedSkill, type);
    }

    // Try to detect a header row and map columns by name
    const first = rows[0] || [];
    const headerText = first.map(c=>String(c||"").trim().toLowerCase());
    const looksHeader = headerText.some(h => h.includes("question")||h.includes("option")||h.includes("answer")||h.includes("correct"));

    let colMap = null;
    if (looksHeader) {
      colMap = {q:-1,a:-1,b:-1,c:-1,d:-1,correct:-1,skill:-1,diff:-1};
      headerText.forEach((h,i)=>{
        if (colMap.q<0 && (h==="question"||h.includes("question text")||(h.includes("question")&&!h.includes("no")&&!h.includes("type")&&!h.includes("number"))) ) colMap.q=i;
        else if (h==="a"||h==="option a"||h.includes("option a")||h==="opt a") colMap.a=i;
        else if (h==="b"||h==="option b"||h.includes("option b")||h==="opt b") colMap.b=i;
        else if (h==="c"||h==="option c"||h.includes("option c")||h==="opt c") colMap.c=i;
        else if (h==="d"||h==="option d"||h.includes("option d")||h==="opt d") colMap.d=i;
        else if (h.includes("correct")||h.includes("answer")||h==="key") colMap.correct=i;
        else if (h.includes("skill")) colMap.skill=i;
        else if (h.includes("difficulty")||h.includes("level")) colMap.diff=i;
      });
      // If we couldn't find proper option columns by name, fall back to position
      if (colMap.q<0||colMap.a<0||colMap.b<0) colMap = null;
    }

    let startRow = looksHeader ? 1 : 0;
    let data = rows.slice(startRow).filter(r=>r&&r.length&&String(r[colMap?colMap.q:0]||"").trim());
    if(!data.length){setErr("No question rows found. Each row needs a question, 4 options, and the correct answer.");return;}

    let result =[],skipped=[];
    data.forEach((r,i)=>{
      let q,a,b,c,d,cl,sk,df;
      if (colMap) {
        q=String(r[colMap.q]||"").trim();
        a=String(r[colMap.a]||"").trim();
        b=String(r[colMap.b]||"").trim();
        c=colMap.c>=0?String(r[colMap.c]||"").trim():"";
        d=colMap.d>=0?String(r[colMap.d]||"").trim():"";
        cl=colMap.correct>=0?String(r[colMap.correct]||"A").trim().toUpperCase():"A";
        sk=colMap.skill>=0?String(r[colMap.skill]||"").trim():"";
        df=colMap.diff>=0?String(r[colMap.diff]||"").trim():"";
      } else {
        q=String(r[0]||"").trim();a=String(r[1]||"").trim();b=String(r[2]||"").trim();c=String(r[3]||"").trim();d=String(r[4]||"").trim();
        cl=String(r[5]||"A").trim().toUpperCase();sk=String(r[6]||"").trim();df=String(r[7]||"").trim();
      }
      if(!q||!a||!b||!c||!d){skipped.push(i+startRow+1);return;}
      // correct can be a letter (A-D) or a number (1-4) or the answer text
      let ci = ["A","B","C","D"].indexOf(cl);
      if (ci<0) { const n=parseInt(cl); if(n>=1&&n<=4) ci=n-1; }
      if (ci<0) { const opts=[a,b,c,d].map(x=>x.toLowerCase()); const f=opts.indexOf(cl.toLowerCase()); if(f>=0) ci=f; }
      if (ci<0) ci=0;
      result.push({id:result.length+1,text:q,options:[a,b,c,d],correct:ci,skill:autoSkill(q,sk),difficulty:DIFFICULTIES.includes(df)?df:diff});
    });
    if(!result.length){setErr("Could not read questions. Make sure your file has columns: Question, Option A, B, C, D, and Correct answer.");return;}
    if(skipped.length)setErr("Imported "+result.length+". Skipped rows "+skipped.join(", ")+" (missing data).");
    setPreview(result);setShowImport(true);
  }

        // ensure correct index points to the correctLabel
        valid=valid.map(q=>{const ci=q.options.findIndex(o=>o.trim().toLowerCase()===(q.correctLabel||"").trim().toLowerCase());return {...q,correct:ci>=0?ci:0};});

    onSave({id:E.id||uid(),code:E.code||shortCode(),teacherId:teacher.id,title:title.trim(),type,difficulty:diff,subject,classIds,timer,masteryThreshold:thresh,allowRetake:retake,maxRetakes:retake?Math.max(0,Number(maxRetakes)||0):0,shuffle,mode,instantFeedback,reviewAnswers,gameTimerType,gameTimerSec,assignedStudents:visibility==="private"?assignedStudents:[],closeDate,passage,readingTimeMode:type==="Reading"?readingTimeMode:"auto",readingCustomMinutes:type==="Reading"?Math.max(0,Number(readingCustomMinutes)||0):0,labelImage:type==="Image Labeling"?labelImage:"",labelAnswerMode:type==="Image Labeling"?labelAnswerMode:"",audioFile:type==="Listening"&&audioFile&&!String(audioFile).startsWith("worker-tts:")?audioFile:"",voiceMode:type==="Listening"?voiceMode:"device",ttsVoice:type==="Listening"?ttsVoice:"",ttsVoiceStyle:type==="Listening"?ttsVoiceStyle:"single",ttsTone:type==="Listening"?ttsTone:"natural",listenLimit:type==="Listening"?listenLimit:0,listenMatch:type==="Listening"?listenMatch:false,matchShuffle:type==="Listening"&&listenMatch?matchShuffle:false,matchAnswers:type==="Listening"&&listenMatch?matchAnswers.filter(a=>a.trim()):[],audioControls:type==="Listening"?audioControls:null,questions:valid,status:E.id?(E.status||"open"):"open",createdAt:E.createdAt||today()});
  }
  const inp={width:"100%",padding:"8px 10px",borderRadius:"7px",border:"1px solid "+C.br,fontSize:"12px",outline:"none",background:"#f8fafc",color:C.tx,fontFamily:F,boxSizing:"border-box"};

  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",fontFamily:F,background:C.bg}}>

        {err && <div style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:"8px",padding:"9px 12px",color:"#991b1b",fontSize:"12px",marginBottom:"11px",fontFamily:F}}>{err}</div>}
        {editQuiz && <div style={{background:"#fffbeb",border:"1px solid #fbbf24",borderRadius:"8px",padding:"9px 12px",color:"#92400e",fontSize:"12px",marginBottom:"11px",fontFamily:F}}>⏸️ This quiz is paused while you edit. It will reopen automatically when you tap Save (if it was open before).</div>}

            <div><Label text="Timer (min,0=off)"/><input type="number" value={timer} onChange={e=>setTimer(Number(e.target.value))} style={inp}/></div>
            <div><Label text="Pass Mark (%)"/><input type="number" value={thresh} onChange={e=>setThresh(Number(e.target.value))} style={inp}/></div>
            <div><Label text="Close Date"/><input type="date" value={closeDate} onChange={e=>setCloseDate(e.target.value)} style={inp}/></div>
            <div style={{display:"flex",alignItems:"center",gap:"6px",paddingTop:"17px"}}><input type="checkbox" checked={retake} onChange={e=>setRetake(e.target.checked)} id="rt"/><label htmlFor="rt" style={{fontSize:"12px",color:C.tx,fontFamily:F}}>Allow retakes</label></div>
            <div><Label text="Max retakes"/><input type="number" min="0" max="10" value={maxRetakes} onChange={e=>setMaxRetakes(Math.max(0,Number(e.target.value)||0))} disabled={!retake} style={{...inp,opacity:retake?1:.55}}/></div>
            <div style={{display:"flex",alignItems:"center",gap:"6px",paddingTop:"17px"}}><input type="checkbox" checked={reviewAnswers} onChange={e=>setReviewAnswers(e.target.checked)} id="ra"/><label htmlFor="ra" style={{fontSize:"12px",color:C.tx,fontFamily:F}}>🔍 Allow answer review (after all attempts used)</label></div>
            <div style={{display:"flex",alignItems:"center",gap:"6px",paddingTop:"17px"}}><input type="checkbox" checked={shuffle} onChange={e=>setShuffle(e.target.checked)} id="sh"/><label htmlFor="sh" style={{fontSize:"12px",color:C.tx,fontFamily:F}}>🔀 Shuffle for students</label></div>
          </div>
          <div style={{marginTop:"11px"}}>
            <Label text="Quiz Mode"/>
            <div style={{display:"flex",gap:"8px",marginBottom:"8px"}}>
              <button onClick={()=>setMode("normal")} style={{flex:1,padding:"11px",borderRadius:"9px",border:"2px solid "+(mode==="normal"?C.p:C.br),background:mode==="normal"?"#eff6ff":"#fff",cursor:"pointer",fontFamily:F}}>

              </button>

                  <button key={o.v} onClick={()=>setGameTimerType(o.v)} style={{padding:"6px 12px",borderRadius:"8px",border:"2px solid "+(gameTimerType===o.v?C.pu:C.br),background:gameTimerType===o.v?"#fff":"#fff",color:gameTimerType===o.v?C.pu:C.mu,fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:F}}>{o.l}</button>

              {gameTimerType==="perQ" && <div style={{display:"flex",alignItems:"center",gap:"8px"}}><input type="number" value={gameTimerSec} onChange={e=>setGameTimerSec(Math.max(5,Number(e.target.value)))} style={{...inp,width:"80px",marginBottom:0}}/><span style={{fontSize:"12px",color:C.mu,fontFamily:F}}>seconds per question</span></div>}
              {gameTimerType==="whole" && <div style={{display:"flex",alignItems:"center",gap:"8px"}}><input type="number" value={gameTimerSec} onChange={e=>setGameTimerSec(Math.max(10,Number(e.target.value)))} style={{...inp,width:"80px",marginBottom:0}}/><span style={{fontSize:"12px",color:C.mu,fontFamily:F}}>seconds for whole quiz</span></div>}
            </div>}
          </div>
          <div style={{marginTop:"11px"}}>
            <Label text="Who can see this quiz?"/>
            <div style={{display:"flex",gap:"6px",marginBottom:"9px",flexWrap:"wrap"}}>
              <button onClick={()=>setVisibility("classes")} style={{flex:1,padding:"9px",borderRadius:"8px",border:"2px solid "+(visibility==="classes"?C.p:C.br),background:visibility==="classes"?"#eff6ff":"#fff",color:visibility==="classes"?C.p:C.mu,fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:F}}>👥 Classes / Everyone</button>
              <button onClick={()=>setVisibility("private")} style={{flex:1,padding:"9px",borderRadius:"8px",border:"2px solid "+(visibility==="private"?C.pu:C.br),background:visibility==="private"?"#faf5ff":"#fff",color:visibility==="private"?C.pu:C.mu,fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:F}}>🔒 Private (pick students)</button>
            </div>
            {visibility==="classes" && <div>
              {myClasses.length>0 ? <>
                <p style={{fontSize:"10px",color:C.mu,margin:"0 0 6px",fontFamily:F}}>Pick classes (or leave empty = all students see it) — all platform classes shown:</p>
                <div style={{display:"flex",flexWrap:"wrap",gap:"6px"}}>
                  {myClasses.map(c=>{const sel=classIds.includes(c.id);return <button key={c.id} onClick={()=>setClassIds(sel?classIds.filter(x=>x!==c.id):[...classIds,c.id])} style={{padding:"4px 11px",borderRadius:"7px",border:"2px solid "+(sel?C.p:C.br),background:sel?"#eff6ff":"#f8fafc",color:sel?C.p:C.mu,fontWeight:"600",fontSize:"11px",cursor:"pointer",fontFamily:F}}>{c.name}</button>;})}
                </div>
              </> : <p style={{fontSize:"11px",color:C.mu,fontFamily:F}}>No classes yet — all students will see this quiz.</p>}
            </div>}
            {visibility==="private" && <div style={{background:"#faf5ff",borderRadius:"9px",padding:"10px"}}>

              {classes.length>0 && <div style={{marginBottom:"9px"}}>

                      else { const ids=clsStudents.map(s=>s.id); setAssignedStudents([...new Set([...assignedStudents,...ids])]); }
                    }} style={{padding:"5px 11px",borderRadius:"999px",border:"2px solid "+(allSel?C.pu:C.br),background:allSel?C.pu:"#fff",color:allSel?"#fff":C.mu,fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:F}}>{allSel?"✓ ":""}{c.name} ({clsStudents.length})</button>;
                  })}
                </div>
              </div>}
              <input value={stuSearch} onChange={e=>setStuSearch(e.target.value)} placeholder="🔍 Search name or ID…" style={{...inp,marginBottom:"8px"}}/>
              {(students||[]).length===0 ? <p style={{fontSize:"11px",color:C.mu,fontFamily:F}}>No students yet. Add or import students first.</p> :
                <div style={{maxHeight:"220px",overflowY:"auto"}}>
                  {(students||[]).filter(s=>{const q=stuSearch.toLowerCase();return !q||s.name.toLowerCase().includes(q)||(s.studentId||"").toLowerCase().includes(q);}).map(s=>{const sel=assignedStudents.includes(s.id);const cls=classes.find(c=>c.id===s.classId);return(
                    <div key={s.id} onClick={()=>setAssignedStudents(sel?assignedStudents.filter(x=>x!==s.id):[...assignedStudents,s.id])} style={{display:"flex",alignItems:"center",gap:"9px",padding:"7px 8px",borderRadius:"7px",cursor:"pointer",background:sel?"#f3e8ff":"transparent",marginBottom:"3px"}}>
                      <div style={{width:"20px",height:"20px",borderRadius:"5px",border:"2px solid "+(sel?C.pu:C.br),background:sel?C.pu:"#fff",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:"12px",flexShrink:0}}>{sel?"✓":""}</div>
                      <div style={{flex:1}}><div style={{fontSize:"12px",fontWeight:"600",color:C.tx,fontFamily:F}}>{s.name}</div><div style={{fontSize:"10px",color:C.mu,fontFamily:F}}>ID: {s.studentId}{cls?" · "+cls.name:""}</div></div>
                    </div>
                  );})}
                </div>}
              <div style={{display:"flex",gap:"6px",marginTop:"8px"}}>
                <Btn size="sm" color={C.mu} onClick={()=>setAssignedStudents([])}>Clear all</Btn>
                <Btn size="sm" color={C.p} onClick={()=>setAssignedStudents((students||[]).map(s=>s.id))}>Select all</Btn>
              </div>
            </div>}
          </div>
        </Card>

        {(type==="Reading"||type==="Listening") && <Card style={{marginBottom:"11px"}}>

          <textarea value={passage} onChange={e=>setPassage(e.target.value)} rows={4} placeholder={type==="Listening"?"Type the script students will hear (or let AI write it below)…":"Paste the reading passage…"} style={{...inp,resize:"vertical",lineHeight:"1.7"}}/>
          {type==="Listening" && <>
            <p style={{fontSize:"11px",color:C.mu,margin:"6px 0 9px",fontFamily:F}}>🔊 Students will HEAR this (they won't see the text).</p>
             <div style={{background:"#dcfce7",border:"2px solid #22c55e",borderRadius:"9px",padding:"8px 10px",marginBottom:"9px",fontSize:"12px",fontWeight:"900",color:"#166534",fontFamily:F}}>
               ✅ VOICE FIX ACTIVE: Student will use Device Voice or Ready MP3 only. No Worker delay for students.
             </div>
             <div style={{background:"#f8fafc",border:"1px solid "+C.br,borderRadius:"9px",padding:"9px",marginBottom:"9px"}}>
               <Label text="🔊 Voice Mode"/>
               <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
                 <button onClick={()=>{setVoiceMode("device");setAudioFile("");setTtsMsg("⚡ Device Voice selected — instant for students.");}} style={{padding:"10px",borderRadius:"9px",border:"2px solid "+(voiceMode==="device"?C.p:C.br),background:voiceMode==="device"?"#eff6ff":"#fff",color:voiceMode==="device"?C.p:C.tx,fontWeight:"800",fontFamily:F}}>⚡ Device Voice<br/><span style={{fontSize:"10px",fontWeight:"600"}}>Instant</span></button>
                 <button onClick={()=>setVoiceMode("ai")} style={{padding:"10px",borderRadius:"9px",border:"2px solid "+(voiceMode==="ai"?C.pu:C.br),background:voiceMode==="ai"?"#faf5ff":"#fff",color:voiceMode==="ai"?C.pu:C.tx,fontWeight:"800",fontFamily:F}}>🎙️ AI Voice<br/><span style={{fontSize:"10px",fontWeight:"600"}}>Natural</span></button>
               </div>
             </div>
            <div style={{display:"flex",gap:"6px",marginBottom:"9px",flexWrap:"wrap",alignItems:"center"}}>
              {audioFile && <Btn size="sm" color={C.mu} onClick={()=>tSeek(-10)}>⏪ 10s</Btn>}
              <Btn size="sm" color={C.p} onClick={previewSpeak}>▶ Preview</Btn>
              <Btn size="sm" color={C.mu} onClick={tStop}>⏹ Stop</Btn>
              {audioFile && <Btn size="sm" color={C.mu} onClick={()=>tSeek(10)}>10s ⏩</Btn>}
              <Btn size="sm" color={C.pu} onClick={tCycleSpeed}>⚡ {tSpeed}x</Btn>
            </div>
            {voiceMode==="ai" && <div style={{background:"#f5f3ff",border:"1px solid #ddd6fe",borderRadius:"7px",padding:"10px 11px",marginBottom:"9px"}}>
              <p style={{fontSize:"11px",color:"#5b21b6",margin:"0 0 8px",fontFamily:F,fontWeight:"700"}}>🎙️ AI Voice → Ready MP3 for students</p>
              <div style={{display:"flex",gap:"6px",marginBottom:"8px"}}>
                <button onClick={()=>setTtsVoice("woman")} style={{flex:1,padding:"8px",borderRadius:"7px",border:"1.5px solid "+(ttsVoice==="woman"?"#7c3aed":C.br),background:ttsVoice==="woman"?"#ede9fe":"#fff",fontWeight:"700",fontSize:"12px",fontFamily:F,cursor:"pointer"}}>👩 Woman</button>
                <button onClick={()=>setTtsVoice("man")} style={{flex:1,padding:"8px",borderRadius:"7px",border:"1.5px solid "+(ttsVoice==="man"?"#7c3aed":C.br),background:ttsVoice==="man"?"#ede9fe":"#fff",fontWeight:"700",fontSize:"12px",fontFamily:F,cursor:"pointer"}}>👨 Man</button>

                <button onClick={()=>{setTtsVoiceStyle("multi");setTtsMsg("");}} style={{padding:"8px",borderRadius:"7px",border:"1.5px solid "+(ttsVoiceStyle==="multi"?"#7c3aed":C.br),background:ttsVoiceStyle==="multi"?"#ede9fe":"#fff",fontWeight:"700",fontSize:"11px",fontFamily:F,cursor:"pointer"}}>Multi‑Voice Dialogue</button>
              </div>
              <Label text="😊 Tone / Emotion"/>
              <select value={ttsTone} onChange={e=>{setTtsTone(e.target.value);setTtsMsg("");}} style={{...inp,marginBottom:"8px",fontSize:"11px"}}>
                <option value="natural">Natural conversation</option>
                <option value="happy">Happy / cheerful</option>
                    <option value="mixed">Mixed Emotions / مشاعر متنوعة</option>
                <option value="sad">Sad / disappointed</option>
                <option value="afraid">Afraid / worried</option>
                <option value="angry">Angry / upset</option>
                <option value="excited">Excited</option>
                <option value="funny">Funny / light laughter</option>
                <option value="calm">Calm / clear</option>
              </select>
                  <div style={{fontSize:"11px",color:"#64748b",marginTop:"5px"}}>Mixed Emotions = fear, reassurance, light laugh, sadness, mild pain, controlled anger, joy.</div>
              <div style={{fontSize:"10px",color:"#6b21a8",margin:"-3px 0 8px",fontFamily:F}}>Multi‑Voice works best when the script uses labels like Dad:, Mom:, Boy:, Girl:, Speaker A:, Speaker B:</div>
              <input value={ttsWorkerUrl} onChange={e=>{setTtsWorkerUrl(e.target.value);localStorage.setItem("eq_tts_worker_url",e.target.value.trim());}} placeholder="🔗 AI Voice Worker URL" style={{...inp,marginBottom:"8px",fontSize:"11px"}}/>
              <Btn size="sm" color={C.pu} onClick={handleGenerateAIVoice} disabled={ttsBusy}>{ttsBusy?"⏳ Creating MP3…":"✨ Generate AI MP3 Voice"}</Btn>
              {ttsMsg && <p style={{fontSize:"11px",color:ttsMsg.startsWith("✅")?"#166534":"#92400e",margin:"8px 0 0",fontFamily:F}}>{ttsMsg}</p>}
            </div>}
            <div style={{borderTop:"1px solid "+C.br,paddingTop:"10px",marginTop:"4px"}}>
              <Label text="🎙️ Ready MP3 audio link/file (fastest for students)"/>

              <input value={audioFile.startsWith("data:")?"":audioFile} onChange={e=>setAudioFile(e.target.value)} placeholder="🔗 Paste audio URL (https://…)" style={{...inp,marginBottom:"8px"}}/>

              <input id="audioUp" type="file" accept="audio/*" ref={audioFileRef} onChange={handleAudioUpload} style={{display:"none"}}/>

              <Label text="How many times can a student listen? (0 = unlimited)"/>
              <input type="number" min="0" value={listenLimit} onChange={e=>setListenLimit(Math.max(0,Number(e.target.value)))} style={{...inp,marginBottom:"11px"}}/>
              <div style={{borderTop:"1px solid "+C.br,paddingTop:"10px"}}>
                <Label text="🎛️ Audio controls students can use"/>
                <div style={{display:"flex",gap:"6px",marginBottom:"9px",flexWrap:"wrap"}}>
                  <Btn size="sm" color={C.s} onClick={applyEasyMode}>🟢 Easy (all controls)</Btn>
                  <Btn size="sm" color={C.d} onClick={applyHardMode}>🔴 Hard (no controls)</Btn>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"7px"}}>
                  {[{k:"pause",l:"⏸ Pause"},{k:"restart",l:"🔁 Restart"},{k:"seek",l:"⏪⏩ Skip 10s"},{k:"speed",l:"⚡ Speed"}].map(o=>(
                    <label key={o.k} style={{display:"flex",alignItems:"center",gap:"7px",fontSize:"12px",color:C.tx,fontFamily:F,background:"#f8fafc",padding:"8px 10px",borderRadius:"8px",cursor:"pointer"}}>
                      <input type="checkbox" checked={!!audioControls[o.k]} onChange={e=>setAC(o.k,e.target.checked)} style={{width:"16px",height:"16px"}}/>
                      {o.l}
                    </label>
                  ))}
                </div>
                <p style={{fontSize:"10px",color:C.mu,margin:"7px 0 0",fontFamily:F}}>💡 For top students, use 🔴 Hard to make listening more challenging (play once, no pausing or slowing down).</p>
              </div>
              <div style={{borderTop:"1px solid "+C.br,paddingTop:"10px",marginTop:"10px"}}>
                <label style={{display:"flex",alignItems:"center",gap:"9px",cursor:"pointer",marginBottom:listenMatch?"10px":"0"}}>
                  <input type="checkbox" checked={listenMatch} onChange={e=>setListenMatch(e.target.checked)} style={{width:"18px",height:"18px"}}/>
                  <span style={{fontSize:"13px",fontWeight:"700",color:C.tx,fontFamily:F}}>🔗 Matching mode (students write a letter for each question)</span>
                </label>
                {listenMatch && <div style={{background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:"9px",padding:"11px"}}>
                  <p style={{fontSize:"11px",color:"#1e40af",margin:"0 0 9px",fontFamily:F}}>Add the answer choices (a, b, c…). You can add MORE answers than questions (extra ones become distractors). Below, for each question type the correct letter.</p>

                <input id="aiAudioUp" type="file" accept="audio/*" ref={aiAudioRef} onChange={handleAiAudio} style={{display:"none"}}/>

              <textarea value={aiText} onChange={e=>setAiText(e.target.value)} rows={6} placeholder={type==="Listening"?"Paste your listening questions here. Example:\n\n1. Where is the speaker?\nA. ...\nB. ...\nC. ...\nD. ...\n\n2. ...":"Paste your passage and questions here. Example:\n\n[Passage text...]\n\n1. What is the main idea?\nA. ...\nB. ...\nC. ...\nD. ...\n\n2. ..."} style={{...inp,resize:"vertical",lineHeight:"1.6"}}/>

// ── TEACHER APP ───────────────────────────────────────────────

function ReadingProgressStudent({user,data,reload,onHome,onReading}){
  if(!activeStudentInData(user,data)){
    try{ clearSession(); localStorage.removeItem(EQ_LOGIN_MEMORY_KEY); localStorage.removeItem("rp_attempt_records_v11"); }catch(e){}
    return <Card><strong style={{fontSize:"14px",color:C.d}}>🚫 Account removed</strong><p style={{fontSize:"12px",color:C.mu,lineHeight:1.7}}>تم حذف حسابك أو لم يعد مرتبطًا بفصل نشط. لا يمكن عرض مهام Reading Progress أو إرسال تسجيلات. تواصل مع المعلم.</p></Card>;
  }
  const tasks=(data.readingTasks||[]).filter(t=>t.status!=="closed").filter(t=>{
    if(t.status==="closed") return false;
    const userCid=canonicalClassId(user.classId||"");
    const delCls=(typeof deletedClassSetFromData==="function")?deletedClassSetFromData(data):adminDeletedClassSet();
    if(!userCid || delCls.has(userCid) || delCls.has(String(user.classId||""))) return false;
    const classOk=!t.classIds||t.classIds.length===0||t.classIds.map(canonicalClassId).includes(userCid)||t.classIds.includes(user.classId);
    const studentOk=!t.studentIds||t.studentIds.length===0||t.studentIds.includes(user.id)||t.studentIds.includes(user.studentId);
    const now=new Date();
    const timeOk=rpTaskDateVisible(t);
    return classOk && studentOk && timeOk;
  });
  const [localRpSubmissions,setLocalRpSubmissions]=useState([]);
  useEffect(()=>{ setLocalRpSubmissions([]); },[user&&user.id,user&&user.studentId]);
  function rpBelongsToCurrentStudent(x){
    if(!x) return false;
    const myIds=[String(user.id||""),String(user.studentId||""),String(user.email||"")].filter(Boolean);
    const myDigits=eqDigits(user.studentId||user.id||"");
    const vals=[x.studentId,x.studentNumber,x.studentUserId,x.userId,x.uid,x.studentEmail,x.ownerStudentId,x.ownerId].filter(Boolean).map(v=>String(v));
    if(vals.some(v=>myIds.includes(v))) return true;
    if(myDigits && vals.map(eqDigits).filter(Boolean).includes(myDigits)) return true;
    // Some older RP records keep the numeric student id inside the document id only.
    const docDigits=eqDigits(x.id||x.docId||"");
    if(myDigits && docDigits && docDigits.includes(myDigits)) return true;
    return false;
  }

  // RP161: direct student listener.
  // The student card must not wait for the general app cache/reload when the teacher rejects or deletes.
  // Firebase decisions are merged into localRpSubmissions immediately and then win inside attemptsForTask().
  useEffect(()=>{
    if(!user || !FIREBASE_OK || !(db&&db.collection)) return;
    let alive=true, unsub=null;
    try{
      unsub=db.collection("readingSubmissions").onSnapshot(function(snap){
        if(!alive) return;
        const arr=[];
        snap.forEach(function(doc){
          const item={id:doc.id,...(doc.data?doc.data():{})};
          if(rpBelongsToCurrentStudent(item)) arr.push(item);
        });
        arr.sort(function(a,b){return rpAttemptTimeMs(a)-rpAttemptTimeMs(b);});
        setLocalRpSubmissions(arr);
      }, function(err){ console.warn("RP161 student direct sync unavailable", err&&err.message); });
    }catch(e){ console.warn("RP161 student direct sync failed", e&&e.message); }
    return function(){ alive=false; try{unsub&&unsub();}catch(_e){} };
  },[user&&user.id,user&&user.studentId,user&&user.email]);

  const subs=[...(data.readingSubmissions||[]),...localRpSubmissions].filter(rpBelongsToCurrentStudent);
  const resets=(data.readingAttemptResets||[]);
  function resetCutoffForTask(taskId){
    const sidSet=[String(user.id||""),String(user.studentId||""),String(user.email||"")].filter(Boolean);
    const matches=resets.filter(r=>{
      if(!r || String(r.taskId||"")!==String(taskId||"")) return false;
      if(r.targetType==="all") return true;
      if(r.targetType==="class") return String(r.classId||"")===String(user.classId||"");
      if(r.targetType==="student") return sidSet.includes(String(r.studentId||"")) || sidSet.includes(String(r.studentNumber||""));
      return false;
    }).map(r=>Date.parse(r.resetAt||r.createdAt||"")||0).filter(Boolean);
    return matches.length?Math.max(...matches):0;
  }
  function afterReset(r,taskId){
    const cut=resetCutoffForTask(taskId);
    if(!cut) return true;
    return rpRecordTime(r)>cut;
  }
  function rpTaskNorm(v){ return String(v||"").toLowerCase().replace(/\s+/g," ").trim(); }
  function rpSameTaskForStudentRecord(r,t){
    if(!r || !t) return false;
    const recordIds=[r.taskId,r.taskKey,r.assignmentId].filter(Boolean).map(v=>String(v));
    const taskIds=[t.id,t.taskId,t.taskKey,t.assignmentId].filter(Boolean).map(v=>String(v));
    if(recordIds.length && taskIds.length && recordIds.some(v=>taskIds.includes(v))) return true;
    const recordNames=[r.taskTitle,r.title,r.taskName,r.assignmentTitle,r.assignment].filter(Boolean).map(rpTaskNorm);
    const taskNames=[t.title,t.taskTitle,t.name,t.taskName,t.assignmentTitle,t.assignment].filter(Boolean).map(rpTaskNorm);
    return recordNames.length && taskNames.length && recordNames.some(v=>taskNames.includes(v));
  }
  function rpFinalStateForStudentTask(r){
    const st=rpAttemptState(r);
    return st==="accepted" || st==="rejected" || st==="retake" || st==="deleted";
  }
  function rpRecordHasTaskIdentity(r){
    if(!r) return false;
    const ids=[r.taskId,r.taskKey,r.assignmentId].filter(Boolean).map(v=>String(v).trim()).filter(Boolean);
    if(ids.length) return true;
    const names=[r.taskTitle,r.title,r.taskName,r.assignmentTitle,r.assignment].filter(Boolean).map(rpTaskNorm).filter(Boolean);
    return names.some(n=>n && n!=="reading task" && n!=="reading progress task" && n!=="reading-progress-task-1");
  }
  function rpSameTaskForStudentRecordFinalAware(r,t){
    if(rpSameTaskForStudentRecord(r,t)) return true;
    // RP167: when the teacher decision document loses/changes taskId during normalization,
    // the student card still has only one visible RP task. In that case the final decision
    // must be allowed to attach to that visible card instead of letting old Pending win.
    if(rpFinalStateForStudentTask(r) && tasks.length===1) return true;
    return false;
  }
  function rpLocalAttemptsForTask(taskId){
    let out=[];
    try{
      ["rp_student_attempts","rp_attempt_records_v11","rp_attempt_records_v10","rp_attempt_records_v9","rp_attempt_records_v8","rp_attempt_records_v7"].forEach(k=>{
        const arr=JSON.parse(localStorage.getItem(k)||"[]");
        if(Array.isArray(arr)) out=out.concat(arr);
      });
    }catch(e){}
    return out.filter(r=>{
      if(!r || r.deleted===true || r.status==="deleted") return false;
      const sameTask=String(r.taskId||"")===String(taskId||"");
      const vals=[r.studentId,r.studentNumber,r.studentUserId,r.userId,r.uid,r.studentEmail].filter(Boolean).map(v=>String(v));
      const myIds=[String(user.id||""),String(user.studentId||""),String(user.email||"")].filter(Boolean);
      const myDigits=eqDigits(user.studentId||user.id||"");
      const sameStudent=vals.some(v=>myIds.includes(v)) || (myDigits && vals.map(eqDigits).filter(Boolean).includes(myDigits));
      return sameTask && sameStudent && afterReset(r,taskId);
    });
  }
  function studentKeys(){
    return [...new Set([String(user.id||""),String(user.studentId||""),String(user.email||"")].filter(Boolean))];
  }
  function attemptCounterKeys(taskId){
    return studentKeys().map(s=>"rp_attempt_count_"+s+"_"+String(taskId));
  }
  function getAttemptCounter(taskId){
    try{
      return Math.max(0,...attemptCounterKeys(taskId).map(k=>Number(localStorage.getItem(k)||0)||0));
    }catch(e){return 0;}
  }
  function setAttemptCounter(taskId,n){
    try{attemptCounterKeys(taskId).forEach(k=>localStorage.setItem(k, String(Math.max(0,Number(n)||0))));}catch(e){}
  }
  function saveStudentAttemptMarker(r){
    try{
      const arr=JSON.parse(localStorage.getItem("rp_student_attempts")||"[]");
      const clean=arr.filter(x=>x&&x.id!==r.id);
      clean.push(r);
      localStorage.setItem("rp_student_attempts", JSON.stringify(clean));
      const cut=resetCutoffForTask(r.taskId);
      const same=clean.filter(function(x){
        if(!x) return false;
        if(String(x.taskId||"")!==String(r.taskId||"")) return false;
        if(!studentKeys().includes(String(x.studentId||x.studentNumber||""))) return false;
        if(x.status==="deleted"||x.deleted===true) return false;
        if(cut && (rpRecordTime(x)||0)<=cut) return false; // exclude pre-reset
        return true;
      });
      const old=getAttemptCounter(r.taskId);
      setAttemptCounter(r.taskId, Math.max(old+1, same.length));
    }catch(e){}
  }
  function canAttemptTask(t){
    if(!t) return false;
    const done=attemptsForTask(t);
    const limit=totalAllowedAttempts(t);
    return done.length < limit || extraRetakeAllowed(done);
  }
  function attemptsForTask(t){
    // RP160: Firebase teacher decisions must beat stale local student markers.
    // Reject/delete from the teacher can be saved under the same attempt id OR under a cloud-only record.
    // In both cases, do not let old localStorage pending attempts or local attempt counters keep the
    // student card stuck on "Waiting for teacher analysis".
    const cloudAll=subs.filter(function(s){return s && rpSameTaskForStudentRecordFinalAware(s,t) && afterReset(s,t.id);});
    const cloudDeletedIds=new Set(cloudAll.filter(function(s){return s.deleted===true || String(s.status||"").toLowerCase()==="deleted" || rpAttemptState(s)==="deleted";}).map(function(s){return String(s.id||"");}));
    const cloudById={};
    cloudAll.forEach(function(s){ if(s&&s.id) cloudById[String(s.id)]={...(cloudById[String(s.id)]||{}),...s}; });
    const terminalCloud=cloudAll.filter(function(s){
      const st=rpAttemptState(s);
      return st==="accepted" || st==="rejected" || st==="retake" || st==="deleted";
    });
    function rpDecisionTime(s){
      const raw=s&&(s.rejectedAt||s.reviewedAt||s.deletedAt||s.acceptedAt||s.approvedAt||s.updatedAt||s.submittedAt||s.createdAt||s.timestamp);
      const n=Date.parse(raw||"");
      return Number.isFinite(n)?n:(rpAttemptTimeMs(s)||0);
    }
    function rpSubmitTime(s){
      // RP166: submitted time must not use updatedAt. Teacher accept/reject updates updatedAt,
      // and old pending copies may receive a fresh updatedAt during merge, causing them to look newer.
      // Only a true new student submission may beat a final teacher decision.
      const raw=s&&(s.submittedAt||s.createdAt||s.timestamp);
      const n=Date.parse(raw||"");
      return Number.isFinite(n)?n:0;
    }
    const newestTerminalTime=terminalCloud.length?Math.max.apply(null,terminalCloud.map(function(s){return rpDecisionTime(s)||0;})):0;
    const cloudPendingAfterTerminal=cloudAll.some(function(s){
      return rpAttemptState(s)==="pending" && (!newestTerminalTime || (rpSubmitTime(s)||0)>newestTerminalTime);
    });
    const cloud=Object.values(cloudById).filter(function(s){
      if(!s || s.deleted===true || String(s.status||"").toLowerCase()==="deleted" || rpAttemptState(s)==="deleted") return false;
      // RP166: once teacher has a final decision for this student's task, old pending copies must never win.
      // Allow pending only when it has a real submittedAt/createdAt/timestamp after that final decision.
      if(terminalCloud.length && rpAttemptState(s)==="pending" && (!(rpSubmitTime(s)||0) || (rpSubmitTime(s)||0) <= newestTerminalTime)) return false;
      return true;
    });
    const local=rpLocalAttemptsForTask(t.id).filter(function(r){
      const id=String(r&&r.id||"");
      if(id && cloudDeletedIds.has(id)) return false;
      // If Firebase has the same attempt, use the Firebase version because it may be rejected/accepted/deleted.
      if(id && cloudById[id]) return false;
      const localState=rpAttemptState(r);
      const localSubmitTime=rpSubmitTime(r)||0;
      // RP162: once the teacher has rejected/deleted/accepted an attempt in Firebase, never let an old
      // device-only pending marker recreate "Waiting for teacher analysis" for the student.
      // A genuinely new attempt is allowed only when Firebase also has a newer pending submission.
      if(terminalCloud.length && (localState==="pending" || localState==="none")){
        // RP174: a fresh device/local submission after the teacher decision must show Pending immediately,
        // even before the Firestore listener has caught up. Only older local markers are suppressed.
        if(localSubmitTime && localSubmitTime > newestTerminalTime) return true;
        return false;
      }
      return true;
    });
    const map={};
    [...local,...cloud].forEach(function(r){ if(r&&r.id) map[String(r.id)]={...(map[String(r.id)]||{}),...r}; });
    const arr=Object.values(map).filter(function(r){return r && r.deleted!==true && String(r.status||"").toLowerCase()!=="deleted" && rpAttemptState(r)!=="deleted";});
    const cut=resetCutoffForTask(t.id);
    // Do not create artificial pending counters when Firebase already has any final teacher decision,
    // including deleted attempts. Otherwise the student page recreates a fake Waiting card.

    setRpButton("reset_attempts","Updating...");
    const id="rpr_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    try{await fsSet("readingAttemptResets",id,{id,teacherId:user.id,taskId:resetTaskId,targetType:resetTargetType,...target,resetAt:new Date().toISOString(),createdAt:today()});}finally{clearRpButton("reset_attempts");}
    setMsg("✅ تم تصفير المحاولات بنجاح!\nالمهمة: "+(t?t.title:"")+" — "+targetLabel+"\nيجب على الطالب تحديث الصفحة.");
    setResetTaskId(""); setResetStudentId(""); setResetClassId(""); setResetTargetType("student");
    await reload();
  }
  function rpCleanupTargetLabel(type, studentId, classId){
    if(type==="selected") return "المحاولات المحددة / Selected attempts";
    if(type==="student"){
      const st=(myStudents||[]).find(s=>String(s.id)===String(studentId));
      return st ? (st.name+" (#"+(st.studentId||st.id)+")") : "الطالب المختار";
    }
    if(type==="class"){
      const cls=(myClasses||[]).find(c=>String(c.id)===String(classId));
      return cls ? cls.name : "الفصل المختار";
    }
    return "جميع الطلاب / All students";
  }
  function rpAttemptMatchesCleanup(s){
    if(!s || rpOldDeleted(s)) return false;
    if(deleteTaskId && deleteTaskId!=="all" && String(s.taskId)!==String(deleteTaskId)) return false;
    if(deleteTargetType==="selected") return !!selectedAttemptIds[s.id];
    if(deleteTargetType==="student"){
      if(!deleteStudentId) return false;
      const st=(myStudents||[]).find(x=>String(x.id)===String(deleteStudentId));
      if(!st) return false;
      return responseBelongsToStudent(s,st);
    }
    if(deleteTargetType==="class"){
      if(!deleteClassId) return false;
      const clsId=String(deleteClassId||"");
      const clsCanon=canonicalClassId(clsId);
      const sCls=String(s.classId||s.className||"");
      const sCanon=canonicalClassId(sCls);
      return sCls===clsId || sCanon===clsCanon;
    }
    return true;
  }
  async function deleteReadingAttemptsBulk(){
    if(deleteTargetType==="student" && !deleteStudentId){setMsg("⚠️ اختر الطالب أولاً. / Choose student first.");return;}
    if(deleteTargetType==="class" && !deleteClassId){setMsg("⚠️ اختر الفصل أولاً. / Choose class first.");return;}
    const matches=subs.filter(rpAttemptMatchesCleanup);
    if(!matches.length){setMsg("⚠️ لا توجد محاولات مطابقة للحذف. / No matching attempts.");return;}
    const taskLabel=deleteTaskId==="all"?"كل المهام / All tasks":((tasks.find(t=>String(t.id)===String(deleteTaskId))||{}).title||"المهمة المختارة");
    const targetLabel=rpCleanupTargetLabel(deleteTargetType,deleteStudentId,deleteClassId);
    const txt="سيتم إخفاء/حذف "+matches.length+" محاولة من النتائج وحساب الطالب.\n\nالمهمة: "+taskLabel+"\nالهدف: "+targetLabel+"\n\nاكتب DELETE للتأكيد.";
    const ok=window.prompt(txt,"");
    if(String(ok||"").trim().toUpperCase()!=="DELETE") return;
    setRpButton("delete_attempts_bulk","Deleting..."); setMsg("Deleting selected Reading Progress attempts...");
    let done=0, fail=0;
    for(const r of matches){
      try{
        const upd={...r,rpExactDeleted:true,exactAttemptDeleted:true,deletedAttemptExact:true,deleteScope:"single_attempt",deleteMode:"single_attempt",status:"deleted",reviewStatus:"deleted",teacherReview:"deleted",teacherReviewStatus:"deleted",studentStatus:"deleted",deleted:true,pending:false,accepted:false,approved:false,teacherAccepted:false,teacherApproved:false,deletedAt:new Date().toISOString(),reviewedAt:new Date().toISOString(),updatedAt:new Date().toISOString(),deletedBy:user.id||"teacher",visibleToStudent:false,scoreVisible:false};
        setLocalTeacherSubs(prev=>rpMergeById(prev,[upd]));
        await fsSet("readingSubmissions",r.id,upd);
        done++;
      }catch(e){fail++; console.warn("delete reading attempt failed",r&&r.id,e);}
    }
    clearRpButton("delete_attempts_bulk");
    setSelectedAttemptIds({});
    setMsg((done?"✅ تم حذف/إخفاء "+done+" محاولة. ":"")+(fail?"⚠️ فشل "+fail:""));
    try{await reload();}catch(e){}
  }
  async function deleteSingleReadingAttempt(s){
    if(!s||!s.id) return;
    const st=myStudents.find(x=>responseBelongsToStudent(s,x));
    const t=(data.readingTasks||[]).find(x=>String(x.id)===String(s.taskId));
    const ok=window.confirm("Delete this attempt from teacher and student results?\n\nStudent: "+(st?st.name:"Student")+"\nTask: "+(t?t.title:"Task")+"\n\nThis will make it excluded from student performance.");
    if(!ok) return;
    const bid="del_one_"+s.id; setRpButton(bid,"Deleting...");
    const upd={...s,rpExactDeleted:true,exactAttemptDeleted:true,deletedAttemptExact:true,deleteScope:"single_attempt",deleteMode:"single_attempt",status:"deleted",reviewStatus:"deleted",teacherReview:"deleted",teacherReviewStatus:"deleted",studentStatus:"deleted",deleted:true,pending:false,accepted:false,approved:false,teacherAccepted:false,teacherApproved:false,deletedAt:new Date().toISOString(),reviewedAt:new Date().toISOString(),updatedAt:new Date().toISOString(),deletedBy:user.id||"teacher",visibleToStudent:false,scoreVisible:false};
    setLocalTeacherSubs(prev=>rpMergeById(prev,[upd]));
    try{await fsSet("readingSubmissions",s.id,upd); setMsg("✅ Attempt deleted/hidden."); try{await reload();}catch(e){}}
    finally{setTimeout(()=>clearRpButton(bid),250);}
  }

  async function delTask(t){
    const related=(data.readingSubmissions||[]).filter(s=>s.taskId===t.id && s.deleted!==true && s.status!=="deleted").length;
    const msg="Delete this Reading Progress task?\n\nTask: "+(t.title||"Reading Task")+"\nStudent recordings/results linked to this task will be kept, but the task will no longer appear for students."+ (related?"\n\nLinked submissions kept: "+related:"");
    if(!confirm(msg))return;
    setLocalTeacherTasks(prev=>(prev||[]).filter(x=>x&&x.id!==t.id));
    setMsg("Updating... Deleting task");
    await fsDel("readingTasks",t.id);
    setMsg("✅ Reading task deleted. Existing student submissions were kept.");
    reload();
  }
  const targetStudents=myStudents.filter(s=>!classIds.length||classIds.includes(s.classId));
  const filteredStudents=myStudents.filter(s=>(filter==="all"||s.classId===filter)&&(!search||s.name.toLowerCase().includes(search.toLowerCase())||(s.studentId||"").includes(search)));
  const studentStats=filteredStudents.map(st=>{
    const ss=subs.filter(x=>responseBelongsToStudent(x,st) && rpApprovedForDashboard(x));
    const scores=ss.map(rpScoreForDashboard).filter(x=>x!==null);
    const wcpmVals=ss.map(rpWcpmForDashboard).filter(x=>x!==null);
    const fluVals=ss.map(rpFluencyForDashboard).filter(x=>x!==null);
    const avg=scores.length?Math.round(scores.reduce((a,x)=>a+x,0)/scores.length):null;
    const w=wcpmVals.length?Math.round(wcpmVals.reduce((a,x)=>a+x,0)/wcpmVals.length):null;
    const f=fluVals.length?Math.round(fluVals.reduce((a,x)=>a+x,0)/fluVals.length):null;
    return {st,ss,avg,w,f};
  });
  return <div>
    <Card style={{marginBottom:"11px",background:"linear-gradient(135deg,"+C.dk+","+C.md+")",border:"none"}}><strong style={{color:"#fff",fontSize:"14px"}}>📖 Reading Progress AI</strong><p style={{color:C.mu,fontSize:"11px",margin:"4px 0 0"}}>Create text, let students record, then analyze accuracy, speed, mistakes and growth.</p><div style={{marginTop:"8px",fontSize:"11px",fontWeight:900,color:"#fff",background:"rgba(255,255,255,.12)",padding:"6px 8px",borderRadius:"8px",display:"inline-block"}}>RP119 Live Firebase Link + One Status Source</div></Card>
    <Card style={{marginBottom:"11px",border:"2px solid "+C.p}}><strong style={{fontSize:"13px",color:C.tx}}>⚙️ Teacher-side Auto Correction</strong><p style={{fontSize:"11px",color:C.mu,margin:"5px 0 8px"}}>تصحيح تلقائي من جهاز المعلم فقط عندما تكون لوحة المعلم مفتوحة. الطلاب لا يحتاجون مفتاح OpenAI.</p><label style={{display:"flex",alignItems:"center",gap:"8px",fontSize:"12px",fontWeight:800,color:C.tx}}><input type="checkbox" checked={teacherAuto} onChange={e=>setTeacherAuto(e.target.checked)}/> Auto analyze waiting/new submissions while teacher dashboard is open</label><div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginTop:"8px"}}><input type="password" value={teacherKey} onChange={e=>{setTeacherKey(e.target.value);localStorage.setItem("rp_openai_api_key",e.target.value.trim());}} placeholder="OpenAI API Key on teacher device" style={{flex:1,minWidth:"220px",padding:"8px",border:"1px solid "+C.br,borderRadius:"8px"}}/><Btn size="sm" color={C.s} onClick={()=>analyzeWaitingNow(false)}>Analyze Waiting Now</Btn><span style={{fontSize:"10px",fontWeight:900,color:teacherKey?C.s:C.d,alignSelf:"center"}}>{teacherKey?"Key saved":"Key missing"}</span></div></Card>
    <Card style={{marginBottom:"11px",border:"2px solid "+C.w}}>
      <strong style={{fontSize:"13px",color:C.tx}}>🔄 Reset Reading Progress Attempts</strong>
      <p style={{fontSize:"11px",color:C.mu,margin:"5px 0 8px"}}>اختر الاختبار أولًا، ثم الطالب أو الصف أو جميع الفصول. التصفير لا يحذف التسجيلات القديمة؛ فقط لا يحسبها بعد وقت التصفير.</p>
      <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>

function fixAhmedStudent(u){
  if(!u) return u;
  const n=String(u.name||"").replace(/\s+/g," ").trim();
  const looksAhmed = n.includes("أحمد علي الخميس") || n.includes("احمد علي الخميس") || n.toLowerCase().includes("ahmed ali");
  if(!looksAhmed) return u;
  return {...u, studentId:"3136", className:"3/1- 3", fixedClassName:"3/1- 3"};
}
function cleanClassLabel(v){
  const s=String(v||"").trim();
  if(!s) return "";
  if(/^class_3_1$/i.test(s)) return "ثالث أول — 3-1";
  if(/^class_3_2$/i.test(s)) return "ثالث ثاني — 3-2";
  if(/^class_3_3$/i.test(s)) return "ثالث ثالث — 3-3";
  if(/^class_3_4$/i.test(s)) return "ثالث رابع — 3-4";
  if(/^mph/i.test(s) || s.length>18) return "";
  return s;
}

  }

  function isDeleted(r){return !!(r&&(r.rpExactDeleted===true||r.exactAttemptDeleted===true||r.deletedAttemptExact===true||r.deleteScope==="single_attempt"||r.deleteMode==="single_attempt")&&(r.deleted===true||String(r.status||"").toLowerCase()==="deleted"));}
  function isRejected(r){return !!(r&&r.status==="rejected");}
  function isApproved(r){const t=Number(r&&r.teacherScore);return !!(r&&!isDeleted(r)&&!isRejected(r)&&((r.status==="accepted"||r.status==="approved")||(!Number.isNaN(t)&&t>0)));}
  function score(r){const t=Number(r&&r.teacherScore); if(!Number.isNaN(t)&&t>0)return Math.round(Math.max(0,Math.min(100,t))); const f=Number(r&&r.finalScore); if(!Number.isNaN(f)&&f>0)return Math.round(Math.max(0,Math.min(100,f))); const ai=Number(r&&r.aiScore); if(!Number.isNaN(ai)&&ai>0)return Math.round(Math.max(0,Math.min(100,ai))); const a=Number(r&&r.accuracy); if(!Number.isNaN(a)&&a>0)return Math.round(Math.max(0,Math.min(100,a))); if(r&&r.analysis&&Number.isFinite(Number(r.analysis.accuracy)))return Math.round(Number(r.analysis.accuracy)); return null;}
  function accuracy(r){const a=Number(r&&r.accuracy); if(!Number.isNaN(a)&&a>0)return Math.round(a); if(r&&r.analysis&&Number.isFinite(Number(r.analysis.accuracy)))return Math.round(Number(r.analysis.accuracy)); return score(r);}
  function wcpm(r){if(Number.isFinite(Number(r&&r.wcpm)))return Math.round(Number(r.wcpm)); if(r&&r.analysis&&Number.isFinite(Number(r.analysis.wcpm)))return Math.round(Number(r.analysis.wcpm)); return null;}
  function fluency(r){if(Number.isFinite(Number(r&&r.fluency)))return Math.round(Number(r.fluency)); if(r&&r.analysis&&Number.isFinite(Number(r.analysis.fluency)))return Math.round(Number(r.analysis.fluency)); return null;}
  function sname(r){return String(r.studentName||r.name||"Student").trim();}

  function avg(a){a=a.filter(x=>x!==null&&x!==undefined&&Number.isFinite(Number(x)));return a.length?Math.round(a.reduce((x,y)=>x+Number(y),0)/a.length):null;}
  function perfLevel(v){if(v===null)return "—"; if(v>=90)return "Excellent"; if(v>=80)return "Very Good"; if(v>=70)return "Good"; if(v>=60)return "Needs Practice"; return "Needs Support";}
  function improveText(items){const sorted=items.slice().sort((a,b)=>timeOf(a)-timeOf(b)).map(score).filter(x=>x!==null); if(sorted.length===0)return "—"; if(sorted.length===1)return "Baseline: "+sorted[0]+"%"; const min=Math.min(...sorted), last=sorted[sorted.length-1], diff=last-min; if(diff>=50)return "+"+diff+"% Excellent Growth"; if(diff>=30)return "+"+diff+"% Strong Growth"; if(diff>=20)return "+"+diff+"% Good Growth"; if(diff>=10)return "+"+diff+"% Growth"; if(diff>0)return "+"+diff+"% Slight Growth"; return "+0% Stable";}

  const approved=all.filter(isApproved), pending=all.filter(r=>!isApproved(r)&&!isRejected(r)), rejected=all.filter(isRejected);

  const rows=Object.values(grouped).sort((a,b)=>a.name.localeCompare(b.name));
  const overall=avg(approved.map(score)), accAvg=avg(approved.map(accuracy));

  const dist=[{label:"90-100",count:approved.filter(r=>score(r)>=90).length,color:C.s},{label:"80-89",count:approved.filter(r=>score(r)>=80&&score(r)<90).length,color:C.p},{label:"70-79",count:approved.filter(r=>score(r)>=70&&score(r)<80).length,color:C.w},{label:"<70",count:approved.filter(r=>score(r)!==null&&score(r)<70).length,color:C.d}];

  function buildPreview(){

    });
    const out=[];
    Object.values(grouped).forEach(list=>{
      const ordered=list.slice().sort((a,b)=>(a.__i||0)-(b.__i||0));
      const first=ordered[0];
      const last=ordered[ordered.length-1];
      const best=ordered.slice().sort((a,b)=>scorePct(b)-scorePct(a)||num(b.earned)-num(a.earned))[0];
      let chosen=best;

      const lowest=ordered.slice().sort((a,b)=>scorePct(a)-scorePct(b)||num(a.earned)-num(b.earned))[0];

      function pick(o,names){

  const preview=buildPreview();

  function relatedResponses(q){return (data.responses||[]).filter(r=>r.deleted!==true&&r.status!=="deleted"&&(r.quizId===q.id || (q.importBatchId&&r.importBatchId===q.importBatchId)));}
  const importedQuizMap={}; importedQuizzes.forEach(q=>importedQuizMap[q.id]=q);
  const allImportedResponses=importedQuizzes.flatMap(q=>relatedResponses(q).map(r=>({...r,__quiz:q})));
  const effectiveZipFrom = zipFrom!=="all"?zipFrom:(importedQuizzes[0]&&importedQuizzes[0].id)||"all";
  const effectiveZipTo = zipTo!=="all"?zipTo:(importedQuizzes[1]&&importedQuizzes[1].id)||effectiveZipFrom;
  function quizAllowed(qid){
    if(zipMode==="all") return true;
    if(zipMode==="single") return qid===effectiveZipFrom;
    if(zipMode==="compare") return qid===effectiveZipFrom || qid===effectiveZipTo;

  function impPctResp(r){return Number.isFinite(Number(r.percent))?Number(r.percent):pct(r.score,r.totalQ);}
  function impTime(r){return Number(r.ts)||Date.parse(r.importedAt||r.completedAt||r.createdAt||"")||0;}
  function buildImprovedRows(){
    const rows=[];
    // 1) Improvement INSIDE the same ZipGrade file/import.
    // ZipGrade full format may contain repeated rows for the same student. During import we store
    // first/last/best/low and duplicateRows on the single official response. This report must read
    // those saved details, not only compare separate quizzes.
    allImportedResponses.filter(r=>zipMode!=="compare" && quizAllowed(r.__quiz&&r.__quiz.id)).forEach(r=>{
      const imp=Number(r.improvement||0);
      const impPct=Number(r.improvementPercent!==undefined?r.improvementPercent:((imp)/Math.max(1,Number(r.totalQ)||1))*100);
      const cls=myClasses.find(c=>c.id===r.classId);
      if(Number.isFinite(impPct) && impPct>=Number(improvedMin||0) && (improvedClass==="all"||r.classId===improvedClass)){
        if(imp>0 || (Number(r.attemptCount||1)>1 && impPct>0)){

            bestPct:r.bestPercent!==undefined?oneDec(r.bestPercent):oneDec((Number((r.bestScore!==undefined?r.bestScore:r.score)||0)/Math.max(1,Number(r.totalQ)||1))*100),

            improvementPoints:imp,

        const toList=ordered.filter(x=>(x.__quiz&&x.__quiz.id)===effectiveZipTo);
        if(!fromList.length||!toList.length)return;
        first=fromList.slice().sort((a,b)=>impTime(a)-impTime(b))[0];
        last=toList.slice().sort((a,b)=>impTime(b)-impTime(a))[0];
        best=toList.slice().sort((a,b)=>impPctResp(b)-impPctResp(a)||Number(b.score||0)-Number(a.score||0))[0];
        low=fromList.slice().sort((a,b)=>impPctResp(a)-impPctResp(b)||Number(a.score||0)-Number(b.score||0))[0];
      }
      const firstPct=oneDec(impPctResp(first)), lastPct=oneDec(impPctResp(last)), bestPct=oneDec(impPctResp(best)), lowPct=oneDec(impPctResp(low));
      const sameTotal=Number(first.totalQ||0)===Number(best.totalQ||0);
      const impPoints=sameTotal?Number(best.score||0)-Number(first.score||0):null;
      const impPercent=oneDec(bestPct-firstPct);

      const row={sourceType:"Across ZipGrade quizzes",studentId:first.studentId,studentNumber:first.studentNumber,studentName:first.studentName||best.studentName||last.studentName||"—",classId:first.classId||best.classId||last.classId,className:cls?cls.name:"—",attempts:ordered.length,first,last,best,low,firstPct,lastPct,bestPct,lowPct,improvementPoints:impPoints,improvementPercent:impPercent,firstQuiz:(first.__quiz&&first.__quiz.title)||"—",lastQuiz:(last.__quiz&&last.__quiz.title)||"—",bestQuiz:(best.__quiz&&best.__quiz.title)||"—"};
      if((improvedClass==="all"||row.classId===improvedClass) && Number(row.improvementPercent||0)>=Number(improvedMin||0)) rows.push(row);
    });

    return rows.filter(r=>{
      const key=[r.sourceType,r.studentId||r.studentNumber||r.studentName,r.firstQuiz,r.bestQuiz,r.improvementPoints,r.improvementPercent].join('|');

// ── READING THEORY v2 — Adaptive + KP + Badges ───────────────
// نظام تكيفي: المستوى يتطور حسب أداء الطالب
// نقاط KP تتراكم مع كل إجابة صحيحة
// أوسمة ReadTheory: Luminary → Orienteer → ... → Page 2+

const RT_TOPICS = [
  "Animals and Nature","Sports and Health","Technology","Food and Culture",
  "Famous People","Travel and Places","Science and Discoveries","Environment",
  "School and Education","Friendship and Family","History","Space and Universe",
  "Ocean Life","Weather and Climate","Music and Art","Healthy Habits",
  "Robots and AI","Ancient Civilizations","Insects and Plants","Teamwork"
];

// 5 مستويات تكيفية — كل مستوى أطول وأصعب
const RT_ADAPTIVE_LEVELS = [
  {id:1, name:"Beginner",    words:60,  color:"#22c55e", emoji:"🟢"},
  {id:2, name:"Elementary",  words:90,  color:"#3b82f6", emoji:"🔵"},
  {id:3, name:"Intermediate",words:130, color:"#f59e0b", emoji:"🟡"},
  {id:4, name:"Upper-Inter", words:170, color:"#f97316", emoji:"🟠"},
  {id:5, name:"Advanced",    words:220, color:"#ef4444", emoji:"🔴"},
];

// أوسمة ReadTheory الأصلية — مبنية على نقاط KP
const RT_BADGES = [
  {id:"luminary",   icon:"💡", name:"Luminary",    kp:10,   desc:"Earn 10 KP"},
  {id:"orienteer",  icon:"🧭", name:"Orienteer",   kp:50,   desc:"Earn 50 KP"},
  {id:"innovator",  icon:"⚙️", name:"Innovator",   kp:100,  desc:"Earn 100 KP"},
  {id:"tactician",  icon:"♟️", name:"Tactician",   kp:150,  desc:"Earn 150 KP"},
  {id:"analyst",    icon:"🔍", name:"Analyst",     kp:200,  desc:"Earn 200 KP"},
  {id:"naturalist", icon:"🌿", name:"Naturalist",  kp:310,  desc:"Earn 310 KP"},
  {id:"explorer",   icon:"🗺️", name:"Explorer",    kp:400,  desc:"Earn 400 KP"},
  {id:"optimist",   icon:"☀️", name:"Optimist",    kp:500,  desc:"Earn 500 KP"},
  {id:"scholar",    icon:"🎓", name:"Scholar",     kp:650,  desc:"Earn 650 KP"},
  {id:"champion",   icon:"🏆", name:"Champion",    kp:850,  desc:"Earn 850 KP"},
  {id:"legend",     icon:"⭐", name:"Legend",      kp:1100, desc:"Earn 1100 KP"},
  {id:"master",     icon:"👑", name:"Master",      kp:1500, desc:"Earn 1500 KP"},
];

// احسب KP: كل إجابة صحيحة = نقاط حسب المستوى
function rtKpPerCorrect(levelId){ return levelId||1; } // Beginner=1, Advanced=5
function rtCalcKp(resps){
  return (resps||[]).reduce((sum,r)=>{
    const lv = RT_ADAPTIVE_LEVELS.find(l=>l.name===(r.level||"Beginner")||l.id===(r.levelId||1));
    const kpEach = rtKpPerCorrect(lv?lv.id:1);
    return sum + (r.correct||0)*kpEach;
  },0);
}
function rtCurrentBadge(kp){
  let badge = null;
  RT_BADGES.forEach(b=>{ if(kp>=b.kp) badge=b; });
  return badge;
}
function rtNextBadge(kp){
  return RT_BADGES.find(b=>kp<b.kp)||null;
}
// حساب المستوى التكيفي بناءً على آخر 3 محاولات
function rtAdaptiveLevel(resps){
  if(!resps||!resps.length) return RT_ADAPTIVE_LEVELS[0];
  const last3 = resps.slice(-3);
  const avgScore = last3.reduce((s,r)=>s+(r.score||0),0)/last3.length;
  const lastLv = RT_ADAPTIVE_LEVELS.find(l=>l.name===(resps[resps.length-1].level||"Beginner")||l.id===(resps[resps.length-1].levelId||1)) || RT_ADAPTIVE_LEVELS[0];
  let newIdx = RT_ADAPTIVE_LEVELS.indexOf(lastLv);
  if(avgScore>=80 && newIdx<RT_ADAPTIVE_LEVELS.length-1) newIdx++;
  else if(avgScore<50 && newIdx>0) newIdx--;
  return RT_ADAPTIVE_LEVELS[newIdx];
}

async function generateReadingTheorySession(apiKey, level, topic) {
  const prompt = `Create an English reading comprehension exercise for EFL students.
Level: ${level.name} (about ${level.words} words).
Topic: ${topic}.

Write a reading passage of exactly about ${level.words} words. Then create exactly 5 multiple-choice comprehension questions. Each question has 4 options (A,B,C,D) with ONE correct answer. Mix question types: Main Idea, Detail, Inference, Vocabulary, Cause & Effect.

Return ONLY valid JSON (no markdown):
{"topic":"${topic}","level":"${level.name}","passage":"full passage text","questions":[{"text":"question","options":["A","B","C","D"],"correct":0}]}

"correct" is 0-3 index of the right answer.`;

  const resp = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1400,messages:[{role:"user",content:prompt}]})
  });
  if(!resp.ok) throw new Error("API error "+resp.status);
  let data = await resp.json();
  let txt = (data.content&&data.content[0]&&data.content[0].text)||"";
  txt = txt.replace(/```json/g,"").replace(/```/g,"").trim();
  const s=txt.indexOf("{"), e=txt.lastIndexOf("}");
  if(s>=0&&e>s) txt=txt.slice(s,e+1);
  let parsed = JSON.parse(txt);
  if(!parsed.passage||!parsed.questions||parsed.questions.length<3) throw new Error("Invalid AI response");
  return parsed;
}

function adminConfirmOk(input, phrase){
