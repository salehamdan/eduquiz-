});

function canonicalClassId(v){

  const n=normalizeNameText(s).replace(/[\s_—–-]+/g," ");
  const e=s.toLowerCase().replace(/[\s_—–-]+/g," ").trim();
  const d=eqDigits(s);
  const digitsOnly=/^[0-9٠-٩۰-۹]+$/.test(s.replace(/\s/g,""));
  // Numeric Excel class values: in this school roster, a single digit 1-6 means Third First-Sixth.
  // This is required so old rows saved as class: 4 are found and deleted when Third Fourth is reset.
  if(digitsOnly && d==="1") return "class_3_1";
  if(digitsOnly && d==="2") return "class_3_2";
  if(digitsOnly && d==="3") return "class_3_3";
  if(digitsOnly && d==="4") return "class_3_4";
  if(digitsOnly && d==="5") return "class_3_5";
  if(digitsOnly && d==="6") return "class_3_6";
  // Arabic + English aliases. This is critical for deleting old/English class names like Second Fourth.
  if(s==="class_3_1" || d==="31" || d==="13" || n.includes("ثالث اول") || e.includes("third first") || e.includes("3 1") || n.includes("3 1") || n.includes("1 3")) return "class_3_1";
  if(s==="class_3_2" || d==="32" || d==="23" || n.includes("ثالث ثاني") || e.includes("third second") || e.includes("3 2") || n.includes("3 2") || n.includes("2 3")) return "class_3_2";
  if(s==="class_3_3" || d==="33" || n.includes("ثالث ثالث") || e.includes("third third") || e.includes("3 3") || n.includes("3 3")) return "class_3_3";
  if(s==="class_3_4" || d==="34" || d==="43" || n.includes("ثالث رابع") || n.includes("الثالث رابع") || n.includes("ثالث الرابع") || n.includes("الثالث الرابع") || n.includes("ثالث ورابع") || n.includes("الثالث والرابع") || e.includes("third fourth") || e.includes("3 4") || n.includes("3 4") || n.includes("4 3")) return "class_3_4";
  if(s==="class_3_5" || d==="35" || d==="53" || n.includes("ثالث خامس") || e.includes("third fifth") || e.includes("3 5") || n.includes("3 5") || n.includes("5 3")) return "class_3_5";
  if(s==="class_3_6" || d==="36" || d==="63" || n.includes("ثالث سادس") || e.includes("third sixth") || e.includes("3 6") || n.includes("3 6") || n.includes("6 3")) return "class_3_6";
  if(s==="class_2_4" || d==="24" || d==="42" || n.includes("ثاني رابع") || e.includes("second fourth") || e.includes("2 4") || n.includes("2 4") || n.includes("4 2")) return "class_2_4";
  return s;
}

function adminClassAliases(c){
  const vals=[c&&c.id,c&&c._id,c&&c.name,c&&c.grade,c&&c.classId,c&&c.className,c&&c.class].filter(Boolean).map(String);
  const out=new Set(vals);

  const canon=canonicalClassId((c&& (c.id||c.classId||c.grade||c.name||c.className||c.class)) || "");
  const m=String(canon||"").match(/^class_3_([1-6])$/);
  if(m){ out.add(m[1]); out.add("3-"+m[1]); out.add("3 "+m[1]); }
  return Array.from(out).filter(Boolean);
}

// Same matching rules, with a small memo cache to keep dashboards fast without

const __eqRespStudentMemo = new Map();
function __eqRespStudentCacheKey(resp, student){
  const rid = String((resp&&(resp.id||resp._id||resp.docId||resp.studentId||resp.userId||resp.uid))||"");
  const sid = String((student&&(student.id||student.studentId||student.number||student.studentNumber))||"");
  const r2 = String((resp&&(resp.studentId||resp.userId||resp.uid||resp.studentNumber||resp.studentIdNumber||resp.restoredFromStudentId||resp.restoredFrom||resp.studentName||resp.name||resp.restoredFromName))||"");
  const s2 = String((student&&(student.studentId||student.name||student.shortName))||"");
  return rid+"|"+sid+"|"+r2+"|"+s2;
}
function __eqMemoReturn(key, val){
  if(__eqRespStudentMemo.size>250000) __eqRespStudentMemo.clear();
  __eqRespStudentMemo.set(key, !!val);
  return !!val;
}
function responseBelongsToStudent(resp, student){
  if(!resp || !student) return false;
  const __ck = __eqRespStudentCacheKey(resp, student);
  if(__eqRespStudentMemo.has(__ck)) return __eqRespStudentMemo.get(__ck);
  const studentDigits = eqDigits(student.studentId || student.id || student.number || student.studentNumber || "");
  const studentAliasIds = [].concat(student.aliasIds||[], student.linkedIds||[], student.mergeIds||[]);
  const studentAliasNums = [].concat(student.aliasStudentIds||[], student.linkedStudentIds||[], student.mergeStudentIds||[]);
  const ids = [student.id, student.studentId, student.number, student.studentNumber, studentDigits, studentDigits?"student_"+studentDigits:""].concat(studentAliasIds, studentAliasNums).filter(Boolean).map(v=>String(v).trim());
  const rids = [resp.studentId, resp.userId, resp.uid, resp.studentNumber, resp.studentIdNumber, resp.restoredFromStudentId, resp.restoredFrom, resp.id, resp._id].filter(Boolean).map(v=>String(v).trim());
  if(rids.some(x=>ids.includes(x))) return __eqMemoReturn(__ck,true);
  const rDigits = rids.map(eqDigits).filter(Boolean);
  if(studentDigits && rDigits.includes(studentDigits)) return __eqMemoReturn(__ck,true);
  // NUMERIC_STUDENT_ID_LINK_FIX_20260610
  // النتائج القديمة قد تحفظ رقم الطالب فقط مثل 2410/2415/2420 أو بصيغة أطول تنتهي برقم الطالب.
  // نربطها بالقائمة الرسمية حتى تظهر الأسماء بدل الأرقام.
  if(studentDigits && studentDigits.length>=4 && rDigits.some(function(x){return x && x.length>studentDigits.length && x.endsWith(studentDigits);})){ return __eqMemoReturn(__ck,true); }
  const rText = [resp.studentName, resp.name, resp.restoredFromName, resp.email].filter(Boolean).join(" ");
  if(rText && studentNameMatches(student, rText)) return __eqMemoReturn(__ck,true);
  return __eqMemoReturn(__ck,false);
}

function responsesForStudent(list, student){
  if(!student) return [];
  const arr=list||[];
  const sk=String(student.id||student.studentId||student.number||student.name||"");
  const lk=arr.length+":"+(arr[0]&&(arr[0].id||arr[0]._id||arr[0].studentId)||"")+":"+(arr[arr.length-1]&&(arr[arr.length-1].id||arr[arr.length-1]._id||arr[arr.length-1].studentId)||"");
  if(!responsesForStudent.__cache) responsesForStudent.__cache=new Map();
  const ck=sk+"|"+lk;
  if(responsesForStudent.__cache.has(ck)) return responsesForStudent.__cache.get(ck);
  if(responsesForStudent.__cache.size>10000) responsesForStudent.__cache.clear();
  const out=arr.filter(function(r){ return responseBelongsToStudent(r, student); });
  responsesForStudent.__cache.set(ck,out);
  return out;
}

function studentMatchesSearch(student, rawSearch){

  const qn=normalizeNameText(q);

// ── READING PROGRESS STORAGE & ANALYSIS ───────────────────────
function rpWords(text){ return String(text||"").toLowerCase().replace(/[^a-z\s']/g," ").split(/\s+/).filter(Boolean); }
function rpLcsLength(a,b){
  const m=a.length,n=b.length;
  if(!m||!n) return 0;
  let prev=new Array(n+1).fill(0), cur=new Array(n+1).fill(0);
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++) cur[j]=(a[i-1]===b[j-1])?prev[j-1]+1:Math.max(prev[j],cur[j-1]);
    const tmp=prev; prev=cur; cur=tmp; cur.fill(0);
  }
  return prev[n]||0;
}

function rpLcsPairs(a,b){
  const m=(a||[]).length,n=(b||[]).length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--){
    for(let j=n-1;j>=0;j--){
      dp[i][j]=(a[i]===b[j]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
    }
  }
  const pairs=[]; let i=0,j=0;
  while(i<m && j<n){
    if(a[i]===b[j]){ pairs.push([i,j]); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]) i++;
    else j++;
  }
  return pairs;
}
function rpLooseSameWord(a,b){
  a=String(a||'').toLowerCase(); b=String(b||'').toLowerCase();
  if(!a||!b) return false;
  if(a===b) return true;
  function stem(x){ return x.replace(/ies$/,'y').replace(/es$/,'').replace(/s$/,''); }
  return stem(a)===stem(b);
}

function rpSpeedTarget(level){
  const l=String(level||"beginner").toLowerCase();
  // RP168: high-school RP should not award full fluency for very slow perfect reading.
  // Targets are intentionally stricter than the old 30/45/60 WCPM so 22 WCPM is treated as slow.
  if(l.includes("advanced")) return 90;
  if(l.includes("intermediate")) return 70;
  return 55;
}
function rpShortTextFactor(totalWords){
  const n=Number(totalWords);
  if(!Number.isFinite(n) || n<=0) return 1;
  if(n<=30) return 0.25;   // very short passage: WCPM is unstable and should be light.
  if(n<=50) return 0.45;
  if(n<=80) return 0.70;
  return 1;
}
function rpEffectiveSpeedTarget(level, totalWords){
  const base=rpSpeedTarget(level);
  const n=Number(totalWords);
  if(!Number.isFinite(n) || n<=0) return base;
  // RP170: A 22-word text must not be judged against the same WCPM target as a long passage.
  // Short texts use a lower effective target, then only a light penalty is applied.
  if(n<=30) return Math.max(24, Math.min(base, Math.round(n*2.0)));
  if(n<=50) return Math.max(35, Math.min(base, Math.round(n*1.55)));
  if(n<=80) return Math.max(45, Math.min(base, Math.round(n*1.20)));
  return base;
}
function rpSpeedRatioForWcpm(wcpm, level, totalWords){
  const w=Number(wcpm);
  const t=rpEffectiveSpeedTarget(level, totalWords);
  if(!Number.isFinite(w) || w<=0 || !Number.isFinite(t) || t<=0) return 0;
  return Math.max(0, Math.min(1.25, w/t));
}
function rpSpeedScoreFromWcpm(wcpm, level, totalWords){
  const raw=Math.max(0, Math.min(100, Math.round(rpSpeedRatioForWcpm(wcpm, level, totalWords)*100)));
  const factor=rpShortTextFactor(totalWords);
  // Blend short passages toward neutral so a 20–30 word text is not crushed by WCPM.
  return Math.max(0, Math.min(100, Math.round((100*(1-factor)) + (raw*factor))));
}
function rpSpeedScoreCap(wcpm, level, totalWords){
  const n=Number(totalWords);
  const w=Number(wcpm);
  if(!Number.isFinite(w) || w<=0) return 70;
  // RP_SCORING_RULES_V1_202607
  // Speed is only a cap. It never rescues weak accuracy/completion.
  // Short: 1–30 words. Medium: 31–80. Long: 81+.
  if(Number.isFinite(n) && n>0 && n<=30){
    if(w<25) return 75;
    if(w<35) return 82;
    if(w<50) return 90;
    return 100;
  }
  if(Number.isFinite(n) && n<=80){
    if(w<35) return 70;
    if(w<50) return 82;
    if(w<75) return 92;
    return 100;
  }
  if(w<45) return 70;
  if(w<60) return 82;
  if(w<90) return 92;
  return 100;
}
function rpCapBySpeed(value, wcpm, level, totalWords){
  const n=Number(value);
  if(!Number.isFinite(n)) return value;
  return Math.max(0, Math.min(100, Math.round(Math.min(n, rpSpeedScoreCap(wcpm, level, totalWords)))));
}
function rpCompletionScoreCap(correctWords, totalWords){
  const c=Number(correctWords), t=Number(totalWords);
  if(!Number.isFinite(c) || !Number.isFinite(t) || t<=0) return 100;
  const ratio=Math.max(0, Math.min(1, c/t));
  // RP_SCORING_RULES_V1_202607 — completion caps by passage length.
  if(t<=30){
    if(ratio < 0.30) return 25;
    if(ratio < 0.40) return 35;
    if(ratio < 0.50) return 40;
    if(ratio < 0.60) return 45;
    if(ratio < 0.75) return 60;
    if(ratio < 0.90) return 75;
    if(ratio < 1.00) return 90;
    return 100;
  }
  if(t<=80){
    if(ratio < 0.40) return 35;
    if(ratio < 0.60) return 55;
    if(ratio < 0.75) return 70;
    if(ratio < 0.90) return 85;
    if(ratio < 1.00) return 93;
    return 100;
  }
  if(ratio < 0.50) return 40;
  if(ratio < 0.70) return 60;
  if(ratio < 0.85) return 78;
  if(ratio < 0.95) return 90;
  if(ratio < 1.00) return 95;
  return 100;
}
function rpMistakeScoreCap(mistakes, totalWords){
  const m=Number(mistakes), t=Number(totalWords);
  if(!Number.isFinite(m) || m<=0) return 100;
  if(!Number.isFinite(t) || t<=0) return 100;
  // RP_SCORING_RULES_V1_202607 — errors are stricter in short texts.
  if(t<=30){
    if(m===1) return 95;
    if(m===2) return 90;
    if(m===3) return 84;
    if(m<=5) return 78;
    if(m<=8) return 63;
    return 45;
  }
  const pctErr=(m/t)*100;
  if(t<=80){
    if(pctErr<=3) return 100;
    if(pctErr<=8) return 90;
    if(pctErr<=15) return 78;
    if(pctErr<=25) return 65;
    return 50;
  }
  if(pctErr<=3) return 100;
  if(pctErr<=7) return 92;
  if(pctErr<=12) return 85;
  if(pctErr<=20) return 72;
  return 60;
}
function rpCapByMistakes(value, mistakes, totalWords){
  const n=Number(value);
  if(!Number.isFinite(n)) return value;
  return Math.max(0, Math.min(100, Math.round(Math.min(n, rpMistakeScoreCap(mistakes, totalWords)))));
}

// RP194: Extra words after the reference text are a separate over-reading penalty.
// They must not be treated like missed/wrong/reversed reference words, especially in short texts.
function rpFairCoreMistakes(meta){
  meta=meta||{};
  const missing=Number(meta.missingCount)||0;
  const wrong=Number(meta.wrongCount)||0;
  const repeated=Number(meta.repeatedCount)||0;
  const outOfOrder=Number(meta.outOfOrderCount)||0;
  const backward=Number(meta.backwardCount)||0;
  return Math.max(0, missing + wrong + repeated + outOfOrder + backward);
}
function rpExtraSpeechPenalty(extraCount, totalWords){
  const e=Math.max(0, Number(extraCount)||0);
  const t=Math.max(1, Number(totalWords)||0);
  if(!e) return 0;
  // Short text: additions matter, but cap the damage so 21/22 or 22/22 cannot fall to 15%.
  if(t<=30) return Math.min(22, Math.round(e*2.0));
  if(t<=80) return Math.min(18, Math.round(e*1.5));
  return Math.min(15, Math.round(e*1.0));
}
function rpFairExtraScoreFloor(meta){
  meta=meta||{};
  const total=Number(meta.totalWords)||0;
  const correct=Number(meta.correctWords)||0;
  const core=Number(meta.coreMistakes)||0;
  const extra=Number(meta.extraCount)||0;
  const completion=total>0 ? correct/total : 0;
  if(!extra || !total || completion<0.85 || core>2) return 0;
  if(completion>=0.98 && core===0) return total<=30 ? 78 : 82;
  if(completion>=0.94 && core<=1) return total<=30 ? 72 : 76;
  if(completion>=0.90 && core<=2) return total<=30 ? 65 : 70;
  return 0;
}

function rpFluencyRepetitionCapV1(value, meta){
  const n=Number(value);
  if(!Number.isFinite(n)) return value;
  const total=Number(meta&&meta.totalWords);
  const correct=Number(meta&&meta.correctWords);
  const mistakes=Number(meta&&meta.mistakes);
  const wcpm=Number(meta&&meta.wcpm);
  const fluency=Number(meta&&meta.fluency);
  const repetition=Number(meta&&meta.repetitionCount)||0;
  if(!Number.isFinite(total) || total<=0) return Math.max(0, Math.min(100, Math.round(n)));
  const completion=(Number.isFinite(correct)?correct:0)/total;
  let cap=100;
  // RP_FLUENCY_REPETITION_RULES_V1_202607
  // Word-by-word reading should not be rescued by WCPM, especially when the text is incomplete or has many errors.
  if(total<=30){
    if(completion<0.90 && Number.isFinite(fluency) && fluency<70) cap=Math.min(cap,55);
    if(completion<0.90 && Number.isFinite(wcpm) && wcpm<55) cap=Math.min(cap,60);
    if(completion<1.00 && Number.isFinite(mistakes) && mistakes>=6) cap=Math.min(cap,55);
    if(completion>=1.00 && Number.isFinite(fluency) && fluency<65) cap=Math.min(cap,88);
    if(repetition>=2) cap=Math.min(cap,85);
    if(repetition>=4) cap=Math.min(cap,75);
    if(repetition>=7) cap=Math.min(cap,60);
  }else if(total<=80){
    if(Number.isFinite(fluency) && fluency<60 && Number.isFinite(wcpm) && wcpm<50) cap=Math.min(cap,72);
    else if(Number.isFinite(fluency) && fluency<68 && Number.isFinite(wcpm) && wcpm<50) cap=Math.min(cap,82);
    if(completion<0.90 && Number.isFinite(fluency) && fluency<65) cap=Math.min(cap,75);
    if(repetition>=4) cap=Math.min(cap,82);
    if(repetition>=8) cap=Math.min(cap,70);
    if(repetition>=12) cap=Math.min(cap,60);

// RP171: WCPM must use actual reading time, not the full recorded clip.
// It trims only silence before the first word and after the last word. Pauses inside reading remain counted.
async function rpEstimateActualReadingSecondsFromBlob(blob){
  try{
    if(!blob || typeof AudioContext==="undefined" && typeof webkitAudioContext==="undefined") return 0;
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    const arr=await blob.arrayBuffer();
    const ctx=new AudioCtx();
    let audio;
    try{ audio=await ctx.decodeAudioData(arr.slice(0)); }catch(e){ try{ctx.close&&ctx.close();}catch(_){} return 0; }
    const sr=audio.sampleRate||44100;
    const len=audio.length||0;
    if(!len){ try{ctx.close&&ctx.close();}catch(_){} return 0; }
    const channels=[];
    for(let c=0;c<audio.numberOfChannels;c++) channels.push(audio.getChannelData(c));
    const win=Math.max(256, Math.round(sr*0.05)); // 50 ms windows
    const rms=[];
    for(let i=0;i<len;i+=win){
      let sum=0,count=0;
      const end=Math.min(len,i+win);
      for(let j=i;j<end;j++){
        let v=0;
        for(let c=0;c<channels.length;c++) v+=channels[c][j]||0;
        v=v/Math.max(1,channels.length);
        sum+=v*v; count++;
      }
      rms.push(Math.sqrt(sum/Math.max(1,count)));
    }
    try{ctx.close&&ctx.close();}catch(_){ }
    if(!rms.length) return 0;
    const sorted=rms.slice().sort((a,b)=>a-b);
    const noise=sorted[Math.floor(sorted.length*0.25)]||0;
    const peak=sorted[sorted.length-1]||0;
    // Dynamic threshold: enough to remove room silence, low enough for quiet students.
    const threshold=Math.max(0.012, noise*3.0, peak*0.08);
    let first=-1,last=-1;
    for(let i=0;i<rms.length;i++){ if(rms[i]>=threshold){ first=i; break; } }
    for(let i=rms.length-1;i>=0;i--){ if(rms[i]>=threshold){ last=i; break; } }
    if(first<0 || last<first) return 0;
    // Add small padding so the first/last spoken word is not clipped; keep internal pauses counted.
    const start=Math.max(0,(first*win/sr)-0.15);
    const end=Math.min(audio.duration||len/sr,((last+1)*win/sr)+0.15);
    const reading=end-start;
    const full=audio.duration||len/sr;
    if(!Number.isFinite(reading) || reading<=0) return 0;
    // Avoid false trimming if the clip is very short or almost all speech.
    if(full>0 && reading/full>0.92) return Math.max(1,Math.round(full));
    return Math.max(1,Math.round(reading));
  }catch(e){ return 0; }
}

function rpLatestEffectiveAttempt(list){
  const arr=(list||[]).filter(r=>r && rpAttemptState(r)!=="deleted");
  if(!arr.length) return null;
  // RP172: final teacher decisions win only over older pending copies.
  // If the student submits a NEW attempt after the latest accepted/rejected decision, show Pending again.
  function parseMs(raw){ const n=Date.parse(raw||""); return Number.isFinite(n)?n:0; }
  function submitTime(r){ return parseMs(r&&(r.submittedAt||r.createdAt||r.timestamp||r.uploadedAt||r.recordedAt)); }
  function decisionTime(r){ return parseMs(r&&(r.rejectedAt||r.acceptedAt||r.approvedAt||r.reviewedAt||r.teacherReviewedAt||r.updatedAt)) || submitTime(r) || rpAttemptTimeMs(r); }
  const finals=arr.filter(r=>{const st=rpAttemptState(r); return st==="accepted" || st==="rejected" || st==="retake";})
                  .sort((a,b)=>decisionTime(a)-decisionTime(b));
  const pendings=arr.filter(r=>rpAttemptState(r)==="pending")
                    .sort((a,b)=>(submitTime(a)||rpAttemptTimeMs(a))-(submitTime(b)||rpAttemptTimeMs(b)));
  const latestFinal=finals.length?finals[finals.length-1]:null;
  const latestPending=pendings.length?pendings[pendings.length-1]:null;
  if(latestFinal && latestPending){
    const pt=submitTime(latestPending)||rpAttemptTimeMs(latestPending);
    const ft=decisionTime(latestFinal)||rpAttemptTimeMs(latestFinal);
    if(pt>ft) return latestPending;
    return latestFinal;
  }
  if(latestFinal) return latestFinal;
  return arr.slice().sort((a,b)=>rpAttemptTimeMs(a)-rpAttemptTimeMs(b))[arr.length-1];
}

function rpGenerateTextWords(level, words, topic){

    beginner:[`I like ${cleanTopic}. It is easy and fun.`,`I read about ${cleanTopic} with my teacher.`,`I learn new words every day.`],
    intermediate:[`${cleanTopic} helps students learn new ideas and useful words.`,`Good readers slow down, think carefully, and read again when a sentence is difficult.`,`Practice helps students improve accuracy, fluency, and confidence.`],
    advanced:[`${cleanTopic} encourages learners to connect information, monitor understanding, and explain ideas with confidence.`,`Fluent readers balance accuracy, expression, and speed while paying close attention to meaning.`,`Regular practice helps students notice details, correct mistakes, and build stronger comprehension.`]
  };

async function rpLoadAudioChunks(submissionId, count){

async function eqGenerateTTS(text, voice, path, meta={}){
  const script=String(text||"").trim();
  if(!script) throw new Error("Write or generate the listening script text first.");

  const endpoint=(localStorage.getItem("eq_tts_worker_url")||"").trim();
  if(!endpoint) throw new Error("Add AI Voice Worker URL first.");

  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),90000);

  let resp;
  try{
    resp=await fetch(endpoint,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        text:script.slice(0,6000),
        voice:voice || "nova",
        format:"mp3",
        save:true,
        multiVoice: meta.voiceStyle==="multi",
        voiceStyle: meta.voiceStyle || "single",
        tone: meta.tone || "natural",
        quizId: meta.quizId || "quiz",
        title: meta.title || "listening"
      }),
      signal:controller.signal
    });
  }catch(e){
    clearTimeout(timer);
    if(String(e&&e.name)==="AbortError") throw new Error("AI Voice took too long. Try a shorter script.");
    throw new Error("Cannot reach AI Voice Worker.");
  }
  clearTimeout(timer);

  const data=await resp.json().catch(()=>null);
  if(!resp.ok || !data || !(data.url || data.secure_url)){
    const msg = data && (data.error || data.detail) ? (data.error + (data.detail?": "+JSON.stringify(data.detail).slice(0,180):"")) : "AI Voice Worker did not return MP3 URL.";
    throw new Error(msg);
  }

  const url = String(data.secure_url || data.url || "").trim();
  if(!/^https?:\/\//i.test(url)) throw new Error("Generated MP3 URL is invalid.");

  return url;
}

function detectSkill(text, providedSkill, quizType) {
  const t = (text||"").toLowerCase();
  if (quizType === "Grammar") return "Grammar";
  if (quizType === "Vocabulary") return "Vocabulary";
  if (quizType === "Grammar & Vocabulary") {
    if (providedSkill === "Grammar" || providedSkill === "Vocabulary") return providedSkill;
    const vocabWords = ["mean","meaning","synonym","antonym","opposite","definition","vocabulary","closest in meaning","similar to","word for","best describes","refers to"];
    const grammarWords = ["tense","verb","correct form","grammar","article","preposition","plural","singular","clause","passive","active","comparative","superlative","past","present","future","auxiliary","conjunction","pronoun","adjective","adverb","subject","object","correct sentence","gap"];
    if (vocabWords.some(w=>t.includes(w))) return "Vocabulary";
    if (grammarWords.some(w=>t.includes(w))) return "Grammar";
    return "Grammar";
  }
  if (quizType === "Reading" || quizType === "Listening") {
    if (providedSkill && SKILLS.includes(providedSkill) && providedSkill !== "Main Idea") return providedSkill;
    if (/(main idea|best title|mainly about|purpose of the (passage|text|paragraph)|what is the (passage|text|article) about|theme|best summary)/.test(t)) return "Main Idea";
    if (/(infer|imply|implies|suggest|probably|most likely|we can conclude|it can be understood|attitude|tone of)/.test(t)) return "Inference";
    if (/(the word|the underlined word|closest in meaning|synonym|antonym|opposite of|refers to|what does .* mean)/.test(t)) return "Vocabulary";
    if (/(first|then|next|after that|sequence|order of events|what happened (first|last)|put .* in order)/.test(t)) return "Sequencing";
    if (/(because|cause|reason|result|effect|due to|why did|led to|as a result)/.test(t)) return "Cause & Effect";
    if (/(according to|when|where|who|how many|how much|what (did|was|were|is|are)|which)/.test(t)) return "Detail Recall";
    return quizType === "Listening" ? "Listening Comprehension" : "Detail Recall";
  }
  if (SKILLS.includes(providedSkill)) return providedSkill;
  return SKILLS[0];
}

// ── AI QUESTION QUALITY GATE ──────────────────────────────────
// This validator keeps AI-generated quizzes usable before preview/import.
// It rejects weak structures (duplicate questions/options, wrong option count,
// missing listening script, invalid correct answer) and asks AI once to repair.
function eqCleanText(s){ return String(s||"").replace(/\s+/g," ").trim(); }
function eqNormText(s){ return eqCleanText(s).toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g," "); }
function eqUniqueCount(arr){ return new Set((arr||[]).map(x=>eqNormText(x)).filter(Boolean)).size; }
function eqWordCount(s){ return (String(s||"").match(/\b[\w']+\b/g)||[]).length; }
function eqExpectedOptionCount(qFormat){ return qFormat==="truefalse" ? 2 : 4; }
function eqParseJsonObject(raw){
  let out=String(raw||"").replace(/```json/g,"").replace(/```/g,"").trim();
  const s=out.indexOf("{"), e=out.lastIndexOf("}");
  if(s>=0 && e>s) out=out.slice(s,e+1);
  return JSON.parse(out);
}
function eqQuestionQualityIssues(parsed, cfg){
  const issues=[];
  const qs=(parsed&&parsed.questions)||[];
  const count=Number(cfg.count||0);
  const minNeeded=Math.max(1, Math.min(count||qs.length, count||1));
  if(!Array.isArray(qs) || qs.length<minNeeded) issues.push("BLOCK: fewer questions than requested");
  if(cfg.type==="Listening" && cfg.sourceType==="topic" && !eqCleanText(parsed&&parsed.script)) issues.push("BLOCK: listening from topic needs a script");
  if(cfg.type==="Listening" && cfg.sourceType==="topic" && parsed&&parsed.script){
    const wc=eqWordCount(parsed.script);
    const minWords=cfg.length==="short"?55:cfg.length==="long"?170:105;
    if(wc<minWords) issues.push("BLOCK: listening script is too short for selected length");
  }
  const seenQ=new Set();
  const correctPositions=[];
  const expected=eqExpectedOptionCount(cfg.qFormat);
  const usedMatchLabels=new Set();
  const matchAnswerCount=Array.isArray(parsed&&parsed.matchAnswers)?parsed.matchAnswers.length:0;
  qs.forEach((q,i)=>{
    const qt=eqCleanText(q&&q.text);
    if(qt.length<8) issues.push("BLOCK: question "+(i+1)+" is too short");
    const nq=eqNormText(qt);
    if(nq && seenQ.has(nq)) issues.push("BLOCK: duplicate question "+(i+1));
    if(nq) seenQ.add(nq);
    if(cfg.matchMode){
      const lab=eqCleanText(q&&q.correctLabel).toLowerCase();
      if(!lab) issues.push("BLOCK: matching question "+(i+1)+" has no correctLabel");
      const idx=lab.charCodeAt(0)-97;
      if(idx<0 || idx>=matchAnswerCount) issues.push("BLOCK: matching question "+(i+1)+" points to missing answer");
      if(lab) usedMatchLabels.add(lab);
    }else{
      const opts=(q&&q.options)||[];
      if(!Array.isArray(opts) || opts.length!==expected) issues.push("BLOCK: question "+(i+1)+" must have exactly "+expected+" options");
      if(eqUniqueCount(opts)!==opts.length) issues.push("BLOCK: duplicate options in question "+(i+1));
      if(typeof (q&&q.correct)!=="number" || q.correct<0 || q.correct>=opts.length) issues.push("BLOCK: invalid correct index in question "+(i+1));
      if(typeof (q&&q.correct)==="number") correctPositions.push(q.correct);
      const joined=opts.map(eqNormText).join(" | ");
      if(/all of the above|none of the above/.test(joined)) issues.push("FIX: avoid all/none of the above in question "+(i+1));
    }
  });
  if(!cfg.matchMode && correctPositions.length>=4 && new Set(correctPositions).size<2) issues.push("FIX: correct answers are not varied");
  if(cfg.matchMode && matchAnswerCount && usedMatchLabels.size>=matchAnswerCount) issues.push("FIX: matching needs at least one unused distractor answer");
  return issues;
}

async function extractFileText(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".txt") || name.endsWith(".csv")) {
    return await file.text();
  }
  if (name.endsWith(".xlsx") || name.endsWith(".xls")) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(buf), {type:"array"});
    let txt = "";
    wb.SheetNames.forEach(sn => { txt += XLSX.utils.sheet_to_csv(wb.Sheets[sn]) + "\n"; });
    return txt;
  }
  // For docx/pdf: read as text (best effort) — recommend paste for these
  try { return await file.text(); } catch(e){ return ""; }
}

function calcSkills(resps, quizzes) {
  const m = {};
  resps.forEach(r => {
    const q = quizzes.find(x => x.id === r.quizId);
    if (!q) return;
    q.questions.forEach((qs, idx) => {
      const skill = qs.skill || (q.type === "Listening" ? "Listening Comprehension" : "General");
      if (!m[skill]) m[skill] = {c:0,t:0};
      m[skill].t++;

      const ans = r.answers ? r.answers[qs.id] : undefined;
      let ok = false;

      // Normal MCQ quizzes store the selected option index.
      if (q.type === "Listening" && q.listenMatch) {
        // Listening Matching stores a selected letter (a, b, c...) instead of an option index.
        ok = String(ans || "").trim().toLowerCase() === String(qs.correctLabel || "").trim().toLowerCase();
      } else if (q.type === "Image Labeling" && q.labelAnswerMode === "number") {
        ok = String(ans || "").trim() === String(qs.correctNum || (idx + 1)).trim();
      } else if (q.type === "Image Labeling" && q.labelAnswerMode === "write") {
        ok = String(ans || "").trim().toLowerCase() === String(qs.correctLabel || "").trim().toLowerCase();
      } else {
        ok = ans === qs.correct;
      }

      if (ok) m[skill].c++;
    });
  });
  return Object.entries(m).map(([skill,x]) => ({skill, score:pct(x.c,x.t), correct:x.c, total:x.t}));
}
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function estimateReadingLockSec(quiz){
  if(!quiz || quiz.type!=="Reading" || !quiz.passage) return 0;
  if(quiz.readingTimeMode === "manual"){
    const m = Math.max(0, Number(quiz.readingCustomMinutes)||0);
    const sec = Math.round(m*60);
    return Math.max(0, Math.min(900, sec));
  }
  const words = String(quiz.passage||"").replace(/\s+/g," ").trim().split(/\s+/).filter(Boolean).length;
  if(!words) return 0;
  // Auto minimum reading time before Submit only.
  // About 120 WPM plus a small thinking buffer. Clamp to keep it practical on mobile.
  return Math.max(30, Math.min(300, Math.ceil((words/120)*60 + 20)));
}
function readingWordCount(quiz){
  return String((quiz&&quiz.passage)||"").replace(/\s+/g," ").trim().split(/\s+/).filter(Boolean).length;
}
// Build a shuffled copy of a quiz: questions in random order, and each question's
// options shuffled with the correct index updated. Reading/Listening keep question
// order (since they follow a passage) but still shuffle options.
function makeShuffledQuiz(quiz) {
  // Image Labeling: handle FIRST (number mode must always assign correctNum, even if shuffle off)
  if (quiz.type === "Image Labeling") {
    if (quiz.labelAnswerMode === "number") {
      // Each part has a teacher-set correctNum (the number on the image). Shuffle the table row order
      // so words don't appear in a predictable order, but keep each word's correct number.
      const numbered = quiz.questions.map((q,i) => ({ ...q, correctNum: String(q.correctNum||(i+1)) }));
      const rows = (quiz.shuffle === false) ? numbered : shuffleArray(numbered.slice());
      return { ...quiz, questions: rows };
    }
    if (quiz.shuffle === false) return quiz;
    if (quiz.labelAnswerMode === "write") return quiz;
    // choose mode: shuffle options only, keep correctLabel mapping
    const qs = quiz.questions.map(q => {
      const idxs = shuffleArray([0,1,2,3].slice(0, q.options.length));
      const newOptions = idxs.map(i => q.options[i]);
      const newCorrect = newOptions.findIndex(o => String(o).trim().toLowerCase() === String(q.correctLabel||"").trim().toLowerCase());
      return { ...q, options: newOptions, correct: newCorrect>=0?newCorrect:0 };
    });
    return { ...quiz, questions: qs };
  }
  // Listening Matching: questions have no MCQ options. Optionally shuffle the ANSWER CHOICES (a,b,c…)
  // and remap each question's correct letter so grading stays correct. Questions keep their order (tied to audio).
  if (quiz.type === "Listening" && quiz.listenMatch) {
    if (!quiz.matchShuffle || !quiz.matchAnswers || quiz.matchAnswers.length < 2) return quiz;
    const n = quiz.matchAnswers.length;
    const order = shuffleArray([...Array(n).keys()]); // order[newIndex] = oldIndex
    const newAnswers = order.map(oi => quiz.matchAnswers[oi]);
    // Map old letter -> new letter so grading stays correct after reordering.
    const oldToNew = {};
    order.forEach((oldIdx, newIdx) => { oldToNew[String.fromCharCode(97+oldIdx)] = String.fromCharCode(97+newIdx); });
    const qs = quiz.questions.map(q => {
      const oldLetter = String(q.correctLabel||"").trim().toLowerCase();
      return { ...q, correctLabel: oldToNew[oldLetter] || oldLetter };
    });
    return { ...quiz, matchAnswers: newAnswers, questions: qs };
  }
  // If teacher turned shuffle off for this quiz, return it unchanged
  if (quiz.shuffle === false) return quiz;
  // Shuffle question order for non-passage quizzes (passages need order); answers always shuffle
  const shuffleQuestions = (quiz.type === "Grammar" || quiz.type === "Vocabulary" || quiz.type === "Grammar & Vocabulary");
  let qs = quiz.questions.map(q => {
    const idxs = shuffleArray([0,1,2,3].slice(0, q.options.length));
    const newOptions = idxs.map(i => q.options[i]);
    const newCorrect = idxs.indexOf(q.correct);
    return { ...q, options: newOptions, correct: newCorrect>=0?newCorrect:0 };
  });
  if (shuffleQuestions) qs = shuffleArray(qs);
  return { ...quiz, questions: qs };
}

function calcBadges(resps, quizzes) {
  const e = new Set();
  if (resps.length>0) e.add("first");
  if (resps.length>=5) e.add("streak5");
  if (resps.some(r => pct(r.score,r.totalQ)===100)) e.add("perfect");
  const sk = calcSkills(resps, quizzes);
  if (sk.filter(s=>s.score>=80).length>=3) e.add("mastery3");
  if (sk.find(s=>s.skill==="Vocabulary"&&s.score>=80)) e.add("vocab");
  if (sk.find(s=>s.skill==="Grammar"&&s.score>=80)) e.add("grammar");
  if (sk.find(s=>s.skill==="Listening Comprehension"&&s.score>=80)) e.add("listen");
  if (sk.find(s=>s.skill==="Main Idea"&&s.score>=80)) e.add("reading");
  const byQ = {};
  resps.forEach(r => { if(!byQ[r.quizId]) byQ[r.quizId]=[]; byQ[r.quizId].push(r); });
  Object.values(byQ).forEach(rs => {
    if (rs.length>=2) {
      const s = [...rs].sort((a,b)=>a.attempt-b.attempt);
      if (pct(s[s.length-1].score,s[s.length-1].totalQ)-pct(s[0].score,s[0].totalQ)>=20) e.add("improved");
    }
  });
  return [...e];
}

// Normalize Arabic name: remove diacritics, "بن/بنت/ابن/آل/ال", extra spaces, standardize chars
function normalizeArabicName(s) {
  if (!s) return "";
  return s
    .replace(/[\u064B-\u065F]/g, "")          // remove tashkeel
    .replace(/أ|إ|آ/g, "ا")                    // normalize alef variants
    .replace(/ة/g, "ه")                        // ta marbuta → ha
    .replace(/ى/g, "ي")                        // alef maqsura → ya
    .replace(/\bبن\b|\bبنت\b|\bابن\b/g, "")   // remove nasab particles
    .replace(/\bآل\b/g, "")
    .replace(/\bال/g, "")                      // remove definite article
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}
// Extract key name tokens (words ≥2 chars after normalization)
function nameTokens(s) {
  return normalizeArabicName(s).split(" ").filter(w => w.length >= 2);
}
// Check if student-entered name matches the preloaded name sufficiently
// Returns true if ≥60% of the shorter name's tokens appear in the other
function nameMatchesPreloaded(entered, official) {
  const a = nameTokens(entered);
  const b = nameTokens(official);
  if (!a.length || !b.length) return false;
  const shorter = a.length <= b.length ? a : b;
  const longer  = a.length <= b.length ? b : a;
  const matched = shorter.filter(t => longer.some(l => l.includes(t) || t.includes(l)));
  return matched.length / shorter.length >= 0.6;
}
// Find preloaded student by exact ID only — no partial or fuzzy matching
function findPreloadedStudent(allUsers, studentId, name, classId) {
  const id = String(studentId || "").trim().replace(/\s/g, "");
  if (!id) return null;
  // Exact ID match from PRELOADED_USERS only — no partial, no fuzzy
  return PRELOADED_USERS.find(function(u){ return String(u.studentId) === id; }) || null;
}

// ── TAKE QUIZ ─────────────────────────────────────────────────
function GameQuiz({quiz: rawQuiz, student, allResponses, onDone, onSaved}) {
  const [quiz] = useState(() => makeShuffledQuiz(rawQuiz));
  const [idx,setIdx] = useState(0);            // current question index
  const [picked,setPicked] = useState(null);   // option index picked for current q
  const [locked,setLocked] = useState(false);  // answer locked (showing feedback)
  const [answers,setAnswers] = useState({});    // qId -> original option index
  const answersRef = useRef({});
  const [points,setPoints] = useState(0);
  const [streak,setStreak] = useState(0);
  const [qStart,setQStart] = useState(Date.now());
  const [phase,setPhase] = useState("play");   // play | done (Reading can answer immediately; Submit/save waits for timer)
  const [saving,setSaving] = useState(false);
  const [score,setScore] = useState(0);
  const instant = quiz.instantFeedback !== false;
  const total = quiz.questions.length;
  const fmt = s=>Math.floor(s/60)+":"+String(Math.max(0,Math.floor(s))%60).padStart(2,"0");
  const prev = allResponses.filter(r=>responseBelongsToStudent(r,student) && r.quizId===quiz.id).length;
  const timerType = quiz.gameTimerType || "none";
  const timerSec = quiz.gameTimerSec || 20;
  const [timeLeft,setTimeLeft] = useState(timerType==="perQ"?timerSec : timerType==="whole"?timerSec : null);
  const tickRef = useRef();
  const gameAudioRef = useRef();
  const [gameAudioPlayed,setGameAudioPlayed] = useState(false);
  const [gameAudioLoading,setGameAudioLoading] = useState(false);
  const [gameAudioReady,setGameAudioReady] = useState(true);
  const [gameAudioError,setGameAudioError] = useState("");
  const gameIsListening = quiz.type==="Listening" && (quiz.audioFile || quiz.passage);
  const gameIsReading = quiz.type==="Reading" && !!quiz.passage;
  const gameReadingSec = estimateReadingLockSec(quiz);
  const [readingLeft,setReadingLeft] = useState(gameIsReading?gameReadingSec:0);
  const gameForceDeviceVoice = quiz.type==="Listening" && (!quiz.audioFile || String(quiz.audioFile||"").startsWith("worker-tts:"));
  useEffect(()=>{
    if(!gameIsListening) return;
    let cancelled=false;
    async function prepareListeningAudio(){
      const a=gameAudioRef.current;
      if(!a){
        if(gameForceDeviceVoice){ setGameAudioReady(true); setGameAudioLoading(false); }
        return;
      }
      setGameAudioError("");
      try{
        if(gameForceDeviceVoice){
          // Force old worker-tts quizzes to instant Device Voice for students.
          a.removeAttribute("src");
          setGameAudioReady(true);
        }else if(String(quiz.audioFile||"").startsWith("worker-tts:")){
          // Disabled for students: no Worker/OpenAI delay.
          a.removeAttribute("src");
          setGameAudioReady(true);
        }else{
          setGameAudioReady(true);
        }
      }catch(e){
        if(cancelled) return;
        setGameAudioError(e.message || "Could not prepare audio.");
      }finally{
        if(!cancelled) setGameAudioLoading(false);
      }
    }
    setTimeout(prepareListeningAudio, 150);
    return ()=>{cancelled=true;};
  },[quiz.id, quiz.audioFile]);

  function cleanDeviceVoiceText(s){
    return String(s||"")
      .replace(/\bSpeaker\s*A\s*:/gi,"")
      .replace(/\bSpeaker\s*B\s*:/gi,"")
      .replace(/\bA\s*:/g,"")
      .replace(/\bB\s*:/g,"")
      .replace(/\bDad\s*:/gi,"")
      .replace(/\bMom\s*:/gi,"")
      .replace(/\bBoy\s*:/gi,"")
      .replace(/\bGirl\s*:/gi,"")
      .replace(/\s+/g," ")
      .trim();
  }
  function stopDeviceVoice(){
    try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  }
  async function gamePlayAudio(){
    if(gameAudioLoading) return;
    const a=gameAudioRef.current;
    if(!a){ alert("Audio player is not ready."); return; }
    try{
      const currentSrc = a.getAttribute("src") || "";
      if(!currentSrc || gameForceDeviceVoice){
        // Fast Device Voice: no audio file needed, and old worker-tts is forced to Device Voice.
        if(quiz.passage){
          window.speechSynthesis.cancel();
          const speakText = cleanDeviceVoiceText(quiz.passage);
          const u=new SpeechSynthesisUtterance(speakText);
          u.lang="en-US";
          u.rate=0.9;
          u.onend=()=>setGameAudioPlayed(true);
          u.onerror=()=>setGameAudioError("Device voice stopped before finishing. Play it again to unlock the answers.");
          window.speechSynthesis.speak(u);
          return;
        }
        setGameAudioError("Audio is still preparing. Please wait a moment.");
        return;
      }
      a.currentTime=0;
      const p=a.play();
      if(p && p.catch) await p.catch(err=>{ throw new Error("Audio could not play yet. Wait for loading to finish, then tap Play again."); });
      // Do not unlock answers here. Answers unlock only when the audio reaches the end.
      // The audio element onEnded handler will set gameAudioPlayed=true.
    }catch(e){
      alert(e.message || "Audio could not play. Try again.");
    }
  }

  useEffect(()=>{
    return ()=>{
      try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
    };
  },[]);

  const q = quiz.questions[idx];

  // Reading timer for Game mode: questions can start immediately; saving waits for the timer.
  useEffect(()=>{
    if(phase!=="play" || !gameIsReading || readingLeft<=0) return;
    const id=setTimeout(()=>setReadingLeft(x=>Math.max(0,x-1)),1000);
    return ()=>clearTimeout(id);
  },[phase,gameIsReading,readingLeft]);

  // Countdown timer
  useEffect(()=>{
    if(timerType==="none" || phase!=="play") return;
    tickRef.current = setInterval(()=>{
      setTimeLeft(t=>{
        if(t===null) return null;
        if(t<=1){
          clearInterval(tickRef.current);
          if(timerType==="perQ"){ if(!locked){ setLocked(true); setStreak(0); setTimeout(()=>nextWithReset(),600); } }
          else { finish(); }
          return 0;
        }
        return t-1;
      });
    },1000);
    return ()=>clearInterval(tickRef.current);
  },[idx,phase,locked]);

  function nextWithReset(){
    clearInterval(tickRef.current);
    if(idx+1 < total){ setIdx(idx+1); setPicked(null); setLocked(false); setQStart(Date.now()); if(timerType==="perQ") setTimeLeft(timerSec); }
    else finish();
  }

  function choose(i){
    if(locked) return;
    setPicked(i);
    setLocked(true);
    const correct = i===q.correct;
    // map back to original index for saving
    const orig = rawQuiz.questions.find(oq=>oq.id===q.id);
    const selText = q.options[i];
    const oi = orig ? orig.options.indexOf(selText) : i;
    const newAnswers = {...answersRef.current,[q.id]: oi>=0?oi:i};
    answersRef.current = newAnswers;
    setAnswers(newAnswers);
    if(correct){
      const secs = (Date.now()-qStart)/1000;
      const speedBonus = Math.max(0, Math.round(50 - secs*5)); // up to +50 for fast
      const base = 100;
      const newStreak = streak+1;
      const streakBonus = (newStreak>=3)?25:0;
      setPoints(p=>p+base+speedBonus+streakBonus);
      setStreak(newStreak);
    } else {
      setStreak(0);
    }
    // Auto-advance after a short delay
    setTimeout(()=>{ next(); }, instant ? 1100 : 350);
  }

  function next(){
    clearInterval(tickRef.current);
    if(idx+1 < total){
      setIdx(idx+1); setPicked(null); setLocked(false); setQStart(Date.now());
      if(timerType==="perQ") setTimeLeft(timerSec);
    } else {
      finish();
    }
  }

  async function finish(){
    if(gameIsListening && !gameAudioPlayed){
      setGameAudioError("You can answer now, but you must listen to the full audio before submitting.");
      setLocked(false);
      return;
    }
    if(gameIsReading && readingLeft>0){
      setGameAudioError("You can answer now, but the result will save after the reading timer ends: "+fmt(readingLeft)+".");
      setLocked(false);
      setTimeout(()=>finish(), Math.max(1000, readingLeft*1000));
      return;
    }
    const finalAnswers = answersRef.current && Object.keys(answersRef.current).length ? answersRef.current : answers;
    const answeredCount = Object.keys(finalAnswers).length;
    const sc = quiz.questions.filter(qq=>{
      const sel = finalAnswers[qq.id];
      const orig = rawQuiz.questions.find(oq=>oq.id===qq.id);
      return orig && sel===orig.correct;
    }).length;
    setScore(sc); setPhase("done");
    // Don't save an empty attempt (student left without answering anything)
    if(answeredCount===0){ return; }
    setSaving(true);
    const entry={id:uid(),studentId:student.id,quizId:quiz.id,score:sc,totalQ:total,answers:{...finalAnswers},attempt:prev+1,points,mode:"game",completedAt:today(),ts:Date.now()};
    try { await fsSet("responses",entry.id,entry); if(onSaved) await onSaved(); } catch(e){}
    setSaving(false);
  }

  // Reading screen before Game questions
  if(phase==="reading" && gameIsReading){
    const words=readingWordCount(quiz);
    return (
      <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"linear-gradient(160deg,"+C.dk+","+C.md+")",fontFamily:F}}>
        <div style={{padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button onClick={()=>{ if(confirm("Leave the quiz?")) onDone(); }} style={{background:"none",border:"none",color:"#fff",fontSize:"22px",cursor:"pointer"}}>←</button>
          <div style={{color:"#fff",fontSize:"14px",fontWeight:"800"}}>📖 Read First</div>
          <div style={{background:"rgba(255,255,255,0.14)",borderRadius:"999px",padding:"5px 11px",color:"#fff",fontWeight:"900",fontSize:"13px"}}>⏱️ {readingLeft>0?fmt(readingLeft):"Ready"}</div>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"16px",paddingBottom:"100px"}}>
          <div style={{maxWidth:"720px",margin:"0 auto"}}>
            <div style={{background:"rgba(255,255,255,0.96)",borderRadius:"18px",padding:"18px",boxShadow:"0 10px 30px rgba(0,0,0,.18)"}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:"8px",alignItems:"center",marginBottom:"12px"}}>
                <strong style={{fontSize:"17px",color:C.tx}}>📖 {quiz.title||"Reading Passage"}</strong>
                <span style={{fontSize:"11px",fontWeight:"900",color:C.p,background:"#dbeafe",padding:"5px 9px",borderRadius:"999px"}}>{words} words</span>
              </div>
              <div style={{background:"#f8fafc",border:"1px solid "+C.br,borderRadius:"12px",padding:"15px"}}>
                {quiz.passage.split("\n\n").map((p,i)=><p key={i} style={{color:C.tx,fontSize:"15px",lineHeight:"1.9",margin:"0 0 12px",textAlign:"justify"}}>{p}</p>)}
              </div>
              <div style={{marginTop:"12px",background:readingLeft>0?"#fffbeb":"#ecfdf5",border:"1px solid "+(readingLeft>0?"#fde68a":"#bbf7d0"),borderRadius:"12px",padding:"11px",fontSize:"12px",fontWeight:"800",color:readingLeft>0?"#92400e":"#166534"}}>
                {readingLeft>0?"اقرأ النص أولًا. يمكنك بدء الأسئلة بعد انتهاء الوقت المناسب لطول النص.":"يمكنك الآن بدء الأسئلة."}
              </div>
            </div>
          </div>
        </div>
        <div style={{position:"fixed",left:0,right:0,bottom:0,padding:"14px",background:"linear-gradient(0deg,"+C.dk+",rgba(15,23,42,.78))"}}>
          <button onClick={()=>setPhase("play")} disabled={readingLeft>0} style={{width:"100%",maxWidth:"720px",display:"block",margin:"0 auto",border:"0",borderRadius:"14px",padding:"15px",fontWeight:"900",fontSize:"16px",background:readingLeft>0?"#64748b":"#22c55e",color:"#fff",opacity:readingLeft>0?0.75:1}}>
            {readingLeft>0?"⏳ Wait "+fmt(readingLeft):"Start Questions →"}
          </button>
        </div>
      </div>
    );
  }

  // DONE screen
  if(phase==="done"){
    const p = pct(score,total);
    const passed = p>=(quiz.masteryThreshold||MASTERY_DEFAULT);
    return (
      <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"linear-gradient(160deg,"+C.dk+","+C.md+")"}}>
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px",textAlign:"center"}}>
          <div style={{fontSize:"64px",marginBottom:"6px"}}>{passed?"🏆":"💪"}</div>
          <div style={{fontSize:"22px",fontWeight:"900",color:"#fff",fontFamily:F,marginBottom:"4px"}}>{passed?"Awesome!":"Good try!"}</div>
          <div style={{fontSize:"15px",color:"#cbd5e1",fontFamily:F,marginBottom:"18px"}}>{student.name}</div>
          <div style={{background:"rgba(255,255,255,0.1)",borderRadius:"16px",padding:"22px 30px",marginBottom:"16px"}}>
            <div style={{fontSize:"44px",fontWeight:"900",color:"#fbbf24",fontFamily:F,lineHeight:1}}>{points}</div>
            <div style={{fontSize:"12px",color:"#cbd5e1",fontFamily:F,letterSpacing:"1px"}}>POINTS</div>
          </div>
          <div style={{display:"flex",gap:"12px",marginBottom:"22px"}}>
            <div style={{background:"rgba(255,255,255,0.1)",borderRadius:"11px",padding:"11px 18px"}}><div style={{fontSize:"20px",fontWeight:"800",color:"#4ade80",fontFamily:F}}>{score}</div><div style={{fontSize:"10px",color:"#cbd5e1",fontFamily:F}}>Correct</div></div>
            <div style={{background:"rgba(255,255,255,0.1)",borderRadius:"11px",padding:"11px 18px"}}><div style={{fontSize:"20px",fontWeight:"800",color:"#f87171",fontFamily:F}}>{total-score}</div><div style={{fontSize:"10px",color:"#cbd5e1",fontFamily:F}}>Wrong</div></div>
            <div style={{background:"rgba(255,255,255,0.1)",borderRadius:"11px",padding:"11px 18px"}}><div style={{fontSize:"20px",fontWeight:"800",color:"#60a5fa",fontFamily:F}}>{p}%</div><div style={{fontSize:"10px",color:"#cbd5e1",fontFamily:F}}>Score</div></div>
          </div>
          <button onClick={onDone} style={{background:"#fff",color:C.dk,border:"none",borderRadius:"11px",padding:"13px 32px",fontWeight:"800",fontSize:"15px",cursor:"pointer",fontFamily:F}}>{saving?"Saving…":"Done ✓"}</button>
        </div>
      </div>
    );
  }

  // PLAY screen
  const progress = ((idx)/total)*100;
  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"linear-gradient(160deg,"+C.dk+","+C.md+")"}}>
      {/* Top bar */}
      <div style={{padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <button onClick={()=>{ stopDeviceVoice(); if(confirm("Leave the game? Progress will not be saved.")) onDone(); }} style={{background:"none",border:"none",color:"#fff",fontSize:"22px",cursor:"pointer"}}>←</button>
        <div style={{color:"#fff",fontSize:"13px",fontWeight:"700",fontFamily:F}}>Question {idx+1} of {total}</div>
        <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
          {timerType!=="none" && timeLeft!==null && <div style={{background:timeLeft<=5?"rgba(239,68,68,0.3)":"rgba(255,255,255,0.15)",borderRadius:"999px",padding:"4px 11px",color:timeLeft<=5?"#fca5a5":"#fff",fontWeight:"800",fontSize:"14px",fontFamily:F}}>⏱️ {timeLeft}s</div>}
          <div style={{background:"rgba(251,191,36,0.2)",borderRadius:"999px",padding:"4px 12px",color:"#fbbf24",fontWeight:"800",fontSize:"14px",fontFamily:F}}>⭐ {points}</div>
        </div>
      </div>
      {/* Progress bar */}
      <div style={{height:"6px",background:"rgba(255,255,255,0.15)",margin:"0 16px",borderRadius:"3px",overflow:"hidden"}}>
        <div style={{height:"100%",width:progress+"%",background:"linear-gradient(90deg,#fbbf24,#f59e0b)",transition:"width 0.3s",borderRadius:"3px"}}/>
      </div>
      {streak>=3 && <div style={{textAlign:"center",color:"#fbbf24",fontSize:"12px",fontWeight:"700",marginTop:"6px",fontFamily:F}}>🔥 {streak} in a row! +25 bonus</div>}

      {/* Listening audio for Game mode */}
      {gameIsListening && <div style={{padding:"14px 18px 0"}}>
        <div style={{background:"rgba(255,255,255,0.10)",border:"1px solid rgba(255,255,255,0.18)",borderRadius:"14px",padding:"12px",color:"#fff",fontFamily:F}}>
          <div style={{fontSize:"12px",fontWeight:"800",marginBottom:"8px"}}>🎧 Listening Audio</div>
          <audio ref={gameAudioRef} src={gameForceDeviceVoice?"":quiz.audioFile} preload="auto" controls onEnded={()=>setGameAudioPlayed(true)} style={{width:"100%",marginBottom:"8px",display:gameForceDeviceVoice?"none":"block"}}/>
          <button onClick={gamePlayAudio} disabled={gameAudioLoading} style={{width:"100%",border:"0",borderRadius:"11px",background:gameAudioLoading?"#64748b":"#2563eb",color:"#fff",fontWeight:"900",fontSize:"15px",padding:"12px",fontFamily:F,opacity:gameAudioLoading?0.9:1}}>
            {gameAudioLoading?"⏳ Preparing audio…":(gameForceDeviceVoice?"⚡ Play Device Voice":"▶ Play Listening")}
          </button>
          {gameForceDeviceVoice && <button onClick={stopDeviceVoice} style={{width:"100%",border:"0",borderRadius:"11px",background:"#334155",color:"#fff",fontWeight:"800",fontSize:"14px",padding:"10px",fontFamily:F,marginTop:"8px"}}>
            ⏹ Stop Voice
          </button>}
          {gameAudioLoading && !gameAudioError && <div style={{fontSize:"11px",color:"#fde68a",marginTop:"7px",fontWeight:"700"}}>جاري تجهيز مقطع الاستماع قبل البدء… انتظر قليلًا.</div>}
          {gameAudioError && <div style={{fontSize:"11px",color:"#fca5a5",marginTop:"7px",fontWeight:"700"}}>⚠️ {gameAudioError}</div>}
          {!gameAudioLoading && gameAudioReady && !gameAudioPlayed && <div style={{fontSize:"11px",color:"#fde68a",marginTop:"7px",fontWeight:"800"}}>{gameForceDeviceVoice?"⚠️ You can answer, but you must finish listening before submitting.":"⚠️ You can answer while listening, but you cannot submit before the audio ends."}</div>}
        </div>
      </div>}

      {gameIsReading && <div style={{padding:"12px 18px 0"}}>
        <div style={{background:"rgba(255,255,255,0.10)",border:"1px solid rgba(255,255,255,0.18)",borderRadius:"14px",padding:"10px 12px",color:"#fff",fontFamily:F,fontSize:"12px",fontWeight:"800",marginBottom:"10px"}}>
          📖 Reading timer: {readingLeft>0?("Submit/save after "+fmt(readingLeft)):"Ready to save"}
        </div>
        <div style={{background:"rgba(255,255,255,0.96)",border:"1px solid rgba(255,255,255,0.25)",borderRadius:"14px",padding:"12px",fontFamily:F,maxHeight:"190px",overflowY:"auto",boxShadow:"0 10px 24px rgba(0,0,0,.16)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"8px",marginBottom:"8px"}}>
            <strong style={{fontSize:"14px",color:C.tx}}>📖 {quiz.title||"Reading Passage"}</strong>
            <span style={{fontSize:"10px",fontWeight:"900",color:C.p,background:"#dbeafe",padding:"4px 8px",borderRadius:"999px"}}>{readingWordCount(quiz)} words</span>
          </div>
          <div style={{color:C.tx,fontSize:"13px",lineHeight:"1.8",textAlign:"justify"}}>
            {String(quiz.passage||"").split("\n\n").map((p,i)=><p key={i} style={{margin:"0 0 9px"}}>{p}</p>)}
          </div>
        </div>
      </div>}

      {/* Question */}
      <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",padding:"20px 18px"}}>
        <div style={{background:"rgba(255,255,255,0.08)",borderRadius:"14px",padding:"20px",marginBottom:"18px"}}>
          <span style={{fontSize:"10px",background:"rgba(96,165,250,0.25)",color:"#93c5fd",padding:"2px 9px",borderRadius:"999px",fontWeight:"600",fontFamily:F}}>{q.skill}</span>
          <p style={{color:"#fff",fontSize:"19px",fontWeight:"700",lineHeight:"1.5",margin:"12px 0 0",fontFamily:F}}>{q.text}</p>
        </div>
        <div style={{display:"grid",gap:"11px"}}>
          {q.options.map((opt,i)=>{
            const isPicked = picked===i;
            const isCorrect = i===q.correct;
            let bg="rgba(255,255,255,0.95)",col=C.tx,bdr="3px solid transparent";
            if(locked && instant){
              if(isCorrect){ bg="#22c55e"; col="#fff"; bdr="3px solid #16a34a"; }
              else if(isPicked){ bg="#ef4444"; col="#fff"; bdr="3px solid #dc2626"; }
              else { bg="rgba(255,255,255,0.5)"; }
            } else if(locked && !instant && isPicked){
              bg="#93c5fd"; bdr="3px solid #3b82f6";
            }
            return (
              <button key={i} onClick={()=>choose(i)} disabled={locked} style={{display:"flex",alignItems:"center",gap:"12px",padding:"16px 18px",borderRadius:"13px",border:bdr,background:bg,color:col,fontSize:"16px",fontWeight:"600",cursor:locked?"default":"pointer",textAlign:"left",fontFamily:F,transition:"all 0.2s",transform:isPicked?"scale(1.02)":"scale(1)"}}>
                <span style={{minWidth:"30px",height:"30px",borderRadius:"50%",background:"rgba(0,0,0,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"800",flexShrink:0}}>{String.fromCharCode(65+i)}</span>
                <span style={{flex:1}}>{opt}</span>
                {locked && instant && isCorrect && <span style={{fontSize:"20px"}}>✅</span>}
                {locked && instant && isPicked && !isCorrect && <span style={{fontSize:"20px"}}>❌</span>}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function TakeQuiz({quiz: rawQuiz, student, allResponses, onDone, onSaved}) {
  const [quiz] = useState(() => makeShuffledQuiz(rawQuiz));
  const [answers,setAnswers] = useState({});
  const [submitted,setSubmitted] = useState(false);
  const [tab,setTab] = useState((quiz.passage||quiz.audioFile)?"passage":"questions");
  const [timeLeft,setTimeLeft] = useState(quiz.timer>0?quiz.timer*60:null);
  const readingRequiredSec = estimateReadingLockSec(quiz);
  const [readingLeft,setReadingLeft] = useState((quiz.type==="Reading" && quiz.passage)?readingRequiredSec:0);
  const [saving,setSaving] = useState(false);
  const [mErr,setMErr] = useState("");
  const [rating,setRating] = useState(0);
  const [score,setScore] = useState(0);
  const tRef = useRef();
  const audioElRef = useRef();
  const [listenCount,setListenCount] = useState(0);
  const [audioCompleted,setAudioCompleted] = useState(false);
  const [listenStarted,setListenStarted] = useState(false);
  const [listenedRanges,setListenedRanges] = useState([]);
  const listenStartRef = useRef(null);
  const listenCountedRef = useRef(false);
  const [isPlaying,setIsPlaying] = useState(false);
  const [playSpeed,setPlaySpeed] = useState(1);
  const [audioPos,setAudioPos] = useState(0);
  const [audioDur,setAudioDur] = useState(0);
  const [ttsPaused,setTtsPaused] = useState(false);
  const [ttsIndex,setTtsIndex] = useState(0);
  const ttsChunksRef = useRef([]);
  const ttsIndexRef = useRef(0);
  const listenLimit = quiz.type==="Listening" ? 3 : (quiz.listenLimit||0);
  const listensLeft = listenLimit>0 ? Math.max(0,listenLimit-listenCount) : null;
  const canListen = listenLimit===0 || listenCount<listenLimit || isPlaying;
  const AC = quiz.audioControls || {seek:true,speed:true,pause:true,restart:true,skip10:true};
  const skip10Enabled = AC.skip10!==false && AC.seek!==false;
  const thresh = quiz.masteryThreshold ?? MASTERY_DEFAULT;
  const total = quiz.questions.length;
  const prev = allResponses.filter(r=>responseBelongsToStudent(r,student)&&r.quizId===quiz.id).length;
  const maxQuizRetakes = quiz.allowRetake ? Math.max(0, Number(quiz.maxRetakes ?? 2)||0) : 0;
  const totalAllowedQuizAttempts = 1+maxQuizRetakes;
  const attemptBlocked = prev >= totalAllowedQuizAttempts;
  const fmt = s=>Math.floor(s/60)+":"+String(Math.max(0,Math.floor(s))%60).padStart(2,"0");
  function mergeRanges(ranges){
    const clean=(ranges||[]).filter(r=>r&&isFinite(r[0])&&isFinite(r[1])&&r[1]>r[0]).sort((a,b)=>a[0]-b[0]);
    const out=[];
    clean.forEach(r=>{
      if(!out.length || r[0]>out[out.length-1][1]+0.15) out.push([r[0],r[1]]);
      else out[out.length-1][1]=Math.max(out[out.length-1][1],r[1]);
    });
    return out;
  }
  function coverageRatio(ranges,dur){
    if(!dur||!isFinite(dur)||dur<=0) return 0;
    return Math.min(1,mergeRanges(ranges).reduce((s,r)=>s+(r[1]-r[0]),0)/dur);
  }
  function fullCoverageReached(ranges,dur){ return !!(dur && coverageRatio(ranges,dur)>=0.92); }
  function recordListenedSegment(toTime){
    const start=listenStartRef.current;
    if(start===null || start===undefined || !isFinite(start) || !isFinite(toTime)) return listenedRanges;
    if(toTime<=start+0.25) return listenedRanges;
    const next=mergeRanges([...listenedRanges,[start,toTime]]);
    setListenedRanges(next);
    listenStartRef.current=toTime;
    const dur=audioDur || (audioElRef.current&&audioElRef.current.duration);
    if(fullCoverageReached(next,dur)) markAudioComplete(next);
    return next;
  }
  function markAudioComplete(rangesArg){
    const a=audioElRef.current;
    const dur=(a && a.duration && isFinite(a.duration)) ? a.duration : audioDur;
    if(a && dur){ setAudioPos(Math.min(a.currentTime||dur,dur)); setAudioDur(dur); }
    setAudioCompleted(true);
    setIsPlaying(false);
    if(!listenCountedRef.current){
      listenCountedRef.current=true;
      setListenCount(c=>Math.min(listenLimit||3,c+1));
    }
  }
  function hasCompletedListening(){
    if(quiz.type!=="Listening") return true;
    if(audioCompleted) return true;
    const a=audioElRef.current;
    if(quiz.audioFile){
      const dur=(a&&a.duration&&isFinite(a.duration))?a.duration:audioDur;
      return fullCoverageReached(listenedRanges,dur);
    }
    return !!audioCompleted;
  }
  function audioTimeUpdate(){
    const a=audioElRef.current;
    if(a){
      if(a.duration && isFinite(a.duration)) setAudioDur(a.duration);
      if(isFinite(a.currentTime)) setAudioPos(a.currentTime);
      if(isPlaying && listenStartRef.current!==null && isFinite(a.currentTime)){
        if(a.currentTime >= listenStartRef.current - 0.2) recordListenedSegment(a.currentTime);
        else listenStartRef.current=a.currentTime;
      }
    }
  }
  function estimateListeningMs(){
    const text=String(quiz.passage||"").replace(/\s+/g," ").trim();
    const words=text?text.split(/\s+/).filter(Boolean).length:0;
    if(quiz.audioFile && audioElRef.current){
      const a=audioElRef.current;
      if(a.duration && isFinite(a.duration)){
        return Math.max(2500,(a.duration-(a.currentTime||0))*1000+700);
      }
    }
    return Math.min(180000,Math.max(4500,words*520+1200));
  }
  function scheduleListeningComplete(){
    const ms=estimateListeningMs();
    clearTimeout(window.__eqListeningDoneTimer);
    window.__eqListeningDoneTimer=setTimeout(()=>{ if(!quiz.audioFile) markAudioComplete(); },ms);
  }

  useEffect(()=>{
    if(timeLeft===null||submitted) return;
    if(timeLeft<=0){ if(Object.keys(answers).length>0 && !(quiz.type==="Listening" && !hasCompletedListening())){doSave();} else {onDone();} return; }
    tRef.current=setTimeout(()=>setTimeLeft(t=>t-1),1000);
    return ()=>clearTimeout(tRef.current);
  },[timeLeft,submitted]);
  useEffect(()=>{
    if(!(quiz.type==="Reading" && quiz.passage) || submitted || readingLeft<=0) return;
    const id=setTimeout(()=>setReadingLeft(x=>Math.max(0,x-1)),1000);
    return ()=>clearTimeout(id);
  },[quiz.id,quiz.type,quiz.passage,submitted,readingLeft]);

      if(quiz.type==="Listening" && quiz.listenMatch){
        // Convert the picked letter back to the ORIGINAL letter so teacher stats/review stay correct

                  <div style={{padding:"10px 12px",fontSize:"14px",fontWeight:"600",color:C.tx,fontFamily:F}}>{q.correctLabel||q.text}</div>
                  <div style={{padding:"6px",borderLeft:"1px solid "+C.br,textAlign:"center"}}>
                    <input value={val} onChange={e=>{const v=e.target.value.replace(/[^0-9]/g,"").slice(0,2); if(!submitted)setAnswers({...answers,[q.id]:v});}} disabled={submitted} inputMode="numeric" placeholder="#" style={{width:"48px",padding:"8px 4px",borderRadius:"7px",border:submitted?(isC?"2px solid "+C.s:"2px solid "+C.d):"1px solid "+C.br,fontSize:"15px",fontWeight:"700",textAlign:"center",fontFamily:F,background:submitted?(isC?"#dcfce7":"#fee2e2"):"#fff",color:C.tx,boxSizing:"border-box"}}/>
                    {submitted&&!isC&&<div style={{fontSize:"10px",color:"#92400e",marginTop:"3px",fontWeight:"700",fontFamily:F}}>✓{q.correctNum}</div>}
                  </div>
                </div>;
              })}
            </Card>
          ) : quiz.questions.map((q,idx)=>{
            const isC=submitted&&isCorrect(q), isW=submitted&&answers[q.id]!==undefined&&!isCorrect(q), ans=answers[q.id]!==undefined;
            return <Card key={q.id} style={{marginBottom:"9px",border:submitted?(isC?"2px solid "+C.s:"2px solid "+C.d):ans?"2px solid #93c5fd":"2px solid transparent"}}>
              <div style={{display:"flex",gap:"9px"}}>
                <div style={{minWidth:"24px",height:"24px",borderRadius:"50%",background:submitted?(isC?C.s:C.d):ans?C.p:"#e2e8f0",display:"flex",alignItems:"center",justifyContent:"center",color:ans||submitted?"#fff":C.mu,fontWeight:"700",fontSize:"11px",flexShrink:0}}>{submitted?(isC?"✓":"✗"):idx+1}</div>
                <div style={{flex:1}}>
                  <div style={{display:"flex",gap:"5px",marginBottom:"5px",flexWrap:"wrap"}}>
                    <span style={{fontSize:"9px",background:C.p+"18",color:C.p,padding:"1px 7px",borderRadius:"999px",fontWeight:"600",fontFamily:F}}>{q.skill}</span>
                    <span style={{fontSize:"9px",background:"#f1f5f9",color:C.mu,padding:"1px 7px",borderRadius:"999px",fontWeight:"600",fontFamily:F}}>{q.difficulty||quiz.difficulty}</span>
                  </div>
                  <p style={{margin:"0 0 9px",color:C.tx,fontSize:"14px",fontWeight:"600",lineHeight:"1.5",fontFamily:F}}>{quiz.type==="Image Labeling"?("What is part "+(idx+1)+"?"):q.text}</p>
                  {quiz.type==="Image Labeling" && quiz.labelAnswerMode==="write" ? (
                    <div>
                      <input value={typeof answers[q.id]==="string"?answers[q.id]:""} onChange={e=>!submitted&&setAnswers({...answers,[q.id]:e.target.value})} disabled={submitted} placeholder="Type the name of this part…" style={{width:"100%",padding:"10px 12px",borderRadius:"8px",border:submitted?(isC?"2px solid "+C.s:"2px solid "+C.d):"1px solid "+C.br,fontSize:"13px",fontFamily:F,boxSizing:"border-box",background:submitted?(isC?"#f0fdf4":"#fef2f2"):"#fff",color:C.tx}}/>
                      {submitted&&<div style={{marginTop:"6px",padding:"6px 10px",background:isC?"#f0fdf4":"#fef3c7",borderRadius:"7px",color:isC?"#166534":"#92400e",fontSize:"11px",fontFamily:F}}>{isC?"✅ Correct!":"✏️ Correct answer: "}<strong>{q.correctLabel}</strong></div>}
                    </div>
                  ) : (
                    <div style={{display:"grid",gap:"5px"}}>
                    {q.options.map((opt,i)=>{
                      const sel=answers[q.id]===i,corr=i===q.correct;
                      let bg="#f8fafc",bdr="1px solid "+C.br,col=C.tx;
                      if(submitted){if(corr){bg="#f0fdf4";bdr="2px solid "+C.s;col="#166534";}else if(sel){bg="#fef2f2";bdr="2px solid "+C.d;col="#991b1b";}}
                      else if(sel){bg="#eff6ff";bdr="2px solid "+C.p;col="#1e40af";}
                      return <button key={i} onClick={()=>!submitted&&setAnswers({...answers,[q.id]:i})}
                        style={{padding:"8px 11px",borderRadius:"8px",background:bg,border:bdr,color:col,fontSize:"13px",textAlign:"left",cursor:submitted?"default":"pointer",display:"flex",alignItems:"center",gap:"7px",fontFamily:F}}>
                        <span style={{minWidth:"19px",height:"19px",borderRadius:"50%",border:"2px solid "+(sel||(submitted&&corr)?"currentColor":C.br),display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",fontWeight:"700",flexShrink:0}}>{String.fromCharCode(65+i)}</span>
                        {opt}{submitted&&corr&&<span style={{marginLeft:"auto"}}>✅</span>}{submitted&&sel&&!corr&&<span style={{marginLeft:"auto"}}>❌</span>}
                      </button>;
                    })}
                    </div>
                  )}
                  {submitted&&isW&&quiz.type!=="Image Labeling"&&<div style={{marginTop:"6px",padding:"6px 10px",background:"#fef3c7",borderRadius:"7px",color:"#92400e",fontSize:"11px",fontFamily:F}}>✏️ Correct: <strong>{q.options[q.correct]}</strong></div>}
                </div>
              </div>
            </Card>;
          })}
          {!submitted && <Card style={{marginBottom:"9px",background:"#f8fafc"}}>
            <p style={{margin:"0 0 7px",fontSize:"12px",fontWeight:"600",color:C.tx,fontFamily:F}}>⭐ How confident did you feel?</p>
            <div style={{display:"flex",gap:"5px"}}>{[1,2,3,4,5].map(n=><button key={n} onClick={()=>setRating(n)} style={{fontSize:"19px",background:"none",border:"none",cursor:"pointer",opacity:rating>=n?1:0.25}}>{n<=rating?"⭐":"☆"}</button>)}</div>
          </Card>}
          {!submitted && quiz.type==="Reading" && quiz.passage && readingLeft>0 && <Card style={{marginBottom:"9px",background:"#fffbeb",border:"1px solid #fde68a"}}>
            <div style={{fontSize:"12px",fontWeight:"800",color:"#92400e",fontFamily:F}}>⏱️ You can answer now. Submit opens after {fmt(readingLeft)}.</div>
          </Card>}
          {!submitted
            ? <Btn onClick={handleSubmit} disabled={saving || (quiz.type==="Reading" && quiz.passage && readingLeft>0)} size="lg" style={{width:"100%"}} color={(saving || (quiz.type==="Reading" && quiz.passage && readingLeft>0))?"#94a3b8":C.md}>{saving?"Saving…":(quiz.type==="Reading" && quiz.passage && readingLeft>0?"Submit opens in "+fmt(readingLeft):"Submit Quiz ✓")}</Btn>
            : <Btn onClick={()=>setTab("results")} size="lg" style={{width:"100%"}} color={C.s}>View Results 📊</Btn>}
        </div>}

        {tab==="results" && submitted && (()=>{
          const p=pct(score,total);
          const g=p===100?{c:C.s,bg:"#f0fdf4",l:"Perfect! 🌟"}:p>=75?{c:C.p,bg:"#eff6ff",l:"Great Job! 👍"}:p>=thresh?{c:C.w,bg:"#fffbeb",l:"Passed! 📚"}:{c:C.d,bg:"#fef2f2",l:"Keep Trying 💪"};
          return <div>
            <Card style={{background:g.bg,border:"2px solid "+g.c,textAlign:"center",marginBottom:"12px"}}>
              <div style={{fontSize:"46px",fontWeight:"900",color:g.c,lineHeight:1,fontFamily:F}}>{score}<span style={{fontSize:"18px",color:C.mu}}>/{total}</span></div>
              <div style={{fontSize:"17px",fontWeight:"700",color:g.c,margin:"4px 0",fontFamily:F}}>{g.l}</div>
              {p>=thresh?<div style={{background:C.s+"20",color:"#166534",borderRadius:"7px",padding:"4px 11px",display:"inline-block",fontSize:"11px",fontWeight:"700",fontFamily:F}}>✅ Mastery Achieved!</div>:<div style={{background:C.w+"20",color:"#92400e",borderRadius:"7px",padding:"4px 11px",display:"inline-block",fontSize:"11px",fontWeight:"700",fontFamily:F}}>📚 Need {thresh}% to pass</div>}
              <div style={{display:"flex",justifyContent:"center",gap:"9px",marginTop:"9px",flexWrap:"wrap"}}>
                {[{v:score,l:"Correct",c:C.s},{v:total-score,l:"Wrong",c:C.d},{v:p+"%",l:"Score",c:C.p}].map(s=>(
                  <div key={s.l} style={{background:C.wh,borderRadius:"8px",padding:"7px 13px",textAlign:"center"}}>
                    <div style={{fontSize:"15px",fontWeight:"800",color:s.c,fontFamily:F}}>{s.v}</div>
                    <div style={{fontSize:"10px",color:C.mu,fontFamily:F}}>{s.l}</div>
                  </div>
                ))}
              </div>
            </Card>
            {skillData.length>0 && <Card style={{marginBottom:"11px"}}><strong style={{fontSize:"12px",color:C.tx,display:"block",marginBottom:"9px",fontFamily:F}}>📚 Skill Breakdown</strong>{skillData.map(s=><SBar key={s.skill} {...s}/>)}</Card>}
            {allAttemptsUsed && reviewAllowed
              ? <Card style={{marginBottom:"11px",background:"#eff6ff",border:"1px solid #93c5fd",textAlign:"center"}}>
                  <p style={{margin:"0 0 9px",fontSize:"13px",color:"#1e40af",fontWeight:"600",fontFamily:F}}>👀 All attempts finished. You can now review your answers.</p>
                  <Btn onClick={()=>setTab("questions")} style={{width:"100%"}} color={C.p}>🔍 Review My Answers</Btn>
                </Card>
              : !allAttemptsUsed
              ? <Card style={{marginBottom:"11px",background:"#fff7ed",border:"1px solid #fdba74",textAlign:"center"}}>
                  <p style={{margin:0,fontSize:"13px",color:"#9a3412",fontWeight:"600",fontFamily:F}}>🔒 Answer review will open after your final allowed attempt. Attempts used: {prev+1}/{totalAllowedQuizAttempts}</p>
                </Card>
              : null}
            <Btn onClick={onDone} size="lg" style={{width:"100%"}} color={C.mu}>← Back to Quizzes</Btn>
          </div>;
        })()}
      </div></div>
    </div>
  );
}
