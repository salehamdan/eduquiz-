      await reload();
    }catch(e){
      alert("Sync failed. Please try again.");
    }
  }
  const remoteSubs=allPossibleRemoteReadingRecords().filter(sameStudentRecord);
  const legacySubs=localReadingRecords().filter(sameStudentRecord);
  const mySubs=remoteSubs.concat(legacySubs).map(normalizeSub).filter(function(s,idx,arr){
    const key=String(s.id||"")+"|"+String(s.taskId||"")+"|"+String(s.createdAt||"");
    return arr.findIndex(function(x){return String(x.id||"")+"|"+String(x.taskId||"")+"|"+String(x.createdAt||"")===key;})===idx;
  }).sort(function(a,b){
    return String(a.createdAt||a.submittedAt||"").localeCompare(String(b.createdAt||b.submittedAt||""));

  function taskSubs(t){
    return mySubs.filter(function(s){return s.taskId===t.id;});
  }
  function canOpenTask(t){

    const t=allTasks.find(function(t){return t.id===id;}) || (data.readingTasks||[]).find(function(t){return t.id===id;});

  }

  function firstScoreValue(){
    for(let i=0;i<arguments.length;i++){
      const v=arguments[i];
      if(v!==undefined && v!==null && v!=="") return v;
    }
    return null;
  }
  function safeNumber(v){
    if(v===undefined || v===null || v==="") return null;
    const n=Number(String(v).replace("%","").trim());
    return Number.isFinite(n)?Math.max(0,Math.min(100,Math.round(n))):null;
  }
  function finalScore(s){
    const a=s.analysis||{};
    const candidates=[
      a.finalScore,a.official,a.officialScore,a.strictScore,a.adjustedAccuracy,a.final,a.score,a.percentage,a.result,a.grade,
      s.finalScoreOfficial,s.officialScore,s.official,s.strictScore,s.adjustedAccuracy,s.finalScore,s.score,s.percentage,s.result,s.grade
    ];
    for(let i=0;i<candidates.length;i++){
      const n=safeNumber(candidates[i]);
      if(n!==null) return n;
    }
    // Accuracy-only old records are accepted only when the record is clearly analyzed.
    const isAnalyzed=!!s.analysis || s.status==="analyzed" || s.status==="accepted" || s.analysisStatus==="Completed" || s.analysisStatus==="completed";
    if(isAnalyzed){
      const n=safeNumber(a.accuracy!==undefined?a.accuracy:s.accuracy);
      if(n!==null) return n;
    }
    return null;
  }
  const analyzed=mySubs.filter(function(s){return finalScore(s)!==null||s.status==="analyzed"||s.status==="accepted";});
  const scores=analyzed.map(finalScore).filter(function(x){return x!==null;});
  const pendingCount=mySubs.filter(function(s){
    if(s.status==="retake_allowed"||s.status==="retake_used") return false;
    if(s.status==="accepted"||s.status==="analyzed") return false;
    if(finalScore(s)!==null) return false;
    if(s.audioUploadStatus==="failed") return false;
    return true;
  }).length;
  const audioFailedCount=mySubs.filter(function(s){return s.audioUploadStatus==="failed";}).length;
  const analyzedCount=analyzed.length;
  const latest=scores.length?scores[scores.length-1]:null;
  const best=scores.length?Math.max.apply(null,scores):null;
  const avg=scores.length?Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length):null;
  function growthPercent(){
    if(scores.length<2) return null;
    const first=scores[0], last=scores[scores.length-1];
    if(first===0) return last>0?100:0;
    return Math.round(((last-first)/Math.max(1,first))*100);
  }
  const growth=growthPercent();

  function chip(label,value,bg,fg){
    return <div style={{minWidth:"92px",flex:1,padding:"9px 10px",borderRadius:"14px",background:bg,color:fg,fontWeight:800,textAlign:"center"}}><div style={{fontSize:"11px",opacity:.75}}>{label}</div><div style={{fontSize:"18px"}}>{value}</div></div>;
  }
  function bars(){
    if(!scores.length) return <div style={{marginTop:"12px",padding:"12px",border:"1px dashed "+C.br,borderRadius:"12px",fontSize:"12px",color:C.mu,textAlign:"center"}}>No chart yet. Complete your first Reading Progress recording to start tracking growth.</div>;
    return <div style={{overflowX:"auto",maxWidth:"100%",paddingBottom:"6px",marginTop:"12px"}}><div style={{display:"flex",gap:"8px",alignItems:"end",height:"86px",borderBottom:"1px solid "+C.br,minWidth:"max-content",padding:"0 4px"}}>{scores.map(function(s,i){return <div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"4px",minWidth:"34px"}}><div style={{width:"24px",height:Math.max(8,Math.round(s/100*64))+"px",background:gc(s),borderRadius:"8px 8px 0 0"}}></div><span style={{fontSize:"10px",color:C.mu}}>{i+1}</span></div>;})}</div></div>;
  }
  function statusText(s){
    if(finalScore(s)!==null || s.analysis) return "Analyzed";
    if(s.status==="accepted") return "Accepted";
    if(s.status==="rejected") return "Rejected";
    if(s.status==="retake_allowed") return "Retake allowed";
    if(s.audioUploadStatus==="failed") return "Submitted - audio upload failed";
    if(s.audioUploadStatus==="uploading") return "Uploading audio";
    if(s.syncedFromLocal) return "Synced old record";

  }

  function words(s){
    return String(s||"").toLowerCase().replace(/[^a-z\s']/g," ").split(/\s+/).filter(Boolean);
  }
  function clean(w){return String(w||"").toLowerCase().replace(/[^a-z']/g,"").trim();}
  function distance(a,b){
    a=clean(a); b=clean(b);
    const dp=Array(a.length+1).fill(0).map(function(){return Array(b.length+1).fill(0);});
    for(let i=0;i<=a.length;i++) dp[i][0]=i;
    for(let j=0;j<=b.length;j++) dp[0][j]=j;
    for(let i=1;i<=a.length;i++){
      for(let j=1;j<=b.length;j++){
        dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
      }
    }
    return dp[a.length][b.length];
  }
  function wordMatches(target,said){
    const t=clean(target);
    const arr=words(said).map(clean).filter(Boolean);
    if(!t || !arr.length) return false;
    return arr.some(function(w){
      if(w===t) return true;
      if(w.indexOf(t)>=0 || t.indexOf(w)>=0) return Math.min(w.length,t.length)>=3;
      const d=distance(w,t);
      if(t.length<=4) return d<=1;
      if(t.length<=7) return d<=2;
      return d<=3;
    });
  }
  function wrongWordsFor(t,spoken){

    const ref=words(t.text).filter(function(w){return w.length>=4&&!stop[w];});
    const unique=[];
    ref.forEach(function(w){if(unique.indexOf(w)<0)unique.push(w);});
    const hyp=words(spoken);
    return unique.filter(function(w){return hyp.indexOf(w)<0;}).slice(0,7);
  }
  const practiceWords=selectedTask&&blob?wrongWordsFor(selectedTask,transcript):[];
  const needsPractice=!!(selectedTask&&selectedTask.requirePractice)&&practiceWords.length>0;
  const passedCount=practiceWords.filter(function(w){return passedWords[w];}).length;
  const practiceDone=!needsPractice || passedCount===practiceWords.length;
  const currentWord=practiceWords[Math.min(practiceIndex,Math.max(0,practiceWords.length-1))]||"";

  function speakWord(word){
    try{
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(word);
      u.lang="en-US"; u.rate=0.82;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function listenWord(word){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setPracticeMsg("Speech recognition is not supported here. Please use Chrome and allow microphone permission.");return;}
    const r=new SR();
    r.lang="en-US"; r.interimResults=false; r.maxAlternatives=3;
    setListeningWord(true); setPracticeMsg("Now say: "+word);
    r.onresult=function(e){
      const said=Array.from(e.results).map(function(x){return x[0].transcript;}).join(" ");
      if(wordMatches(word,said)){
        const next=Object.assign({},passedWords); next[word]=true; setPassedWords(next);
        const count=practiceWords.filter(function(w){return next[w];}).length;
        setPracticeIndex(Math.min(practiceWords.length-1,practiceIndex+1));
        setPracticeMsg(count===practiceWords.length?"✅ All words passed. You can submit now.":"✅ Correct. Next word.");
      }else{
        setPracticeMsg("❌ I heard: "+said+". Try again: "+word);
      }
      setListeningWord(false);
    };
    r.onerror=function(){setListeningWord(false);setPracticeMsg("Speech check failed. Try again and allow microphone permission.");};
    r.onend=function(){setListeningWord(false);};
    r.start();
  }
  function startPractice(){

  }

  async function startRec(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){setMsg("Recording is not supported in this browser.");return;}
    setMsg(""); setSubmitStatus(""); setBlob(null); setAudioUrl(""); setTranscript(""); setSeconds(0); setPassedWords({}); setPracticeIndex(0); setPracticeMsg(""); chunksRef.current=[];
    const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
    const mime=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":(MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"");
    const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:undefined);
    mediaRef.current=mr;
    mr.ondataavailable=function(e){if(e.data&&e.data.size)chunksRef.current.push(e.data);};
    mr.onstop=function(){stream.getTracks().forEach(function(x){x.stop();}); const b=new Blob(chunksRef.current,{type:mime||"audio/webm"}); setBlob(b); setAudioUrl(URL.createObjectURL(b));};
    try{recRef.current=rpStartRecognition(setTranscript);}catch(e){}
    mr.start(1000); setRecording(true); timerRef.current=setInterval(function(){setSeconds(function(x){return x+1;});},1000);
  }
  function stopRec(){

    try{recRef.current&&recRef.current.stop();}catch(e){}
    clearInterval(timerRef.current); setRecording(false);
  }
  function backToReadingTasks(){

    try{recRef.current&&recRef.current.stop();}catch(e){}

    setTranscript("");

  }
  async function clearRetakeFlags(t){
    const done=taskSubs(t).filter(function(x){return x.status==="retake_allowed";});
    for(const s of done){await fsSet("readingSubmissions",s.id,Object.assign({},s,{status:"retake_used",updatedAt:new Date().toISOString()}));}
  }
  function blobToDataUrl(b){

      try{
        const r=new FileReader();
        r.onload=function(){resolve(String(r.result||""));};
        r.onerror=function(){reject(r.error||new Error("reader_failed"));};

      let done=false;
      const t=setTimeout(function(){
        if(done) return;
        done=true;
        reject(new Error("upload_timeout"));
      },ms);
      promise.then(function(v){
        if(done) return;
        done=true;
        clearTimeout(t);
        resolve(v);
      }).catch(function(e){
        if(done) return;

        clearTimeout(t);

      });
    });

    <Card style={{marginBottom:"10px",border:"2px solid "+C.p,overflow:"hidden",background:"#fff"}}><strong style={{fontSize:"15px",color:C.tx}}>📈 My Reading Progress Dashboard</strong><p style={{fontSize:"10px",color:C.mu,margin:"4px 0 8px"}}>Your reading performance summary appears here, including previous saved attempts when they match your account.</p><div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:"8px",marginTop:"10px"}}>{chip("Latest",latest!==null?latest+"%":"—","#eff6ff","#1d4ed8")}{chip("Attempts",mySubs.length,"#ecfdf5","#166534")}{chip("Analyzed",analyzedCount,"#eff6ff","#1d4ed8")}{chip("Pending Review",pendingCount,"#fff7ed","#9a3412")}{audioFailedCount?chip("Audio Failed",audioFailedCount,"#fef2f2","#991b1b"):null}{chip("Growth",growth!==null?growth+"%":"—","#fff7ed","#9a3412")}{chip("Best",best!==null?best+"%":"—","#f8fafc","#334155")}{chip("Average",avg!==null?avg+"%":"—","#f8fafc","#334155")}</div>{bars()}</Card>

function ReadingProgressTeacher({user,data,reload,myClasses,myStudents}){
  const [title,setTitle]=useState("Reading Progress Task");
  const [editTaskId,setEditTaskId]=useState("");
  const [level,setLevel]=useState("beginner");
  const [lines,setLines]=useState(3);
  const [wordCount,setWordCount]=useState(80);
  const [rpMaxAttempts,setRpMaxAttempts]=useState(1);
  const [requirePractice,setRequirePractice]=useState(false);
  const [topic,setTopic]=useState("");
  const [text,setText]=useState("");
  const [classIds,setClassIds]=useState([]);
  const [filter,setFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [selectedGroup,setSelectedGroup]=useState([]);
  const [msg,setMsg]=useState("");
  const [viewMode,setViewMode]=useState("official");
  const [sensitivity,setSensitivity]=useState("normal");
  const [speedWeight,setSpeedWeight]=useState("reduced");
  const [refreshTick,setRefreshTick]=useState(0);
  const [showPanel,setShowPanel]=useState(true);

  function studentNameById(id){
    const s=(data.students||[]).find(function(x){return String(x.id)===String(id)||String(x.studentId||"")===String(id);});
    return s?(s.name||s.studentName||id):(id||"Unknown student");
  }
  function needsTeacherReview(s){
    if(!s) return false;
    if(s.status==="retake_allowed"||s.status==="retake_used") return false;
    if(s.status==="accepted"||s.status==="rejected") return false;
    if(s.analysis) return false;
    if(s.audioUploadStatus==="uploading") return false;
    return s.status==="submitted" || s.status==="audio_upload_failed" || s.audioUploadStatus==="failed" || s.analysisStatus==="Pending";
  }
  const newReadingSubmissions=(data.readingSubmissions||[]).filter(needsTeacherReview).sort(function(a,b){
    return String(b.createdAt||b.submittedAt||"").localeCompare(String(a.createdAt||a.submittedAt||""));
  });
  function jumpToReadingSubmission(id){
    const el=document.getElementById("rp-sub-"+id);
    if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.style.outline="3px solid #f59e0b";setTimeout(function(){el.style.outline="";},2500);}
    else{document.getElementById("rp-teacher-bottom")&&document.getElementById("rp-teacher-bottom").scrollIntoView({behavior:"smooth",block:"center"});}
  }


  function teacherLooksLikeReadingRecord(x){
    if(!x || typeof x!=="object") return false;
    if(x.audioUrl||x.transcript||x.wcpm||x.fluency||x.finalScore||x.strictScore||x.official||x.adjustedAccuracy) return true;
    if(x.analysis && (x.taskId||x.studentId||x.studentName||x.name)) return true;
    const txt=String((x.type||"")+" "+(x.kind||"")+" "+(x.title||"")+" "+(x.taskTitle||"")).toLowerCase();
    return txt.indexOf("reading")>=0 && (x.studentId||x.studentName||x.name||x.score||x.accuracy);
  }
  function teacherCollectReadingRecordsDeep(obj,out,sourceKey,depth){
    if(!obj || depth>5) return;
    if(Array.isArray(obj)){obj.forEach(function(v){teacherCollectReadingRecordsDeep(v,out,sourceKey,depth+1);});return;}
    if(typeof obj!=="object") return;
    if(teacherLooksLikeReadingRecord(obj)) out.push(Object.assign({__local:true,__key:sourceKey},obj));
    Object.keys(obj).forEach(function(k){
      const low=String(k).toLowerCase();
      const v=obj[k];
      if(low.indexOf("reading")>=0||low.indexOf("submission")>=0||low.indexOf("record")>=0||low.indexOf("rp")>=0||Array.isArray(v)){
        teacherCollectReadingRecordsDeep(v,out,sourceKey,depth+1);
      }
    });
  }
  function teacherLocalReadingRecords(){
    const out=[];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i)||"";
        let v=null;
        try{v=JSON.parse(localStorage.getItem(k)||"null");}catch(e){v=null;}
        teacherCollectReadingRecordsDeep(v,out,k,0);
      }
    }catch(e){}
    return out;
  }
  async function syncTeacherLocalReadingRecords(){
    try{
      const old=teacherLocalReadingRecords();
      if(!old.length){alert("No local Reading Progress records found on this device. If records are in Firebase, no sync is needed.");return;}
      let added=0;
      const existing=data.readingSubmissions||[];
      for(let i=0;i<old.length;i++){
        const s=old[i];
        const sid=s.studentId||s.studentID||s.userId||s.studentNumber||s.number||"";
        const sname=s.studentName||s.name||s.fullName||"";
        const tid=s.taskId||s.readingTaskId||s.taskID||s.rpTaskId||s.title||"legacy-reading-task";
        const created=s.createdAt||s.submittedAt||s.completedAt||s.date||"";
        const exists=existing.some(function(r){
          return (String(r.id||"")&&String(r.id||"")===String(s.id||"")) || (String(r.studentId||r.studentNumber||"")===String(sid) && String(r.taskId||"")===String(tid) && String(r.createdAt||r.submittedAt||"")===String(created));
        });
        if(exists) continue;
        const id=s.id&&String(s.id).indexOf("legacy-")!==0?s.id:uid();
        const analysis=s.analysis||((s.finalScore||s.score||s.official||s.officialScore||s.strictScore||s.adjustedAccuracy||s.percentage||s.result||s.grade||s.wcpm||s.fluency)?{finalScore:s.finalScore||s.score||s.official||s.officialScore||s.strictScore||s.adjustedAccuracy||s.percentage||s.result||s.grade,accuracy:s.accuracy,wcpm:s.wcpm,fluency:s.fluency}:undefined);
        await fsSet("readingSubmissions",id,Object.assign({},s,{id:id,taskId:tid,taskTitle:s.taskTitle||s.title||"Reading Progress Task",studentId:sid,studentName:sname,classId:s.classId||"",createdAt:created||today(),status:s.status||((analysis)?"analyzed":"submitted"),analysis:analysis,syncedFromLocal:true,syncedAt:new Date().toISOString()}));
        added++;
      }
      alert(added?("Synced "+added+" local Reading Progress record(s) to the database."):"All local records are already synced.");
      await reload();
    }catch(e){
      alert("Teacher sync failed. Please try again.");
    }
  }

  const [retakeStudentPick,setRetakeStudentPick]=useState({});

  const tasks=(data.readingTasks||[]).filter(t=>t.teacherId===user.id);

  function rpKey(){
    for(const k of ["rp_attempt_records_v11","rp_attempt_records_v10","rp_attempt_records_v9","rp_attempt_records_v8"]){
      try{const v=JSON.parse(localStorage.getItem(k)||"null"); if(Array.isArray(v)) return k;}catch(e){}
    }
    localStorage.setItem("rp_attempt_records_v11","[]");
    return "rp_attempt_records_v11";
  }
  function localRecords(){
    try{return JSON.parse(localStorage.getItem(rpKey())||"[]")||[];}catch(e){return[];}
  }
  function saveLocalRecords(arr){
    localStorage.setItem(rpKey(),JSON.stringify(arr));
    setRefreshTick(x=>x+1);
  }
  function norm(x){return String(x||"").replace(/\s+/g," ").trim().toLowerCase();}
  function matchStudent(r){
    return myStudents.find(st =>
      st.id===r.studentId ||
      st.studentId===r.studentId ||
      String(st.studentId||"")===String(r.studentId||"") ||
      norm(st.name)===norm(r.studentName)
    );
  }
  function classIdFor(r,st){
    if(st&&st.classId) return st.classId;
    const c=myClasses.find(c=>c.id===r.className||c.name===r.className||c.id===r.classId||c.name===r.classId);
    return c?c.id:(r.classId||r.className||"");
  }
  function localToSub(r){
    const st=matchStudent(r)||{};
    const hasAnalysis = r.accuracy!=="" && r.accuracy!==undefined && r.accuracy!==null;
    const analysis = hasAnalysis ? {
      accuracy:Number(r.accuracy)||0,
      wcpm:Number(r.wcpm)||0,
      fluency:Number(r.fluency)||0,
      mistakeCount:Number(r.mistakes)||0,
      repeated:Array(Number(r.repeated)||0).fill("x")
    } : null;
    return {
      ...r,
      __local:true,
      teacherId:user.id,
      studentId:st.id||r.studentId,
      studentName:r.studentName||st.name||"Student",
      classId:classIdFor(r,st),
      createdAt:(r.submittedAt||r.createdAt||today()).slice(0,10),
      seconds:r.seconds||60,
      analysis,
      status:r.status||"submitted"
    };
  }

  const firebaseSubs=(data.readingSubmissions||[]).filter(s=>s.teacherId===user.id);
  const localSubs=localRecords().map(localToSub);
  const subs=[...firebaseSubs,...localSubs];

  function officialScore(sub){
    if(!sub.analysis) return null;
    const acc=Number(sub.analysis.accuracy);
    const flu=Number(sub.analysis.fluency);
    const wcpm=Number(sub.analysis.wcpm);
    const speedScore=Number.isFinite(wcpm)?Math.min(100,Math.round(wcpm/130*100)):NaN;
    let score;
    if(speedWeight==="excluded"){
      const vals=[acc,flu].filter(Number.isFinite);
      score=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):acc;
    }else if(speedWeight==="reduced"){
      score=Math.round((Number.isFinite(acc)?acc*.70:0)+(Number.isFinite(flu)?flu*.25:0)+(Number.isFinite(speedScore)?speedScore*.05:0));
    }else{
      score=Math.round((Number.isFinite(acc)?acc*.60:0)+(Number.isFinite(flu)?flu*.25:0)+(Number.isFinite(speedScore)?speedScore*.15:0));
    }
    const bonus=sensitivity==="supportive"?12:sensitivity==="normal"?5:0;
    return Math.max(0,Math.min(100,score+bonus));
  }

  function officialAccuracy(sub){
    if(!sub.analysis) return null;
    const acc=Number(sub.analysis.accuracy);
    if(!Number.isFinite(acc)) return null;

    let bonus=sensitivity==="supportive"?6:sensitivity==="normal"?2:0;
    if(acc<35) bonus=sensitivity==="supportive"?2:0;

    let out=Math.round(acc+bonus);
    if(acc<15) out=Math.min(out,12);
    else if(acc<25) out=Math.min(out,20);
    else if(acc<35) out=Math.min(out,28);
    else if(acc<45) out=Math.min(out,36);
    else if(acc<55) out=Math.min(out,45);
    else if(acc<65) out=Math.min(out,58);

    return Math.max(0,Math.min(100,out));
  }
  function officialFluency(sub){
    if(!sub.analysis) return null;
    const flu=Number(sub.analysis.fluency);
    const wcpm=Number(sub.analysis.wcpm);
    const acc=Number(sub.analysis.accuracy);
    if(!Number.isFinite(flu)&&!Number.isFinite(wcpm)) return null;

    const speedScore=Number.isFinite(wcpm)?Math.min(100,Math.round(wcpm/130*100)):flu;
    let base;
    if(speedWeight==="excluded") base=Number.isFinite(flu)?flu:speedScore;
    else if(speedWeight==="normal") base=Math.round((Number.isFinite(flu)?flu*.85:0)+(Number.isFinite(speedScore)?speedScore*.15:0));
    else base=Math.round((Number.isFinite(flu)?flu*.95:0)+(Number.isFinite(speedScore)?speedScore*.05:0));

    let bonus=sensitivity==="supportive"?4:sensitivity==="normal"?1:0;
    let out=Math.round(base+bonus);

    if(Number.isFinite(acc)){
      if(acc<15) out=Math.min(out,18);
      else if(acc<25) out=Math.min(out,25);
      else if(acc<35) out=Math.min(out,33);
      else if(acc<45) out=Math.min(out,42);
      else if(acc<55) out=Math.min(out,52);
    }

    return Math.max(0,Math.min(100,out));
  }

    const technology={beginner:[`Technology helps people learn, work, and communicate.`,`A phone or computer can be useful when people use it wisely.`,`People should also take breaks and protect their eyes.`,`Good habits make technology safer.`],intermediate:[`Technology can make life easier by helping people find information and communicate quickly.`,`However, people should use it carefully and avoid wasting too much time.`,`Responsible users check information, protect privacy, and balance screen time with real activities.`,`When used well, technology can support learning and creativity.`],advanced:[`Technology has changed the way people study, work, communicate, and solve problems.`,`Its benefits are clear, but responsible use requires critical thinking, privacy awareness, and self-control.`,`Artificial intelligence can support creativity and productivity, yet people must still make ethical decisions.`,`The best use of technology combines innovation with responsibility.`]};
    const generic={beginner:[`It can happen at home, outside, or in the community.`,`People can learn something new from this experience.`,`They should listen carefully and make good choices.`,`This can help them become more confident.`],intermediate:[`This topic can be connected to real situations and personal decisions.`,`People may face challenges, but they can learn by thinking carefully and taking action.`,`Good choices usually need patience, respect, and clear goals.`,`For this reason, the topic is useful for discussion and reflection.`],advanced:[`This topic can be understood through examples, consequences, and different points of view.`,`It encourages people to think critically about values, responsibilities, and long-term results.`,`A balanced view considers both advantages and possible challenges.`,`Such reflection can lead to better decisions and deeper understanding.`]};
    let bank=generic;
    if(seed.includes("travel")||seed.includes("trip")||seed.includes("tourism")||seed.includes("city")||seed.includes("beach")) bank=travel;
    if(seed.includes("food")||seed.includes("meal")||seed.includes("healthy")) bank=food;

  async function deleteAudio(audioId){

    try{
      const db=await new Promise((resolve,reject)=>{
        const req=indexedDB.open("EduQuizRP_AudioDB",1);
        req.onupgradeneeded=e=>{
          const db=e.target.result;
          if(!db.objectStoreNames.contains("audios")) db.createObjectStore("audios",{keyPath:"id"});
        };
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>reject(req.error);
      });
      await new Promise((resolve,reject)=>{
        const tx=db.transaction("audios","readwrite");

        tx.onerror=()=>reject(tx.error);
      });
    }catch(e){}

          <Btn size="sm" color={C.p} onClick={()=>document.getElementById("rp-teacher-top")?.scrollIntoView({behavior:"smooth",block:"start"})}>↑ Back to Top</Btn>
          <Btn size="sm" color="#64748b" onClick={()=>setShowPanel(false)}>Hide Reading Progress</Btn>
        </div>
      </div>
    </Card>
  </div>;
}


function TeacherApp({user, data, onLogout, reload, viewAsStudent}) {
  const [tab,setTab]=useState("overview"),[view,setView]=useState(null),[selQuiz,setSelQuiz]=useState(null);
  const [noteModal,setNoteModal]=useState(null),[noteText,setNoteText]=useState(""),[annModal,setAnnModal]=useState(false),[ann,setAnn]=useState({title:"",text:"",classIds:[]});
  const [attemptsModal,setAttemptsModal]=useState(null);

  const [viewAsOpen,setViewAsOpen]=useState(false);

  const [editStu,setEditStu]=useState(null);

  const [resumeAfterEdit,setResumeAfterEdit]=useState(false);
  const [clsModal,setClsModal]=useState(false),[newCls,setNewCls]=useState({name:"",grade:""}),[search,setSearch]=useState(""),[sortBy,setSortBy]=useState("name"),[filterCls,setFilterCls]=useState("all");
  const [shareModal,setShareModal]=useState(null);

  const myQuizzes=data.quizzes.filter(q=>q.teacherId===user.id);
  const myClasses=data.classes.filter(c=>!c.teacherIds || c.teacherIds.includes(user.id) || c.teacherIds.includes("GLOBAL") || c.preloaded);
  const myStudents=data.users.filter(u=>u.role==="student"&&(myClasses.some(c=>c.id===u.classId)||!u.classId));
  const myResps=data.responses.filter(r=>myQuizzes.some(q=>q.id===r.quizId));
  const flags=myStudents.filter(s=>{const rs=data.responses.filter(r=>r.studentId===s.id);return calcSkills(rs,data.quizzes).filter(sk=>sk.score<50&&sk.total>=2).length>=2;});
  const sorted=[...myStudents].filter(s=>(filterCls==="all"||s.classId===filterCls)&&(!search||s.name.toLowerCase().includes(search.toLowerCase())||(s.studentId||"").includes(search))).sort((a,b)=>{
    if(sortBy==="name")return a.name.localeCompare(b.name);if(sortBy==="id")return a.studentId.localeCompare(b.studentId);if(sortBy==="class")return (a.classId||"").localeCompare(b.classId||"");
    const ra=data.responses.filter(r=>r.studentId===a.id&&myQuizzes.some(q=>q.id===r.quizId)),rb=data.responses.filter(r=>r.studentId===b.id&&myQuizzes.some(q=>q.id===r.quizId));
    return (rb.length?Math.round(rb.reduce((s,r)=>s+pct(r.score,r.totalQ),0)/rb.length):0)-(ra.length?Math.round(ra.reduce((s,r)=>s+pct(r.score,r.totalQ),0)/ra.length):0);
  });

  async function saveQuiz(q){await fsSet("quizzes",q.id,q);await reload();setView(null);}
  // Auto-pause: close the quiz before editing so no new students start mid-change
  async function startEditQuiz(quiz){
    const wasOpen = quiz.status!=="closed";
    if(wasOpen){ await fsSet("quizzes",quiz.id,{...quiz,status:"closed"}); await reload(); }
    setResumeAfterEdit(wasOpen);
    setEditingQuiz({...quiz,status:wasOpen?"closed":quiz.status});
    setView("edit");
  }
  // On save while editing: reopen the quiz if it was open before editing
  async function saveEditedQuiz(q){
    const finalStatus = resumeAfterEdit ? "open" : q.status;
    await fsSet("quizzes",q.id,{...q,status:finalStatus});
    await reload();
    setView(null); setEditingQuiz(null); setResumeAfterEdit(false);
  }
  function cancelEdit(){
    // If we auto-closed it, reopen it on cancel too
    (async()=>{ if(resumeAfterEdit&&editingQuiz){ await fsSet("quizzes",editingQuiz.id,{...editingQuiz,status:"open"}); await reload(); } setView(null); setEditingQuiz(null); setResumeAfterEdit(false); })();
  }
  async function delQuiz(id){if(!confirm("Delete this quiz?"))return;await fsDel("quizzes",id);await reload();}
  async function delResponse(rid, studentName){if(!confirm("Delete this attempt by "+studentName+"? This will update their progress and mastery."))return;await fsDel("responses",rid);await reload();}
  async function toggleQuiz(quiz){await fsSet("quizzes",quiz.id,{...quiz,status:quiz.status==="closed"?"open":"closed"});await reload();}
  async function saveNote(){const ex=data.notes.find(n=>n.teacherId===user.id&&n.studentId===noteModal.id);const id=ex?ex.id:uid();await fsSet("notes",id,{id,teacherId:user.id,studentId:noteModal.id,note:noteText,updatedAt:today()});await reload();setNoteModal(null);}
  async function postAnn(){const id=uid();await fsSet("announcements",id,{id,teacherId:user.id,...ann,createdAt:today()});await reload();setAnnModal(false);setAnn({title:"",text:"",classIds:[]});}
  // ── IMPORT STUDENTS FROM EXCEL/CSV ──
  async function importStudents(e){
    const file=e.target.files[0]; if(e.target)e.target.value="";
    if(!file) return;
    setImportMsg("Reading file…");
    try {
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(new Uint8Array(buf),{type:"array"});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
      if(!rows.length){setImportMsg("File is empty.");return;}
      // Detect header columns
      const hdr=rows[0].map(c=>String(c||"").trim().toLowerCase());
      let ci={name:-1,id:-1,cls:-1,email:-1};
      hdr.forEach((h,i)=>{
        if(ci.name<0&&(h==="name"||h.includes("student name")||h.includes("full name")||h==="اسم"||h.includes("الاسم"))) ci.name=i;
        else if(ci.id<0&&(h==="id"||h.includes("student id")||h.includes("number")||h.includes("رقم")||h.includes("هوية"))) ci.id=i;
        else if(ci.cls<0&&(h==="class"||h.includes("class")||h.includes("grade")||h.includes("صف")||h.includes("فصل"))) ci.cls=i;
        else if(ci.email<0&&h.includes("email")) ci.email=i;
      });
      const hasHeader=ci.name>=0||ci.id>=0;
      if(!hasHeader){ci={name:0,id:1,cls:2,email:-1};}
      const dataRows=rows.slice(hasHeader?1:0);
      const existing=await fsAll("users");
      let added=0,skipped=0,dupe=0;
      const myClassList=data.classes.filter(c=>(c.teacherIds||[]).includes(user.id));
      for(const r of dataRows){
        const name=String(r[ci.name]||"").trim();
        const sid=String(r[ci.id]||"").trim();
        if(!name||!sid){skipped++;continue;}
        if(existing.find(u=>(u.studentId||"")===sid)){dupe++;continue;}
        // Match class by name if provided
        let classId="";
        if(ci.cls>=0){const cn=String(r[ci.cls]||"").trim().toLowerCase();const mc=myClassList.find(c=>c.name.toLowerCase()===cn||((c.grade||"").toLowerCase()===cn));if(mc)classId=mc.id;}
        const email=ci.email>=0?String(r[ci.email]||"").trim().toLowerCase():"";
        const nu={id:uid(),role:"student",name,studentId:sid,classId,email,password:"",createdAt:today()};
        await fsSet("users",nu.id,nu);
        existing.push(nu); added++;
      }
      await reload();
      setImportMsg("✅ Added "+added+" students."+(dupe?" Skipped "+dupe+" already existing.":"")+(skipped?" Skipped "+skipped+" rows missing name/ID.":""));
    } catch(err){ setImportMsg("Error: "+(err.message||err)); }
  }

  // ── EXPORT GRADEBOOK (grid: students x quizzes) ──
  function exportGradebook(){
    const qs = myQuizzes;
    const studs = (gbClass==="all"?myStudents:myStudents.filter(s=>s.classId===gbClass));
    const header=["Student Name","Student ID","Class",...qs.map(q=>q.title),"Average %"];
    const rows=[header];
    studs.forEach(s=>{
      const cls=data.classes.find(c=>c.id===s.classId);
      const row=[s.name,s.studentId||"",cls?.name||""];
      let sum=0,cnt=0;
      qs.forEach(q=>{
        const rs=data.responses.filter(r=>r.studentId===s.id&&r.quizId===q.id);
        if(rs.length){ const best=Math.max(...rs.map(r=>pct(r.score,r.totalQ))); row.push(best); sum+=best; cnt++; }
        else row.push("");
      });
      row.push(cnt?Math.round(sum/cnt):"");
      rows.push(row);
    });
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:22},{wch:12},{wch:12},...qs.map(()=>({wch:14})),{wch:10}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Gradebook");
    XLSX.writeFile(wb,"EduQuiz_Gradebook_"+new Date().toISOString().slice(0,10)+".xlsx");
  }

  // ── EXPORT RESULTS TO EXCEL ──
  function exportResults(){
    const rows=[["Student Name","Student ID","Class","Quiz","Type","Mode","Score","Total","Percent","Attempt","Date"]];
    const myResp=data.responses.filter(r=>myQuizzes.some(q=>q.id===r.quizId));
    myResp.sort((a,b)=>(b.ts||0)-(a.ts||0));
    myResp.forEach(r=>{
      const st=data.users.find(u=>u.id===r.studentId);
      const quiz=myQuizzes.find(q=>q.id===r.quizId);
      const cls=data.classes.find(c=>c.id===(st?.classId));
      rows.push([st?.name||"?",st?.studentId||"",cls?.name||"",quiz?.title||"",quiz?.type||"",r.mode||"normal",r.score,r.totalQ,pct(r.score,r.totalQ)+"%",r.attempt||1,r.completedAt||""]);
    });
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:20},{wch:12},{wch:12},{wch:24},{wch:10},{wch:8},{wch:7},{wch:7},{wch:9},{wch:8},{wch:18}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Results");
    XLSX.writeFile(wb,"EduQuiz_Results_"+new Date().toISOString().slice(0,10)+".xlsx");
  }

  async function saveEditStudent(){
    setEsMsg("");
    if(!esForm.name.trim()||!esForm.studentId.trim()){setEsMsg("Name and ID are required.");return;}
    const all=(await loadAllData()).users;
    if(all.find(u=>u.id!==editStu.id && !u.deleted && (u.studentId||"")===esForm.studentId.trim())){setEsMsg("That Student ID is used by another student.");return;}
    const updated={...editStu,name:esForm.name.trim(),shortName:(esForm.shortName||"").trim() || esForm.name.trim().split(/\s+/).slice(0,2).join(" "),studentId:esForm.studentId.trim(),classId:esForm.classId,email:(esForm.email||"").trim().toLowerCase(),fatherName:esForm.fatherName.trim(),updatedAt:today()};
    if(esForm.password.trim()) updated.password=esForm.password.trim();
    await fsSet("users",editStu.id,updated);
    await reload();
    setEsMsg("✅ Saved!");
    setTimeout(()=>setEditStu(null),700);

  async function createCls(){if(!newCls.name.trim())return;const id=uid();await fsSet("classes",id,{id,name:newCls.name.trim(),grade:newCls.grade.trim(),teacherIds:[user.id],createdAt:today()});await reload();setClsModal(false);setNewCls({name:"",grade:""});}

    const name = prompt("Edit class name:", cls.name||"");

    await fsSet("classes", cls.id, {...cls, name:name.trim(), grade:(grade||"").trim(), teacherIds:(cls.teacherIds&&cls.teacherIds.includes("GLOBAL"))?cls.teacherIds:[user.id], updatedAt:today()});
    await reload();
  }
  async function deleteClass(cls){
    const studs = data.users.filter(u=>u.role==="student" && u.classId===cls.id && !u.deleted);
    if(!confirm("Delete class: "+cls.name+"?"+(studs.length?"\nStudents in this class will be moved to No class.":""))) return;
    for(const st of studs){ await fsSet("users", st.id, {...st, classId:""}); }
    await fsSet("classes", cls.id, {...cls, deleted:true, updatedAt:today()});
    await reload();

  async function deleteStudent(st){
    if(!confirm("Delete student: "+st.name+"?")) return;

  function quizLink(quiz){
    // Use a saved site URL if the teacher set one, otherwise current page URL
    let base = "";
    try { base = localStorage.getItem("eq_siteurl") || ""; } catch(e){}
    if (!base) {
      base = location.origin + location.pathname;
    }
    // Clean up: remove trailing slash, remove any query/hash
    base = base.split("?")[0].split("#")[0].replace(/\/$/, "");
    return base + "?quiz=" + quiz.code;
  }

  return (

          </Card>}

              <ResponsiveContainer width="100%" height={150}><BarChart data={[{r:"0-49%",n:myResps.filter(r=>pct(r.score,r.totalQ)<50).length},{r:"50-69%",n:myResps.filter(r=>{const p=pct(r.score,r.totalQ);return p>=50&&p<70;}).length},{r:"70-89%",n:myResps.filter(r=>{const p=pct(r.score,r.totalQ);return p>=70&&p<90;}).length},{r:"90-100%",n:myResps.filter(r=>pct(r.score,r.totalQ)>=90).length}]} barSize={28}><XAxis dataKey="r" tick={{fontSize:9,fill:C.mu}} axisLine={false} tickLine={false}/><YAxis allowDecimals={false} tick={{fontSize:9,fill:C.mu}}/><Tooltip/><Bar dataKey="n" radius={[4,4,0,0]}>{[C.d,C.w,C.p,C.s].map((c,i)=><Cell key={i} fill={c}/>)}</Bar></BarChart></ResponsiveContainer>

            </Card>

  async function reload(){const d=await loadAllData();setData(d);return d;}

  // Teacher taps "View as Student" -> pick a student to impersonate (view only their experience)
  function viewAsStudent(studentUser){ setParkedTeacher(user); setUser(studentUser); reload(); }
  function backToTeacher(){ if(parkedTeacher){ setUser(parkedTeacher); setParkedTeacher(null); reload(); } }

  useEffect(()=>{
    (async()=>{
      const d=await loadAllData();setData(d);
      // Check for ?quiz=CODE link
      const params=new URLSearchParams(location.search);
      const code=params.get("quiz");

      const sess=loadSession();
      if(sess){const u=d.users.find(x=>x.id===sess.id);if(u)setUser(u);else if(sess.id)setUser(sess);}
      setLoading(false);
    })();
  },[]);

  function handleLogin(u){setUser(u);reload();}
  function handleLogout(){clearSession();removeReadingProgressStalePanels();setUser(null);}

  if(loading) return <div style={{minHeight:"100vh",background:C.dk,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column"}}><div style={{fontSize:"42px",marginBottom:"12px"}}>🎓</div><div style={{color:"#fff",fontSize:"16px",fontWeight:"700",fontFamily:F}}>EduQuiz</div><div style={{color:C.mu,fontSize:"12px",marginTop:"5px",fontFamily:F}}>Loading…</div></div>;

  // If opened via a quiz share link, ALWAYS show the quiz entry (guest), even if someone is logged in.
  if(directQuiz && !user) return <Landing onLogin={handleLogin} prefillQuiz={directQuiz}/>;
  if(directQuiz && user && user.role==="teacher"){
    // Teacher opened a student quiz link on their own device — let them choose
    return <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px",fontFamily:F}}>
      <div style={{fontSize:"42px",marginBottom:"10px"}}>🎓</div>
      <div style={{fontSize:"18px",fontWeight:"800",color:C.tx,marginBottom:"6px",textAlign:"center"}}>{directQuiz.title}</div>
      <div style={{fontSize:"13px",color:C.mu,marginBottom:"22px",textAlign:"center"}}>You're logged in as a teacher. This is a student quiz link.</div>
      <button onClick={()=>{setDirectQuiz(null);history.replaceState(null,"",location.pathname);}} style={{width:"100%",maxWidth:"320px",padding:"13px",background:C.p,color:"#fff",border:"none",borderRadius:"10px",fontWeight:"700",fontSize:"14px",cursor:"pointer",fontFamily:F,marginBottom:"10px"}}>Go to my Teacher Dashboard →</button>
      <button onClick={()=>{clearSession();removeReadingProgressStalePanels();setUser(null);}} style={{width:"100%",maxWidth:"320px",padding:"13px",background:"#fff",color:C.p,border:"2px solid "+C.p,borderRadius:"10px",fontWeight:"700",fontSize:"14px",cursor:"pointer",fontFamily:F}}>👁 Open quiz as a student (test it)</button>
    </div>;
  }
  if(directQuiz && user && user.role==="student"){
    // Student logged in with a quiz link - take them straight to the quiz (handled in StudentApp via directQuiz)
  }
  if(!user||!data) return <Landing onLogin={handleLogin} prefillQuiz={directQuiz}/>;

  // Banner shown when a teacher is viewing as a student
  const parkedBanner = parkedTeacher ? (
    <div style={{background:"#f59e0b",color:"#fff",padding:"8px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",fontFamily:F,flexShrink:0}}>
      <span style={{fontSize:"12px",fontWeight:"600"}}>👁 Viewing as student: {user.name}</span>
      <button onClick={backToTeacher} style={{background:"#fff",color:"#92400e",border:"none",borderRadius:"7px",padding:"5px 12px",fontWeight:"700",fontSize:"12px",cursor:"pointer",fontFamily:F}}>← Back to Teacher</button>
    </div>
  ) : null;

  if(user.role==="teacher") return <TeacherApp user={user} data={data} onLogout={handleLogout} reload={reload} viewAsStudent={viewAsStudent}/>;
  return <div style={{height:"100vh",display:"flex",flexDirection:"column"}}>{parkedBanner}<div style={{flex:1,minHeight:0}}><StudentApp user={user} data={data} onLogout={parkedTeacher?backToTeacher:handleLogout} reload={reload} directQuiz={directQuiz} clearDirect={()=>{setDirectQuiz(null);history.replaceState(null,"",location.pathname);}}/></div></div>;
}

<script>
// ===== READING PROGRESS V11 INDEXEDDB STORAGE FIX =====
(function(){
  const RP_KEY = "rp_attempt_records_v11";
  const OLD_KEYS = ["rp_attempt_records_v10","rp_attempt_records_v9","rp_attempt_records_v8","rp_attempt_records_v7"];
  const API_KEY = "rp_openai_api_key";
  const DB_NAME = "EduQuizRP_AudioDB";
  const STORE = "audios";
  let panelMade = false;

  function readJSON(k,f){ try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f));}catch(e){return f;} }
  function writeJSON(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
  function records(){
    let cur = readJSON(RP_KEY, null);
    if(Array.isArray(cur)) return cur;
    for(const k of OLD_KEYS){
      let old = readJSON(k, null);
      if(Array.isArray(old)){ writeJSON(RP_KEY, old); return old; }
    }
    writeJSON(RP_KEY, []);
    return [];
  }
  function saveRecords(a){ writeJSON(RP_KEY,a); }

  function openDB(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:"id"});
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function saveAudio(blob){
    const db = await openDB();
    const id = "aud_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const item = {id, blob, type:blob.type||"audio/webm", size:blob.size, createdAt:new Date().toISOString()};
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,"readwrite");
      tx.objectStore(STORE).put(item);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    return item;
  }
  async function getAudio(id){
    if(!id) return null;
    const db = await openDB();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,"readonly");
      const req = tx.objectStore(STORE).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  function session(){ try{return JSON.parse(localStorage.getItem("eq_session")||"null")||{};}catch(e){return{};} }
  function user(){
    const u=session();
    return {
      id:String(u.id||u.studentId||u.ID||u.number||u.studentNumber||u.name||"unknown").trim(),
      name:String(u.name||u.fullName||u.studentName||u.id||"Student").trim(),
      className:String(u.className||u.classId||u.class||u.grade||"Unassigned").trim(),
      role:String(u.role||u.type||"").toLowerCase()
    };
  }
  function isTeacher(){
    const u=user(), b=document.body.innerText||"";
    return u.role.includes("teacher") || b.includes("TEACHER DASHBOARD") || b.includes("Teacher Dashboard") || b.includes("+ Quiz");
  }
  function taskId(){return "reading-progress-task-1";}
  function latest(studentId){ const a=records().filter(r=>r.studentId===studentId&&r.taskId===taskId()); return a.length?a[a.length-1]:null; }
  function canSubmit(studentId){ return true; }
  
  // ERROR-AWARE SCORING ACTIVE: missing and extra words reduce final score.
  function rpScoreWords(s){
    return String(s||"")
      .toLowerCase()
      .replace(/[^\w\s']/g," ")
      .replace(/\s+/g," ")
      .trim()
      .split(" ")
      .filter(Boolean);
  }

  function rpDefaultReferenceText(){
    return "Reading every day helps students learn new words. A good reader stops, thinks, and tries again when a sentence is difficult. Students can improve their fluency by practicing short texts many times.";
  }

  function rpErrorStats(r){
    const ref = rpScoreWords(r.referenceText || r.taskText || rpDefaultReferenceText());
    const hyp = rpScoreWords(r.transcript || "");
    const used = Array(hyp.length).fill(false);
    let correct = 0;
    let missing = 0;
    let repeated = 0;
    let extra = 0;

    ref.forEach(w=>{
      const i = hyp.findIndex((x,j)=>!used[j] && x===w);
      if(i >= 0){
        used[i] = true;
        correct++;
        if(i>0 && hyp[i-1]===w) repeated++;
      }else{
        missing++;
      }
    });

    hyp.forEach((w,i)=>{
      if(!used[i]){
        if(i>0 && hyp[i-1]===w) repeated++;
        else extra++;
      }
    });

    const totalRef = Math.max(1, ref.length);
    const severeErrors = missing + extra;
    const errorRatio = severeErrors / totalRef;

    return {correct, missing, extra, repeated, totalRef, severeErrors, errorRatio};
  }

function rpBalancedScore(r){
    const acc = Number(r.accuracy);
    const flu = Number(r.fluency);
    const wcpm = Number(r.wcpm);
    const es = rpErrorStats(r);
    if(!Number.isFinite(acc) && !Number.isFinite(flu) && !Number.isFinite(wcpm) && !r.transcript) return "";
    const speedSetting = r.speedSetting || "reduced";
    const difficulty = r.difficulty || "intermediate";
    const speedScore = Number.isFinite(wcpm) ? Math.min(100, Math.round((wcpm / 130) * 100)) : 0;
    let base;
    if(speedSetting === "excluded"){
      const vals = [acc, flu].filter(Number.isFinite);
      base = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0) / vals.length) : (Number.isFinite(acc)?acc:0);
    }else if(speedSetting === "normal"){
      base = Math.round((Number.isFinite(acc)?acc*.65:0)+(Number.isFinite(flu)?flu*.25:0)+(Number.isFinite(speedScore)?speedScore*.10:0));
    }else{
      base = Math.round((Number.isFinite(acc)?acc*.75:0)+(Number.isFinite(flu)?flu*.22:0)+(Number.isFinite(speedScore)?speedScore*.03:0));
    }
    let score = Math.round(base - es.missing*.75 - es.extra*.60 - es.repeated*.35);
    let cap = 100;
    if(es.errorRatio >= .80) cap = 35;
    else if(es.errorRatio >= .70) cap = 38;
    else if(es.errorRatio >= .60) cap = 42;
    else if(es.errorRatio >= .50) cap = 48;
    else if(es.errorRatio >= .40) cap = 55;
    else if(es.errorRatio >= .30) cap = 65;
    if(Number.isFinite(acc)){
      if(acc < 15) cap = Math.min(cap, 15);
      else if(acc < 25) cap = Math.min(cap, 22);
      else if(acc < 35) cap = Math.min(cap, 30);
      else if(acc < 45) cap = Math.min(cap, 38);
      else if(acc < 55) cap = Math.min(cap, 46);
      else if(acc < 65 && es.errorRatio >= .35) cap = Math.min(cap, 35);
    }
    score = Math.min(score, cap);
    if(difficulty === "beginner") score += 10;
    if(difficulty === "advanced") score -= 10;
    if(speedSetting === "excluded") score += 5;
    if(speedSetting === "normal" && Number.isFinite(wcpm) && wcpm < 45) score -= 5;
    return Math.max(0, Math.min(100, Math.round(score)));
  }

  function finalScore(r){
    const manual = Number(r.teacherScore);
    if(Number.isFinite(manual) && manual > 0) return Math.max(0, Math.min(100, Math.round(manual)));
    return rpBalancedScore(r);
  }

  function difficultyBonus(r){
    const difficulty = r.difficulty || "intermediate";
    const acc = Number(r.accuracy);
    if(difficulty === "beginner"){
      if(Number.isFinite(acc) && acc < 35) return 1;
      if(Number.isFinite(acc) && acc < 50) return 2;
      return 3;
    }
    if(difficulty === "intermediate"){
      if(Number.isFinite(acc) && acc < 35) return 0;
      return 1;
    }
    return 0;
  }

  function adjustedAccuracy(r){
    const acc = Number(r.accuracy);
    if(!Number.isFinite(acc)) return "";

    const es = rpErrorStats(r);
    let out = Math.round(
      acc + difficultyBonus(r) -
      (es.missing * 1.20) -
      (es.extra * 0.90) -
      (es.repeated * 0.40)
    );

    if(es.errorRatio >= 0.75) out = Math.min(out, 18);
    else if(es.errorRatio >= 0.60) out = Math.min(out, 25);
    else if(es.errorRatio >= 0.45) out = Math.min(out, 32);
    else if(es.errorRatio >= 0.35) out = Math.min(out, 40);

    if(acc < 15) out = Math.min(out, 12);
    else if(acc < 25) out = Math.min(out, 20);
    else if(acc < 35) out = Math.min(out, 28);
    else if(acc < 45) out = Math.min(out, 36);
    else if(acc < 55) out = Math.min(out, 45);

    return Math.max(0, Math.min(100, out));
  }

  function adjustedFluency(r){
    const flu = Number(r.fluency);
    const wcpm = Number(r.wcpm);
    const acc = Number(r.accuracy);
    if(!Number.isFinite(flu) && !Number.isFinite(wcpm)) return "";

    const speedSetting = r.speedSetting || "reduced";
    const speedScore = Number.isFinite(wcpm) ? Math.min(100, Math.round((wcpm / 130) * 100)) : flu;
    const es = rpErrorStats(r);

    let base;
    if(speedSetting === "excluded"){
      base = Number.isFinite(flu) ? flu : speedScore;
    }else if(speedSetting === "normal"){
      base = Math.round(
        (Number.isFinite(flu) ? flu * 0.85 : 0) +
        (Number.isFinite(speedScore) ? speedScore * 0.15 : 0)
      );
    }else{
      base = Math.round(
        (Number.isFinite(flu) ? flu * 0.95 : 0) +
        (Number.isFinite(speedScore) ? speedScore * 0.05 : 0)
      );
    }

    const difficulty = r.difficulty || "intermediate";
    const bonus = difficulty === "beginner" ? 2 : difficulty === "intermediate" ? 1 : 0;

    let out = Math.round(
      base + bonus -
      (es.missing * 0.90) -
      (es.extra * 0.65) -
      (es.repeated * 0.35)
    );

    if(es.errorRatio >= 0.75) out = Math.min(out, 20);
    else if(es.errorRatio >= 0.60) out = Math.min(out, 28);
    else if(es.errorRatio >= 0.45) out = Math.min(out, 36);
    else if(es.errorRatio >= 0.35) out = Math.min(out, 42);

    if(Number.isFinite(acc)){
      if(acc < 15) out = Math.min(out, 18);
      else if(acc < 25) out = Math.min(out, 25);
      else if(acc < 35) out = Math.min(out, 33);
      else if(acc < 45) out = Math.min(out, 42);
      else if(acc < 55) out = Math.min(out, 52);
    }

    return Math.max(0, Math.min(100, out));
  }

  function escapeHtmlRP(s){
    return String(s||"").replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function cleanRP(s){
    return String(s||"").toLowerCase().replace(/[^\w\s']/g," ").replace(/\s+/g," ").trim().split(" ").filter(Boolean);
  }

  function coloredWordAnalysis(transcript){
    if(!transcript) return "";
    const ref = cleanRP(referenceText());
    const hyp = cleanRP(transcript);
    const used = Array(hyp.length).fill(false);
    const out = [];
    const extra = [];
    const repeated = [];
    let correct = 0, missing = 0;

    ref.forEach(w=>{
      const i = hyp.findIndex((x,j)=>!used[j] && x===w);
      if(i >= 0){
        used[i] = true;
        correct++;
        const rep = i>0 && hyp[i-1]===w;
        if(rep) repeated.push(w);
        out.push(`<span title="correct" style="display:inline-block;margin:2px;padding:2px 6px;border-radius:7px;background:${rep?"#ede9fe":"#dcfce7"};color:${rep?"#6d28d9":"#166534"};font-weight:700">${escapeHtmlRP(w)}</span>`);
      }else{
        missing++;
        out.push(`<span title="missing" style="display:inline-block;margin:2px;padding:2px 6px;border-radius:7px;background:#ffedd5;color:#c2410c;text-decoration:line-through;font-weight:700">${escapeHtmlRP(w)}</span>`);
      }
    });

    hyp.forEach((w,i)=>{
      if(!used[i]){
        if(i>0 && hyp[i-1]===w) repeated.push(w);
        else extra.push(w);
      }
    });

    let html = `<div style="line-height:2">${out.join(" ")}</div>`;
    if(extra.length){
      html += `<div style="margin-top:8px"><b style="color:#991b1b">Extra / wrong words:</b> ` + extra.map(w=>`<span style="display:inline-block;margin:2px;padding:2px 6px;border-radius:7px;background:#fee2e2;color:#991b1b;font-weight:700">${escapeHtmlRP(w)}</span>`).join(" ") + `</div>`;
    }
    if(repeated.length){
      html += `<div style="margin-top:6px"><b style="color:#6d28d9">Repeated words:</b> ` + [...new Set(repeated)].map(w=>`<span style="display:inline-block;margin:2px;padding:2px 6px;border-radius:7px;background:#ede9fe;color:#6d28d9;font-weight:700">${escapeHtmlRP(w)}</span>`).join(" ") + `</div>`;
    }
    html += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px">
      <span style="padding:5px 8px;border-radius:10px;background:#dcfce7;color:#166534;font-weight:800">Correct: ${correct}</span>
      <span style="padding:5px 8px;border-radius:10px;background:#ffedd5;color:#c2410c;font-weight:800">Missing: ${missing}</span>
      <span style="padding:5px 8px;border-radius:10px;background:#fee2e2;color:#991b1b;font-weight:800">Extra/Wrong: ${extra.length}</span>
      <span style="padding:5px 8px;border-radius:10px;background:#ede9fe;color:#6d28d9;font-weight:800">Repeated: ${repeated.length}</span>
    </div>`;
    return html;
  }

      const mr = new Original(stream, opts);

  async function transcribe(audioId){
    const key=getKey();
    if(!key) throw new Error("Add OpenAI API Key first.");
    const item=await getAudio(audioId);
    if(!item||!item.blob) throw new Error("Audio file not found. Allow retake and ask student to submit again.");
    const file = new File([item.blob], "student-reading.webm", {type:item.type||"audio/webm"});
    const form=new FormData();
    form.append("file",file);
    form.append("model","whisper-1");
    form.append("language","en");
    form.append("response_format","json");
    const resp=await fetch("https://api.openai.com/v1/audio/transcriptions",{method:"POST",headers:{"Authorization":"Bearer "+key},body:form});
    if(!resp.ok){ const t=await resp.text(); throw new Error("OpenAI error "+resp.status+": "+t.slice(0,200)); }
    const data=await resp.json();
    return (data.text||"").trim();
  }
  function refText(){ return "Reading every day helps students learn new words. A good reader stops, thinks, and tries again when a sentence is difficult. Students can improve their fluency by practicing short texts many times."; }
  function score(ref,spoken,seconds=60){
    const clean=s=>String(s||"").toLowerCase().replace(/[^\w\s']/g," ").replace(/\s+/g," ").trim();
    const a=clean(ref).split(" ").filter(Boolean), b=clean(spoken).split(" ").filter(Boolean);
    let correct=0, used=Array(b.length).fill(false);
    a.forEach(w=>{ const i=b.findIndex((x,j)=>!used[j]&&x===w); if(i>=0){correct++;used[i]=true;}});
    const missing=Math.max(0,a.length-correct), extra=Math.max(0,b.length-correct), repeated=b.filter((w,i)=>i>0&&b[i-1]===w).length;
    const accuracy=a.length?Math.round(correct/a.length*100):0;
    const wcpm=Math.round(correct/Math.max(seconds/60,.25));
    const fluency=Math.max(0,Math.min(100,Math.round(accuracy*.7+Math.min(wcpm,140)/140*100*.3-repeated*2)));
    return {accuracy,wcpm,fluency,mistakes:missing+extra+repeated,missing,extra,repeated,aiScore:accuracy,analysisStatus:"Completed"};
  }
  async function analyzeOne(id,silent=false){

    try{

      updateRecord(id,{...res,transcript:text});
      if(!silent) alert("تم التحليل من التسجيل نفسه. Final: "+finalScore(res)+"%");
    }catch(err){
      updateRecord(id,{analysisStatus:"Failed: "+err.message});
      if(!silent) alert("فشل التحليل: "+err.message);
    }
    await renderCards();
  }

      const item=r.audioId?await getAudio(r.audioId):null;
      const url=item&&item.blob?URL.createObjectURL(item.blob):"";
      out+=`<div style="border:1px solid #e2e8f0;border-radius:16px;padding:12px;background:#fff;box-shadow:0 4px 12px rgba(15,23,42,.06)"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px"><div><div style="font-size:18px;font-weight:900;color:#1e293b">${r.studentName||"Student"}</div><div style="color:#64748b;font-size:13px">${r.studentId||""} · ${r.className||""}</div></div><div style="font-size:22px;font-weight:900;color:#2563eb">${finalScore(r)===""?"-":finalScore(r)+"%"}</div></div><div style="display:grid;grid-template-columns:1fr;gap:8px"><div style="padding:9px;border-radius:12px;background:#f8fafc"><b>Status:</b> ${r.status||"submitted"} · <b>Analysis:</b> ${r.analysisStatus||"Pending"}</div><div style="padding:9px;border-radius:12px;background:#f8fafc"><b>Audio Recording:</b> <span style="color:${url?"#166534":"#dc2626"};font-weight:800">${url?fmt(item.size)+" · "+(item.type||"audio"):"No audio attached"}</span>${url?`<audio controls src="${url}" style="width:100%;margin-top:6px"></audio>`:`<div style="color:#dc2626;font-weight:800;margin-top:6px">No audio attached</div>`}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><div style="padding:8px 10px;border-radius:12px;background:#eff6ff;color:#1d4ed8;font-weight:800">Official: ${finalScore(r)===""?"-":finalScore(r)+"%"}</div><div style="padding:8px 10px;border-radius:12px;background:#dbeafe;color:#1d4ed8;font-weight:800">Official Acc: ${adjustedAccuracy(r)===""?"-":adjustedAccuracy(r)+"%"}</div><div style="padding:8px 10px;border-radius:12px;background:#fff7ed;color:#9a3412;font-weight:800">Official Fluency: ${adjustedFluency(r)===""?"-":adjustedFluency(r)+"%"}</div><div style="padding:8px 10px;border-radius:12px;background:#f8fafc;color:#64748b;font-weight:800">Raw Acc: ${r.accuracy||"-"}</div><div style="padding:8px 10px;border-radius:12px;background:#f8fafc;color:#64748b;font-weight:800">Raw Fluency: ${r.fluency||"-"}</div><div style="padding:8px 10px;border-radius:12px;background:#ecfdf5;color:#166534;font-weight:800">WCPM: ${r.wcpm||"-"}</div><div style="padding:8px 10px;border-radius:12px;background:#fef2f2;color:#991b1b;font-weight:800">Mistakes: ${r.mistakes||"-"}</div><div style="padding:8px 10px;border-radius:12px;background:#fff1f2;color:#9f1239;font-weight:800">Missing+Extra: ${rpErrorStats(r).missing + rpErrorStats(r).extra}</div></div>${r.transcript?`<div style="padding:9px;border-radius:12px;background:#f8fafc;color:#334155"><b>Transcript:</b><br>${r.transcript}</div>`:""}
            ${r.transcript?`<div style="padding:10px;border-radius:12px;background:#fff;border:1px solid #e2e8f0;color:#334155"><b>Colored Word Feedback</b><div style="font-size:12px;color:#64748b;margin:4px 0">Green = correct · Orange = missing · Red = extra/wrong · Purple = repeated</div>${coloredWordAnalysis(r.transcript)}</div>`:""}<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input data-score="${r.id}" value="${r.teacherScore||""}" placeholder="Teacher score optional" style="flex:1;min-width:150px;padding:10px;border:1px solid #cbd5e1;border-radius:10px"><input data-notes="${r.id}" value="${r.teacherNotes||""}" placeholder="Notes optional" style="flex:2;min-width:180px;padding:10px;border:1px solid #cbd5e1;border-radius:10px"></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select data-difficulty="${r.id}" style="flex:1;min-width:150px;padding:10px;border:1px solid #cbd5e1;border-radius:10px"><option value="">Difficulty</option><option value="beginner" ${r.difficulty==="beginner"?"selected":""}>Beginner</option><option value="intermediate" ${r.difficulty==="intermediate"?"selected":""}>Intermediate</option><option value="advanced" ${r.difficulty==="advanced"?"selected":""}>Advanced</option></select><select data-speed-setting="${r.id}" style="flex:1;min-width:150px;padding:10px;border:1px solid #cbd5e1;border-radius:10px"><option value="">Speed Weight</option><option value="normal" ${r.speedSetting==="normal"?"selected":""}>Speed Normal</option><option value="reduced" ${r.speedSetting==="reduced"?"selected":""}>Speed Reduced</option><option value="excluded" ${r.speedSetting==="excluded"?"selected":""}>Exclude Speed</option></select></div><div style="font-size:12px;color:#64748b;margin-top:-2px">Beginner changes the official score immediately. Intermediate is normal. Advanced is strict.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" data-analyze="${r.id}" style="padding:10px 12px;border:0;border-radius:10px;background:#7c3aed;color:white;font-weight:800">Analyze Saved Recording</button><button type="button" data-id="${r.id}" data-status="accepted" style="padding:10px 12px;border:0;border-radius:10px;background:#16a34a;color:white;font-weight:800">Accept</button><button type="button" data-id="${r.id}" data-status="retake_allowed" style="padding:10px 12px;border:0;border-radius:10px;background:#f59e0b;color:white;font-weight:800">Allow Retake</button><button type="button" data-id="${r.id}" data-status="rejected" style="padding:10px 12px;border:0;border-radius:10px;background:#dc2626;color:white;font-weight:800">Reject</button><button type="button" data-delete-attempt="${r.id}" style="padding:10px 12px;border:0;border-radius:10px;background:#475569;color:white;font-weight:800">Delete</button></div></div></div>`;
    }
    cards.innerHTML=out;
  }

  function studentStatus(){
    const box=document.getElementById("rp-v11-student-status");
    const txt=document.body.innerText||"";
    const loginVisible=txt.includes("EduQuiz")&&txt.includes("دخول")&&!txt.includes("STUDENT DASHBOARD")&&!txt.includes("TEACHER DASHBOARD");
    if(isTeacher() || loginVisible || !txt.includes("Reading Progress")){
      if(box) box.remove();
      return;
    }
    const u=user(), ok=canSubmit(u.id);
    let b=box;
    if(!b){
      b=document.createElement("div");
      b.id="rp-v11-student-status";
      b.style.cssText="margin:10px 24px;padding:10px;border-radius:12px;font-family:system-ui;font-weight:800";
      (document.getElementById("root")||document.body).appendChild(b);
    }
    b.textContent=ok?"Reading Progress: You can submit one recording.":"Reading Progress: Wait for teacher retake permission.";
    b.style.background=ok?"#eff6ff":"#fff7ed";
    b.style.color=ok?"#1d4ed8":"#9a3412";
  }

  setTimeout(()=>{teacherPanel();studentStatus();},1000);
  setInterval(()=>{if(!panelMade)teacherPanel();studentStatus();},4000);
})();
 // ===== END READING PROGRESS V11 INDEXEDDB STORAGE FIX =====
</script>




<script>
// ===== RP Logout Cleanup Guard =====
(function(){
  function session(){try{return JSON.parse(localStorage.getItem("eq_session")||"null")||null;}catch(e){return null;}}
  function removeOldReadingPanels(){["rp-student-practice-panel","rp-student-progress-panel","rp-v11-student-status","rp-v11-show"].forEach(id=>{const el=document.getElementById(id);if(el)el.remove();});document.querySelectorAll("[data-rp-floating='1']").forEach(el=>el.remove());}
  function isLoginScreen(){const txt=document.body.innerText||"";const s=session();return !s || (txt.includes("EduQuiz")&&txt.includes("دخول")&&!txt.includes("STUDENT DASHBOARD")&&!txt.includes("TEACHER DASHBOARD"));}
  function isTeacherScreen(){const txt=document.body.innerText||"";const s=session()||{};return String(s.role||s.type||"").toLowerCase().includes("teacher")||txt.includes("TEACHER DASHBOARD");}
  function isWrongPage(){const txt=document.body.innerText||"";return txt.includes("Skill Breakdown")||txt.includes("Back to Quizzes")||(!txt.includes("Reading Progress")&&!txt.includes("Record your reading"));}

  function removeLoginOnlyReadingPanels(){
    if(isLoginScreen()){
      const p=document.getElementById("rp-v11-panel");
      if(p) p.remove();
      const s=document.getElementById("rp-v11-show");
      if(s) s.remove();
    }
  }

  function guard(){if(isLoginScreen()||isTeacherScreen()||isWrongPage())removeOldReadingPanels();}
  window.addEventListener("click",()=>setTimeout(guard,80),true);window.addEventListener("hashchange",guard);setInterval(guard,350);setTimeout(guard,100);
})();
 // ===== END RP Logout Cleanup Guard =====
</script>
