// ── TEACHER APP ───────────────────────────────────────────────
function TeacherApp({user, data, onLogout, reload, viewAsStudent}) {
  const [tab,setTab]=useState("overview"),[view,setView]=useState(null),[selQuiz,setSelQuiz]=useState(null);
  const [noteModal,setNoteModal]=useState(null),[noteText,setNoteText]=useState(""),[annModal,setAnnModal]=useState(false),[ann,setAnn]=useState({title:"",text:"",classIds:[]});
  const [attemptsModal,setAttemptsModal]=useState(null);
  const [profileOpen,setProfileOpen]=useState(false);
  const [viewAsOpen,setViewAsOpen]=useState(false);
  const [editingQuiz,setEditingQuiz]=useState(null);
  const [importMsg,setImportMsg]=useState("");
  const [editStu,setEditStu]=useState(null);
  const [gbClass,setGbClass]=useState("all");
  const [esForm,setEsForm]=useState({name:"",studentId:"",classId:"",password:"",fatherName:""});
  const [esMsg,setEsMsg]=useState("");
  const stuFileRef = useRef();
  const [resumeAfterEdit,setResumeAfterEdit]=useState(false);
  const [clsModal,setClsModal]=useState(false),[newCls,setNewCls]=useState({name:"",grade:""}),[search,setSearch]=useState(""),[sortBy,setSortBy]=useState("name"),[filterCls,setFilterCls]=useState("all");
  const [shareModal,setShareModal]=useState(null);

  const myQuizzes=data.quizzes.filter(q=>q.teacherId===user.id);
  const myClasses=data.classes.filter(c=>c.teacherIds&&c.teacherIds.includes(user.id));
  const myStudents=data.users.filter(u=>u.role==="student"&&(myClasses.some(c=>c.id===u.classId)||!u.classId));
  const myResps=data.responses.filter(r=>myQuizzes.some(q=>q.id===r.quizId));
  const flags=myStudents.filter(s=>{const rs=data.responses.filter(r=>r.studentId===s.id);return calcSkills(rs,data.quizzes).filter(sk=>sk.score<50&&sk.total>=2).length>=2;});
  const sorted=[...myStudents].filter(s=>(filterCls==="all"||s.classId===filterCls)&&(!search||s.name.toLowerCase().includes(search.toLowerCase())||s.studentId.includes(search))).sort((a,b)=>{
    if(sortBy==="name")return a.name.localeCompare(b.name);if(sortBy==="id")return a.studentId.localeCompare(b.studentId);if(sortBy==="class")return (a.classId||"").localeCompare(b.classId||"");
    const ra=data.responses.filter(r=>r.studentId===a.id&&myQuizzes.some(q=>q.id===r.quizId)),rb=data.responses.filter(r=>r.studentId===b.id&&myQuizzes.some(q=>q.id===r.quizId));
    return (rb.length?Math.round(rb.reduce((s,r)=>s+pct(r.score,r.totalQ),0)/rb.length):0)-(ra.length?Math.round(ra.reduce((s,r)=>s+pct(r.score,r.totalQ),0)/ra.length):0);
  });

  async function saveQuiz(q){await fsSet("quizzes",q.id,q);await reload();setView(null);}
  // Auto-pause: close the quiz before editing so no new students start mid-change
  async function startEditQuiz(quiz){
    const wasOpen = quiz.status!=="closed";
    if(wasOpen){ await fsSet("quizzes",quiz.id,{...quiz,status:"closed"}); await reload(); }
    setResumeAfterEdit(wasOpen);
    setEditingQuiz({...quiz,status:wasOpen?"closed":quiz.status});
    setView("edit");
  }
  // On save while editing: reopen the quiz if it was open before editing
  async function saveEditedQuiz(q){
    const finalStatus = resumeAfterEdit ? "open" : q.status;
    await fsSet("quizzes",q.id,{...q,status:finalStatus});
    await reload();
    setView(null); setEditingQuiz(null); setResumeAfterEdit(false);
  }
  function cancelEdit(){
    // If we auto-closed it, reopen it on cancel too
    (async()=>{ if(resumeAfterEdit&&editingQuiz){ await fsSet("quizzes",editingQuiz.id,{...editingQuiz,status:"open"}); await reload(); } setView(null); setEditingQuiz(null); setResumeAfterEdit(false); })();
  }
  async function delQuiz(id){if(!confirm("Delete this quiz?"))return;await fsDel("quizzes",id);await reload();}
  async function delResponse(rid, studentName){if(!confirm("Delete this attempt by "+studentName+"? This will update their progress and mastery."))return;await fsDel("responses",rid);await reload();}
  async function toggleQuiz(quiz){await fsSet("quizzes",quiz.id,{...quiz,status:quiz.status==="closed"?"open":"closed"});await reload();}
  async function saveNote(){const ex=data.notes.find(n=>n.teacherId===user.id&&n.studentId===noteModal.id);const id=ex?ex.id:uid();await fsSet("notes",id,{id,teacherId:user.id,studentId:noteModal.id,note:noteText,updatedAt:today()});await reload();setNoteModal(null);}
  async function postAnn(){const id=uid();await fsSet("announcements",id,{id,teacherId:user.id,...ann,createdAt:today()});await reload();setAnnModal(false);setAnn({title:"",text:"",classIds:[]});}
  // ── IMPORT STUDENTS FROM EXCEL/CSV ──
  async function importStudents(e){
    const file=e.target.files[0]; if(e.target)e.target.value="";
    if(!file) return;
    setImportMsg("Reading file…");
    try {
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(new Uint8Array(buf),{type:"array"});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
      if(!rows.length){setImportMsg("File is empty.");return;}
      // Detect header columns
      const hdr=rows[0].map(c=>String(c||"").trim().toLowerCase());
      let ci={name:-1,id:-1,cls:-1,email:-1};
      hdr.forEach((h,i)=>{
        if(ci.name<0&&(h==="name"||h.includes("student name")||h.includes("full name")||h==="اسم"||h.includes("الاسم"))) ci.name=i;
        else if(ci.id<0&&(h==="id"||h.includes("student id")||h.includes("number")||h.includes("رقم")||h.includes("هوية"))) ci.id=i;
        else if(ci.cls<0&&(h==="class"||h.includes("class")||h.includes("grade")||h.includes("صف")||h.includes("فصل"))) ci.cls=i;
        else if(ci.email<0&&h.includes("email")) ci.email=i;
      });
      const hasHeader=ci.name>=0||ci.id>=0;
      if(!hasHeader){ci={name:0,id:1,cls:2,email:-1};}
      const dataRows=rows.slice(hasHeader?1:0);
      const existing=await fsAll("users");
      let added=0,skipped=0,dupe=0;
      const myClassList=data.classes.filter(c=>(c.teacherIds||[]).includes(user.id));
      for(const r of dataRows){
        const name=String(r[ci.name]||"").trim();
        const sid=String(r[ci.id]||"").trim();
        if(!name||!sid){skipped++;continue;}
        if(existing.find(u=>(u.studentId||"")===sid)){dupe++;continue;}
        // Match class by name if provided
        let classId="";
        if(ci.cls>=0){const cn=String(r[ci.cls]||"").trim().toLowerCase();const mc=myClassList.find(c=>c.name.toLowerCase()===cn||((c.grade||"").toLowerCase()===cn));if(mc)classId=mc.id;}
        const email=ci.email>=0?String(r[ci.email]||"").trim().toLowerCase():"";
        const nu={id:uid(),role:"student",name,studentId:sid,classId,email,password:"",createdAt:today()};
        await fsSet("users",nu.id,nu);
        existing.push(nu); added++;
      }
      await reload();
      setImportMsg("✅ Added "+added+" students."+(dupe?" Skipped "+dupe+" already existing.":"")+(skipped?" Skipped "+skipped+" rows missing name/ID.":""));
    } catch(err){ setImportMsg("Error: "+(err.message||err)); }
  }

  // ── EXPORT GRADEBOOK (grid: students x quizzes) ──
  function exportGradebook(){
    const qs = myQuizzes;
    const studs = (gbClass==="all"?myStudents:myStudents.filter(s=>s.classId===gbClass));
    const header=["Student Name","Student ID","Class",...qs.map(q=>q.title),"Average %"];
    const rows=[header];
    studs.forEach(s=>{
      const cls=data.classes.find(c=>c.id===s.classId);
      const row=[s.name,s.studentId||"",cls?.name||""];
      let sum=0,cnt=0;
      qs.forEach(q=>{
        const rs=data.responses.filter(r=>r.studentId===s.id&&r.quizId===q.id);
        if(rs.length){ const best=Math.max(...rs.map(r=>pct(r.score,r.totalQ))); row.push(best); sum+=best; cnt++; }
        else row.push("");
      });
      row.push(cnt?Math.round(sum/cnt):"");
      rows.push(row);
    });
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:22},{wch:12},{wch:12},...qs.map(()=>({wch:14})),{wch:10}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Gradebook");
    XLSX.writeFile(wb,"EduQuiz_Gradebook_"+new Date().toISOString().slice(0,10)+".xlsx");
  }

  // ── EXPORT RESULTS TO EXCEL ──
  function exportResults(){
    const rows=[["Student Name","Student ID","Class","Quiz","Type","Mode","Score","Total","Percent","Attempt","Date"]];
    const myResp=data.responses.filter(r=>myQuizzes.some(q=>q.id===r.quizId));
    myResp.sort((a,b)=>(b.ts||0)-(a.ts||0));
    myResp.forEach(r=>{
      const st=data.users.find(u=>u.id===r.studentId);
      const quiz=myQuizzes.find(q=>q.id===r.quizId);
      const cls=data.classes.find(c=>c.id===(st?.classId));
      rows.push([st?.name||"?",st?.studentId||"",cls?.name||"",quiz?.title||"",quiz?.type||"",r.mode||"normal",r.score,r.totalQ,pct(r.score,r.totalQ)+"%",r.attempt||1,r.completedAt||""]);
    });
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:20},{wch:12},{wch:12},{wch:24},{wch:10},{wch:8},{wch:7},{wch:7},{wch:9},{wch:8},{wch:18}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Results");
    XLSX.writeFile(wb,"EduQuiz_Results_"+new Date().toISOString().slice(0,10)+".xlsx");
  }

  async function saveEditStudent(){
    setEsMsg("");
    if(!esForm.name.trim()||!esForm.studentId.trim()){setEsMsg("Name and ID are required.");return;}
    const all=await fsAll("users");
    if(all.find(u=>u.id!==editStu.id && (u.studentId||"")===esForm.studentId.trim())){setEsMsg("That Student ID is used by another student.");return;}
    const updated={...editStu,name:esForm.name.trim(),studentId:esForm.studentId.trim(),classId:esForm.classId,fatherName:esForm.fatherName.trim()};
    if(esForm.password.trim()) updated.password=esForm.password.trim();
    await fsSet("users",editStu.id,updated);
    await reload();
    setEsMsg("✅ Saved!");
    setTimeout(()=>setEditStu(null),700);
  }
  async function createCls(){if(!newCls.name.trim())return;const id=uid();await fsSet("classes",id,{id,name:newCls.name.trim(),grade:newCls.grade.trim(),teacherIds:[user.id],createdAt:today()});await reload();setClsModal(false);setNewCls({name:"",grade:""});}

  function quizLink(quiz){
    // Use a saved site URL if the teacher set one, otherwise current page URL
    let base = "";
    try { base = localStorage.getItem("eq_siteurl") || ""; } catch(e){}
    if (!base) {
      base = location.origin + location.pathname;
    }
    // Clean up: remove trailing slash, remove any query/hash
    base = base.split("?")[0].split("#")[0].replace(/\/$/, "");
    return base + "?quiz=" + quiz.code;
  }

  if(view==="create")return <CreateQuiz teacher={user} classes={data.classes} students={myStudents} onSave={saveQuiz} onBack={()=>setView(null)}/>;
  if(view==="edit")return <CreateQuiz teacher={user} classes={data.classes} students={myStudents} editQuiz={editingQuiz} onSave={saveEditedQuiz} onBack={cancelEdit}/>;
  const tabs=[{id:"overview",icon:"📊",label:"Overview"},{id:"quizzes",icon:"📋",label:"Quizzes"},{id:"gradebook",icon:"📒",label:"Gradebook"},{id:"classes",icon:"🏫",label:"Classes"},{id:"students",icon:"👥",label:"Students"},{id:"heatmap",icon:"🌡️",label:"Heatmap"},{id:"announce",icon:"📣",label:"Announce"}];

  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",fontFamily:F,background:C.bg}}>
      <HDR title={user.name} sub="Teacher Dashboard" right={<><Btn size="sm" color={C.s} onClick={()=>setView("create")}>+ Quiz</Btn><Btn size="sm" color={C.w} onClick={()=>setViewAsOpen(true)}>👁</Btn><Btn size="sm" color={C.mu} onClick={()=>{if(confirm("Update to the latest version? The app will reload."))forceUpdate();}}>🔄</Btn><Btn size="sm" color={C.p} onClick={()=>setProfileOpen(true)}>⚙️</Btn><Btn size="sm" onClick={onLogout} color="#475569">Logout</Btn></>}/>
      <TabBar tabs={tabs} active={tab} onChange={setTab}/>
      <div style={{flex:1,overflowY:"auto"}}>
      <div style={{maxWidth:"880px",margin:"0 auto",padding:"14px"}}>
        {tab==="overview" && <div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"9px",marginBottom:"13px"}}>
            <Stat icon="📋" label="Quizzes" value={myQuizzes.length} color={C.p}/><Stat icon="👥" label="Students" value={myStudents.length} color={C.pu}/><Stat icon="📝" label="Submissions" value={myResps.length} color={C.s}/><Stat icon="🚨" label="Need Help" value={flags.length} color={C.d}/>
          </div>
          {flags.length>0 && <Card style={{marginBottom:"11px",border:"2px solid "+C.d,background:"#fef2f2"}}>
            <strong style={{color:"#991b1b",fontSize:"12px",display:"block",marginBottom:"7px",fontFamily:F}}>🚨 Students Needing Intervention</strong>
            {flags.map(s=><div key={s.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #fca5a5",fontSize:"12px",fontFamily:F}}><span style={{fontWeight:"700",color:C.tx}}>{s.name}</span><span style={{color:"#991b1b"}}>Below 50% in 2+ skills</span></div>)}
          </Card>}
          {myResps.length>0 && <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"11px"}}>
            <Card><strong style={{fontSize:"12px",color:C.tx,display:"block",marginBottom:"9px",fontFamily:F}}>📊 Score Distribution</strong>
              <ResponsiveContainer width="100%" height={150}><BarChart data={[{r:"0-49%",n:myResps.filter(r=>pct(r.score,r.totalQ)<50).length},{r:"50-69%",n:myResps.filter(r=>{const p=pct(r.score,r.totalQ);return p>=50&&p<70;}).length},{r:"70-89%",n:myResps.filter(r=>{const p=pct(r.score,r.totalQ);return p>=70&&p<90;}).length},{r:"90-100%",n:myResps.filter(r=>pct(r.score,r.totalQ)>=90).length}]} barSize={28}><XAxis dataKey="r" tick={{fontSize:9,fill:C.mu}} axisLine={false} tickLine={false}/><YAxis allowDecimals={false} tick={{fontSize:9,fill:C.mu}}/><Tooltip/><Bar dataKey="n" radius={[4,4,0,0]}>{[C.d,C.w,C.p,C.s].map((c,i)=><Cell key={i} fill={c}/>)}</Bar></BarChart></ResponsiveContainer>

// ── ROOT ──────────────────────────────────────────────────────
function App() {
  const [user,setUser]=useState(null);
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [directQuiz,setDirectQuiz]=useState(null);
  const [parkedTeacher,setParkedTeacher]=useState(null); // holds teacher while viewing as student

  async function reload(){const d=await loadAllData();setData(d);return d;}

  // Teacher taps "View as Student" -> pick a student to impersonate (view only their experience)
  function viewAsStudent(studentUser){ setParkedTeacher(user); setUser(studentUser); reload(); }
  function backToTeacher(){ if(parkedTeacher){ setUser(parkedTeacher); setParkedTeacher(null); reload(); } }

  useEffect(()=>{
    (async()=>{
      const d=await loadAllData();setData(d);
      // Check for ?quiz=CODE link
      const params=new URLSearchParams(location.search);
      const code=params.get("quiz");
      if(code){const q=d.quizzes.find(x=>x.code===code.toUpperCase());if(q)setDirectQuiz(q);}
      const sess=loadSession();
      if(sess){const u=d.users.find(x=>x.id===sess.id);if(u)setUser(u);else if(sess.id)setUser(sess);}
      setLoading(false);
    })();
  },[]);

  function handleLogin(u){setUser(u);reload();}
  function handleLogout(){clearSession();setUser(null);}

  if(loading) return <div style={{minHeight:"100vh",background:C.dk,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column"}}><div style={{fontSize:"42px",marginBottom:"12px"}}>🎓</div><div style={{color:"#fff",fontSize:"16px",fontWeight:"700",fontFamily:F}}>EduQuiz</div><div style={{color:C.mu,fontSize:"12px",marginTop:"5px",fontFamily:F}}>Loading…</div></div>;

  // If opened via a quiz share link, ALWAYS show the quiz entry (guest), even if someone is logged in.
  if(directQuiz && !user) return <Landing onLogin={handleLogin} prefillQuiz={directQuiz}/>;
  if(directQuiz && user && user.role==="teacher"){
    // Teacher opened a student quiz link on their own device — let them choose
    return <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px",fontFamily:F}}>
      <div style={{fontSize:"42px",marginBottom:"10px"}}>🎓</div>
      <div style={{fontSize:"18px",fontWeight:"800",color:C.tx,marginBottom:"6px",textAlign:"center"}}>{directQuiz.title}</div>
      <div style={{fontSize:"13px",color:C.mu,marginBottom:"22px",textAlign:"center"}}>You're logged in as a teacher. This is a student quiz link.</div>
      <button onClick={()=>{setDirectQuiz(null);history.replaceState(null,"",location.pathname);}} style={{width:"100%",maxWidth:"320px",padding:"13px",background:C.p,color:"#fff",border:"none",borderRadius:"10px",fontWeight:"700",fontSize:"14px",cursor:"pointer",fontFamily:F,marginBottom:"10px"}}>Go to my Teacher Dashboard →</button>
      <button onClick={()=>{clearSession();setUser(null);}} style={{width:"100%",maxWidth:"320px",padding:"13px",background:"#fff",color:C.p,border:"2px solid "+C.p,borderRadius:"10px",fontWeight:"700",fontSize:"14px",cursor:"pointer",fontFamily:F}}>👁 Open quiz as a student (test it)</button>
    </div>;
  }
  if(directQuiz && user && user.role==="student"){
    // Student logged in with a quiz link - take them straight to the quiz (handled in StudentApp via directQuiz)
  }
  if(!user||!data) return <Landing onLogin={handleLogin} prefillQuiz={directQuiz}/>;

  // Banner shown when a teacher is viewing as a student
  const parkedBanner = parkedTeacher ? (
    <div style={{background:"#f59e0b",color:"#fff",padding:"8px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",fontFamily:F,flexShrink:0}}>
      <span style={{fontSize:"12px",fontWeight:"600"}}>👁 Viewing as student: {user.name}</span>
      <button onClick={backToTeacher} style={{background:"#fff",color:"#92400e",border:"none",borderRadius:"7px",padding:"5px 12px",fontWeight:"700",fontSize:"12px",cursor:"pointer",fontFamily:F}}>← Back to Teacher</button>
    </div>
  ) : null;

  if(user.role==="teacher") return <TeacherApp user={user} data={data} onLogout={handleLogout} reload={reload} viewAsStudent={viewAsStudent}/>;
  return <div style={{height:"100vh",display:"flex",flexDirection:"column"}}>{parkedBanner}<div style={{flex:1,minHeight:0}}><StudentApp user={user} data={data} onLogout={parkedTeacher?backToTeacher:handleLogout} reload={reload} directQuiz={directQuiz} clearDirect={()=>{setDirectQuiz(null);history.replaceState(null,"",location.pathname);}}/></div></div>;
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
} catch(e) {
  document.getElementById("root").innerHTML = '<div style="padding:30px;font-family:system-ui;color:#fff;background:#0f172a;min-height:100vh"><h3>App error</h3><pre style="white-space:pre-wrap;font-size:12px;color:#fca5a5">'+(e.message||e)+'</pre></div>';
}
</script>
