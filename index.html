              </Card>
            ))}
            <button onClick={addLabelPart} style={{width:"100%",padding:"10px",background:"#f1f5f9",color:C.mu,border:"2px dashed "+C.br,borderRadius:"9px",fontSize:"13px",fontWeight:"600",cursor:"pointer",marginBottom:"9px",fontFamily:F}}>{labelAnswerMode==="number"?"+ Add Word":"+ Add Part"}</button>
            <Btn size="lg" onClick={save} style={{width:"100%"}}>💾 Save Quiz</Btn>
          </>
        ) : (<>
        <div style={{display:"flex",alignItems:"center",gap:"8px",margin:"4px 0 10px"}}>
          <div style={{flex:1,height:"1px",background:C.br}}/>
          <span style={{fontSize:"13px",fontWeight:"800",color:C.tx,fontFamily:F}}>{(type==="Listening"&&listenMatch)?"❓ Questions (write the correct letter for each)":"❓ Questions"}</span>
          <div style={{flex:1,height:"1px",background:C.br}}/>
        </div>
        {questions.map((q,qi)=>(
          <Card key={qi} style={{marginBottom:"10px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"9px",flexWrap:"wrap",gap:"6px"}}>
              <div style={{display:"flex",alignItems:"center",gap:"7px"}}>
                <div style={{width:"22px",height:"22px",borderRadius:"50%",background:C.p,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"700",fontSize:"11px",fontFamily:F}}>{qi+1}</div>
                <select value={q.skill} onChange={e=>updQ(qi,"skill",e.target.value)} style={{...inp,width:"150px"}}>{SKILLS.map(s=><option key={s}>{s}</option>)}</select>
                <select value={q.difficulty} onChange={e=>updQ(qi,"difficulty",e.target.value)} style={{...inp,width:"90px"}}>{DIFFICULTIES.map(d=><option key={d}>{d}</option>)}</select>

            </div>
            <textarea value={q.text} onChange={e=>updQ(qi,"text",e.target.value)} placeholder="Question text…" rows={2} style={{...inp,resize:"none",marginBottom:"8px"}}/>
            {(type==="Listening" && listenMatch) ? (
              <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
                <Label text="Correct letter:"/>
                <input value={q.correctLabel||""} onChange={e=>updQ(qi,"correctLabel",e.target.value.replace(/[^a-zA-Z]/g,"").slice(0,1).toLowerCase())} placeholder="a" style={{...inp,width:"60px",textAlign:"center",fontWeight:"800",fontSize:"15px"}}/>
                <span style={{fontSize:"10px",color:C.mu,fontFamily:F}}>(the answer letter from the list above)</span>
              </div>
            ) : (<>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px"}}>
              {q.options.map((opt,oi)=>(
                <div key={oi} style={{display:"flex",alignItems:"center",gap:"5px"}}>
                  <button onClick={()=>updQ(qi,"correct",oi)} style={{minWidth:"20px",height:"20px",borderRadius:"50%",border:"2px solid "+(q.correct===oi?C.s:C.br),background:q.correct===oi?C.s:"#fff",color:q.correct===oi?"#fff":C.mu,fontWeight:"700",fontSize:"10px",cursor:"pointer",flexShrink:0}}>{String.fromCharCode(65+oi)}</button>
                  <input value={opt} onChange={e=>updO(qi,oi,e.target.value)} placeholder={"Option "+String.fromCharCode(65+oi)} style={{...inp,border:q.correct===oi?"2px solid "+C.s:"1px solid "+C.br}}/>
                </div>
              ))}
            </div>
            <p style={{margin:"5px 0 0",fontSize:"10px",color:C.mu,fontFamily:F}}>Tap a letter to mark the correct answer</p>
            </>)}
          </Card>
        ))}
        <button onClick={addQ} style={{width:"100%",padding:"10px",background:"#f1f5f9",color:C.mu,border:"2px dashed "+C.br,borderRadius:"9px",fontSize:"13px",fontWeight:"600",cursor:"pointer",marginBottom:"9px",fontFamily:F}}>+ Add Question</button>
        <Btn size="lg" onClick={save} style={{width:"100%"}}>💾 Save Quiz</Btn>
        </>)}
      </div></div>
    </div>
  );
}

// ── TEACHER APP ───────────────────────────────────────────────

function ReadingProgressStudent({user,data,reload}){
  const tasks=(data.readingTasks||[]).filter(t=>{
    if(t.status==="closed") return false;
    const classOk=!t.classIds||t.classIds.length===0||t.classIds.includes(user.classId);
    const studentOk=!t.studentIds||t.studentIds.length===0||t.studentIds.includes(user.id)||t.studentIds.includes(user.studentId);
    return classOk && studentOk;
  });
  const subs=(data.readingSubmissions||[]).filter(x=>x.studentId===user.id);
  function rpLocalAttemptsForTask(taskId){
    let out=[];
    try{
      ["rp_student_attempts","rp_attempt_records_v11","rp_attempt_records_v10","rp_attempt_records_v9","rp_attempt_records_v8","rp_attempt_records_v7"].forEach(k=>{
        const arr=JSON.parse(localStorage.getItem(k)||"[]");
        if(Array.isArray(arr)) out=out.concat(arr);
      });
    }catch(e){}
    return out.filter(r=>{
      if(!r || r.deleted===true || r.status==="deleted") return false;
      const sameTask=String(r.taskId||"")===String(taskId||"");
      const sid=String(r.studentId||r.studentNumber||"");
      const sameStudent=sid===String(user.id||"") || sid===String(user.studentId||"");
      return sameTask && sameStudent;
    });
  }
  function studentKeys(){
    return [...new Set([String(user.id||""),String(user.studentId||""),String(user.email||"")].filter(Boolean))];
  }
  function attemptCounterKeys(taskId){
    return studentKeys().map(s=>"rp_attempt_count_"+s+"_"+String(taskId));
  }
  function getAttemptCounter(taskId){
    try{
      return Math.max(0,...attemptCounterKeys(taskId).map(k=>Number(localStorage.getItem(k)||0)||0));
    }catch(e){return 0;}
  }
  function setAttemptCounter(taskId,n){
    try{attemptCounterKeys(taskId).forEach(k=>localStorage.setItem(k, String(Math.max(0,Number(n)||0))));}catch(e){}
  }
  function saveStudentAttemptMarker(r){
    try{
      const arr=JSON.parse(localStorage.getItem("rp_student_attempts")||"[]");
      const clean=arr.filter(x=>x&&x.id!==r.id);
      clean.push(r);
      localStorage.setItem("rp_student_attempts", JSON.stringify(clean));
      const same=clean.filter(x=>x&&String(x.taskId||"")===String(r.taskId||"")&&studentKeys().includes(String(x.studentId||x.studentNumber||"")));
      const old=getAttemptCounter(r.taskId);
      setAttemptCounter(r.taskId, Math.max(old+1, same.length));
    }catch(e){}
  }
  function canAttemptTask(t){
    if(!t) return false;
    const done=attemptsForTask(t);
    const limit=totalAllowedAttempts(t);
    return done.length < limit || extraRetakeAllowed(done);
  }
  function attemptsForTask(t){
    const cloud=subs.filter(s=>s.taskId===t.id && s.deleted!==true && s.status!=="deleted");
    const local=rpLocalAttemptsForTask(t.id);
    const map={};
    [...cloud,...local].forEach(r=>{ if(r&&r.id) map[r.id]=r; });
    const arr=Object.values(map);
    const counted=getAttemptCounter(t.id);
    while(arr.length<counted){
      arr.push({id:"local_counter_"+t.id+"_"+arr.length,taskId:t.id,studentId:user.id,status:"submitted",createdAt:today()});
    }
    return arr;
  }
  function extraRetakeAllowed(attempts){
    return attempts.some(a=>a && a.status==="retake_allowed");
  }
  function totalAllowedAttempts(t){
    const retakes=Math.max(0,Math.min(10,Number(t.retakeLimit??0)||0));
    return 1 + retakes;
  }
  const [task,setTask]=useState(null); const [recording,setRecording]=useState(false); const [blob,setBlob]=useState(null); const [audioUrl,setAudioUrl]=useState("");
  const [seconds,setSeconds]=useState(0); const [transcript,setTranscript]=useState(""); const [msg,setMsg]=useState(""); const [modelPlaying,setModelPlaying]=useState(false); const [submitting,setSubmitting]=useState(false); const [sentBlobKey,setSentBlobKey]=useState(""); const [recordingId,setRecordingId]=useState(""); const mediaRef=useRef(null); const chunksRef=useRef([]); const tRef=useRef(null); const recRef=useRef(null); const modelRef=useRef(null); const audioCtxRef=useRef(null); const analyserRef=useRef(null); const voiceRef=useRef(false);
  function currentBlobKey(){return blob?String(blob.size)+"_"+String(blob.type)+"_"+String(task&&task.id||"")+"_"+String(recordingId||""):"";}
  function submittedRecordingIds(){try{return JSON.parse(localStorage.getItem("rp_submitted_recording_ids")||"[]");}catch(e){return []}}
  function markRecordingSubmitted(id){try{localStorage.setItem("rp_submitted_recording_ids",JSON.stringify([...new Set([...submittedRecordingIds(),id])]))}catch(e){}}
  function isRecordingSubmitted(id){return !!id && submittedRecordingIds().includes(id);}
  function stopModelAudio(){try{window.speechSynthesis.cancel();}catch(e){} setModelPlaying(false);}
  function playModel(t){
    if(recording){setMsg("Stop recording before playing model audio.");return;}
    stopModelAudio();
    const u=new SpeechSynthesisUtterance(t.text);
    modelRef.current=u;
    u.lang="en-US";
    u.rate=t.level==="beginner"?0.82:t.level==="advanced"?0.98:0.9;
    u.onend=()=>setModelPlaying(false);
    u.onerror=()=>setModelPlaying(false);
    setModelPlaying(true);
    window.speechSynthesis.speak(u);
  }
  async function startRec(){
    if(task && !canAttemptTask(task)){setMsg("Attempt limit reached. Ask your teacher for retake permission.");return;}
    if(modelPlaying || (window.speechSynthesis&&window.speechSynthesis.speaking)){setMsg("Stop the model audio first, then start recording.");return;}
    if(!rpCanRecord()){setMsg("Recording is not supported in this browser. Use Chrome on Android if possible.");return;}
    setMsg("");setBlob(null);setAudioUrl("");setTranscript("");setSeconds(0);setSentBlobKey("");setRecordingId("rec_"+Date.now()+"_"+Math.random().toString(36).slice(2));chunksRef.current=[];voiceRef.current=false;
    const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      const ctx=new AC(); audioCtxRef.current=ctx;
      if(ctx.state==="suspended") await ctx.resume();
      const src=ctx.createMediaStreamSource(stream);
      const analyser=ctx.createAnalyser(); analyser.fftSize=1024; analyserRef.current=analyser; src.connect(analyser);
    }catch(e){}
    const mime=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":(MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"");
    const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:undefined); mediaRef.current=mr;
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunksRef.current.push(e.data);};
    mr.onstop=()=>{stream.getTracks().forEach(x=>x.stop()); try{audioCtxRef.current&&audioCtxRef.current.close();}catch(e){} const b=new Blob(chunksRef.current,{type:mime||"audio/webm"}); setBlob(b); setAudioUrl(URL.createObjectURL(b));};
    recRef.current=rpStartRecognition(t=>{setTranscript(t); if(String(t||"").trim().split(/\s+/).length>=2) voiceRef.current=true;});
    mr.start(1000); setRecording(true);
    let elapsed=0, strongVoiceSeconds=0;
    tRef.current=setInterval(()=>{
      elapsed++;
      setSeconds(elapsed);
      try{
        const an=analyserRef.current;
        if(an){
          const dataArr=new Uint8Array(an.fftSize);
          an.getByteTimeDomainData(dataArr);
          let sum=0;
          for(let i=0;i<dataArr.length;i++){const v=(dataArr[i]-128)/128;sum+=v*v;}
          const rms=Math.sqrt(sum/dataArr.length);
          if(rms>0.075){strongVoiceSeconds++;}
          if(strongVoiceSeconds>=2) voiceRef.current=true;
        }
      }catch(e){}
      if(elapsed>=20 && !voiceRef.current){
        setMsg("Recording stopped because no clear student voice was detected.");
        stopRec();
      }else if(elapsed>=90){
        setMsg("Recording stopped automatically after the maximum time.");
        stopRec();
      }
    },1000);
  }
  function stopRec(){try{mediaRef.current&&mediaRef.current.state!=="inactive"&&mediaRef.current.stop();}catch(e){} try{recRef.current&&recRef.current.stop();}catch(e){} clearInterval(tRef.current);setRecording(false);}
  async function submit(){
    if(submitting){setMsg("Uploading already in progress. Please wait.");return;}
    if(!task||!blob){setMsg("Record your reading first.");return;}
    const key=currentBlobKey();
    if((sentBlobKey && sentBlobKey===key)||isRecordingSubmitted(recordingId)){setMsg("This recording has already been submitted. Record a new attempt if allowed.");return;}
    if(!canAttemptTask(task)){setMsg("Attempt limit reached. Ask your teacher for retake permission.");return;}
    setSubmitting(true);
    const beforeCount=attemptsForTask(task).length;
    setAttemptCounter(task.id, Math.max(getAttemptCounter(task.id), beforeCount+1));
    setMsg("Uploading…");
    const id=uid(); const path=`reading-progress/${user.classId||"class"}/${user.studentId||user.id}/${task.id}-${Date.now()}.webm`;
    let url="";
    try{url=await rpUploadAudio(blob,path);}
    catch(e){setAttemptCounter(task.id,beforeCount);setSubmitting(false);setMsg("Upload failed. Check Firebase Storage permissions.");return;}
    const submission={id,taskId:task.id,taskTitle:task.title,studentId:user.id,studentNumber:user.studentId,classId:user.classId,className:user.className,teacherId:task.teacherId,audioUrl:url,transcript,seconds,createdAt:today(),status:"submitted"};
    try{
      await fsSet("readingSubmissions",id,submission);
      saveStudentAttemptMarker(submission);
      markRecordingSubmitted(recordingId);
      setSentBlobKey(key);
      setMsg("✅ Submitted to teacher. This recording cannot be submitted again.");
      setBlob(null); setAudioUrl(""); setTask(null); await reload();
    }catch(e){
      setAttemptCounter(task.id,beforeCount);
      setMsg("Send failed. Please try again.");
    }finally{
      setSubmitting(false);
    }
  }
  if(task)return <div>
    <Card style={{marginBottom:"10px",border:"2px solid "+C.p}}><strong style={{fontSize:"14px",color:C.tx}}>📖 {task.title}</strong><p style={{fontSize:"13px",lineHeight:1.7,color:C.tx,background:"#f8fafc",padding:"10px",borderRadius:"8px"}}>{task.text}</p><div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}><Btn color={C.p} onClick={()=>playModel(task)} disabled={recording}>🔊 Listen to model audio</Btn>{modelPlaying&&<Btn color={C.d} onClick={stopModelAudio}>⏹ Stop Model Audio</Btn>}</div></Card>
    <Card><strong style={{fontSize:"13px"}}>🎙️ Record your reading</strong><p style={{fontSize:"11px",color:C.mu}}>Use your phone microphone. The file is compressed automatically.</p>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>{!recording?<Btn color={C.s} onClick={startRec} disabled={modelPlaying}>Start Recording</Btn>:<Btn color={C.d} onClick={stopRec}>Stop</Btn>}<span style={{fontWeight:800,color:recording?C.d:C.mu}}>{seconds}s</span><Btn color={C.mu} onClick={()=>{stopModelAudio();setTask(null);}}>Back</Btn></div>{modelPlaying&&<div style={{fontSize:"11px",color:C.d,fontWeight:800,marginTop:"6px"}}>Stop the model audio before recording.</div>}
      {audioUrl&&<audio controls src={audioUrl} style={{display:"none"}}/>}
      {transcript&&<div style={{fontSize:"11px",color:C.mu,marginTop:"8px",background:"#f8fafc",padding:"8px",borderRadius:"8px"}}>Live transcript: {transcript}</div>}
      <Btn color={C.p} disabled={!blob||submitting||(sentBlobKey&&sentBlobKey===currentBlobKey())||isRecordingSubmitted(recordingId)} onClick={submit} style={{width:"100%",marginTop:"10px"}}>{submitting?"Uploading…":((sentBlobKey&&sentBlobKey===currentBlobKey())||isRecordingSubmitted(recordingId)?"Submitted":"Submit to Teacher")}</Btn>{msg&&<p style={{fontSize:"12px",color:msg.startsWith("✅")?C.s:C.d}}>{msg}</p>}
    </Card></div>;
  return <div><Card style={{marginBottom:"10px",background:"linear-gradient(135deg,"+C.dk+","+C.md+")",border:"none"}}><strong style={{color:"#fff",fontSize:"14px"}}>📖 Reading Progress</strong><p style={{color:C.mu,fontSize:"11px",margin:"4px 0 0"}}>Listen, read aloud, and submit your recording.</p></Card>

function fixAhmedStudent(u){
  if(!u) return u;
  const n=String(u.name||"").replace(/\s+/g," ").trim();
  const looksAhmed = n.includes("أحمد علي الخميس") || n.includes("احمد علي الخميس") || n.toLowerCase().includes("ahmed ali");
  if(!looksAhmed) return u;
  return {...u, studentId:"3136", className:"3/1- 3", fixedClassName:"3/1- 3"};
}
function cleanClassLabel(v){
  const s=String(v||"").trim();
  if(!s) return "";
  if(/^class_3_1$/i.test(s)) return "ثالث أول — 3-1";
  if(/^class_3_2$/i.test(s)) return "ثالث ثاني — 3-2";
  if(/^class_3_3$/i.test(s)) return "ثالث ثالث — 3-3";
  if(/^class_3_4$/i.test(s)) return "ثالث رابع — 3-4";
  if(/^mph/i.test(s) || s.length>18) return "";
  return s;
}

  const grouped={}; approved.forEach(r=>{const key=fixedSid(r)||sname(r); if(!grouped[key])grouped[key]={name:sname(r),sid:fixedSid(r),cls:cls(r),items:[]}; grouped[key].items.push(r);});

    <Card><strong style={{fontSize:"13px",display:"block",marginBottom:"8px"}}>👤 Student Performance</strong>{rows.length===0?<p style={{fontSize:"12px",color:C.mu}}>No accepted student results yet. Press Accept or enter Teacher Score in Reading Progress.</p>:rows.map(r=>{const sorted=r.items.slice().sort((a,b)=>timeOf(a)-timeOf(b)); const scores=sorted.map(x=>({task:x.taskTitle||x.title||x.taskId||"Task",score:score(x)})).filter(x=>x.score!==null); const av=avg(sorted.map(score)), aa=avg(sorted.map(accuracy)), aw=avg(sorted.map(wcpm)), af=avg(sorted.map(fluency)); const notes=sorted.map(x=>x.teacherNotes).filter(Boolean).slice(-2).join(" | "); return <div key={r.sid||r.name} style={{border:"1px solid "+C.br,borderRadius:"14px",padding:"11px",marginBottom:"10px",background:"#fff",boxShadow:"0 4px 12px rgba(15,23,42,.06)"}}><div style={{display:"flex",justifyContent:"space-between",gap:"8px",alignItems:"flex-start"}}><div><strong style={{fontSize:"14px",color:C.tx}}>{r.name}</strong><div style={{fontSize:"10px",color:C.mu}}>ID: {r.sid||"—"} · Class: {r.cls||"—"}</div></div><div style={{fontWeight:900,color:gc(av||0),fontSize:"18px"}}>{av!==null?av+"%":"—"}</div></div><div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:"6px",marginTop:"9px",fontSize:"11px"}}><div>Attempts: <b>{r.items.length}</b></div><div>Level: <b>{perfLevel(av)}</b></div><div>Accuracy: <b>{aa!==null?aa+"%":"—"}</b></div><div>WCPM: <b>{aw!==null?aw:"—"}</b></div><div>Fluency: <b>{af!==null?af+"%":"—"}</b></div><div>Improvement: <b>{improveText(sorted)}</b></div></div><div style={{marginTop:"8px",fontSize:"11px",color:C.tx}}><b>Final Scores:</b>{scores.map((s,i)=><div key={i} style={{color:C.mu}}>{s.task}: <b>{s.score}%</b></div>)}</div>{notes&&<div style={{marginTop:"7px",fontSize:"10px",color:C.mu}}>Notes: {notes}</div>}</div>})}</Card>
    <div style={{margin:"12px 0",display:"flex",justifyContent:"center"}}><Btn color={C.p} onClick={pageTop}>Page Up</Btn></div>
  </div>;
}

function TeacherApp({user, data, onLogout, reload, viewAsStudent}) {
  const [tab,setTab]=useState("overview"),[view,setView]=useState(null),[selQuiz,setSelQuiz]=useState(null);
  const [noteModal,setNoteModal]=useState(null),[noteText,setNoteText]=useState(""),[annModal,setAnnModal]=useState(false),[ann,setAnn]=useState({title:"",text:"",classIds:[]});

  const [clsModal,setClsModal]=useState(false),[newCls,setNewCls]=useState({name:"",grade:""}),[search,setSearch]=useState(""),[sortBy,setSortBy]=useState("name"),[filterCls,setFilterCls]=useState("all");
  const [shareModal,setShareModal]=useState(null);

  const myQuizzes=data.quizzes.filter(q=>q.teacherId===user.id);

  const myStudents=data.users.filter(u=>u.role==="student"&&(myClasses.some(c=>c.id===u.classId)||!u.classId)).map(fixAhmedStudent);
  const myResps=data.responses.filter(r=>myQuizzes.some(q=>q.id===r.quizId));
  const flags=myStudents.filter(s=>{const rs=data.responses.filter(r=>r.studentId===s.id);return calcSkills(rs,data.quizzes).filter(sk=>sk.score<50&&sk.total>=2).length>=2;});
  const sorted=[...myStudents].filter(s=>(filterCls==="all"||s.classId===filterCls)&&(!search||s.name.toLowerCase().includes(search.toLowerCase())||(s.studentId||"").includes(search))).sort((a,b)=>{
    if(sortBy==="name")return a.name.localeCompare(b.name);if(sortBy==="id")return a.studentId.localeCompare(b.studentId);if(sortBy==="class")return (a.classId||"").localeCompare(b.classId||"");
    const ra=data.responses.filter(r=>r.studentId===a.id&&myQuizzes.some(q=>q.id===r.quizId)),rb=data.responses.filter(r=>r.studentId===b.id&&myQuizzes.some(q=>q.id===r.quizId));
    return (rb.length?Math.round(rb.reduce((s,r)=>s+pct(r.score,r.totalQ),0)/rb.length):0)-(ra.length?Math.round(ra.reduce((s,r)=>s+pct(r.score,r.totalQ),0)/ra.length):0);
  });

  async function saveQuiz(q){await fsSet("quizzes",q.id,q);await reload();setView(null);}
  // Auto-pause: close the quiz before editing so no new students start mid-change
  async function startEditQuiz(quiz){
    const wasOpen = quiz.status!=="closed";
    if(wasOpen){ await fsSet("quizzes",quiz.id,{...quiz,status:"closed"}); await reload(); }
    setResumeAfterEdit(wasOpen);
    setEditingQuiz({...quiz,status:wasOpen?"closed":quiz.status});
    setView("edit");
  }
  // On save while editing: reopen the quiz if it was open before editing
  async function saveEditedQuiz(q){
    const finalStatus = resumeAfterEdit ? "open" : q.status;
    await fsSet("quizzes",q.id,{...q,status:finalStatus});
    await reload();
    setView(null); setEditingQuiz(null); setResumeAfterEdit(false);
  }
  function cancelEdit(){
    // If we auto-closed it, reopen it on cancel too
    (async()=>{ if(resumeAfterEdit&&editingQuiz){ await fsSet("quizzes",editingQuiz.id,{...editingQuiz,status:"open"}); await reload(); } setView(null); setEditingQuiz(null); setResumeAfterEdit(false); })();
  }
  async function delQuiz(id){if(!confirm("Delete this quiz?"))return;await fsDel("quizzes",id);await reload();}

  async function toggleQuiz(quiz){await fsSet("quizzes",quiz.id,{...quiz,status:quiz.status==="closed"?"open":"closed"});await reload();}
  async function saveNote(){const ex=data.notes.find(n=>n.teacherId===user.id&&n.studentId===noteModal.id);const id=ex?ex.id:uid();await fsSet("notes",id,{id,teacherId:user.id,studentId:noteModal.id,note:noteText,updatedAt:today()});await reload();setNoteModal(null);}
  async function postAnn(){const id=uid();await fsSet("announcements",id,{id,teacherId:user.id,...ann,createdAt:today()});await reload();setAnnModal(false);setAnn({title:"",text:"",classIds:[]});}
  // ── IMPORT STUDENTS FROM EXCEL/CSV ──
  async function importStudents(e){
    const file=e.target.files[0]; if(e.target)e.target.value="";
    if(!file) return;
    setImportMsg("Reading file…");
    try {
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(new Uint8Array(buf),{type:"array"});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
      if(!rows.length){setImportMsg("File is empty.");return;}
      // Detect header columns
      const hdr=rows[0].map(c=>String(c||"").trim().toLowerCase());
      let ci={name:-1,id:-1,cls:-1,email:-1};
      hdr.forEach((h,i)=>{
        if(ci.name<0&&(h==="name"||h.includes("student name")||h.includes("full name")||h==="اسم"||h.includes("الاسم"))) ci.name=i;
        else if(ci.id<0&&(h==="id"||h.includes("student id")||h.includes("number")||h.includes("رقم")||h.includes("هوية"))) ci.id=i;
        else if(ci.cls<0&&(h==="class"||h.includes("class")||h.includes("grade")||h.includes("صف")||h.includes("فصل"))) ci.cls=i;
        else if(ci.email<0&&h.includes("email")) ci.email=i;
      });
      const hasHeader=ci.name>=0||ci.id>=0;
      if(!hasHeader){ci={name:0,id:1,cls:2,email:-1};}
      const dataRows=rows.slice(hasHeader?1:0);
      const existing=await fsAll("users");
      let added=0,skipped=0,dupe=0;
      const myClassList=data.classes.filter(c=>(c.teacherIds||[]).includes(user.id));
      for(const r of dataRows){
        const name=String(r[ci.name]||"").trim();
        const sid=String(r[ci.id]||"").trim();
        if(!name||!sid){skipped++;continue;}
        if(existing.find(u=>(u.studentId||"")===sid)){dupe++;continue;}
        // Match class by name if provided
        let classId="";
        if(ci.cls>=0){const cn=String(r[ci.cls]||"").trim().toLowerCase();const mc=myClassList.find(c=>c.name.toLowerCase()===cn||((c.grade||"").toLowerCase()===cn));if(mc)classId=mc.id;}
        const email=ci.email>=0?String(r[ci.email]||"").trim().toLowerCase():"";
        const nu={id:uid(),role:"student",name,studentId:sid,classId,email,password:"",createdAt:today()};
        await fsSet("users",nu.id,nu);
        existing.push(nu); added++;
      }
      await reload();
      setImportMsg("✅ Added "+added+" students."+(dupe?" Skipped "+dupe+" already existing.":"")+(skipped?" Skipped "+skipped+" rows missing name/ID.":""));
    } catch(err){ setImportMsg("Error: "+(err.message||err)); }
  }

  // ── EXPORT GRADEBOOK (grid: students x quizzes) ──
  function exportGradebook(){
    const qs = myQuizzes;
    const studs = (gbClass==="all"?myStudents:myStudents.filter(s=>s.classId===gbClass));
    const header=["Student Name","Student ID","Class",...qs.map(q=>q.title),"Average %"];
    const rows=[header];
    studs.forEach(s=>{
      const cls=data.classes.find(c=>c.id===s.classId);
      const row=[s.name,s.studentId||"",cls?.name||""];
      let sum=0,cnt=0;
      qs.forEach(q=>{
        const rs=data.responses.filter(r=>r.studentId===s.id&&r.quizId===q.id);
        if(rs.length){ const best=Math.max(...rs.map(r=>pct(r.score,r.totalQ))); row.push(best); sum+=best; cnt++; }
        else row.push("");
      });
      row.push(cnt?Math.round(sum/cnt):"");
      rows.push(row);
    });
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:22},{wch:12},{wch:12},...qs.map(()=>({wch:14})),{wch:10}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Gradebook");
    XLSX.writeFile(wb,"EduQuiz_Gradebook_"+new Date().toISOString().slice(0,10)+".xlsx");
  }

  // ── EXPORT RESULTS TO EXCEL ──
  function exportResults(){
    const rows=[["Student Name","Student ID","Class","Quiz","Type","Mode","Score","Total","Percent","Attempt","Date"]];

      const cls=data.classes.find(c=>c.id===(st?.classId));

  function quizLink(quiz){
    // Use a saved site URL if the teacher set one, otherwise current page URL
    let base = "";
    try { base = localStorage.getItem("eq_siteurl") || ""; } catch(e){}
    if (!base) {
      base = location.origin + location.pathname;
    }
    // Clean up: remove trailing slash, remove any query/hash
    base = base.split("?")[0].split("#")[0].replace(/\/$/, "");
    return base + "?quiz=" + quiz.code;
  }

  if(view==="create")return <CreateQuiz teacher={user} classes={data.classes} students={myStudents} onSave={saveQuiz} onBack={()=>setView(null)}/>;
  if(view==="edit")return <CreateQuiz teacher={user} classes={data.classes} students={myStudents} editQuiz={editingQuiz} onSave={saveEditedQuiz} onBack={cancelEdit}/>;
  const tabs=[{id:"overview",icon:"📊",label:"Overview"},{id:"reading",icon:"📖",label:"Reading Progress"},{id:"readingReport",icon:"📈",label:"Reading Performance"},{id:"quizzes",icon:"📋",label:"Quizzes"},{id:"gradebook",icon:"📒",label:"Gradebook"},{id:"classes",icon:"🏫",label:"Classes"},{id:"students",icon:"👥",label:"Students"},{id:"heatmap",icon:"🌡️",label:"Heatmap"},{id:"announce",icon:"📣",label:"Announce"}];

  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",fontFamily:F,background:C.bg}}>
      <HDR title={user.name} sub="Teacher Dashboard" right={<><Btn size="sm" color={C.s} onClick={()=>setView("create")}>+ Quiz</Btn><Btn size="sm" color={C.w} onClick={()=>setViewAsOpen(true)}>👁</Btn><Btn size="sm" color={C.mu} onClick={()=>{if(confirm("Update to the latest version? The app will reload."))forceUpdate();}}>🔄</Btn><Btn size="sm" color={C.p} onClick={()=>setProfileOpen(true)}>⚙️</Btn><Btn size="sm" onClick={onLogout} color="#475569">Logout</Btn></>}/>
      <TabBar tabs={tabs} active={tab} onChange={setTab}/>
      <div style={{flex:1,overflowY:"auto"}}>
      <div style={{maxWidth:"880px",margin:"0 auto",padding:"14px"}}>
        {tab==="overview" && <div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"9px",marginBottom:"13px"}}>
            <Stat icon="📋" label="Quizzes" value={myQuizzes.length} color={C.p}/><Stat icon="👥" label="Students" value={myStudents.length} color={C.pu}/><Stat icon="📝" label="Submissions" value={myResps.length} color={C.s}/><Stat icon="🚨" label="Need Help" value={flags.length} color={C.d}/>
          </div>
          {flags.length>0 && <Card style={{marginBottom:"11px",border:"2px solid "+C.d,background:"#fef2f2"}}>
            <strong style={{color:"#991b1b",fontSize:"12px",display:"block",marginBottom:"7px",fontFamily:F}}>🚨 Students Needing Intervention</strong>
            {flags.map(s=><div key={s.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #fca5a5",fontSize:"12px",fontFamily:F}}><span style={{fontWeight:"700",color:C.tx}}>{s.name}</span><span style={{color:"#991b1b"}}>Below 50% in 2+ skills</span></div>)}
          </Card>}
          {myResps.length>0 && <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"11px"}}>
            <Card><strong style={{fontSize:"12px",color:C.tx,display:"block",marginBottom:"9px",fontFamily:F}}>📊 Score Distribution</strong>
              <ResponsiveContainer width="100%" height={150}><BarChart data={[{r:"0-49%",n:myResps.filter(r=>pct(r.score,r.totalQ)<50).length},{r:"50-69%",n:myResps.filter(r=>{const p=pct(r.score,r.totalQ);return p>=50&&p<70;}).length},{r:"70-89%",n:myResps.filter(r=>{const p=pct(r.score,r.totalQ);return p>=70&&p<90;}).length},{r:"90-100%",n:myResps.filter(r=>pct(r.score,r.totalQ)>=90).length}]} barSize={28}><XAxis dataKey="r" tick={{fontSize:9,fill:C.mu}} axisLine={false} tickLine={false}/><YAxis allowDecimals={false} tick={{fontSize:9,fill:C.mu}}/><Tooltip/><Bar dataKey="n" radius={[4,4,0,0]}>{[C.d,C.w,C.p,C.s].map((c,i)=><Cell key={i} fill={c}/>)}</Bar></BarChart></ResponsiveContainer>
            </Card>
            <Card><strong style={{fontSize:"12px",color:C.tx,display:"block",marginBottom:"9px",fontFamily:F}}>🏆 Top Students</strong>
              {(()=>{ const ranked=myStudents.map(s=>{const rs=data.responses.filter(r=>r.studentId===s.id&&myQuizzes.some(q=>q.id===r.quizId));return {s,avg:rs.length?Math.round(rs.reduce((a,r)=>a+pct(r.score,r.totalQ),0)/rs.length):null,count:rs.length};}).filter(x=>x.count>0).sort((a,b)=>b.avg-a.avg).slice(0,5); return ranked.length===0 ? <p style={{fontSize:"12px",color:C.mu,fontFamily:F}}>No attempts yet.</p> : ranked.map((x,i)=>(<div key={x.s.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:i<ranked.length-1?"1px solid "+C.br:"none"}}><span style={{fontSize:"12px",fontWeight:"600",color:C.tx,fontFamily:F}}>#{i+1} {x.s.name}</span><span style={{fontWeight:"700",color:gc(x.avg),fontSize:"12px",fontFamily:F}}>{x.avg}%</span></div>)); })()}
            </Card>
          </div>}
        </div>}

        {tab==="reading" && <ReadingProgressTeacher user={user} data={data} reload={reload} myClasses={myClasses} myStudents={myStudents}/>}
        {tab==="readingReport" && <ReadingPerformanceReport user={user} data={data} myClasses={myClasses} myStudents={myStudents}/>}

        {tab==="quizzes" && <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"11px"}}><strong style={{fontSize:"13px",color:C.tx,fontFamily:F}}>My Quizzes ({myQuizzes.length})</strong><Btn size="sm" color={C.s} onClick={()=>setView("create")}>+ New</Btn></div>
          {myQuizzes.length===0?<Card><p style={{textAlign:"center",color:C.mu,fontFamily:F,padding:"14px"}}>No quizzes yet.</p></Card>
          :myQuizzes.map((quiz,i)=>{
            const rs=data.responses.filter(r=>r.quizId===quiz.id);const avg=rs.length?Math.round(rs.reduce((a,r)=>a+pct(r.score,r.totalQ),0)/rs.length):null;const col=COLORS[i%COLORS.length];const open=selQuiz===quiz.id;const icon=quiz.type==="Listening"?"🎧":quiz.type==="Grammar"?"✏️":quiz.type==="Vocabulary"?"📚":"📖";
            return <Card key={quiz.id} style={{marginBottom:"8px",border:open?"2px solid "+C.p:"2px solid transparent"}}>
              <div style={{display:"flex",alignItems:"center",gap:"9px",flexWrap:"wrap"}}>
                <div style={{width:"36px",height:"36px",borderRadius:"8px",background:col+"20",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"15px",flexShrink:0}}>{icon}</div>
                <div style={{flex:1,minWidth:"150px"}}><div style={{fontWeight:"700",color:C.tx,fontSize:"13px",fontFamily:F}}>{quiz.title}</div><div style={{fontSize:"10px",color:C.mu,fontFamily:F}}>{quiz.type} · {quiz.difficulty} · {quiz.questions.length}Q · {rs.length} done{avg!==null?" · Avg:"+avg+"%":""}</div><span style={{fontSize:"10px",fontWeight:"700",color:quiz.status==="closed"?C.d:C.s,fontFamily:F}}>{quiz.status==="closed"?"🔒 Closed":"🟢 Open"} · Code: {quiz.code}</span></div>
                <div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>
                  <Btn size="sm" color={C.s} onClick={()=>setShareModal(quiz)}>🔗 Share</Btn>
                  <Btn size="sm" color={col} onClick={()=>setSelQuiz(open?null:quiz.id)}>📊</Btn>
                  <Btn size="sm" color={C.pu} onClick={()=>startEditQuiz(quiz)}>✏️ Edit</Btn>
                  <Btn size="sm" color={quiz.status==="closed"?C.s:C.w} onClick={()=>toggleQuiz(quiz)}>{quiz.status==="closed"?"Open":"Close"}</Btn>
                  <Btn size="sm" color={C.d} onClick={()=>delQuiz(quiz.id)}>🗑</Btn>
                </div>
              </div>
              {open&&rs.length>0 && <div style={{marginTop:"11px",paddingTop:"11px",borderTop:"1px solid "+C.br}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"9px"}}>
                  <div><p style={{margin:"0 0 5px",fontSize:"10px",color:C.mu,fontFamily:F}}>CORRECT RATE / QUESTION</p>
                    <ResponsiveContainer width="100%" height={100}><BarChart data={quiz.questions.map(q=>({n:"Q"+q.id,p:rs.length?Math.round(rs.filter(r=>r.answers&&r.answers[q.id]===q.correct).length/rs.length*100):0}))} barSize={10}><XAxis dataKey="n" tick={{fontSize:8,fill:C.mu}} axisLine={false} tickLine={false}/><YAxis domain={[0,100]} tick={{fontSize:8,fill:C.mu}}/><Tooltip/><Bar dataKey="p" radius={[3,3,0,0]}>{quiz.questions.map((q,j)=><Cell key={j} fill={rs.length&&Math.round(rs.filter(r=>r.answers&&r.answers[q.id]===q.correct).length/rs.length*100)>=70?C.s:C.w}/>)}</Bar></BarChart></ResponsiveContainer>
                  </div>
                  <div><p style={{margin:"0 0 5px",fontSize:"10px",color:C.mu,fontFamily:F}}>RESULTS (tap 🗑 to delete an attempt)</p><div style={{maxHeight:"140px",overflowY:"auto"}}>{rs.map(r=>{const st=data.users.find(u=>u.id===r.studentId);const p=pct(r.score,r.totalQ);return(<div key={r.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"3px 0",fontSize:"11px",fontFamily:F,borderBottom:"1px solid "+C.br}}><span style={{color:C.tx,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{st?.name||"?"} <span style={{color:C.mu,fontSize:"9px"}}>#{r.attempt} · {r.completedAt}</span></span><span style={{color:gc(p),fontWeight:"700",marginRight:"8px"}}>{p}%</span><button onClick={()=>delResponse(r.id, st?.name||"student")} style={{background:"none",border:"none",cursor:"pointer",fontSize:"13px",padding:"2px 4px"}}>🗑</button></div>);})}</div></div>
                </div>
              </div>}
            </Card>;
          })}
        </div>}

        {tab==="classes" && <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"11px"}}><strong style={{fontSize:"13px",color:C.tx,fontFamily:F}}>My Classes ({myClasses.length})</strong><Btn size="sm" color={C.s} onClick={()=>setClsModal(true)}>+ Add Class</Btn></div>
          {myClasses.length===0?<Card><p style={{textAlign:"center",color:C.mu,fontFamily:F,padding:"14px"}}>No classes yet.</p></Card>
          :myClasses.map(cls=>{const studs=myStudents.filter(s=>s.classId===cls.id);const rs=data.responses.filter(r=>studs.some(s=>s.id===r.studentId)&&myQuizzes.some(q=>q.id===r.quizId));const avg=rs.length?Math.round(rs.reduce((a,r)=>a+pct(r.score,r.totalQ),0)/rs.length):null;
            return <Card key={cls.id} style={{marginBottom:"9px"}}><div style={{marginBottom:"9px"}}><strong style={{fontSize:"14px",color:C.tx,fontFamily:F}}>{cls.name}</strong><div style={{fontSize:"11px",color:C.mu,fontFamily:F}}>{cls.grade} · {studs.length} students{avg!==null?" · Avg: "+avg+"%":""}</div><div style={{display:"flex",gap:"6px",marginTop:"7px"}}><Btn size="sm" color={C.pu} onClick={()=>editClass(cls)}>✏️ Edit Class</Btn><Btn size="sm" color={C.d} onClick={()=>deleteClass(cls)}>🗑 Delete Class</Btn></div></div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:"6px"}}>{studs.map(s=>{const sRs=data.responses.filter(r=>r.studentId===s.id&&myQuizzes.some(q=>q.id===r.quizId));const sAvg=sRs.length?Math.round(sRs.reduce((a,r)=>a+pct(r.score,r.totalQ),0)/sRs.length):null;const flagged=flags.find(f=>f.id===s.id);return <div key={s.id} style={{background:"#f8fafc",borderRadius:"7px",padding:"7px 9px",border:flagged?"2px solid "+C.d:"1px solid "+C.br}}><div style={{fontWeight:"700",fontSize:"12px",color:C.tx,fontFamily:F}}>{s.name}{flagged&&" 🚨"}</div><div style={{fontSize:"10px",color:C.mu,fontFamily:F}}>{s.studentId}</div><div style={{fontSize:"11px",fontWeight:"700",color:sAvg!==null?gc(sAvg):C.mu,fontFamily:F}}>{sAvg!==null?sAvg+"%":"No data"}</div></div>;})}</div>
            </Card>;
          })}
        </div>}

        {tab==="students" && <div>
          <div style={{display:"flex",gap:"7px",marginBottom:"9px",flexWrap:"wrap"}}>
            <label htmlFor="stuImport" style={{flex:1,minWidth:"150px",padding:"10px",background:C.s,color:"#fff",borderRadius:"8px",fontWeight:"700",fontSize:"12px",cursor:"pointer",textAlign:"center",fontFamily:F,boxSizing:"border-box"}}>📥 Import Students (Excel)</label>
            <input id="stuImport" type="file" accept=".xlsx,.xls,.csv" ref={stuFileRef} onChange={importStudents} style={{display:"none"}}/>
            <Btn color={C.w} onClick={exportResults}>📤 Export Results</Btn>
          </div>
          {importMsg && <div style={{background:importMsg.startsWith("✅")?"#f0fdf4":"#eff6ff",border:"1px solid "+(importMsg.startsWith("✅")?"#86efac":"#93c5fd"),borderRadius:"8px",padding:"9px 12px",fontSize:"12px",color:importMsg.startsWith("✅")?"#166534":"#1e40af",marginBottom:"9px",fontFamily:F}}>{importMsg}</div>}
          <div style={{fontSize:"10px",color:C.mu,marginBottom:"9px",fontFamily:F,background:"#f8fafc",padding:"8px 11px",borderRadius:"7px"}}>💡 Excel columns: <strong>Name</strong>, <strong>ID</strong> (required), <strong>Class</strong> (optional). Students log in with name + class + ID + password. Default password for imported students is their ID; teacher can edit it.</div>
          <div style={{display:"flex",gap:"7px",marginBottom:"11px",flexWrap:"wrap"}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search name or ID…" style={{flex:1,minWidth:"150px",padding:"8px 11px",borderRadius:"8px",border:"1px solid "+C.br,fontSize:"12px",outline:"none",fontFamily:F}}/>
            <select value={filterCls} onChange={e=>setFilterCls(e.target.value)} style={{padding:"8px 11px",borderRadius:"8px",border:"1px solid "+C.br,fontSize:"11px",fontFamily:F,background:C.wh}}><option value="all">All Classes</option>{myClasses.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
            <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{padding:"8px 11px",borderRadius:"8px",border:"1px solid "+C.br,fontSize:"11px",fontFamily:F,background:C.wh}}><option value="name">Sort: Name</option><option value="id">Sort: ID</option><option value="class">Sort: Class</option><option value="score">Sort: Score</option></select>
          </div>
          <div style={{fontSize:"11px",color:C.mu,marginBottom:"9px",fontFamily:F}}>Showing {sorted.length} students</div>
          {sorted.length===0?<Card><p style={{textAlign:"center",color:C.mu,fontFamily:F}}>No students found.</p></Card>
          :sorted.map(s=>{const sRs=data.responses.filter(r=>r.studentId===s.id&&myQuizzes.some(q=>q.id===r.quizId));const avg=sRs.length?Math.round(sRs.reduce((a,r)=>a+pct(r.score,r.totalQ),0)/sRs.length):null;const sk=calcSkills(sRs,data.quizzes);const flagged=flags.find(f=>f.id===s.id);const note=data.notes.find(n=>n.teacherId===user.id&&n.studentId===s.id);const cls=data.classes.find(c=>c.id===s.classId);
            return <Card key={s.id} style={{marginBottom:"8px",border:flagged?"2px solid "+C.d:"2px solid transparent"}}><div style={{display:"flex",gap:"9px",flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:"160px"}}><div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"2px",flexWrap:"wrap"}}><span style={{fontWeight:"700",fontSize:"13px",color:C.tx,fontFamily:F}}>{s.name}</span>{flagged&&<span style={{fontSize:"9px",background:"#fef2f2",color:C.d,padding:"1px 6px",borderRadius:"999px",fontWeight:"700",fontFamily:F}}>🚨 Help</span>}</div><div style={{fontSize:"10px",color:C.mu,fontFamily:F}}>ID: {s.studentId} · {cls?.name||"—"} · {sRs.length} quizzes</div>{avg!==null&&<div style={{fontSize:"12px",fontWeight:"700",color:gc(avg),fontFamily:F}}>{avg}% avg</div>}{note&&<div style={{fontSize:"10px",color:C.mu,fontStyle:"italic",marginTop:"2px",fontFamily:F}}>📝 {note.note}</div>}</div>
              {sk.length>0&&<div style={{flex:1,minWidth:"160px"}}>{sk.slice(0,3).map(x=>(<div key={x.skill} style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"3px"}}><div style={{width:"75px",fontSize:"9px",color:C.mu,fontFamily:F,flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{x.skill}</div><div style={{flex:1,height:"5px",background:"#f1f5f9",borderRadius:"999px"}}><div style={{height:"100%",width:x.score+"%",background:gc(x.score),borderRadius:"999px"}}/></div><div style={{fontSize:"9px",fontWeight:"700",color:gc(x.score),width:"28px",fontFamily:F}}>{x.score}%</div></div>))}</div>}
              <div style={{display:"flex",flexDirection:"column",gap:"5px"}}>
                <Btn size="sm" color={C.p} onClick={()=>{setNoteModal(s);setNoteText(note?.note||"");}}>📝 Note</Btn>
                <Btn size="sm" color={C.pu} onClick={()=>{setEditStu(s);setEsForm({name:s.name||"",shortName:s.shortName||String(s.name||"").split(/\s+/).slice(0,2).join(" "),studentId:s.studentId||"",classId:s.classId||"",email:s.email||"",password:"",fatherName:s.fatherName||""});setEsMsg("");}}>✏️ Edit</Btn>
                <Btn size="sm" color={C.d} onClick={()=>deleteStudent(s)}>🗑 Delete</Btn>
                <Btn size="sm" color={C.w} onClick={()=>setAttemptsModal(s)}>📊 Attempts</Btn>
              </div>
            </div></Card>;
          })}
        </div>}

        {tab==="gradebook" && <div>
          <Card style={{marginBottom:"11px",background:"linear-gradient(135deg,"+C.dk+","+C.md+")",border:"none"}}>
            <strong style={{color:"#fff",fontSize:"14px",display:"block",marginBottom:"3px",fontFamily:F}}>📒 Gradebook</strong>
            <p style={{margin:0,color:C.mu,fontSize:"11px",fontFamily:F}}>Each cell shows the student's BEST score, with improvement (↑) from their first try.</p>
          </Card>
          <div style={{display:"flex",gap:"8px",marginBottom:"11px",flexWrap:"wrap",alignItems:"center"}}>
            <select value={gbClass} onChange={e=>setGbClass(e.target.value)} style={{padding:"9px 12px",borderRadius:"8px",border:"1px solid "+C.br,fontSize:"12px",fontFamily:F,flex:1,minWidth:"140px"}}>
              <option value="all">All Classes</option>
              {myClasses.map(c=><option key={c.id} value={c.id}>{c.name}{c.grade?" ("+c.grade+")":""}</option>)}
            </select>
            <Btn size="sm" color={C.w} onClick={exportGradebook}>📤 Export Excel</Btn>
          </div>
          {(()=>{
            const qs=myQuizzes;
            const studs=(gbClass==="all"?myStudents:myStudents.filter(s=>s.classId===gbClass));
            if(!qs.length) return <Card><p style={{textAlign:"center",color:C.mu,fontFamily:F,padding:"14px"}}>No quizzes yet.</p></Card>;
            if(!studs.length) return <Card><p style={{textAlign:"center",color:C.mu,fontFamily:F,padding:"14px"}}>No students in this class.</p></Card>;
            return <Card style={{padding:"0",overflow:"hidden"}}>
              <div style={{overflowX:"auto"}}>
                <table style={{borderCollapse:"collapse",width:"100%",fontFamily:F}}>
                  <thead>
                    <tr style={{background:"#f8fafc"}}>
                      <th style={{position:"sticky",left:0,background:"#f8fafc",padding:"9px 11px",textAlign:"left",fontSize:"11px",color:C.tx,borderBottom:"2px solid "+C.br,minWidth:"130px",zIndex:2}}>Student</th>
                      {qs.map(q=><th key={q.id} style={{padding:"9px 8px",fontSize:"10px",color:C.mu,borderBottom:"2px solid "+C.br,minWidth:"70px",maxWidth:"90px"}}>{q.title}</th>)}
                      <th style={{padding:"9px 8px",fontSize:"11px",color:C.p,borderBottom:"2px solid "+C.br,fontWeight:"800"}}>Avg</th>
                    </tr>
                  </thead>
                  <tbody>
                    {studs.map((s,ri)=>{
                      let sum=0,cnt=0;
                      const cells=qs.map(q=>{
                        const rs=data.responses.filter(r=>r.studentId===s.id&&r.quizId===q.id).sort((a,b)=>(a.ts||0)-(b.ts||0));
                        if(!rs.length) return {empty:true};
                        const scores=rs.map(r=>pct(r.score,r.totalQ));
                        const best=Math.max(...scores);
                        const first=scores[0];
                        const improve=best-first;
                        sum+=best;cnt++;
                        return {best,improve,attempts:rs.length};
                      });
                      const avg=cnt?Math.round(sum/cnt):null;
                      return <tr key={s.id} style={{background:ri%2?"#fff":"#fcfcfd"}}>
                        <td style={{position:"sticky",left:0,background:ri%2?"#fff":"#fcfcfd",padding:"8px 11px",fontSize:"12px",fontWeight:"600",color:C.tx,borderBottom:"1px solid "+C.br,zIndex:1}}>{s.name}<div style={{fontSize:"9px",color:C.mu,fontWeight:"400"}}>{s.studentId}</div></td>
                        {cells.map((c,i)=><td key={i} style={{padding:"6px 8px",textAlign:"center",borderBottom:"1px solid "+C.br}}>
                          {c.empty ? <span style={{color:"#cbd5e1",fontSize:"14px"}}>–</span> :
                            <div>
                              <div style={{fontSize:"13px",fontWeight:"800",color:gc(c.best)}}>{c.best}%</div>
                              {c.improve>0 && <div style={{fontSize:"9px",color:C.s,fontWeight:"700"}}>↑+{c.improve}</div>}
                              {c.attempts>1 && c.improve===0 && <div style={{fontSize:"8px",color:C.mu}}>×{c.attempts}</div>}
                            </div>}
                        </td>)}
                        <td style={{padding:"6px 8px",textAlign:"center",borderBottom:"1px solid "+C.br,fontWeight:"800",fontSize:"13px",color:avg!==null?gc(avg):"#cbd5e1"}}>{avg!==null?avg+"%":"–"}</td>
                      </tr>;
                    })}
                  </tbody>
                </table>
              </div>
            </Card>;
          })()}
        </div>}

        {tab==="heatmap" && <div>
          <Card style={{marginBottom:"11px",background:"linear-gradient(135deg,"+C.dk+","+C.md+")",border:"none"}}>
            <strong style={{color:"#fff",fontSize:"14px",display:"block",marginBottom:"2px",fontFamily:F}}>🌡️ Student Heatmap</strong>
            <p style={{margin:0,color:C.mu,fontSize:"11px",fontFamily:F}}>Names on the left · Skills as chart columns · 🟢 80%+ · 🟡 60–79% · 🔴 below 60%</p>
          </Card>

          <Card style={{marginBottom:"10px"}}>
            <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
              <select value={filterCls} onChange={e=>setFilterCls(e.target.value)} style={{padding:"8px 11px",borderRadius:"8px",border:"1px solid "+C.br,fontSize:"12px",fontFamily:F,background:C.wh,color:C.tx}}>
                <option value="all">All Classes / جميع الصفوف</option>
                {myClasses.map(c=><option key={c.id} value={c.id}>{c.name}{c.grade?" ("+c.grade+")":""}</option>)}
              </select>

// ── ROOT ──────────────────────────────────────────────────────
function App() {
  const [user,setUser]=useState(null);
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [directQuiz,setDirectQuiz]=useState(null);
  const [parkedTeacher,setParkedTeacher]=useState(null); // holds teacher while viewing as student

  async function reload(){const d=await loadAllData();setData(d);return d;}

  // Teacher taps "View as Student" -> pick a student to impersonate (view only their experience)
  function viewAsStudent(studentUser){ setParkedTeacher(user); setUser(studentUser); reload(); }
  function backToTeacher(){ if(parkedTeacher){ setUser(parkedTeacher); setParkedTeacher(null); reload(); } }

  useEffect(()=>{
    (async()=>{
      const d=await loadAllData();setData(d);
      // Check for ?quiz=CODE link
      const params=new URLSearchParams(location.search);
      const code=params.get("quiz");
      if(code){const q=d.quizzes.find(x=>x.code===code.toUpperCase());if(q)setDirectQuiz(q);}
      const sess=loadSession();
      if(sess){const u=d.users.find(x=>x.id===sess.id);if(u)setUser(fixAhmedStudent(u));else if(sess.id)setUser(fixAhmedStudent(sess));}
      setLoading(false);
    })();
  },[]);

  function handleLogin(u){setUser(fixAhmedStudent(u));reload();}
  function handleLogout(){clearSession();setUser(null);}

  if(loading) return <div style={{minHeight:"100vh",background:C.dk,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column"}}><div style={{fontSize:"42px",marginBottom:"12px"}}>🎓</div><div style={{color:"#fff",fontSize:"16px",fontWeight:"700",fontFamily:F}}>EduQuiz</div><div style={{color:C.mu,fontSize:"12px",marginTop:"5px",fontFamily:F}}>Loading…</div></div>;

  // If opened via a quiz share link, ALWAYS show the quiz entry (guest), even if someone is logged in.
  if(directQuiz && !user) return <Landing onLogin={handleLogin} prefillQuiz={directQuiz}/>;
  if(directQuiz && user && user.role==="teacher"){
    // Teacher opened a student quiz link on their own device — let them choose
    return <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px",fontFamily:F}}>
      <div style={{fontSize:"42px",marginBottom:"10px"}}>🎓</div>
      <div style={{fontSize:"18px",fontWeight:"800",color:C.tx,marginBottom:"6px",textAlign:"center"}}>{directQuiz.title}</div>
      <div style={{fontSize:"13px",color:C.mu,marginBottom:"22px",textAlign:"center"}}>You're logged in as a teacher. This is a student quiz link.</div>
      <button onClick={()=>{setDirectQuiz(null);history.replaceState(null,"",location.pathname);}} style={{width:"100%",maxWidth:"320px",padding:"13px",background:C.p,color:"#fff",border:"none",borderRadius:"10px",fontWeight:"700",fontSize:"14px",cursor:"pointer",fontFamily:F,marginBottom:"10px"}}>Go to my Teacher Dashboard →</button>
      <button onClick={()=>{clearSession();setUser(null);}} style={{width:"100%",maxWidth:"320px",padding:"13px",background:"#fff",color:C.p,border:"2px solid "+C.p,borderRadius:"10px",fontWeight:"700",fontSize:"14px",cursor:"pointer",fontFamily:F}}>👁 Open quiz as a student (test it)</button>
    </div>;
  }
  if(directQuiz && user && user.role==="student"){
    // Student logged in with a quiz link - take them straight to the quiz (handled in StudentApp via directQuiz)
  }
  if(!user||!data) return <Landing onLogin={handleLogin} prefillQuiz={directQuiz}/>;

  // Banner shown when a teacher is viewing as a student
  const parkedBanner = parkedTeacher ? (
    <div style={{background:"#f59e0b",color:"#fff",padding:"8px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",fontFamily:F,flexShrink:0}}>
      <span style={{fontSize:"12px",fontWeight:"600"}}>👁 Viewing as student: {user.name}</span>
      <button onClick={backToTeacher} style={{background:"#fff",color:"#92400e",border:"none",borderRadius:"7px",padding:"5px 12px",fontWeight:"700",fontSize:"12px",cursor:"pointer",fontFamily:F}}>← Back to Teacher</button>
    </div>
  ) : null;

  if(user.role==="teacher") return <TeacherApp user={user} data={data} onLogout={handleLogout} reload={reload} viewAsStudent={viewAsStudent}/>;
  return <div style={{height:"100vh",display:"flex",flexDirection:"column"}}>{parkedBanner}<div style={{flex:1,minHeight:0}}><StudentApp user={user} data={data} onLogout={parkedTeacher?backToTeacher:handleLogout} reload={reload} directQuiz={directQuiz} clearDirect={()=>{setDirectQuiz(null);history.replaceState(null,"",location.pathname);}}/></div></div>;
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
} catch(e) {
  document.getElementById("root").innerHTML = '<div style="padding:30px;font-family:system-ui;color:#fff;background:#0f172a;min-height:100vh"><h3>App error</h3><pre style="white-space:pre-wrap;font-size:12px;color:#fca5a5">'+(e.message||e)+'</pre></div>';
}
</script>

<script>
// ===== READING PROGRESS V11 INDEXEDDB STORAGE FIX =====
(function(){
  const RP_KEY = "rp_attempt_records_v11";
  const OLD_KEYS = ["rp_attempt_records_v10","rp_attempt_records_v9","rp_attempt_records_v8","rp_attempt_records_v7"];
  const API_KEY = "rp_openai_api_key";
  const DB_NAME = "EduQuizRP_AudioDB";
  const STORE = "audios";
  let panelMade = false;

  function readJSON(k,f){ try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f));}catch(e){return f;} }
  function writeJSON(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
  function records(){
    let cur = readJSON(RP_KEY, null);
    if(Array.isArray(cur)) return cur;
    for(const k of OLD_KEYS){
      let old = readJSON(k, null);
      if(Array.isArray(old)){ writeJSON(RP_KEY, old); return old; }
    }
    writeJSON(RP_KEY, []);

        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:"id"});
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function saveAudio(blob){

    const id = "aud_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const item = {id, blob, type:blob.type||"audio/webm", size:blob.size, createdAt:new Date().toISOString()};
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,"readwrite");
      tx.objectStore(STORE).put(item);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    return item;
  }

      req.onsuccess = () => resolve(req.result || null);

  function finalScore(r){
    const t=Number(r.teacherScore);
    if(!Number.isNaN(t)&&t>0) return Math.max(0,Math.min(100,Math.round(t)));

    const stored=Number(r.finalScore);
    if(!Number.isNaN(stored)&&stored>0) return Math.max(0,Math.min(100,Math.round(stored)));

    const ai=Number(r.aiScore);
    if(!Number.isNaN(ai)&&ai>0) return Math.max(0,Math.min(100,Math.round(ai)));

    const acc=Number(r.accuracy), flu=Number(r.fluency), wcpm=Number(r.wcpm);
    const ws=Number.isFinite(wcpm)?Math.min(100,Math.round(wcpm/100*100)):NaN;
    if(Number.isFinite(acc)&&Number.isFinite(flu)&&Number.isFinite(ws)){
      let v=Math.round(acc*0.80+flu*0.10+ws*0.10);
      if(acc>=98) v=Math.max(90,v);
      return Math.max(0,Math.min(100,v));
    }
    const vals=[acc,flu,ws].filter(Number.isFinite);
    return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):"";
  }

  function defaultRefText(){ return "Reading every day helps students learn new words. A good reader stops, thinks, and tries again when a sentence is difficult. Students can improve their fluency by practicing short texts many times."; }
  function cleanRefCandidate(t){
    return String(t||"").replace(/\s+/g," ").trim();
  }
  function getVisibleReferenceText(){
    // اختر نص القراءة الحقيقي فقط، ولا تأخذ نص لوحة الأداء أو تعليمات المعلم.
    const bad=/reading progress|performance|rejected|deleted|counted|average|best|attempts|accepted|retake|teacher note|teacher score|record your reading|start recording|submit to teacher|audio|status|transcript|reference text|teacher|home|progress|mastery|badge|logout|retry|back|microphone|recording|analyze|fluency|wcpm|mistakes|accuracy|score|submissions/i;

    function visible(el){
      try{
        const st=getComputedStyle(el);
        const r=el.getBoundingClientRect();
        return st.display!=="none" && st.visibility!=="hidden" && r.width>20 && r.height>8;
      }catch(e){ return true; }
    }

    const nodes=[...document.querySelectorAll("p, .reading-text, [data-reading-text], article, blockquote")];
    const cands=[];

    nodes.forEach(n=>{
      if(!visible(n)) return;
      const raw=cleanRefCandidate(n.innerText||n.textContent||"");
      if(!raw || raw.length<8 || raw.length>600) return;
      if(!/[a-zA-Z]/.test(raw) || !/[.!?]/.test(raw)) return;
      if(bad.test(raw)) return;

      const words=raw.split(/\s+/).filter(Boolean);
      if(words.length<3 || words.length>120) return;

      // استبعد النصوص التي تبدو كلوحة/واجهة وليست فقرة قراءة.
      const uiWords=/button|click|status|score|attempt|teacher|student|average|accepted|rejected|deleted|counted|performance/i;
      if(uiWords.test(raw)) return;

      // الأفضلية للنصوص القصيرة والواضحة داخل بطاقة القراءة.
      let score=100;
      if(n.matches("[data-reading-text], .reading-text, p")) score+=40;
      if(words.length<=12) score+=25;
      if(words.length>=3 && words.length<=80) score+=20;
      score-=Math.abs(words.length-20);

      cands.push({t:raw, words:words.length, score});
    });

    cands.sort((a,b)=>b.score-a.score);
    return cands[0]?.t || "";
  }
  function refText(r){
    return cleanRefCandidate(r&&r.referenceText) || cleanRefCandidate(r&&r.text) || cleanRefCandidate(r&&r.taskText) || defaultRefText();
  }
  function score(ref,spoken,seconds=60){
    const clean=s=>String(s||"").toLowerCase().replace(/[^\w\s']/g," ").replace(/\s+/g," ").trim();
    const a=clean(ref).split(" ").filter(Boolean), b=clean(spoken).split(" ").filter(Boolean);
    let correct=0, used=Array(b.length).fill(false);
    a.forEach(w=>{
      const i=b.findIndex((x,j)=>!used[j]&&x===w);
      if(i>=0){correct++;used[i]=true;}
    });

    const total=a.length;
    const missing=Math.max(0,total-correct);
    const extra=Math.max(0,b.length-correct);
    const repeated=b.filter((w,i)=>i>0&&b[i-1]===w).length;

    const accuracy=total?Math.round(correct/total*100):0;

    // Use real duration when available. For short texts, do not punish speed too harshly.
    const safeSeconds=Math.max(1, Number(seconds)||0);
    const minutes=Math.max(safeSeconds/60, 1/60);
    const wcpm=Math.round(correct/minutes);

    let speedScore=100;
    if(total>=12){
      speedScore=Math.max(50,Math.min(100,Math.round(wcpm/90*100)));
    }else{
      speedScore=Math.max(80,Math.min(100,Math.round(wcpm/60*100)));
    }

    const mistakePenalty = (missing*12) + (extra*4) + (repeated*3);
    let fluency=Math.max(0,Math.min(100,Math.round(accuracy*0.75 + speedScore*0.25 - repeated*2)));

    let finalScore=Math.round(accuracy*0.80 + fluency*0.10 + speedScore*0.10 - Math.min(20,mistakePenalty*0.25));

    // If the student read all required words with no extra/repeated words, it is a full correct reading.
    if(total>0 && correct===total && extra===0 && repeated===0){
      finalScore=100;
      fluency=100;
      speedScore=Math.max(95, speedScore);
    }else{
      // Very short mostly-correct readings should not be marked low because of speed formula.
      if(total<=8 && accuracy>=90 && missing===0){
        finalScore=Math.max(88, finalScore);
      }
      finalScore=Math.max(0,Math.min(100,finalScore));
    }

    return {
      accuracy,
      wcpm,
      fluency,
      speedScore,
      finalScore,
      mistakes:missing+extra+repeated,
      missing,
      extra,
      repeated,
      correctWords:correct,
      totalWords:total,
      aiScore:finalScore,
      analysisStatus:"Completed"
    };
  }

      if(id==="rp-v11-save-key"){const v=document.getElementById("rp-v11-api-key").value.trim(); if(v&&v!=="********")setKey(v); alert("API Key saved locally ✅"); document.getElementById("rp-v11-api-key").value="********"; return;}
      if(id==="rp-v11-clear-key"){setKey("");document.getElementById("rp-v11-api-key").value="";alert("API Key cleared.");return;}
      if(id==="rp-v11-test-key"){await testKey();return;}
      if(id==="rp-v11-clear-filters"){
        document.getElementById("rp-v11-class").value="";
        document.getElementById("rp-v11-student").value="";
        await renderCards();
        return;
      }
      if(id==="rp-v11-analyze-class"){
        const arr=await currentVisibleRecords();
        const ids=arr.filter(r=>!isDeleted(r)&&(r.audioId||r.audioDataUrl||r.audioUrl)&&r.status!=="rejected").map(r=>r.id);
        if(!ids.length)return alert("لا يوجد تسجيلات صوتية محفوظة في النطاق الظاهر.");
        for(const x of ids)await analyzeOne(x,true);
        await renderCards();
        return;
      }
      if(id==="rp-v11-analyze-all"){
        const ids=records().filter(r=>!isDeleted(r)&&(r.audioId||r.audioDataUrl||r.audioUrl)&&r.status!=="rejected").map(r=>r.id);
        if(!ids.length)return alert("لا يوجد تسجيلات صوتية محفوظة للتحليل.");
        for(const x of ids)await analyzeOne(x,true);
        await renderCards();
        return;
      }
      if(id==="rp-v11-accept-visible"||id==="rp-v11-retake-class"||id==="rp-v11-reject-class"){
        const arr=await currentVisibleRecords();
        if(!arr.length)return alert("لا توجد محاولات في النطاق الظاهر.");
        const st=(id==="rp-v11-retake-class")?"retake_allowed":(id==="rp-v11-reject-class")?"rejected":"accepted";
        if(st==="retake_allowed"&&!confirm("السماح للمحاولات الظاهرة بإعادة التسجيل؟"))return;
        if(st==="rejected"&&!confirm("رفض كل المحاولات الظاهرة؟"))return;
        for(const r of arr){ if(!isDeleted(r)) await updateRecord(r.id,{status:st}); }
        await renderCards();
        return;
      }
      const del=e.target.getAttribute("data-delete");
      if(del){
        if(!confirm("حذف هذه المحاولة من لوحة التقييم والحسابات؟")) return;
        await updateRecord(del,{deleted:true,status:"deleted"});
        await renderCards();
        return;
      }
      const an=e.target.getAttribute("data-analyze"); if(an){await analyzeOne(an,false);return;}
      const rid=e.target.getAttribute("data-id"), st=e.target.getAttribute("data-status"); if(rid&&st){ if(st==="retake_allowed"&&!confirm("السماح لهذا الطالب بإعادة التسجيل؟"))return; await updateRecord(rid,{status:st}); await renderCards(); }
    });
    panel.addEventListener("input",async e=>{const s=e.target.getAttribute("data-score"), n=e.target.getAttribute("data-notes"); if(s)await updateRecord(s,{teacherScore:e.target.value}); if(n)await updateRecord(n,{teacherNotes:e.target.value});});
    panel.addEventListener("input",async e=>{if(e.target.id==="rp-v11-class"||e.target.id==="rp-v11-student")await renderCards();});
    panel.addEventListener("change",async e=>{if(e.target.id==="rp-v11-class"||e.target.id==="rp-v11-student")await renderCards();});
    renderCards();
  }

  function searchText(v){ return String(v||"").trim().toLowerCase(); }
  function includesText(v,q){ return !q || String(v||"").toLowerCase().includes(q); }
  function studentLabel(r){
    return `${r.studentName||"Student"}${r.studentId?` · ${r.studentId}`:""}${r.className?` · ${r.className}`:""}`;
  }
  async function currentVisibleRecords(){
    const arr=await syncCloudIntoLocal();
    const clsQ=searchText(document.getElementById("rp-v11-class")?.value||"");
    const stuQ=searchText(document.getElementById("rp-v11-student")?.value||"");
    return arr.filter(r=>!isDeleted(r)
      && includesText(r.className,clsQ)
      && (!stuQ || includesText(r.studentName,stuQ) || includesText(r.studentId,stuQ) || includesText(studentLabel(r),stuQ)));
  }

  async function renderCards(){
    const panel=document.getElementById("rp-v11-panel"); if(!panel)return;
    const shown=await currentVisibleRecords();
    const completed=shown.filter(r=>finalScore(r)!=="");
    const counted=shown.filter(isCountableAttempt);
    const rejectedCount=shown.filter(isRejected).length;
    const avg=counted.length?Math.round(counted.reduce((s,r)=>s+Number(finalScore(r)),0)/counted.length):"-";
    document.getElementById("rp-v11-summary").innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap"><div style="padding:9px 12px;border-radius:12px;background:#eff6ff;color:#1d4ed8;font-weight:800">Submissions: ${shown.length}</div><div style="padding:9px 12px;border-radius:12px;background:#ecfdf5;color:#166534;font-weight:800">Analyzed: ${completed.length}</div><div style="padding:9px 12px;border-radius:12px;background:#fef2f2;color:#991b1b;font-weight:800">Rejected Excluded: ${rejectedCount}</div><div style="padding:9px 12px;border-radius:12px;background:#fff7ed;color:#9a3412;font-weight:800">Approved Average: ${avg}${avg==="-"?"":"%"}</div></div>`;
    const cards=document.getElementById("rp-v11-cards");
    if(!shown.length){cards.innerHTML=`<div style="padding:14px;background:#f8fafc;border-radius:12px;color:#64748b">Yet no submission.</div>`;return;}
    let out="";
    for(const r of shown){
      const item=r.audioId?await getAudio(r.audioId):null;
      const url=item&&item.blob?URL.createObjectURL(item.blob):(r.audioDataUrl||r.audioUrl||"");
      const audioSize=item&&item.size?item.size:(r.audioSize||0);
      const audioType=item&&item.type?item.type:(r.audioType||"audio/webm");
      out+=`<div style="border:1px solid #e2e8f0;border-radius:16px;padding:12px;background:#fff;box-shadow:0 4px 12px rgba(15,23,42,.06)"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px"><div><div style="font-size:18px;font-weight:900;color:#1e293b">${r.studentName||"Student"}</div><div style="color:#64748b;font-size:13px">${r.studentId||""} · ${r.className||""}</div></div><div style="font-size:22px;font-weight:900;color:#2563eb">${finalScore(r)===""?"-":finalScore(r)+"%"}</div></div><div style="display:grid;grid-template-columns:1fr;gap:8px"><div style="padding:9px;border-radius:12px;background:#f8fafc"><b>Status:</b> ${r.status||"submitted"} · <b>Analysis:</b> ${r.analysisStatus||"Pending"}</div><div style="padding:9px;border-radius:12px;background:#f8fafc"><b>Audio Recording:</b> <span style="color:${url?"#166534":"#dc2626"};font-weight:800">${url?fmt(audioSize)+" · "+(audioType||"audio"):"No audio attached"}</span>${url?`<audio controls src="${url}" style="width:100%;margin-top:6px"></audio>`:`<div style="color:#dc2626;font-weight:800;margin-top:6px">No audio attached</div>`}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><div style="padding:8px 10px;border-radius:12px;background:#eff6ff;color:#1d4ed8;font-weight:800">Acc: ${r.accuracy||"-"}</div><div style="padding:8px 10px;border-radius:12px;background:#ecfdf5;color:#166534;font-weight:800">WCPM: ${r.wcpm||"-"}</div><div style="padding:8px 10px;border-radius:12px;background:#fff7ed;color:#9a3412;font-weight:800">Fluency: ${r.fluency||"-"}</div><div style="padding:8px 10px;border-radius:12px;background:#fef2f2;color:#991b1b;font-weight:800">Mistakes: ${r.mistakes||"-"}</div><div style="padding:8px 10px;border-radius:12px;background:#f8fafc;color:#334155;font-weight:800">Words: ${r.correctWords||"-"}/${r.totalWords||"-"}</div></div>${r.referenceText?`<div style="padding:9px;border-radius:12px;background:#f8fafc;color:#334155"><b>Reference Text:</b><br>${r.referenceText}</div>`:""}${r.transcript?`<div style="padding:9px;border-radius:12px;background:#f8fafc;color:#334155"><b>Transcript:</b><br>${r.transcript}</div>`:""}<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input data-score="${r.id}" value="${r.teacherScore||""}" placeholder="Teacher score optional" style="flex:1;min-width:150px;padding:10px;border:1px solid #cbd5e1;border-radius:10px"><input data-notes="${r.id}" value="${r.teacherNotes||""}" placeholder="Notes optional" style="flex:2;min-width:180px;padding:10px;border:1px solid #cbd5e1;border-radius:10px"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" data-analyze="${r.id}" style="padding:10px 12px;border:0;border-radius:10px;background:#7c3aed;color:white;font-weight:800">Analyze Saved Recording</button><button type="button" data-id="${r.id}" data-status="accepted" style="padding:10px 12px;border:0;border-radius:10px;background:#16a34a;color:white;font-weight:800">Accept</button><button type="button" data-id="${r.id}" data-status="retake_allowed" style="padding:10px 12px;border:0;border-radius:10px;background:#f59e0b;color:white;font-weight:800">Allow Retake</button><button type="button" data-id="${r.id}" data-status="rejected" style="padding:10px 12px;border:0;border-radius:10px;background:#dc2626;color:white;font-weight:800">Reject</button><button type="button" data-delete="${r.id}" style="padding:10px 12px;border:0;border-radius:10px;background:#475569;color:white;font-weight:800">Delete Attempt</button></div></div></div>`;
    }
    cards.innerHTML=out;
  }

  async function studentStatus(){
    const currentUserRole = String(user().role||"").toLowerCase();
    if(currentUserRole.includes("teacher")) return;
    if(!(document.body.innerText||"").includes("Reading Progress")) return;

    let all=[];
    try{ all=await syncCloudIntoLocal(); }catch(e){ all=records(); }

    const u=user(), ok=canSubmit(u.id);
    const mine=all.filter(r=>r && r.studentId===u.id && r.taskId===taskId() && !isDeleted(r));
    const counted=mine.filter(isCountableAttempt);
    const rejectedCount=mine.filter(isRejected).length;
    const acceptedCount=mine.filter(r=>r.status==="accepted").length;
    const last=mine.length?mine.slice().sort((a,b)=>recordTime(a)-recordTime(b))[mine.length-1]:null;
    const best=counted.length?Math.max(...counted.map(r=>Number(finalScore(r)||0))):"";
    const avg=counted.length?Math.round(counted.reduce((s,r)=>s+Number(finalScore(r)||0),0)/counted.length):"";
    const lastScore=last&&finalScore(last)!==""?finalScore(last):"";
    const statusText=!last?"No submission yet":
      last.status==="accepted"?"Accepted":
      last.status==="rejected"?"Rejected":
      last.status==="retake_allowed"?"Retake allowed":
      last.analysisStatus==="Completed"?"Analyzed / waiting for teacher":
      "Submitted / waiting for teacher";

    let box=document.getElementById("rp-v11-student-status");
    if(!box){
      box=document.createElement("div");
      box.id="rp-v11-student-status";
      box.style.cssText="margin:10px 24px;padding:12px;border-radius:16px;font-family:system-ui;font-weight:800;line-height:1.6;border:1px solid #dbeafe";
      const host=(document.getElementById("root")||document.body);
      if(host.firstChild) host.insertBefore(box, host.firstChild);
      else host.appendChild(box);
    }

    box.innerHTML=`
      <div style="font-size:16px;color:#1e293b;margin-bottom:8px">📊 Reading Progress Performance</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span style="padding:7px 10px;border-radius:12px;background:#eff6ff;color:#1d4ed8">Status: ${statusText}</span>
        <span style="padding:7px 10px;border-radius:12px;background:#ecfdf5;color:#166534">Last: ${lastScore===""?"-":lastScore+"%"}</span>
        <span style="padding:7px 10px;border-radius:12px;background:#fff7ed;color:#9a3412">Best: ${best===""?"-":best+"%"}</span>
        <span style="padding:7px 10px;border-radius:12px;background:#f8fafc;color:#334155">Average: ${avg===""?"-":avg+"%"}</span>
        <span style="padding:7px 10px;border-radius:12px;background:#f8fafc;color:#334155">Attempts: ${mine.length}</span>
        <span style="padding:7px 10px;border-radius:12px;background:#ecfdf5;color:#166534">Accepted: ${acceptedCount}</span>
        <span style="padding:7px 10px;border-radius:12px;background:#fef2f2;color:#991b1b">Rejected excluded: ${rejectedCount}</span>
      </div>
      ${last&&last.teacherNotes?`<div style="margin-top:8px;color:#475569">Teacher note: ${last.teacherNotes}</div>`:""}
      <div style="margin-top:8px;color:#64748b;font-size:12px">Only teacher-accepted or manually scored attempts are counted. Submitted, retake-allowed, rejected, and deleted attempts are excluded from Average / Best.</div>
    `;
    box.style.background="#ffffff";
    box.style.color="#334155";
    // التسجيل والإرسال متاحان دائمًا للطالب.
  }

  setTimeout(()=>{teacherPanel();studentStatus();},1000);
  setInterval(()=>{if(!panelMade)teacherPanel();studentStatus();},4000);
})();
 // ===== END READING PROGRESS V11 INDEXEDDB STORAGE FIX =====

<script id="safe-smart-scroll-only">
(function(){
  var btn=document.createElement("button");
  btn.className="safe-smart-scroll-btn";
  btn.type="button";
  btn.textContent="↓";
  document.body.appendChild(btn);
  var hideTimer=null;
  function maxScroll(){return Math.max(1, document.documentElement.scrollHeight-window.innerHeight);}
  function showButton(){
    var y=window.scrollY || document.documentElement.scrollTop || 0;
    var nearBottom=y > maxScroll()*0.55;
    btn.textContent=nearBottom ? "↑" : "↓";
    btn.onclick=function(){
      var now=window.scrollY || document.documentElement.scrollTop || 0;
      if(now > maxScroll()*0.55){ window.scrollTo({top:0,behavior:"smooth"}); }
      else { window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"}); }
    };
    btn.classList.add("show");
    clearTimeout(hideTimer);
    hideTimer=setTimeout(function(){btn.classList.remove("show");},2200);
  }
  window.addEventListener("scroll", showButton, {passive:true});
  window.addEventListener("touchmove", showButton, {passive:true});
  window.addEventListener("wheel", showButton, {passive:true});
})();
</script>
