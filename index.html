async function adminFastQuery(col, field, value){
  value = value==null ? "" : String(value).trim();
  if(!value) return [];
  if(!FIREBASE_OK){
    const arr = await fsAll(col);
    return (arr||[]).filter(x=>String(x&&x[field]||"").trim()===value);
  }
  try{
    const snap = await db.collection(col).where(field,"==",value).get();
    return snap.docs.map(d=>({...d.data(),id:(d.data()&&d.data().id)||d.id,_id:d.id}));
  }catch(e){ console.warn("fast query failed", col, field, value, e&&e.message); return []; }
}
function adminUniqueRows(rows){
  const m={};
  (rows||[]).forEach(r=>{const id=String((r&&(r._id||r.id))||""); if(id) m[id]=r;});
  return Object.values(m);
}
async function adminBatchDelete(col, rows, onProgress){
  rows=adminUniqueRows(rows||[]);
  if(!rows.length) return 0;
  if(!FIREBASE_OK){
    let count=0;
    for(const r of rows){ await fsDel(col,r.id||r._id); count++; if(onProgress) onProgress(1,col,count,rows.length); }
    return count;
  }
  let count=0;
  for(let i=0;i<rows.length;i+=450){
    const slice=rows.slice(i,i+450);
    const batch=db.batch();
    let chunkCount=0;
    slice.forEach(r=>{const id=r._id||r.id; if(id){ batch.delete(db.collection(col).doc(String(id))); chunkCount++; }});
    if(chunkCount){ await batch.commit(); count+=chunkCount; if(onProgress) onProgress(chunkCount,col,count,rows.length); }
  }
  return count;
}
async function adminBatchSet(col, rows){
  rows=(rows||[]).filter(r=>r && (r.id||r._id));
  if(!rows.length) return 0;
  if(!FIREBASE_OK){ for(const r of rows){ await fsSet(col,r.id||r._id,r); } return rows.length; }
  let count=0;
  for(let i=0;i<rows.length;i+=450){
    const batch=db.batch();
    rows.slice(i,i+450).forEach(r=>{const id=r.id||r._id; if(id){ const clean=eqCleanFirestoreData({...r,id:String(id)}); delete clean._id; batch.set(db.collection(col).doc(String(id)),clean,{merge:false}); count++; }});
    await batch.commit();
  }
  return count;
}
function eqCleanFirestoreData(value){
  if(value === undefined) return undefined;
  if(value === null) return null;
  if(Array.isArray(value)){
    return value.map(eqCleanFirestoreData).filter(function(v){return v !== undefined;});
  }
  if(value && typeof value === "object"){
    const out={};
    Object.keys(value).forEach(function(k){
      const v=eqCleanFirestoreData(value[k]);
      if(v !== undefined) out[k]=v;
    });
    return out;
  }
  return value;
}
async function adminBatchSetMergeQuick(col, rows, timeoutMs){
  rows=(rows||[]).filter(r=>r && (r.id||r._id));
  if(!rows.length) return 0;
  const work=(async function(){
    if(!FIREBASE_OK){ for(const r of rows){ await fsSet(col,r.id||r._id,r); } return rows.length; }
    let count=0;
    for(let i=0;i<rows.length;i+=450){
      const batch=db.batch();
      rows.slice(i,i+450).forEach(function(r){
        const id=String(r.id||r._id||"");
        if(id){ const clean=eqCleanFirestoreData({...r,id:id}); delete clean._id; batch.set(db.collection(col).doc(id), clean, {merge:true}); count++; }
      });
      await batch.commit();
    }
    return count;
  })();
  if(!timeoutMs) return work;
  return await Promise.race([work, new Promise(function(_,reject){setTimeout(function(){reject(new Error("Firestore write timeout after "+timeoutMs+"ms"));}, timeoutMs);})]);
}
async function adminClearDeletedStudentMarksForRows(rows){
  rows=(rows||[]).filter(Boolean);
  if(!rows.length) return 0;
  const keySet=new Set();
  rows.forEach(function(r){ adminStudentDeleteKeys(r).forEach(function(k){ if(k) keySet.add(String(k)); }); });
  if(!keySet.size) return 0;
  try{
    const local=adminDeletedStudentSet();
    let changed=false;
    keySet.forEach(function(k){ if(local.has(String(k))){ local.delete(String(k)); changed=true; } const sid=eqDigits(k); if(sid && local.has("student_"+sid)){ local.delete("student_"+sid); changed=true; } });
    if(changed) localStorage.setItem("eq_deleted_student_ids", JSON.stringify(Array.from(local)));
  }catch(_e){}
  const docs=[];
  keySet.forEach(function(k){ docs.push({id:k}); const sid=eqDigits(k); if(sid) docs.push({id:"student_"+sid}); });
  try{
    const marks=await fsAll("deletedStudents").catch(function(){return [];});
    (marks||[]).forEach(function(m){
      if(adminStudentDeleteKeys(m).some(function(k){return keySet.has(String(k));})){ docs.push({id:String(m.id||m._id||"")}); }
    });
  }catch(_e){}
  try{
    const n=await adminBatchDelete("deletedStudents", adminUniqueRows(docs.filter(function(x){return x&&x.id;})));
    return n||0;
  }catch(e){ console.warn("clear deleted student marks failed", e&&e.message); return 0; }
}

function adminSidFromAny(v){ return eqDigits(String(v===undefined||v===null?"":v)); }
function adminRecordMatchesSidSet(rec, sidSet){

  for(const f of fields){

    if(rec.student && typeof rec.student==="object"){
      const sid=adminSidFromAny(rec.student.studentId||rec.student.id||rec.student._id);

async function adminPurgeStudentsAndAllDataFast(students, opts){
  opts=opts||{};
  const progress=typeof opts.onProgress==="function"?opts.onProgress:null;
  const rows=adminUniqueRows(students||[]).filter(Boolean);
  const sidSet=new Set();
  const userDocs=[];
  rows.forEach(function(st){
    const sid=adminSidFromAny(st.studentId||st.id||st._id||st.password);
    if(sid){ sidSet.add(String(sid)); userDocs.push({id:"student_"+sid}); userDocs.push({id:String(sid)}); }

  });
  const deleted={students:0,responses:0,reading:0,readingTheory:0,projects:0,gradebook:0,notes:0,writing:0,deletedStudentMarks:0};
  const emit=function(stage,done,total){ if(progress) progress({stage:stage,done:done||0,total:total||0}); };

  function chunkArray(arr,n){ const out=[]; for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; }
  function classTokenSetFromOpts(){
    const set=new Set();
    const raw=opts.classId || opts.className || opts.class || opts.grade || "";
    const canon=canonicalClassId(raw);
    const off=officialClassRow(canon)||{};
    const cls={id:canon||raw,name:off.name||opts.className||raw,grade:off.grade||opts.grade||raw,classId:canon||raw};
    try{ adminClassAliases(cls).forEach(function(x){ if(x!==undefined&&x!==null&&String(x).trim()) set.add(String(x).trim()); const c=canonicalClassId(x); if(c) set.add(c); }); }catch(_e){}
    [raw,canon,off.name,off.grade].forEach(function(x){ if(x!==undefined&&x!==null&&String(x).trim()) set.add(String(x).trim()); });
    return set;
  }
  const classTokens=classTokenSetFromOpts();
  if(!sidSet.size && !userDocs.length && !classTokens.size){ emit("Nothing to delete",1,1); return deleted; }
  function recordMatchesClassTokens(rec){
    if(!rec || !classTokens.size) return false;
    const fields=["classId","className","class","grade","targetClassId","courseClassId","studentClassId"];
    for(const f of fields){
      const v=rec[f];
      if(v!==undefined&&v!==null){
        const s=String(v).trim();
        if(classTokens.has(s) || classTokens.has(canonicalClassId(s))) return true;
      }
    }
    return false;
  }
  async function queryRowsByIn(col, field, values){
    values=Array.from(new Set((values||[]).map(v=>String(v||"").trim()).filter(Boolean)));
    if(!values.length) return [];
    if(!FIREBASE_OK){
      try{ const arr=JSON.parse(localStorage.getItem("eq_"+col)||"[]"); return (arr||[]).filter(function(r){ return values.includes(String(r&&r[field]||"")); }); }catch(_e){ return []; }
    }
    const groups=chunkArray(values,10);
    const snaps=await Promise.all(groups.map(function(g){
      return db.collection(col).where(field,"in",g).get().then(function(s){ return s.docs.map(function(d){ const data=d.data()||{}; return {...data,id:data.id||d.id,_id:d.id}; }); }).catch(function(){ return []; });
    }));
    return [].concat.apply([],snaps);
  }
  async function findRelatedRowsFast(col){
    const sidVals=Array.from(sidSet);
    const idVals=[];
    sidVals.forEach(function(sid){ idVals.push(sid); idVals.push("student_"+sid); });
    const sidFields=["studentId","student_id","studentNumber","userId","uid","ownerId","createdBy","password","studentPassword","restoredFromStudentId","restoredFrom"];
    const classFields=["classId","className","class","grade","targetClassId","courseClassId","studentClassId"];
    const tasks=[];
    sidFields.forEach(function(f){ tasks.push(queryRowsByIn(col,f,sidVals)); tasks.push(queryRowsByIn(col,f,idVals)); });
    if(classTokens.size){ classFields.forEach(function(f){ tasks.push(queryRowsByIn(col,f,Array.from(classTokens))); }); }
    const found=adminUniqueRows([].concat.apply([], await Promise.all(tasks)));
    return found.filter(function(r){ return adminRecordMatchesSidSet(r,sidSet) || recordMatchesClassTokens(r); });
  }

  // Delete roster docs first. This is the fast visible part and should finish in seconds for 35 students.
  const uniqueUserDocs=adminUniqueRows(userDocs);
  emit("Deleting student accounts",0,uniqueUserDocs.length);
  deleted.students=await adminBatchDelete("users", uniqueUserDocs, function(inc,col,count,total){ emit("Deleting student accounts",count,total); });
  try{
    const dsDocs=adminUniqueRows([].concat(uniqueUserDocs, Array.from(sidSet).map(function(sid){return {id:"student_"+sid};})));
    emit("Deleting old delete markers",0,dsDocs.length);
    deleted.deletedStudentMarks=await adminBatchDelete("deletedStudents", dsDocs, function(inc,col,count,total){ emit("Deleting old delete markers",count,total); });
  }catch(_e){}

  const colMap=[
    ["responses","responses","quiz responses"],
    ["readingSubmissions","reading","reading submissions"],
    ["readingAttemptResets","reading","reading reset records"],
    ["readingTheoryResponses","readingTheory","AI reading records"],
    ["projectSubmissions","projects","project submissions"],
    ["gradebook","gradebook","gradebook records"],
    ["notes","notes","notes"]
  ];
  emit("Finding related data",0,colMap.length);
  const related=await Promise.all(colMap.map(function(x,idx){
    emit("Finding related data",idx+1,colMap.length);
    return findRelatedRowsFast(x[0]).catch(function(){ return []; });
  }));
  const totalRelated=related.reduce(function(a,b){ return a+(b?b.length:0); },0);
  let relatedDone=0;
  for(let i=0;i<colMap.length;i++){
    const col=colMap[i][0], bucket=colMap[i][1], label=colMap[i][2];
    const matches=adminUniqueRows(related[i]||[]);
    if(matches.length){
      emit("Deleting "+label,relatedDone,totalRelated);
      const n=await adminBatchDelete(col,matches,function(inc,c,count,total){ emit("Deleting "+label,relatedDone+count,totalRelated||total); });
      relatedDone+=matches.length;
      deleted[bucket]=(deleted[bucket]||0)+n;
    }
  }
  try{
    emit("Checking writing records",0,1);
    const appSettings=await fsAll("appSettings");
    const wdoc=cleanupWriteDocFromSettings(appSettings||[]);
    if(wdoc){
      const clone=JSON.parse(JSON.stringify(wdoc));
      const before=(clone.submissions||[]).length;
      clone.submissions=(clone.submissions||[]).filter(function(x){ return !(adminRecordMatchesSidSet(x,sidSet) || recordMatchesClassTokens(x)); });

    }
    emit("Checking writing records",1,1);
  }catch(_e){}
  emit("Hard delete completed",1,1);
  return deleted;
}

function adminClassValueMatchesAliases(value, aliasSet){

  const parts=raw.split(/[|,;/]+/).map(x=>x.trim()).filter(Boolean);
  return parts.some(function(x){ return aliasSet.has(x) || aliasSet.has(canonicalClassId(x)); });
}

  for(const f of fields){ if(adminClassValueMatchesAliases(u[f], aliasSet)) return true; }

  const canon=canonicalClassId(classId);
  if(!EQ_ACTUAL_CLASS_IDS.includes(canon)) return 0;
  const rows=await adminFastClassStudents({id:canon,name:(officialClassRow(canon)||{}).name,grade:(officialClassRow(canon)||{}).grade}, []);
  const remove=rows.filter(function(st){
    const sid=eqDigits(st.studentId||st.id||st._id||"");
    return sid && !(keepSidSet&&keepSidSet.has(sid));
  });
  if(!remove.length) return 0;
  const stamp=new Date().toISOString();
  const tombs=remove.map(function(st){
    const sid=eqDigits(st.studentId||st.id||st._id||"");
    return {...st,id:sid?"student_"+sid:String(st.id||st._id||uid()),role:"student",studentId:sid||st.studentId||"",deleted:true,status:"deleted",hidePreloaded:true,permanentDeleted:true,adminDeletedAt:stamp,cleanupDeletedAt:stamp,updatedAt:today()};
  });
  await adminBatchSet("users", tombs);
  await adminBatchSet("deletedStudents", tombs);
  return tombs.length;
}

  // SAFE_MISSING_GRADE_RESTORE_V3: diagnostic + restore quiz grades only. Does not touch RP/readings.
  function safeDigits(v){
    return String(v||"").replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d);}).replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);}).trim();
  }
  function safeName(v){
    return safeDigits(v).toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ـ/g,"").replace(/\bبن\b/g," ").replace(/\bابن\b/g," ").replace(/[^\u0600-\u06FFa-z0-9]+/g," ").replace(/\s+/g," ").trim();
  }
  const SAFE_RESTORE_ALIASES = [
    {sid:"3132", names:["مهدي بوحسن","مهدي بو حسن","مهدي حبيب بوحسن","مهدي بن حبيب بن عايش بوحسن"]},

    {sid:"3309", names:["حسين الشقاق","حسين احمد الشقاق","حسين أحمد الشقاق"]},
    {sid:"3135", names:["حسن محمد العلي","حسن العلي"]},
    {sid:"3136", names:["أحمد علي الخميس","احمد علي الخميس","ahmed ali alkhamis"]}
  ];
  function safeOfficialMaps(rawUsers){
    const allOfficial = [];
    const bySid = {};
    const byId = {};
    (PRELOADED_USERS||[]).forEach(p=>{
      const sid=safeDigits(p.studentId);
      const live=(rawUsers||[]).find(u=>safeDigits(u.studentId)===sid && (u.preloaded || String(u.id)===String(p.id))) || (data.users||[]).find(u=>safeDigits(u.studentId)===sid) || p;
      const off={...p,...live,id:(live&&live.id)||p.id,studentId:sid,preloaded:true,deleted:false};
      if(sid){ bySid[sid]=off; byId[off.id]=off; allOfficial.push(off); }
    });
    return {allOfficial,bySid,byId};
  }
  function safeTargetFromText(text, maps){
    const raw=safeDigits(text);
    const n=safeName(text);
    const idMatch=raw.match(/\b(3\d{3}|\d{4})\b/);
    if(idMatch && maps.bySid[idMatch[1]]) return maps.bySid[idMatch[1]];
    for(const a of SAFE_RESTORE_ALIASES){
      if((a.names||[]).some(x=>{const ax=safeName(x); return n===ax || n.includes(ax) || ax.includes(n);}) && maps.bySid[a.sid]) return maps.bySid[a.sid];
    }
    let best=null, score=0;
    for(const o of maps.allOfficial){
      const on=safeName(o.name), os=safeName(o.shortName);
      if(!on) continue;
      if(n===on || (os && n===os)) return o;
      const parts=on.split(" ").filter(x=>x.length>1);
      const hits=parts.filter(x=>n.includes(x)).length;
      if(hits>=3 && hits>score){best=o; score=hits;}
    }
    return best;
  }
  function safeTargetForUser(u, maps){
    if(!u) return null;
    const sid=safeDigits(u.studentId||u.studentNumber||"");
    if(sid && maps.bySid[sid]) return maps.bySid[sid];
    return safeTargetFromText([u.name,u.shortName,u.email,u.id,u.studentId].join(" "), maps);
  }

  // SECOND_FOURTH_RELINK_TOOL_20260610: diagnostic + relink attempts only for ثاني رابع. No delete, no merge, no RP changes.
  function sfIsSecondFourthSid(sid){ return /^24\d{2,}$/.test(safeDigits(sid)); }
  function sfCurrentSecondFourthMaps(rawUsers){
    const rows=[...(rawUsers||[]),...(data.users||[])];
    const bySid={};
    rows.forEach(u=>{
      if(!u || u.role!=="student" || u.deleted) return;
      const sid=safeDigits(u.studentId||u.studentNumber||"");
      const cid=canonicalClassId(u.classId||u.className||u.class||"");
      if(sfIsSecondFourthSid(sid) && cid==="class_2_4"){
        const current=(data.users||[]).find(x=>safeDigits(x.studentId)===sid && !x.deleted) || u;
        bySid[sid]={...u,...current,studentId:sid,classId:"class_2_4"};
      }
    });
    return bySid;
  }
  function sfMatchSecondFourthTarget(resp, sourceUser, bySid){
    const texts=[sourceUser?.studentId, sourceUser?.studentNumber, sourceUser?.id, sourceUser?.email, sourceUser?.name, sourceUser?.shortName, resp?.studentId, resp?.studentNumber, resp?.userId, resp?.email, resp?.studentName, resp?.name, resp?.id].filter(Boolean).join(" ");
    const direct=safeDigits(texts).match(/\b(24\d{2,})\b/);
    if(direct && bySid[direct[1]]) return bySid[direct[1]];
    const rn=safeName(texts);
    let best=null, score=0;
    Object.values(bySid).forEach(t=>{
      const tn=safeName([t.name,t.shortName].join(" "));
      if(!tn) return;
      if(rn===tn || rn.includes(tn) || tn.includes(rn)){ best=t; score=99; return; }
      const parts=tn.split(" ").filter(x=>x.length>1);
      const hits=parts.filter(x=>rn.includes(x)).length;
      if(hits>=3 && hits>score){ best=t; score=hits; }
    });
    return best;
  }

  function importClassTargetFromCell(raw, classList){
    const cell=String(raw||"").trim();
    if(!cell) return null;
    const digits=eqDigits(cell);
    let canon=canonicalClassId(cell);
    if(/^\d$/.test(digits)) canon="class_3_"+digits;
    if(!EQ_ACTUAL_CLASS_IDS.includes(canon)) return null;
    const off=officialClassRow(canon);
    return off ? {id:off.id,name:off.name,grade:off.grade||""} : null;
  }

  async function ensureImportClassExists(target, classList){
    if(!target || !target.id) return "";
    const canon=canonicalClassId(target.id||target.name||target.grade);
    if(!EQ_ACTUAL_CLASS_IDS.includes(canon)) return "";
    const off=officialClassRow(canon)||target;
    const existingClassForImport=[].concat(classList||[], myClasses||[], (data&&data.classes)||[]).find(function(c){return c&&sameClassId(c.id||c.classId||c.grade||c.name, canon);})||{};
    const keepRosterToken=String(existingClassForImport.rosterToken||existingClassForImport.classRosterToken||"").trim();
    const row={id:canon, name:off.name||target.name||canon, grade:off.grade||target.grade||"", teacherIds:[user.id,"GLOBAL"], createdAt:existingClassForImport.createdAt||today(), updatedAt:today(), active:true, source:"teacher-created", preloaded:false, deleted:false, status:"active", hidePreloaded:false, permanentDeleted:false, ...(keepRosterToken?{rosterToken:keepRosterToken,emptyNewClass:existingClassForImport.emptyNewClass===true}: {})};
    try{ await fsDel("deletedClasses", row.id); }catch(e){}

    if(classList && !classList.some(c=>sameClassId(c.id,row.id))) classList.push(row);
    try{ mergeWrittenClassesIntoLocal([row]); }catch(e){}

  function studentDocIdForWrite(u, sid){
    const clean=eqDigits(sid || (u&&u.studentId) || (u&&u.id) || "");
    return String((u&&(u._id||u.id)) || (clean?"student_"+clean:uid()));
  }
  function mergeWrittenUsersIntoLocal(rows){
    try{
      if(!Array.isArray(rows)) return;
      const cleanedRows=rows.map(function(r){ if(!r) return null; const sid=eqDigits(r.studentId||r.id||r._id||""); const id=String(r.id|| (sid?"student_"+sid:uid())); const clean={...r,id:id}; delete clean._id; Object.keys(clean).forEach(function(k){ if(clean[k]===undefined) delete clean[k]; }); return clean; }).filter(Boolean);
      try{
        setLocalStudentPatch(function(prev){
          const map=new Map();
          (Array.isArray(prev)?prev:[]).forEach(function(u){ const sid=eqDigits(u.studentId||u.id||""); map.set(sid?"student_"+sid:String(u.id||uid()), u); });
          cleanedRows.forEach(function(u){ const sid=eqDigits(u.studentId||u.id||""); map.set(sid?"student_"+sid:String(u.id||uid()), {...(map.get(sid?"student_"+sid:String(u.id||""))||{}),...u}); });
          return Array.from(map.values());
        });
      }catch(_stateErr){}
      const liveKeySet=new Set();
      cleanedRows.forEach(function(clean){ adminStudentDeleteKeys(clean).forEach(function(k){ if(k) liveKeySet.add(String(k)); }); });
      if(data && Array.isArray(data.deletedStudents)){
        data.deletedStudents=data.deletedStudents.filter(function(ds){ return !adminStudentDeleteKeys(ds).some(function(k){return liveKeySet.has(String(k));}); });
      }
      if(data && Array.isArray(data.users)){
        data.users=data.users.filter(function(u){
          if(!isStudentTombstone(u)) return true;
          return !adminStudentDeleteKeys(u).some(function(k){return liveKeySet.has(String(k));});
        });
        const byId=new Map(data.users.map((u,i)=>[String(u.id||u._id||""),i]));
        cleanedRows.forEach(function(clean){
          if(!clean) return;
          const id=String(clean.id||"");
          if(!id) return;
          const idx=byId.get(id);
          if(idx!==undefined) data.users[idx]={...(data.users[idx]||{}),...clean};
          else { data.users.push(clean); byId.set(id,data.users.length-1); }
        });
      }
      try{
        const arr=JSON.parse(localStorage.getItem("eq_users")||"[]");
        const byId=new Map((Array.isArray(arr)?arr:[]).map((u,i)=>[String(u.id||u._id||""),i]));
        const out=Array.isArray(arr)?arr:[];
        cleanedRows.forEach(function(clean){ const id=String(clean.id||""); if(!id)return; const idx=byId.get(id); if(idx!==undefined) out[idx]={...(out[idx]||{}),...clean}; else {out.push(clean); byId.set(id,out.length-1);} });
        localStorage.setItem("eq_users", JSON.stringify(out));
      }catch(_e){}
    }catch(e){ console.warn("merge local users failed", e); }
  }

  function removeStudentsFromClassLocally(classId){
    const canon=canonicalClassId(classId);
    if(!canon) return 0;
    const stamp=new Date().toISOString();
    const rows=[].concat(Array.isArray(data&&data.users)?data.users:[], Array.isArray(localStudentPatch)?localStudentPatch:[])
      .filter(st=>st && st.role==="student" && st.deleted!==true && st.status!=="deleted" && sameClassId(st.classId||st.className||st.class||"", canon));
    const seen=new Set();
    const tombs=[];
    rows.forEach(function(st){
      const sid=eqDigits(st.studentId||st.id||st._id||"");
      const id=sid?"student_"+sid:String(st.id||st._id||uid());
      if(seen.has(id)) return;
      seen.add(id);
      const t={...st,id:id,role:"student",studentId:sid||st.studentId||"",classId:canon,deleted:true,status:"deleted",hidePreloaded:true,permanentDeleted:true,adminDeletedAt:stamp,updatedAt:today()};
      delete t._id;
      Object.keys(t).forEach(function(k){ if(t[k]===undefined) delete t[k]; });
      tombs.push(t);
    });
    try{
      if(data && Array.isArray(data.users)){
        data.users=data.users.filter(st=>!(st && st.role==="student" && sameClassId(st.classId||st.className||st.class||"", canon)));
      }
    }catch(_e){}
    try{
      setLocalStudentPatch(function(prev){
        const out=(Array.isArray(prev)?prev:[]).filter(st=>!(st && st.role==="student" && sameClassId(st.classId||st.className||st.class||"", canon)));
        return out.concat(tombs);
      });
    }catch(_e){}
    try{
      const arr=JSON.parse(localStorage.getItem("eq_users")||"[]");
      if(Array.isArray(arr)) localStorage.setItem("eq_users", JSON.stringify(arr.filter(st=>!(st && st.role==="student" && sameClassId(st.classId||st.className||st.class||"", canon)))));
    }catch(_e){}
    return tombs.length;
  }

  function eqSidSetFromRows(rows){

  function removeStudentDataLocallyBySidSet(sidSet){

      ["responses","readingSubmissions","readingAttemptResets","readingTheoryResponses","projectSubmissions","gradebook","notes"].forEach(function(k){ if(Array.isArray(data[k])) data[k]=data[k].filter(function(r){ return !hit(r); }); });
      try{ const wdoc=cleanupWriteDocFromSettings(data.appSettings||[]); if(wdoc && Array.isArray(wdoc.submissions)){ wdoc.submissions=wdoc.submissions.filter(function(x){ return !hit(x); }); } }catch(_e){}
    }catch(e){ console.warn("local data remove failed", e); }

  function hardClearClassFromScreen(classId){
    const canon=canonicalClassId(classId);
    if(!canon) return {students:0,sids:new Set()};
    const rows=[].concat(Array.isArray(data&&data.users)?data.users:[], Array.isArray(localStudentPatch)?localStudentPatch:[])
      .filter(function(st){ return st && st.role==="student" && sameClassId(st.classId||st.className||st.class||st.grade||"", canon); });

    const n=removeStudentsFromClassLocally(canon);
    removeStudentDataLocallyBySidSet(sidSet);
    try{ localStorage.removeItem(EQ_FAST_DATA_CACHE_KEY); }catch(_e){}
    return {students:n, sids:sidSet};
  }

  async function importStudents(e){
    const file=e.target.files&&e.target.files[0]; if(!file)return;
    const preTarget=(importTargetClass && importTargetClass!=="excel") ? canonicalClassId(importTargetClass) : "";
    if(preTarget && EQ_ACTUAL_CLASS_IDS.includes(preTarget)){
      setResettingClassId(preTarget);
      hardClearClassFromScreen(preTarget);
      setFilterCls(preTarget);
      setImportMsg("Cleared "+((officialClassRow(preTarget)||{}).name||preTarget)+" from the screen. Importing the Excel roster now…");
    }else{
      setImportMsg("Importing students…");
    }
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      if(!rows.length){setImportMsg("No rows found.");return;}
      const header=rows[0].map(x=>String(x||"").trim().toLowerCase());
      let ci={name:-1,id:-1,cls:-1,email:-1};
      header.forEach((h,i)=>{
        if(ci.name<0&&(h==="name"||h.includes("name")||h.includes("اسم"))) ci.name=i;
        else if(ci.id<0&&(h==="id"||h.includes("student")||h.includes("رقم")||h.includes("هوية"))) ci.id=i;
        else if(ci.cls<0&&(h==="class"||h.includes("class")||h.includes("grade")||h.includes("صف")||h.includes("فصل"))) ci.cls=i;
        else if(ci.email<0&&h.includes("email")) ci.email=i;
      });
      const hasHeader=ci.name>=0||ci.id>=0;
      if(!hasHeader){ci={name:0,id:1,cls:2,email:-1};}
      const dataRows=rows.slice(hasHeader?1:0);
      let added=0,updated=0,skipped=0;
      const writeRows=[];
      const existingLocal=(data&&Array.isArray(data.users))?data.users:[];
      const bySid={}; existingLocal.forEach(u=>{const sid=eqDigits(u&&u.studentId); if(sid) bySid[sid]=u;});
      let targetClassId="";
      if(importTargetClass && importTargetClass!=="excel"){
        targetClassId=canonicalClassId(importTargetClass);
        if(!EQ_ACTUAL_CLASS_IDS.includes(targetClassId)){ setImportMsg("اختر فصلًا صحيحًا: ثالث ثاني / ثالث رابع / ثالث سادس."); return; }
        await ensureImportClassExists({id:targetClassId}, []);
      }
      for(const r of dataRows){
        const name=String(r[ci.name]||"").trim();
        const sid=eqDigits(String(r[ci.id]||"").trim());
        if(!name||!sid){skipped++;continue;}
        let classId=targetClassId;
        if(!classId && ci.cls>=0){ const t=importClassTargetFromCell(r[ci.cls], myClasses); if(t){ classId=await ensureImportClassExists(t, []); } }
        if(!classId){ skipped++; continue; }
        const base=bySid[sid] || {};
        const row=eqSafeActiveStudentRow({...base,email:(ci.email>=0?String(r[ci.email]||"").trim().toLowerCase():base.email||"")}, sid, classId, name);
        const rt=eqClassRosterTokenForClassId(classId, [].concat(myClasses||[], (data&&data.classes)||[]));
        if(rt) row.classRosterToken=rt;
        writeRows.push(row);
        if(base.id||base._id) updated++; else added++;
      }
      if(!writeRows.length){ setImportMsg("No valid students to import. تأكد من الأعمدة Name و ID واختر الفصل الصحيح."); return; }
      let cleanedOldInTarget=0;
      let resetInfo=null;
      if(targetClassId){
        // Remove stale students from the screen immediately, then hard-reset old Firebase records
        // before writing the new Excel roster. This prevents old names/grades from returning after refresh.
        const cleared=hardClearClassFromScreen(targetClassId);
        cleanedOldInTarget=cleared.students||0;
        setImportMsg("Saving new Excel roster to "+((officialClassRow(targetClassId)||{}).name||targetClassId)+"… Old names are blocked from display.");
        // Do not hard-delete Firebase records automatically during Excel import.
        // The rosterToken on newly-created empty classes prevents old students from appearing.
        await adminClearDeletedStudentMarksForRows(writeRows);
        resetInfo={oldStudents:0, deleted:{}};
      }else{
        await adminClearDeletedStudentMarksForRows(writeRows);
      }
      await adminBatchSetMergeQuick("users", writeRows, 20000);
      await adminClearDeletedStudentMarksForRows(writeRows);
      mergeWrittenUsersIntoLocal(writeRows);
      setFilterCls(writeRows[0].classId);
      setImportTargetClass(writeRows[0].classId);
      setMoveTargetClass(writeRows[0].classId);
      setImportMsg("✅ Added "+added+" · Updated "+updated+" · Skipped "+skipped+". Saved "+writeRows.length+" students to "+((officialClassRow(writeRows[0].classId)||{}).name||writeRows[0].classId)+"."+(cleanedOldInTarget?" Old students removed from screen: "+cleanedOldInTarget+".":"")+(resetInfo&&resetInfo.oldStudents?" Old Firebase class students/data reset: "+resetInfo.oldStudents+".":""));
      setResettingClassId("");
      try{ localStorage.removeItem(EQ_FAST_DATA_CACHE_KEY); }catch(_e){}
      // UI is updated immediately from the saved rows. No foreground reload here.
    }catch(err){ setResettingClassId(""); setImportMsg("❌ Import failed: "+(err.message||err)); }
    try{ e.target.value=""; }catch(_e){}
  }



  async function moveImportedStudentsToClass(){
    const from=Number(eqDigits(moveFromId));
    const to=Number(eqDigits(moveToId));
    const targetClassId=canonicalClassId(moveTargetClass);
    if(!from||!to||from>to){setImportMsg("Enter a valid ID range, for example 3401 to 3435.");return;}
    if(!EQ_ACTUAL_CLASS_IDS.includes(targetClassId)){setImportMsg("اختر فصلًا صحيحًا: ثالث ثاني / ثالث رابع / ثالث سادس.");return;}
    const cls=officialClassRow(targetClassId)||{id:targetClassId,name:targetClassId};
    if(!window.confirm("Move students "+from+"-"+to+" to "+cls.name+"?\nNo students or results will be deleted.")) return;
    setImportMsg("Moving students to "+cls.name+"…");
    try{
      await ensureImportClassExists({id:targetClassId}, []);
      let liveUsers=[];
      try{ liveUsers=await Promise.race([fsAll("users"), new Promise(resolve=>setTimeout(()=>resolve([]),3500))]); }catch(_e){ liveUsers=[]; }
      const bySid={};
      [].concat(Array.isArray(data&&data.users)?data.users:[], Array.isArray(liveUsers)?liveUsers:[]).forEach(function(u){
        const sid=eqDigits(u&& (u.studentId||u.id));
        const n=Number(sid);
        if(n>=from && n<=to && !bySid[sid]) bySid[sid]=u;
      });
      const rows=[];
      for(let n=from;n<=to;n++){
        const sid=String(n);
        const base=bySid[sid]||{};
        // Do not invent names for missing students; but if the Excel import already created them locally/cloud, update them.
        if(!base.name && !base.studentId && !(sid in bySid)) continue;
        rows.push(eqSafeActiveStudentRow(base, sid, targetClassId, base.name||""));
      }
      if(!rows.length){ setImportMsg("No students found in this ID range. أعد رفع ملف Excel واختر الفصل الهدف أولًا."); return; }
      await adminBatchSetMergeQuick("users", rows, 20000);
      mergeWrittenUsersIntoLocal(rows);
      setFilterCls(targetClassId);
      setImportTargetClass(targetClassId);
      setMoveTargetClass(targetClassId);
      setImportMsg("✅ Moved "+rows.length+" students to "+cls.name+". No results were deleted.");
      // UI is updated immediately from the saved rows. A full reload is not needed here and can briefly show stale Firebase/cache data.
    }catch(err){
      setImportMsg("❌ Move failed: "+(err.message||err));
    }
  }

  function exportGradebook(){

    const studs = (gbClass==="all"?myStudents:myStudents.filter(s=>s.classId===gbClass));
    const header=["Student Name","Student ID","Class",...qs.map(q=>q.title),"Average %"];

      qs.forEach(q=>{
        const rs=responsesForStudent(data.responses,s).filter(r=>r.quizId===q.id);

        else row.push("");
      });
      row.push(cnt?Math.round(sum/cnt):"");
      rows.push(row);
    });
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:22},{wch:12},{wch:12},...qs.map(()=>({wch:14})),{wch:10}];

  async function createCls(){
    if(!newCls.name.trim())return;
    const rawName=newCls.name.trim(), rawGrade=newCls.grade.trim();
    const canon=canonicalClassId(rawName||rawGrade);
    if(!EQ_ACTUAL_CLASS_IDS.includes(canon)){ alert("الفصول المسموحة الآن فقط: ثالث ثاني، ثالث رابع، ثالث سادس."); return; }
    const official=officialClassRow(canon);
    const id=official.id;
    const existingActive=(myClasses||[]).find(function(c){ return canonicalClassId(c&& (c.id||c.classId||c.grade||c.name))===id; });
    if(existingActive){ alert("الفصل موجود مسبقًا في المنصة."); return; }
    const aliases=Array.from(new Set([id, canon, rawName, rawGrade, official.name, official.grade].filter(Boolean)));
    // ADD_CLASS_EMPTY_NO_AUTO_DELETE_20260702
    // Creating a class must NOT delete any other class or any old Firebase data automatically.
    // It creates a fresh rosterToken so old students with the same classId are hidden from this new roster
    // until the teacher imports/adds students into this specific class instance.
    setAdminBusy("⏳ Creating empty class: "+official.name+"…");
    adminForgetDeletedClassIds(aliases);
    try{ await adminBatchDelete("deletedClasses", aliases.map(function(a){return {id:String(a)};})); }catch(e){ try{ await fsDel("deletedClasses", id); }catch(_e){} }
    try{ await fsDel("deletedClasses", canon); }catch(e){}
    const rosterToken="rt_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
    const row={id,name:official.name,grade:official.grade,teacherIds:[user.id,"GLOBAL"],createdAt:today(),updatedAt:today(),active:true,source:"teacher-created",preloaded:false,deleted:false,status:"active",hidePreloaded:false,permanentDeleted:false,cleanupDeletedAt:null,adminDeletedAt:null,emptyNewClass:true,rosterToken:rosterToken,classResetAt:new Date().toISOString()};
    await fsSetStrict("classes",id,row);
    try{ eqClearOldClassAndStudentCaches(); }catch(_e){}

  async function deleteClass(cls){
    const classId=canonicalClassId(cls&& (cls.id||cls.classId||cls.grade||cls.name));
    const classAliasSet=new Set(adminClassAliases(cls).map(canonicalClassId));
    const visibleStuds = myStudents.filter(u=>u.role==="student" && !u.deleted && classAliasSet.has(canonicalClassId(u.classId||u.className||u.class||"")));
    const choice=prompt("Delete class: "+cls.name+"\nVisible students: "+visibleStuds.length+"\n\nType one option number:\n1 = Delete class only and move students to No class\n2 = Delete students + their data in this class (keep class)\n3 = Delete class + students + all results\n\nFor safety, type 1, 2, or 3:","2");
    if(!choice)return;
    const modeMap={"1":"classOnly","2":"studentsOnly","3":"classStudentsData"}; const mode=modeMap[String(choice).trim()];
    if(!mode){alert("Cancelled. Invalid option.");return;}
    const phrase=mode==="classStudentsData"?"DELETE CLASS DATA":"DELETE CLASS";
    if(!adminConfirmOk(prompt("Final confirmation required. Type: "+phrase+"\n(uppercase/lowercase accepted)"), phrase)) return;
    try{
      if(mode!=="classOnly"){
        setResettingClassId(classId);
        setFilterCls(classId);
        hardClearClassFromScreen(classId);
        setAdminBusy("⏳ Finding students in "+(cls.name||classId)+"…");
        const res=await adminDeleteClassStudentsFastByClassId(cls,true,{onProgress:function(p){
          const total=p.total||0, done=p.done||0;
          const pct=total?Math.min(100,Math.round(done*100/total)):0;
          setAdminBusy("⏳ "+(p.stage||"Deleting")+" — "+done+" / "+total+(total?" ("+pct+"%)":""));
        }});
        if(mode==="classStudentsData"){
          const row={...(cls||{}),id:classId,deleted:true,status:"deleted",hidePreloaded:true,permanentDeleted:true,adminDeletedAt:new Date().toISOString(),cleanupDeletedAt:new Date().toISOString(),updatedAt:today()};
          adminRememberDeletedClassIds([classId, cls&&cls.id, cls&&cls._id, cls&&cls.name, cls&&cls.grade].filter(Boolean));
          await fsSet("classes",classId,row);
          try{ await fsSet("deletedClasses",classId,row); }catch(_e){}
        }
        try{
          if(data&&Array.isArray(data.users)) data.users=data.users.filter(st=>!sameClassId(st.classId||st.className||st.class,classId));
          if(data&&Array.isArray(data.classes)) data.classes=data.classes.filter(c=>!sameClassId(c.id||c._id||c.name||c.grade,classId));
          if(data&&Array.isArray(data.firebaseClasses)) data.firebaseClasses=data.firebaseClasses.filter(c=>!sameClassId(c.id||c._id||c.name||c.grade,classId));
          if(data&&Array.isArray(data.deletedClasses)) data.deletedClasses=[...(data.deletedClasses||[]),{id:classId,deleted:true,status:"deleted",hidePreloaded:true,permanentDeleted:true}];
          setLocalStudentPatch(prev=>(Array.isArray(prev)?prev:[]).filter(st=>!sameClassId(st.classId||st.className||st.class,classId)));
          localStorage.removeItem(EQ_FAST_DATA_CACHE_KEY);
          localStorage.removeItem(EQ_ACTIVE_LOGIN_CLASSES_KEY);
        }catch(_e){}
        setAdminBusy("✅ Hard delete completed. Students: "+((res&&res.students)||0)+" · data: "+JSON.stringify((res&&res.deleted)||{}));
        setTimeout(()=>setAdminBusy(""),5000);
        setResettingClassId("");
        return;
      }
      setAdminBusy("⏳ Moving students out of class…");
      const liveStuds=await adminFastClassStudents(cls, visibleStuds);
      await adminBatchSetMergeQuick("users", liveStuds.map(st=>({...st,classId:"",className:"",class:"",updatedAt:today()})), 20000);
      const row={...(cls||{}),id:classId,deleted:true,status:"deleted",hidePreloaded:true,permanentDeleted:true,adminDeletedAt:new Date().toISOString(),updatedAt:today()};
      adminRememberDeletedClassIds([classId, cls&&cls.id, cls&&cls._id, cls&&cls.name, cls&&cls.grade].filter(Boolean));
      await fsSet("classes",classId,row);
      try{ await fsSet("deletedClasses",classId,row); }catch(_e){}
      try{ if(data&&Array.isArray(data.classes)) data.classes=data.classes.filter(c=>!sameClassId(c.id||c._id||c.name||c.grade,classId)); localStorage.removeItem(EQ_FAST_DATA_CACHE_KEY); localStorage.removeItem(EQ_ACTIVE_LOGIN_CLASSES_KEY); }catch(_e){}
      setAdminBusy("✅ Class deleted and "+liveStuds.length+" students moved to No class.");
      setTimeout(()=>setAdminBusy(""),4000);
    }catch(e){ setResettingClassId(""); setAdminBusy("❌ Delete failed: "+(e.message||e)); }
  }

    // Use a saved site URL if the teacher set one, otherwise current page URL

// ── ROOT ──────────────────────────────────────────────────────
function App() {
  const [user,setUser]=useState(null);
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [directQuiz,setDirectQuiz]=useState(null);
  const [parkedTeacher,setParkedTeacher]=useState(null); // holds teacher while viewing as student

  async function reload(){const d=await loadAllData();setData(d);try{if(typeof window.rpV11MergeCloudRecords==="function")window.rpV11MergeCloudRecords(d.readingSubmissions||[]);if(typeof window.rpV11RenderNow==="function")setTimeout(()=>window.rpV11RenderNow(),50);}catch(e){}return d;}

  // Teacher taps "View as Student" -> pick a student to impersonate (view only their experience)
  function viewAsStudent(studentUser){ setParkedTeacher(user); setUser(studentUser); reload(); }
  function backToTeacher(){ if(parkedTeacher){ setUser(parkedTeacher); setParkedTeacher(null); reload(); } }

  useEffect(()=>{
    (async()=>{
      const params=new URLSearchParams(location.search);
      const code=params.get("quiz");
      const sess=loadSession();
      // Show cached dashboard immediately when available, then refresh Firebase in the background.
      const cached=eqLoadFastDataCache();
      const useCachedStartup = cached && !data && !(sess && String(sess.role||"")!=="student");
      if(useCachedStartup){
        try{
          setData(cached);
          if(code){const cq=(cached.quizzes||[]).find(x=>x.code===code.toUpperCase());if(cq)setDirectQuiz(cq);}
          if(sess){const cu=(cached.users||[]).find(x=>x.id===sess.id);if(cu&&activeStudentInData(cu,cached))setUser(fixAhmedStudent(cu));else if(sess.role!=="student"&&sess.id)setUser(fixAhmedStudent(sess));else if(sess.role==="student"){ try{clearSession();localStorage.removeItem(EQ_LOGIN_MEMORY_KEY);}catch(e){} }}
          setLoading(false);
        }catch(e){}
      }
      const d=await loadAllData();setData(d);
      // Check for ?quiz=CODE link
      if(code){const q=d.quizzes.find(x=>x.code===code.toUpperCase());if(q)setDirectQuiz(q);}
      if(sess){const sidSess=eqDigits(sess.studentId||sess.id||"");const sessionList=(sess.role==="student"&&Array.isArray(d.firebaseUsers))?d.firebaseUsers:d.users;const u=(sessionList||[]).find(x=>String(x.id||"")===String(sess.id||"") || (sidSess && eqDigits(x.studentId||x.id||"")===sidSess));if(u&&activeStudentInData(u,d))setUser(fixAhmedStudent(u));else { if(sess.role==="student"){ clearSession(); try{localStorage.removeItem(EQ_LOGIN_MEMORY_KEY);}catch(e){} setUser(null); } else if(sess.id)setUser(fixAhmedStudent(sess)); }}
      else if(FIREBASE_OK && auth && auth.currentUser){
        const au=auth.currentUser;
        const linked=d.users.find(x=>!x.deleted && String(x.authUid||x.linkedAuthUid||"")===String(au.uid));
        if(linked){saveSession(linked);setUser(fixAhmedStudent(linked));}
      }
      setLoading(false);
    })();
  },[]);

  useEffect(()=>{
    if(!user) return;
    let busy=false;
    const refresh=async()=>{
      if(busy) return;
      busy=true;
      try{ await reload(); }catch(e){}
      finally{ busy=false; }
    };
    const onVis=()=>{ if(document.visibilityState==="visible") refresh(); };
    window.addEventListener("focus", refresh);
    document.addEventListener("visibilitychange", onVis);
    const timer=setInterval(refresh, 7000);
    return ()=>{ window.removeEventListener("focus", refresh); document.removeEventListener("visibilitychange", onVis); clearInterval(timer); };
  },[user&&user.id,user&&user.role]);

  useEffect(()=>{
    if(!user || !FIREBASE_OK || !(db&&db.collection)) return;
    let unsubs=[];
    function applyCollection(col, arr){
      try{
        if(col==="readingSubmissions" && typeof window.rpV11MergeCloudRecords==="function"){
          window.rpV11MergeCloudRecords(arr);
          if(typeof window.rpV11RenderNow==="function") setTimeout(()=>window.rpV11RenderNow(),60);
        }
      }catch(e){}
      setData(prev=>{

<script>
// ===== READING PROGRESS V11 INDEXEDDB STORAGE FIX =====
(function(){
  const RP_KEY = "rp_attempt_records_v11";
  const OLD_KEYS = ["rp_attempt_records_v10","rp_attempt_records_v9","rp_attempt_records_v8","rp_attempt_records_v7"];
  const API_KEY = "rp_openai_api_key";
  const DB_NAME = "EduQuizRP_AudioDB";
  const STORE = "audios";
  let panelMade = false;
  let rpActiveTab = "waiting";
  let rpInputSaveTimer = null;
  let RP_LIVE_CACHE = [];
  const RP_DELETED_IDS_KEY = "rp_deleted_attempt_ids_v2_exact";
  const RP_DELETED_FP_KEY = "rp_deleted_attempt_fingerprints_v2_exact";
  // RP179: ignore the old loose tombstone cache from 178 because it could mark every attempt
  // for the same student/task as deleted. From now on deletion is exact per attempt only.
  try{ localStorage.removeItem("rp_deleted_attempt_ids_v1"); localStorage.removeItem("rp_deleted_attempt_fingerprints_v1"); }catch(_e){}
  function rpIsExactDeletedAttempt(r){
    return !!(r && (r.rpExactDeleted===true || r.exactAttemptDeleted===true || r.deletedAttemptExact===true || r.deleteScope==="single_attempt" || r.deleteMode==="single_attempt"));
  }
  function rpIsDeleteDecisionMarker(r){
    try{ return !!(r && (r.decisionMarker===true || String(r.id||"").indexOf("rp_decision_")===0) && String(r.status||"").toLowerCase()==="deleted"); }catch(_e){ return false; }
  }
  function rpIsLegacyBroadDeletedAttempt(r){
    if(!r) return false;
    const vals=[r.status,r.reviewStatus,r.teacherReview,r.teacherReviewStatus,r.studentStatus,r.analysisStatus].map(function(v){return String(v||"").toLowerCase().trim();});
    return !!((r.deleted===true || vals.indexOf("deleted")>=0) && !rpIsExactDeletedAttempt(r));
  }
  function rpRecoverLegacyBroadDeletedAttempt(r){
    if(!rpIsLegacyBroadDeletedAttempt(r) || rpIsDeleteDecisionMarker(r)) return r;
    const c={...(r||{})};
    delete c.deleted;
    c.recoveredFromLooseDelete=true;
    c.visibleToStudent=true;
    const hadAccepted=!!(c.acceptedAt || c.approvedAt || c.teacherAccepted || c.teacherApproved || c.accepted || c.approved || c.scoreVisible===true);
    const scoreNum=Number(c.teacherScore ?? c.finalScore ?? c.score ?? (c.analysis&&c.analysis.finalScore));
    if(hadAccepted || Number.isFinite(scoreNum)){
      c.status="accepted"; c.reviewStatus="accepted"; c.teacherReview="accepted"; c.teacherReviewStatus="accepted"; c.studentStatus="accepted"; c.analysisStatus="completed"; c.accepted=true; c.approved=true; c.teacherAccepted=true; c.teacherApproved=true; c.pending=false; c.scoreVisible=true;
    }else if(c.rejectedAt || c.rejectionReason){
      c.status="rejected"; c.reviewStatus="rejected"; c.teacherReview="rejected"; c.teacherReviewStatus="rejected"; c.studentStatus="rejected"; c.analysisStatus="rejected"; c.accepted=false; c.approved=false; c.pending=false; c.scoreVisible=false;
    }else{
      c.status="pending_review"; c.reviewStatus="pending"; c.teacherReview="pending"; c.teacherReviewStatus="pending"; c.studentStatus="pending"; c.analysisStatus=(c.analysis||c.transcript)?"Completed":"Pending"; c.accepted=false; c.approved=false; c.pending=true; c.scoreVisible=false;
    }
    return c;
  }

  function readJSON(k,f){ try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f));}catch(e){return f;} }
  function rpDigits(v){ try{return String(v||"").replace(/\D/g,"");}catch(e){return "";} }
  function rpDeletedIdSet(){ try{return new Set(JSON.parse(localStorage.getItem(RP_DELETED_IDS_KEY)||"[]").map(String));}catch(e){return new Set();} }
  function rpDeletedFpSet(){ try{return new Set(JSON.parse(localStorage.getItem(RP_DELETED_FP_KEY)||"[]").map(String));}catch(e){return new Set();} }
  function rpWriteSet(key,set){ try{ localStorage.setItem(key, JSON.stringify(Array.from(set).filter(Boolean).slice(-2000))); }catch(e){} }
  function rpDeletionIdsFor(r){
    const out=[];
    try{
      [r&&r.id,r&&r.originalAttemptId,r&&r.attemptId,r&&r.submissionId].forEach(function(x){ if(x) out.push(String(x)); });
    }catch(e){}
    return Array.from(new Set(out));
  }
  function rpDeletionFingerprint(r){
    if(!r) return "";
    let sid="";
    try{
      const inf=(typeof rpRecInfo==="function")?rpRecInfo(r):{};
      sid=rpDigits(inf&&inf.sid) || rpDigits(r.studentNumber||r.studentNo||r.studentId||r.studentUserId||r.userId||r.uid||"") || String(r.studentName||r.name||"").trim().toLowerCase();
    }catch(e){ sid=rpDigits(r.studentNumber||r.studentId||"") || String(r.studentName||r.name||"").trim().toLowerCase(); }
    let task="";
    try{ task=String((typeof taskLabel==="function"?taskLabel(r):"") || r.taskTitle || r.title || r.taskId || "").trim().toLowerCase(); }catch(e){ task=String(r.taskTitle||r.title||r.taskId||"").trim().toLowerCase(); }
    const submitted=String(r.submittedAt||r.createdAt||r.timestamp||r.recordedAt||r.uploadedAt||"").trim();
    const audio=String(r.audioId||r.audioSize||((r.audioDataUrl||"").length)||r.audioUrl||"").trim();
    if(!sid && !task && !submitted && !audio) return "";
    return [sid,task,submitted,audio].join("|");
  }
  function rpRememberDeletedAttempt(r){
    try{
      const ids=rpDeletedIdSet();
      rpDeletionIdsFor(r).forEach(function(x){ ids.add(String(x)); });
      rpWriteSet(RP_DELETED_IDS_KEY,ids);
      const fp=rpDeletionFingerprint(r);
      if(fp){ const fps=rpDeletedFpSet(); fps.add(fp); rpWriteSet(RP_DELETED_FP_KEY,fps); }
    }catch(e){}
  }
  function rpIsLocallyDeletedAttempt(r){
    try{
      const ids=rpDeletedIdSet();
      if(rpDeletionIdsFor(r).some(function(x){return ids.has(String(x));})) return true;
      const fp=rpDeletionFingerprint(r);
      return !!(fp && rpDeletedFpSet().has(fp));
    }catch(e){return false;}
  }

  function writeJSON(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
  function records(){
    let cur = readJSON(RP_KEY, null);
    if(Array.isArray(cur)) return cur;
    for(const k of OLD_KEYS){
      let old = readJSON(k, null);
      if(Array.isArray(old)){ writeJSON(RP_KEY, old); return old; }
    }
    writeJSON(RP_KEY, []);
    return [];
  }
  function saveRecords(a){ writeJSON(RP_KEY,a); try{ RP_LIVE_CACHE=Array.isArray(a)?a:[]; }catch(e){} }
  function recordsLive(){
    try{
      const base=records();
      const live=Array.isArray(RP_LIVE_CACHE)?RP_LIVE_CACHE:[];
      return mergeRecords(base, live);
    }catch(e){ return records(); }
  }
  // RP117: allow the React/Firebase live listener to push fresh cloud records into the RP drawer instantly.
  window.rpV11MergeCloudRecords=function(remote){
    try{
      const clean=(remote||[]).filter(r=>r && r.source!=="rp_audio_chunk" && !String(r.id||"").includes("_chunk_"));
      const merged=mergeRecords(records(), clean);
      saveRecords(merged);
      try{ RP_LIVE_CACHE=merged; __rpLastCloudSyncAt=Date.now(); }catch(_e){}
      return merged;
    }catch(e){ return records(); }
  };
  window.rpV11ForceRefresh=function(){
    try{ syncCloudIntoLocal().then(function(){ try{ if(typeof renderCards==="function") renderCards(); }catch(_e){} }); }catch(e){}
  };

  function openDB(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:"id"});
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function saveAudio(blob){
    const db = await openDB();
    const id = "aud_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const item = {id, blob, type:blob.type||"audio/webm", size:blob.size, createdAt:new Date().toISOString()};
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,"readwrite");
      tx.objectStore(STORE).put(item);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    return item;
  }
  async function getAudio(id){
    if(!id) return null;
    const db = await openDB();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,"readonly");
      const req = tx.objectStore(STORE).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  function blobToDataUrl(blob){
    return new Promise((resolve,reject)=>{
      try{
        const reader=new FileReader();
        reader.onload=()=>resolve(reader.result);
        reader.onerror=()=>reject(reader.error||new Error("FileReader failed"));
        reader.readAsDataURL(blob);
      }catch(e){reject(e);}
    });
  }

  function normalizeRecord(r){
    if(!r) return r;
    r=rpRecoverLegacyBroadDeletedAttempt(r);
    return {
      ...r,
      taskId:r.taskId||taskId(),
      className:r.className||r.classId||"Unassigned",
      studentName:r.studentName||r.name||"Student",
      studentId:String(r.studentId||r.id||"unknown").trim(),
      source:r.source||"rp_shared_submission"
    };
  }

  function recordTime(r){
    const t=Date.parse((r&&(r.updatedAt||r.reviewedAt||r.acceptedAt||r.approvedAt||r.analyzedAt||r.submittedAt||r.createdAt||r.timestamp))||"");
    return Number.isFinite(t)?t:0;
  }
  function mergeRecords(local, remote){
    const map={};
    function put(r){
      if(!r||!r.id) return;
      const nr=normalizeRecord(r);
      if(isDeleted(nr) || rpAttemptState(nr)==="deleted"){
        rpRememberDeletedAttempt(nr);
      }
      // RP178: once the teacher deletes an attempt, never let an old cloud/local copy revive it
      // after app close or Firebase re-sync. Only the deleted tombstone itself may remain hidden.
      if(rpIsLocallyDeletedAttempt(nr) && !(isDeleted(nr) || rpAttemptState(nr)==="deleted")) return;
      const old=map[nr.id];
      if(!old || recordTime(nr)>=recordTime(old) || isDeleted(nr)){
        map[nr.id]={...(old||{}),...nr};
      }
    }
    (local||[]).forEach(put);
    (remote||[]).forEach(put);
    return Object.values(map).filter(function(r){ return r && !(rpIsLocallyDeletedAttempt(r) && !(isDeleted(r)||rpAttemptState(r)==="deleted")); });
  }

  async function cloudRecords(){
    try{
      if(typeof fsAll!=="function") return [];
      const arr=await fsAll("readingSubmissions");
      // RP117: RB/float drawer must not filter by the old fixed task id.
      // Load every real Reading Progress submission, excluding only audio chunks.
      let clean=(arr||[]).filter(r=>r && r.source!=="rp_audio_chunk" && !String(r.id||"").includes("_chunk_") && !(typeof rpIsDeleteDecisionMarker==="function" && rpIsDeleteDecisionMarker(r)));
      try{ if(localStorage.getItem("rp_purge_keep_only_hussein_fayez_done_at")){ clean=clean.filter(rpIsHusseinFayezRecord); } }catch(_e){}
      return clean;
    }catch(e){
      console.warn("RP cloud read failed", e);
      return [];
    }
  }

  async function cloudSaveRecord(record){
    try{
      if(typeof fsSet!=="function" || !record || !record.id) return false;
      const copy={...normalizeRecord(record)};
      await fsSet("readingSubmissions", copy.id, copy);
      return true;
    }catch(e){
      console.warn("RP cloud save failed", e);
      return false;
    }
  }


  // RP180: HARD CLEANUP - delete every Reading Progress recording from Firestore/local cache
  // except the student حسين محمد الفايز / حسين بن محمد بن حسين الفايز (student number 3209).
  function rpNormArabic(v){
    return String(v||"").toLowerCase().replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ").trim();
  }
  function rpIsHusseinFayezRecord(r){
    try{
      const info=(typeof rpRecInfo==="function")?rpRecInfo(r||{}):{};
      const n=rpNormArabic((info&&info.name)||r.studentName||r.name||r.fullName||"");
      const sid=String((info&&info.sid)||r.studentNumber||r.studentNo||r.studentId||r.idNumber||r.password||"").replace(/\D/g,"");
      if(sid==="3209") return true;
      if(n.includes("حسين محمد") && n.includes("الفايز")) return true;
      if(n.includes("حسين بن محمد") && n.includes("الفايز")) return true;
      if(n.includes("حسين") && n.includes("محمد") && n.includes("الفايز")) return true;
    }catch(_e){}
    return false;
  }
  function rpParentSubmissionId(r){
    try{return String(r.parentSubmissionId||r.parentId||r.submissionId||r.originalSubmissionId||r.attemptId||r.sourceAttemptId||"");}catch(_e){return "";}
  }
  function rpChunkBelongsToKept(r,keepIds){
    try{
      if(rpIsHusseinFayezRecord(r)) return true;
      const pid=rpParentSubmissionId(r);
      if(pid && keepIds.has(String(pid))) return true;
      const id=String(r.id||"");
      for(const k of keepIds){ if(id && (id.includes(String(k)+"_chunk_") || id.includes(String(k)))) return true; }
    }catch(_e){}
    return false;
  }
  async function rpDeleteStorageForRecord(r){
    try{
      if(!(typeof firebase!=="undefined" && firebase.storage)) return false;
      const url=String(r.audioUrl||r.downloadURL||r.storageUrl||r.audioDownloadUrl||"");
      if(!url || !/^https?:/i.test(url)) return false;
      await firebase.storage().refFromURL(url).delete();
      return true;
    }catch(e){ return false; }
  }
  async function rpClearIndexedDbExcept(keepAudioIds){
    try{
      const db=await openDB();
      await new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE,"readwrite");
        const store=tx.objectStore(STORE);
        const req=store.openCursor();
        req.onsuccess=function(ev){
          const cur=ev.target.result;
          if(cur){
            const id=String((cur.value&&cur.value.id)||cur.key||"");
            if(!keepAudioIds.has(id)) cur.delete();
            cur.continue();
          }
        };
        tx.oncomplete=resolve;
        tx.onerror=function(){reject(tx.error);};
      });
    }catch(e){ console.warn("RP180 IndexedDB cleanup failed", e&&e.message); }
  }
  async function rpHardPurgeAllExceptHusseinFayez(){
    if(!isTeacher()){
      alert("افتح حساب المعلم أولًا ثم نفذ التنظيف من زر RP.");
      return;
    }
    const phrase=window.prompt("تنظيف نهائي للتسجيلات من Firebase والمنصة.\nسيتم حذف كل تسجيلات Reading Progress ما عدا حسين محمد الفايز فقط.\nاكتب بالضبط: احذف التسجيلات");
    if(String(phrase||"").trim()!=="احذف التسجيلات") return;
    const btn=document.getElementById("rp-v11-hard-purge");
    const old=btn?btn.textContent:"";
    if(btn){btn.disabled=true;btn.textContent="جاري الحذف النهائي...";}
    let cloud=[];
    try{ cloud=(typeof fsAll==="function") ? (await fsAll("readingSubmissions")) : []; }catch(e){ cloud=[]; }
    const normalized=(cloud||[]).map(function(r){return {id:String(r.id||r._id||""), ...r};}).filter(function(r){return r&&r.id;});
    const keep=[];
    const del=[];
    normalized.forEach(function(r){ if(rpIsHusseinFayezRecord(r)) keep.push(r); else del.push(r); });
    const keepIds=new Set(keep.map(function(r){return String(r.id||r._id||"");}).filter(Boolean));
    const finalDel=del.filter(function(r){ return !rpChunkBelongsToKept(r,keepIds); });
    let deleted=0, failed=0, storageDeleted=0;
    for(const r of finalDel){
      try{ if(await rpDeleteStorageForRecord(r)) storageDeleted++; }catch(_e){}
      try{
        if(typeof fsDel==="function") await fsDel("readingSubmissions", String(r._id||r.id));
        else if(typeof db!=="undefined" && db && db.collection) await db.collection("readingSubmissions").doc(String(r._id||r.id)).delete();
        deleted++;
      }catch(e){ failed++; console.warn("RP180 delete failed", r&&r.id, e&&e.message); }
    }
    // Keep local cache containing only Hussein Fayez records; clear every old RP cache key so deleted records do not revive.
    const localKeep=(keep||[]).map(function(r){return normalizeRecord({...r,id:String(r.id||r._id)});});
    try{
      [RP_KEY].concat(OLD_KEYS).forEach(function(k){ localStorage.setItem(k, JSON.stringify(localKeep)); });
      localStorage.setItem("eq_readingSubmissions", JSON.stringify(localKeep));
      localStorage.removeItem(RP_DELETED_IDS_KEY);

  function getVisibleReferenceText(){
    // اختر نص القراءة الحقيقي فقط، ولا تأخذ نص لوحة الأداء أو تعليمات المعلم.
    const bad=/reading progress|performance|rejected|deleted|counted|average|best|attempts|accepted|retake|teacher note|teacher score|record your reading|start recording|submit to teacher|audio|status|transcript|reference text|teacher|home|progress|mastery|badge|logout|retry|back|microphone|recording|analyze|fluency|wcpm|mistakes|accuracy|score|submissions/i;

    function visible(el){
      try{
        const st=getComputedStyle(el);
        const r=el.getBoundingClientRect();
        return st.display!=="none" && st.visibility!=="hidden" && r.width>20 && r.height>8;
      }catch(e){ return true; }
    }

    const nodes=[...document.querySelectorAll("p, .reading-text, [data-reading-text], article, blockquote")];
    const cands=[];

    nodes.forEach(n=>{
      if(!visible(n)) return;
      const raw=cleanRefCandidate(n.innerText||n.textContent||"");
      if(!raw || raw.length<8 || raw.length>600) return;
      if(!/[a-zA-Z]/.test(raw) || !/[.!?]/.test(raw)) return;
      if(bad.test(raw)) return;

      const words=raw.split(/\s+/).filter(Boolean);
      if(words.length<3 || words.length>120) return;

      // استبعد النصوص التي تبدو كلوحة/واجهة وليست فقرة قراءة.
      const uiWords=/button|click|status|score|attempt|teacher|student|average|accepted|rejected|deleted|counted|performance/i;
      if(uiWords.test(raw)) return;

      // الأفضلية للنصوص القصيرة والواضحة داخل بطاقة القراءة.
      let score=100;
      if(n.matches("[data-reading-text], .reading-text, p")) score+=40;
      if(words.length<=12) score+=25;
      if(words.length>=3 && words.length<=80) score+=20;
      score-=Math.abs(words.length-20);

      cands.push({t:raw, words:words.length, score});
    });

    cands.sort((a,b)=>b.score-a.score);

  async function rpTrimmedAudioReadingSeconds(blob){
    try{
      const AudioCtx=window.AudioContext||window.webkitAudioContext;
      if(!blob || !AudioCtx) return 0;
      const buf=await blob.arrayBuffer();
      const ctx=new AudioCtx();
      let audio;
      try{ audio=await ctx.decodeAudioData(buf.slice(0)); }catch(e){ try{ctx.close&&ctx.close();}catch(_){} return 0; }
      const sr=audio.sampleRate||44100, len=audio.length||0;
      if(!len){ try{ctx.close&&ctx.close();}catch(_){} return 0; }
      const ch=[]; for(let c=0;c<audio.numberOfChannels;c++) ch.push(audio.getChannelData(c));
      const win=Math.max(256,Math.round(sr*0.05));
      const rms=[];
      for(let i=0;i<len;i+=win){
        let sum=0,count=0,end=Math.min(len,i+win);
        for(let j=i;j<end;j++){ let v=0; for(let c=0;c<ch.length;c++) v+=ch[c][j]||0; v/=Math.max(1,ch.length); sum+=v*v; count++; }
        rms.push(Math.sqrt(sum/Math.max(1,count)));
      }
      try{ctx.close&&ctx.close();}catch(_){}
      if(!rms.length) return 0;
      const sorted=rms.slice().sort((a,b)=>a-b), noise=sorted[Math.floor(sorted.length*.25)]||0, peak=sorted[sorted.length-1]||0;
      const threshold=Math.max(0.010, noise*2.6, peak*0.06);
      let first=-1,last=-1;
      for(let i=0;i<rms.length;i++){ if(rms[i]>=threshold){ first=i; break; } }
      for(let i=rms.length-1;i>=0;i--){ if(rms[i]>=threshold){ last=i; break; } }
      if(first<0||last<first) return 0;
      const full=audio.duration||len/sr;
      const start=Math.max(0, first*win/sr - .15);
      const end=Math.min(full, (last+1)*win/sr + .15);
      const reading=end-start;
      if(!Number.isFinite(reading)||reading<=0) return 0;
      return Math.max(1,Math.round(reading));
    }catch(e){ return 0; }
  }

      if(dur>0) return Math.round(dur);

    function valid(v){ const n=Number(v); return Number.isFinite(n)&&n>=3&&n<=300?Math.round(n):null; }
    const candidates=[
      r&&r.actualReadingSeconds, r&&r.effectiveReadingSeconds,
      r&&r.recordingSeconds, r&&r.fullRecordingSeconds, r&&r.fullRecordedSeconds,
      r&&r.durationSeconds, r&&r.seconds, r&&r.audioDuration, r&&r.duration,
      r&&r.analysis&&r.analysis.actualReadingSeconds, r&&r.analysis&&r.analysis.effectiveReadingSeconds,
      r&&r.analysis&&r.analysis.recordingSeconds, r&&r.analysis&&r.analysis.fullRecordingSeconds,
      r&&r.analysis&&r.analysis.durationSeconds, r&&r.analysis&&r.analysis.seconds, r&&r.analysis&&r.analysis.audioDuration
    ].map(valid).filter(x=>x!==null);
    if(!candidates.length) return 0;
    const nonDefault=candidates.filter(x=>Math.abs(x-60)>1);
    return Math.min(...(nonDefault.length?nonDefault:candidates));
  }
  function score(ref,spoken,seconds=60){
    const clean=s=>String(s||"").toLowerCase().replace(/[^\w\s']/g," ").replace(/\s+/g," ").trim();
    const a=clean(ref).split(" ").filter(Boolean), b=clean(spoken).split(" ").filter(Boolean);
    let correct=0, used=Array(b.length).fill(false);
    a.forEach(w=>{
      const i=b.findIndex((x,j)=>!used[j]&&x===w);
      if(i>=0){correct++;used[i]=true;}
    });

    const total=a.length;
    const missing=Math.max(0,total-correct);
    const extra=Math.max(0,b.length-correct);
    const repeated=b.filter((w,i)=>i>0&&b[i-1]===w).length;

    const accuracy=total?Math.round(correct/total*100):0;

    // Use real duration when available. For short texts, do not punish speed too harshly.
    const safeSeconds=Math.max(1, Number(seconds)||0);
    const minutes=Math.max(safeSeconds/60, 1/60);
    const wcpm=Math.round(correct/minutes);

    // RP169: WCPM is only the measured speed. A perfect word match must NOT force fluency/score to 100.
    // Target speed depends on text length: short tasks are more forgiving, normal RP tasks require real pace.
    const speedTarget = total<=30 ? 60 : (total<=50 ? 75 : 90);
    let speedScore=Math.max(0,Math.min(100,Math.round(wcpm/speedTarget*100)));
    const completion=total?Math.round(correct/total*100):0;

    const mistakePenalty = (missing*12) + (extra*4) + (repeated*3);
    let fluency=Math.max(0,Math.min(100,Math.round(
      accuracy*0.45 + completion*0.15 + speedScore*0.40 - repeated*2
    )));

    let finalScore=Math.round(
      accuracy*0.45 + completion*0.15 + fluency*0.20 + speedScore*0.20 - Math.min(20,mistakePenalty*0.25)
    );

    // Hard cap by speed: slow perfect reading remains accurate, but not fluent/high-scored.
    function capByWcpm(v){
      if(!Number.isFinite(Number(wcpm))) return v;
      if(total<=30) return Math.min(v, wcpm<25?82:(wcpm<35?86:(wcpm<45?90:(wcpm<60?94:100))));
      if(total<=50) return Math.min(v, wcpm<30?78:(wcpm<45?86:(wcpm<60?92:100)));
      if(wcpm<30) return Math.min(v,70);
      if(wcpm<45) return Math.min(v,80);
      if(wcpm<60) return Math.min(v,88);
      if(wcpm<75) return Math.min(v,94);
      return v;
    }
    function fluencyCapByWcpm(v){
      if(!Number.isFinite(Number(wcpm))) return v;
      if(total<=30) return Math.min(v, wcpm<25?62:(wcpm<35?72:(wcpm<45?80:(wcpm<60?90:100))));
      if(total<=50) return Math.min(v, wcpm<30?60:(wcpm<45?76:(wcpm<60?88:100)));
      if(wcpm<30) return Math.min(v,55);
      if(wcpm<45) return Math.min(v,70);
      if(wcpm<60) return Math.min(v,82);
      if(wcpm<75) return Math.min(v,92);
      return v;
    }
    fluency=Math.max(0,Math.min(100,Math.round(fluencyCapByWcpm(fluency))));
    finalScore=Math.max(0,Math.min(100,Math.round(capByWcpm(finalScore))));

    return {
      accuracy,
      wcpm,
      fluency,
      speedScore,
      finalScore,
      mistakes:missing+extra+repeated,
      missing,
      extra,
      repeated,
      correctWords:correct,
      totalWords:total,
      aiScore:finalScore,
      analysisStatus:"Completed"
    };
  }
  async function analyzeOne(id,silent=false){
    const r=records().find(x=>x.id===id);
    if(!r) return alert("Submission not found.");
    if(!hasAudioRecord(r)) return alert("No audio attached. Allow retake and ask student to record again.");
    await updateRecord(id,{analysisStatus:"Analyzing saved recording..."});
    await renderCards();
    try{
      const text=await transcribeRecord(r);
      const secs=await rpResolveAnalyzeSeconds(r);
      if(!secs || secs<=0) throw new Error("Could not read recording duration. Ask student to submit again or enter a teacher score manually.");
      const res=score(refText(r),text,secs);
      const saved=await updateRecord(id,{...res,analysis:{...res,seconds:secs,readingSeconds:secs,actualReadingSeconds:secs,effectiveReadingSeconds:secs},transcript:text,seconds:secs,durationSeconds:secs,readingSeconds:secs,actualReadingSeconds:secs,effectiveReadingSeconds:secs,analysisStatus:"Completed"});
      if(!silent) console.log("تم التحليل من التسجيل نفسه. Final:", finalScore(saved||res)+"%");
    }catch(err){
      const em=String(err&&err.message||err||"");
      const noKey=/api key|key missing|add openai/i.test(em);
      await updateRecord(id,{analysisStatus:noKey?"Waiting for teacher auto analysis":"Failed: "+em});
      if(!silent) alert("فشل التحليل: "+em);
    }
    await renderCards();
  }

  function fmt(n){ n=Number(n||0); if(!n)return"-"; if(n<1024)return n+" B"; if(n<1048576)return Math.round(n/1024)+" KB"; return (n/1048576).toFixed(1)+" MB"; }

  function normalizeArabicLoose(v){
    return String(v||"")
      .replace(/[أإآٱ]/g,"ا")
      .replace(/ى/g,"ي")
      .replace(/ة/g,"ه")
      .replace(/[\u064B-\u065F\u0670]/g,"")
      .replace(/\s+/g," ")
      .trim()
      .toLowerCase();
  }
  function textOfRecordForRestore(r){
    try{
      return normalizeArabicLoose([
        r && r.id,
        r && r.studentId,
        r && r.studentName,
        r && r.name,
        r && r.fullName,
        r && r.userId,
        r && r.studentUid,
        r && r.uid,
        r && r.className,
        r && r.classId,
        r && r.taskId,
        r && r.taskTitle,
        r && r.title,
        r && r.referenceText
      ].filter(x=>x!==undefined&&x!==null).join(" "));
    }catch(e){return "";}
  }
  function isTargetOldStudentRecord(r){
    const t=textOfRecordForRestore(r);
    if(!t) return false;
    return t.includes("3135") || t.includes("3136") ||
      t.includes(normalizeArabicLoose("حسن محمد العلي")) || t.includes(normalizeArabicLoose("حسن العلي")) ||
      t.includes(normalizeArabicLoose("أحمد علي الخميس")) || t.includes(normalizeArabicLoose("احمد علي الخميس"));
  }
  function repairOldStudentRecord(r){
    const nr=normalizeRecord({...r});
    const t=textOfRecordForRestore(nr);
    if(t.includes("3135") || t.includes(normalizeArabicLoose("حسن محمد العلي")) || t.includes(normalizeArabicLoose("حسن العلي"))){
      nr.studentId="3135";
      nr.studentName="حسن محمد العلي";
      nr.classId=nr.classId||"class_3_1";
      nr.className=nr.className&&nr.className!=="Unassigned"?nr.className:"ثالث أول";
    }
    if(t.includes("3136") || t.includes(normalizeArabicLoose("أحمد علي الخميس")) || t.includes(normalizeArabicLoose("احمد علي الخميس"))){
      nr.studentId="3136";
      nr.studentName="أحمد علي الخميس";
      nr.classId=nr.classId||"class_3_1";
      nr.className=nr.className&&nr.className!=="Unassigned"?nr.className:"ثالث أول";
    }
    nr.id = nr.id || ("restored_"+nr.studentId+"_"+(nr.submittedAt||nr.createdAt||Date.now())+"_"+Math.random().toString(36).slice(2));
    nr.taskId = nr.taskId || taskId();
    nr.restoredFromOldStorage = nr.restoredFromOldStorage || new Date().toISOString();
    return nr;
  }
  function collectArraysDeep(value, out, depth){
    if(depth>3 || !value) return;
    if(Array.isArray(value)){
      if(value.some(x=>x && typeof x==="object" && (x.audioId||x.audioDataUrl||x.audioUrl||x.studentId||x.studentName||x.taskId))) out.push(value);
      value.forEach(x=>collectArraysDeep(x,out,depth+1));
    }else if(typeof value==="object"){
      Object.keys(value).forEach(k=>collectArraysDeep(value[k],out,depth+1));
    }
  }
  async function restoreOldStudentRecords(){
    alert("تم تعطيل استعادة التسجيلات القديمة نهائيًا حتى لا ترجع بيانات الطلاب القديمة إلى RP.");
    return;
    const found=[];
    const scanned=[];
    const keyRe=/(rp_attempt_records|rp_student_attempts|reading|eq_reading|attempt|submission)/i;
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(!key || !keyRe.test(key)) continue;
      scanned.push(key);
      let parsed=null;
      try{ parsed=JSON.parse(localStorage.getItem(key)||"null"); }catch(e){ continue; }
      const arrays=[];
      collectArraysDeep(parsed, arrays, 0);
      arrays.forEach(arr=>arr.forEach(item=>{ if(item && typeof item==="object" && isTargetOldStudentRecord(item)) found.push({key,item}); }));
    }
    const current=records();
    const map={};
    current.forEach(r=>{ if(r&&r.id) map[r.id]=r; });
    let added=0, updated=0;
    const sources=[];
    for(const f of found){
      const rr=repairOldStudentRecord(f.item);
      rr.restoreSourceKey=f.key;
      sources.push(f.key);
      if(map[rr.id]){ map[rr.id]={...map[rr.id],...rr}; updated++; }
      else{ map[rr.id]=rr; added++; }
    }
    const merged=Object.values(map).sort((a,b)=>recordTime(a)-recordTime(b));
    saveRecords(merged);
    // Try to save restored records to cloud too, without blocking local restore.
    await Promise.allSettled(Object.values(map).filter(r=>r&&r.restoredFromOldStorage).map(r=>cloudSaveRecord(r)));
    await renderCards();
    const uniqueSources=[...new Set(sources)];
    alert("فحص التسجيلات القديمة انتهى.\n"+
      "المفاتيح المفحوصة: "+scanned.length+"\n"+
      "تسجيلات مطابقة لأحمد/حسن: "+found.length+"\n"+
      "تمت الإضافة: "+added+"\n"+
      "تم تحديث موجود: "+updated+"\n"+
      (uniqueSources.length?"المصدر: "+uniqueSources.slice(0,5).join(", "):"لم أجد تسجيلات قديمة في هذا الجهاز."));
  }

  }

<!-- PATCH_NO_STICKY_SECTION_CARDS_GB_HEATMAP_20260611_SAFE -->
<script id="patch-no-sticky-section-cards-gb-heatmap-safe">
(function(){
  function textHas(el, needle){ return el && (el.textContent||'').indexOf(needle) !== -1; }
  function unstickSectionCard(needle){
    var all = document.querySelectorAll('div,section,article');
    for(var i=0;i<all.length;i++){
      var el = all[i];
      if(!textHas(el, needle)) continue;
      // Only target the small section header/filter block, not the whole app/root.
      var p = el;
      for(var depth=0; depth<4 && p && p.id !== 'root' && p !== document.body; depth++, p=p.parentElement){
        var st = getComputedStyle(p);
        if(st.position === 'sticky' || st.position === 'fixed'){
          p.style.position = 'relative';
          p.style.top = 'auto';
          p.style.zIndex = '1';
          p.style.transform = 'none';
        }
      }
    }
  }
  function protectMainBars(){
    var root = document.getElementById('root');
    if(!root) return;
    var app = root.firstElementChild;
    if(!app) return;
    var header = app.children && app.children[0];
    var tabs = app.children && app.children[1];
    if(header){ header.style.position='relative'; header.style.zIndex='300'; }
    if(tabs){ tabs.style.position='relative'; tabs.style.zIndex='250'; }
  }
  function apply(){
    unstickSectionCard('📒 Gradebook');
    unstickSectionCard('Student Heatmap');
    protectMainBars();
  }
  apply();
  var tries=0;
  var timer=setInterval(function(){ apply(); if(++tries>40) clearInterval(timer); }, 500);
  document.addEventListener('click', function(){ setTimeout(apply, 80); }, true);
})();
</script>
