function normalizeNameText(v){

function studentNameMatches(student, entered){
  const n = normalizeNameText(entered);

  const full = normalizeNameText(student.name);
  const short = normalizeNameText(student.shortName || String(student.name||"").split(/\s+/).slice(0,2).join(" "));
  if(n === full || n === short) return true;
  const stop={"بن":1,"ابن":1,"بنت":1};
  const inTokens=n.split(" ").filter(t=>t&&!stop[t]);
  const fullTokens=full.split(" ").filter(t=>t&&!stop[t]);

}

  return s;
}
