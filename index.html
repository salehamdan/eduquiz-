// Force-fetch the latest app version (bypass browser cache) and reload.
async function forceUpdate(){
  try {
    if (window.caches && caches.keys) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  } catch(e){}
  // Add a cache-busting query param so the server returns the freshest file
  const u = new URL(window.location.href);
  u.searchParams.set("v", Date.now().toString(36));
  window.location.replace(u.toString());
}


// ── CLOUD DATA LAYER (Firestore) ──────────────────────────────
// Collections: users, classes, quizzes, responses, announcements, notes
async function fsAll(col) {
  if (!FIREBASE_OK) return JSON.parse(localStorage.getItem("eq_"+col) || "[]");
  const snap = await db.collection(col).get();
  return snap.docs.map(d => ({...d.data(), _id:d.id}));
}
async function fsSet(col, id, data) {
  if (!FIREBASE_OK) {
    const arr = JSON.parse(localStorage.getItem("eq_"+col) || "[]");
    const i = arr.findIndex(x => x.id===id);
    if (i>=0) arr[i] = {...data, id}; else arr.push({...data, id});
    localStorage.setItem("eq_"+col, JSON.stringify(arr));
    return;
  }
  await db.collection(col).doc(id).set(data);
}
async function fsDel(col, id) {
  if (!FIREBASE_OK) {
    const arr = JSON.parse(localStorage.getItem("eq_"+col) || "[]").filter(x => x.id!==id);
    localStorage.setItem("eq_"+col, JSON.stringify(arr));
    return;
  }
  await db.collection(col).doc(id).delete();
}
async function loadAllData() {
  const [users,classes,quizzes,responses,announcements,notes] = await Promise.all([
    fsAll("users"),fsAll("classes"),fsAll("quizzes"),fsAll("responses"),fsAll("announcements"),fsAll("notes")
  ]);
  return {users,classes,quizzes,responses,announcements,notes};
}

// ── SKILL DETECTION (shared by AI generation & import) ────────
function detectSkill(text, providedSkill, quizType) {
  const t = (text||"").toLowerCase();
  if (quizType === "Grammar") return "Grammar";
  if (quizType === "Vocabulary") return "Vocabulary";
  if (quizType === "Grammar & Vocabulary") {
    if (providedSkill === "Grammar" || providedSkill === "Vocabulary") return providedSkill;
    const vocabWords = ["mean","meaning","synonym","antonym","opposite","definition","vocabulary","closest in meaning","similar to","word for","best describes","refers to"];
    const grammarWords = ["tense","verb","correct form","grammar","article","preposition","plural","singular","clause","passive","active","comparative","superlative","past","present","future","auxiliary","conjunction","pronoun","adjective","adverb","subject","object","correct sentence","gap"];
    if (vocabWords.some(w=>t.includes(w))) return "Vocabulary";
    if (grammarWords.some(w=>t.includes(w))) return "Grammar";
    return "Grammar";
  }
  if (quizType === "Reading" || quizType === "Listening") {
    if (providedSkill && SKILLS.includes(providedSkill) && providedSkill !== "Main Idea") return providedSkill;
    if (/(main idea|best title|mainly about|purpose of the (passage|text|paragraph)|what is the (passage|text|article) about|theme|best summary)/.test(t)) return "Main Idea";
    if (/(infer|imply|implies|suggest|probably|most likely|we can conclude|it can be understood|attitude|tone of)/.test(t)) return "Inference";
    if (/(the word|the underlined word|closest in meaning|synonym|antonym|opposite of|refers to|what does .* mean)/.test(t)) return "Vocabulary";
    if (/(first|then|next|after that|sequence|order of events|what happened (first|last)|put .* in order)/.test(t)) return "Sequencing";
    if (/(because|cause|reason|result|effect|due to|why did|led to|as a result)/.test(t)) return "Cause & Effect";
    if (/(according to|when|where|who|how many|how much|what (did|was|were|is|are)|which)/.test(t)) return "Detail Recall";
    return quizType === "Listening" ? "Listening Comprehension" : "Detail Recall";
  }
  if (SKILLS.includes(providedSkill)) return providedSkill;
  return SKILLS[0];
}

async function suggestListeningTopics({apiKey, difficulty}) {
  const prompt = `Suggest 6 short, engaging LISTENING comprehension topic ideas for English learners at ${difficulty} level. Each topic should be 2-5 words (e.g. "At the airport", "A job interview", "Ordering food"). Return ONLY valid JSON: {"topics":["topic1","topic2","topic3","topic4","topic5","topic6"]}`;
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body: JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:500,messages:[{role:"user",content:prompt}]})
  });
  if(!resp.ok){ const t=await resp.text(); throw new Error("API error "+resp.status+": "+t.slice(0,200)); }
  const data=await resp.json();
  let text=(data.content&&data.content[0]&&data.content[0].text)||"";
  text=text.replace(/```json/g,"").replace(/```/g,"").trim();
  const s=text.indexOf("{"),e=text.lastIndexOf("}");
  if(s>=0&&e>s)text=text.slice(s,e+1);
  const parsed=JSON.parse(text);
  return parsed.topics||[];
}

Make ${count} questions. Also make an answer bank with ${count}+1 or ${count}+2 choices (a few MORE than the questions, so some are distractors). Each question matches exactly ONE answer.

"correct" is 0 if the statement is True, 1 if False. Mix true and false answers. Make them clear for students.`;
    } else {

Each question has exactly 4 options with ONE correct answer.

{"questions":[{"text":"question here","options":["option A","option B","option C","option D"],"correct":0,"skill":"Grammar","difficulty":"${difficulty}"}]}

"correct" is the index (0-3) of the right option. Vary the correct answer position. Make questions clear and focused on the rule.`;

Skills must be from: ${skillsList}. 

Return ONLY valid JSON (no markdown) in this EXACT format:
{"questions":[{"text":"the question text","options":["A","B","C","D"],"correct":0,"skill":"Grammar","difficulty":"${difficulty}"}]}

"correct" is the index (0-3) of the right option. Extract ALL questions in order. If text is unclear, make your best reading.`;
  } else if (sourceType === "extract") {

Return ONLY valid JSON (no markdown, no explanation) in this EXACT format:
{"questions":[{"text":"question here","options":["option A","option B","option C","option D"],"correct":0,"skill":"Grammar","difficulty":"${difficulty}"}]}

      "anthropic-dangerous-direct-browser-access": "true"

      model: "claude-haiku-4-5-20251001",

        { type:"image", source:{ type:"base64", media_type:(image.match(/^data:(image\/[a-zA-Z]+);base64,/)||[])[1]||"image/jpeg", data:image.replace(/^data:image\/[a-zA-Z]+;base64,/,"") } },

  const data = await resp.json();
  let text = (data.content && data.content[0] && data.content[0].text) || "";
  text = text.replace(/```json/g,"").replace(/```/g,"").trim();
  // Extract JSON object
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  if (start>=0 && end>start) text = text.slice(start, end+1);
  const parsed = JSON.parse(text);
  if (!parsed.questions || !parsed.questions.length) throw new Error("No questions generated.");
  if (matchMode) {
    const matchAnswers = (parsed.matchAnswers||[]).map(a=>String(a).trim()).filter(a=>a);
    const questions = parsed.questions.map((q,i)=>({
      id: i+1,
      text: String(q.text||"").trim(),
      options: [],
      correctLabel: String(q.correctLabel||"").trim().toLowerCase(),

      difficulty: DIFFICULTIES.includes(q.difficulty) ? q.difficulty : difficulty
    })).filter(q=>q.text && q.correctLabel);
    return { questions, matchAnswers, script: String(parsed.script||"").trim() };
  }
  const questions = parsed.questions.map((q,i)=>{
    const opts = (q.options||[]).slice(0,4).map(o=>String(o).trim()).filter(o=>o);
    const maxIdx = opts.length-1;
    return {
      id: i+1,
      text: String(q.text||"").trim(),
      options: opts,
      correct: typeof q.correct==="number" && q.correct>=0 && q.correct<=maxIdx ? q.correct : 0,
      skill: detectSkill(String(q.text||""), q.skill, type),
      difficulty: DIFFICULTIES.includes(q.difficulty) ? q.difficulty : difficulty
    };
  }).filter(q=>q.text && q.options.length>=2);
  return { questions, script: String(parsed.script||"").trim() };
}

// ── Extract text from uploaded file (txt, docx via mammoth-free fallback, pdf basic) ──
async function extractFileText(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".txt") || name.endsWith(".csv")) {
    return await file.text();
  }
  if (name.endsWith(".xlsx") || name.endsWith(".xls")) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(buf), {type:"array"});
    let txt = "";
    wb.SheetNames.forEach(sn => { txt += XLSX.utils.sheet_to_csv(wb.Sheets[sn]) + "\n"; });
    return txt;
  }
  // For docx/pdf: read as text (best effort) — recommend paste for these
  try { return await file.text(); } catch(e){ return ""; }
}

function calcSkills(resps, quizzes) {
  const m = {};
  resps.forEach(r => {
    const q = quizzes.find(x => x.id === r.quizId);
    if (!q) return;
    q.questions.forEach((qs, idx) => {
      const skill = qs.skill || (q.type === "Listening" ? "Listening Comprehension" : "General");
      if (!m[skill]) m[skill] = {c:0,t:0};
      m[skill].t++;

      const ans = r.answers ? r.answers[qs.id] : undefined;
      let ok = false;

      // Normal MCQ quizzes store the selected option index.
      if (q.type === "Listening" && q.listenMatch) {
        // Listening Matching stores a selected letter (a, b, c...) instead of an option index.
        ok = String(ans || "").trim().toLowerCase() === String(qs.correctLabel || "").trim().toLowerCase();
      } else if (q.type === "Image Labeling" && q.labelAnswerMode === "number") {
        ok = String(ans || "").trim() === String(qs.correctNum || (idx + 1)).trim();
      } else if (q.type === "Image Labeling" && q.labelAnswerMode === "write") {
        ok = String(ans || "").trim().toLowerCase() === String(qs.correctLabel || "").trim().toLowerCase();
      } else {
        ok = ans === qs.correct;
      }

      if (ok) m[skill].c++;
    });
  });
  return Object.entries(m).map(([skill,x]) => ({skill, score:pct(x.c,x.t), correct:x.c, total:x.t}));
}
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// Build a shuffled copy of a quiz: questions in random order, and each question's
// options shuffled with the correct index updated. Reading/Listening keep question
// order (since they follow a passage) but still shuffle options.
function makeShuffledQuiz(quiz) {
  // Image Labeling: handle FIRST (number mode must always assign correctNum, even if shuffle off)
  if (quiz.type === "Image Labeling") {
    if (quiz.labelAnswerMode === "number") {
      // Each part has a teacher-set correctNum (the number on the image). Shuffle the table row order
      // so words don't appear in a predictable order, but keep each word's correct number.
      const numbered = quiz.questions.map((q,i) => ({ ...q, correctNum: String(q.correctNum||(i+1)) }));
      const rows = (quiz.shuffle === false) ? numbered : shuffleArray(numbered.slice());
      return { ...quiz, questions: rows };
    }
    if (quiz.shuffle === false) return quiz;
    if (quiz.labelAnswerMode === "write") return quiz;
    // choose mode: shuffle options only, keep correctLabel mapping
    const qs = quiz.questions.map(q => {
      const idxs = shuffleArray([0,1,2,3].slice(0, q.options.length));
      const newOptions = idxs.map(i => q.options[i]);
      const newCorrect = newOptions.findIndex(o => String(o).trim().toLowerCase() === String(q.correctLabel||"").trim().toLowerCase());
      return { ...q, options: newOptions, correct: newCorrect>=0?newCorrect:0 };
    });
    return { ...quiz, questions: qs };
  }
  // Listening Matching: questions have no MCQ options. Optionally shuffle the ANSWER CHOICES (a,b,c…)
  // and remap each question's correct letter so grading stays correct. Questions keep their order (tied to audio).
  if (quiz.type === "Listening" && quiz.listenMatch) {
    if (!quiz.matchShuffle || !quiz.matchAnswers || quiz.matchAnswers.length < 2) return quiz;
    const n = quiz.matchAnswers.length;
    const order = shuffleArray([...Array(n).keys()]); // order[newIndex] = oldIndex
    const newAnswers = order.map(oi => quiz.matchAnswers[oi]);
    // Map old letter -> new letter so grading stays correct after reordering.
    const oldToNew = {};
    order.forEach((oldIdx, newIdx) => { oldToNew[String.fromCharCode(97+oldIdx)] = String.fromCharCode(97+newIdx); });
    const qs = quiz.questions.map(q => {
      const oldLetter = String(q.correctLabel||"").trim().toLowerCase();
      return { ...q, correctLabel: oldToNew[oldLetter] || oldLetter };
    });
    return { ...quiz, matchAnswers: newAnswers, questions: qs };
  }
  // If teacher turned shuffle off for this quiz, return it unchanged
  if (quiz.shuffle === false) return quiz;
  // Shuffle question order for non-passage quizzes (passages need order); answers always shuffle
  const shuffleQuestions = (quiz.type === "Grammar" || quiz.type === "Vocabulary" || quiz.type === "Grammar & Vocabulary");
  let qs = quiz.questions.map(q => {
    const idxs = shuffleArray([0,1,2,3].slice(0, q.options.length));
    const newOptions = idxs.map(i => q.options[i]);
    const newCorrect = idxs.indexOf(q.correct);
    return { ...q, options: newOptions, correct: newCorrect>=0?newCorrect:0 };
  });
  if (shuffleQuestions) qs = shuffleArray(qs);
  return { ...quiz, questions: qs };
}

function calcBadges(resps, quizzes) {
  const e = new Set();
  if (resps.length>0) e.add("first");
  if (resps.length>=5) e.add("streak5");
  if (resps.some(r => pct(r.score,r.totalQ)===100)) e.add("perfect");
  const sk = calcSkills(resps, quizzes);
  if (sk.filter(s=>s.score>=80).length>=3) e.add("mastery3");
  if (sk.find(s=>s.skill==="Vocabulary"&&s.score>=80)) e.add("vocab");
  if (sk.find(s=>s.skill==="Grammar"&&s.score>=80)) e.add("grammar");
  if (sk.find(s=>s.skill==="Listening Comprehension"&&s.score>=80)) e.add("listen");
  if (sk.find(s=>s.skill==="Main Idea"&&s.score>=80)) e.add("reading");
  const byQ = {};
  resps.forEach(r => { if(!byQ[r.quizId]) byQ[r.quizId]=[]; byQ[r.quizId].push(r); });
  Object.values(byQ).forEach(rs => {
    if (rs.length>=2) {
      const s = [...rs].sort((a,b)=>a.attempt-b.attempt);
      if (pct(s[s.length-1].score,s[s.length-1].totalQ)-pct(s[0].score,s[0].totalQ)>=20) e.add("improved");
    }
  });
  return [...e];
}

  const upd = (k,v) => sf(x=>({...x,[k]:v}));

  useEffect(()=>{ fsAll("classes").then(setClasses); },[]);

  async function doResetPassword(){
    setFgMsg("");
    if(!fgId.trim()||!fgFather.trim()||!fgNew.trim()){setFgMsg("Please fill all fields.");return;}
    const users = await fsAll("users");
    const u = users.find(x=>x.role==="student" && (x.studentId||"").toLowerCase()===fgId.trim().toLowerCase());
    if(!u){setFgMsg("Student ID not found.");return;}
    if((u.fatherName||"").trim().toLowerCase()!==fgFather.trim().toLowerCase()){setFgMsg("Father's name does not match our records. Ask your teacher to reset it.");return;}
    await fsSet("users",u.id,{...u,password:fgNew.trim()});

// ── TAKE QUIZ ─────────────────────────────────────────────────
function GameQuiz({quiz: rawQuiz, student, allResponses, onDone, onSaved}) {
  const [quiz] = useState(() => makeShuffledQuiz(rawQuiz));
  const [idx,setIdx] = useState(0);            // current question index
  const [picked,setPicked] = useState(null);   // option index picked for current q
  const [locked,setLocked] = useState(false);  // answer locked (showing feedback)
  const [answers,setAnswers] = useState({});    // qId -> original option index
  const [points,setPoints] = useState(0);
  const [streak,setStreak] = useState(0);
  const [qStart,setQStart] = useState(Date.now());
  const [phase,setPhase] = useState("play");   // play | done
  const [saving,setSaving] = useState(false);
  const [score,setScore] = useState(0);
  const instant = quiz.instantFeedback !== false;
  const total = quiz.questions.length;
  const prev = allResponses.filter(r=>r.studentId===student.id && r.quizId===quiz.id).length;
  const timerType = quiz.gameTimerType || "none";
  const timerSec = quiz.gameTimerSec || 20;
  const [timeLeft,setTimeLeft] = useState(timerType==="perQ"?timerSec : timerType==="whole"?timerSec : null);
  const tickRef = useRef();

  const q = quiz.questions[idx];

  // Countdown timer
  useEffect(()=>{
    if(timerType==="none" || phase!=="play") return;
    tickRef.current = setInterval(()=>{
      setTimeLeft(t=>{
        if(t===null) return null;
        if(t<=1){
          clearInterval(tickRef.current);
          if(timerType==="perQ"){ if(!locked){ setLocked(true); setStreak(0); setTimeout(()=>nextWithReset(),600); } }
          else { finish(); }
          return 0;
        }
        return t-1;
      });
    },1000);
    return ()=>clearInterval(tickRef.current);
  },[idx,phase,locked]);

  function nextWithReset(){
    clearInterval(tickRef.current);
    if(idx+1 < total){ setIdx(idx+1); setPicked(null); setLocked(false); setQStart(Date.now()); if(timerType==="perQ") setTimeLeft(timerSec); }
    else finish();
  }

  function choose(i){
    if(locked) return;
    setPicked(i);
    setLocked(true);
    const correct = i===q.correct;
    // map back to original index for saving
    const orig = rawQuiz.questions.find(oq=>oq.id===q.id);
    const selText = q.options[i];
    const oi = orig ? orig.options.indexOf(selText) : i;
    setAnswers(a=>({...a,[q.id]: oi>=0?oi:i}));
    if(correct){
      const secs = (Date.now()-qStart)/1000;
      const speedBonus = Math.max(0, Math.round(50 - secs*5)); // up to +50 for fast
      const base = 100;
      const newStreak = streak+1;
      const streakBonus = (newStreak>=3)?25:0;
      setPoints(p=>p+base+speedBonus+streakBonus);
      setStreak(newStreak);
    } else {
      setStreak(0);
    }
    // Auto-advance after a short delay
    setTimeout(()=>{ next(); }, instant ? 1100 : 350);
  }

  function next(){
    clearInterval(tickRef.current);
    if(idx+1 < total){
      setIdx(idx+1); setPicked(null); setLocked(false); setQStart(Date.now());
      if(timerType==="perQ") setTimeLeft(timerSec);
    } else {
      finish();
    }
  }

  async function finish(){
    const answeredCount = Object.keys(answers).length;
    const sc = quiz.questions.filter(qq=>{
      const sel = answers[qq.id];
      const orig = rawQuiz.questions.find(oq=>oq.id===qq.id);
      return orig && sel===orig.correct;
    }).length;
    setScore(sc); setPhase("done");
    // Don't save an empty attempt (student left without answering anything)
    if(answeredCount===0){ return; }
    setSaving(true);
    const entry={id:uid(),studentId:student.id,quizId:quiz.id,score:sc,totalQ:total,answers:{...answers},attempt:prev+1,points,mode:"game",completedAt:today(),ts:Date.now()};
    try { await fsSet("responses",entry.id,entry); if(onSaved) await onSaved(); } catch(e){}
    setSaving(false);
  }

  // DONE screen
  if(phase==="done"){
    const p = pct(score,total);
    const passed = p>=(quiz.masteryThreshold||MASTERY_DEFAULT);
    return (
      <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"linear-gradient(160deg,"+C.dk+","+C.md+")"}}>
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px",textAlign:"center"}}>
          <div style={{fontSize:"64px",marginBottom:"6px"}}>{passed?"🏆":"💪"}</div>
          <div style={{fontSize:"22px",fontWeight:"900",color:"#fff",fontFamily:F,marginBottom:"4px"}}>{passed?"Awesome!":"Good try!"}</div>
          <div style={{fontSize:"15px",color:"#cbd5e1",fontFamily:F,marginBottom:"18px"}}>{student.name}</div>
          <div style={{background:"rgba(255,255,255,0.1)",borderRadius:"16px",padding:"22px 30px",marginBottom:"16px"}}>
            <div style={{fontSize:"44px",fontWeight:"900",color:"#fbbf24",fontFamily:F,lineHeight:1}}>{points}</div>
            <div style={{fontSize:"12px",color:"#cbd5e1",fontFamily:F,letterSpacing:"1px"}}>POINTS</div>
          </div>
          <div style={{display:"flex",gap:"12px",marginBottom:"22px"}}>
            <div style={{background:"rgba(255,255,255,0.1)",borderRadius:"11px",padding:"11px 18px"}}><div style={{fontSize:"20px",fontWeight:"800",color:"#4ade80",fontFamily:F}}>{score}</div><div style={{fontSize:"10px",color:"#cbd5e1",fontFamily:F}}>Correct</div></div>
            <div style={{background:"rgba(255,255,255,0.1)",borderRadius:"11px",padding:"11px 18px"}}><div style={{fontSize:"20px",fontWeight:"800",color:"#f87171",fontFamily:F}}>{total-score}</div><div style={{fontSize:"10px",color:"#cbd5e1",fontFamily:F}}>Wrong</div></div>
            <div style={{background:"rgba(255,255,255,0.1)",borderRadius:"11px",padding:"11px 18px"}}><div style={{fontSize:"20px",fontWeight:"800",color:"#60a5fa",fontFamily:F}}>{p}%</div><div style={{fontSize:"10px",color:"#cbd5e1",fontFamily:F}}>Score</div></div>
          </div>
          <button onClick={onDone} style={{background:"#fff",color:C.dk,border:"none",borderRadius:"11px",padding:"13px 32px",fontWeight:"800",fontSize:"15px",cursor:"pointer",fontFamily:F}}>{saving?"Saving…":"Done ✓"}</button>
        </div>
      </div>
    );
  }

  // PLAY screen
  const progress = ((idx)/total)*100;
  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"linear-gradient(160deg,"+C.dk+","+C.md+")"}}>
      {/* Top bar */}
      <div style={{padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <button onClick={()=>{ if(confirm("Leave the game? Progress will not be saved.")) onDone(); }} style={{background:"none",border:"none",color:"#fff",fontSize:"22px",cursor:"pointer"}}>←</button>
        <div style={{color:"#fff",fontSize:"13px",fontWeight:"700",fontFamily:F}}>Question {idx+1} of {total}</div>
        <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
          {timerType!=="none" && timeLeft!==null && <div style={{background:timeLeft<=5?"rgba(239,68,68,0.3)":"rgba(255,255,255,0.15)",borderRadius:"999px",padding:"4px 11px",color:timeLeft<=5?"#fca5a5":"#fff",fontWeight:"800",fontSize:"14px",fontFamily:F}}>⏱️ {timeLeft}s</div>}
          <div style={{background:"rgba(251,191,36,0.2)",borderRadius:"999px",padding:"4px 12px",color:"#fbbf24",fontWeight:"800",fontSize:"14px",fontFamily:F}}>⭐ {points}</div>
        </div>
      </div>
      {/* Progress bar */}
      <div style={{height:"6px",background:"rgba(255,255,255,0.15)",margin:"0 16px",borderRadius:"3px",overflow:"hidden"}}>
        <div style={{height:"100%",width:progress+"%",background:"linear-gradient(90deg,#fbbf24,#f59e0b)",transition:"width 0.3s",borderRadius:"3px"}}/>
      </div>
      {streak>=3 && <div style={{textAlign:"center",color:"#fbbf24",fontSize:"12px",fontWeight:"700",marginTop:"6px",fontFamily:F}}>🔥 {streak} in a row! +25 bonus</div>}

      {/* Question */}
      <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",padding:"20px 18px"}}>
        <div style={{background:"rgba(255,255,255,0.08)",borderRadius:"14px",padding:"20px",marginBottom:"18px"}}>
          <span style={{fontSize:"10px",background:"rgba(96,165,250,0.25)",color:"#93c5fd",padding:"2px 9px",borderRadius:"999px",fontWeight:"600",fontFamily:F}}>{q.skill}</span>
          <p style={{color:"#fff",fontSize:"19px",fontWeight:"700",lineHeight:"1.5",margin:"12px 0 0",fontFamily:F}}>{q.text}</p>
        </div>
        <div style={{display:"grid",gap:"11px"}}>
          {q.options.map((opt,i)=>{
            const isPicked = picked===i;
            const isCorrect = i===q.correct;
            let bg="rgba(255,255,255,0.95)",col=C.tx,bdr="3px solid transparent";
            if(locked && instant){
              if(isCorrect){ bg="#22c55e"; col="#fff"; bdr="3px solid #16a34a"; }
              else if(isPicked){ bg="#ef4444"; col="#fff"; bdr="3px solid #dc2626"; }
              else { bg="rgba(255,255,255,0.5)"; }
            } else if(locked && !instant && isPicked){
              bg="#93c5fd"; bdr="3px solid #3b82f6";
            }
            return (
              <button key={i} onClick={()=>choose(i)} disabled={locked} style={{display:"flex",alignItems:"center",gap:"12px",padding:"16px 18px",borderRadius:"13px",border:bdr,background:bg,color:col,fontSize:"16px",fontWeight:"600",cursor:locked?"default":"pointer",textAlign:"left",fontFamily:F,transition:"all 0.2s",transform:isPicked?"scale(1.02)":"scale(1)"}}>
                <span style={{minWidth:"30px",height:"30px",borderRadius:"50%",background:"rgba(0,0,0,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"800",flexShrink:0}}>{String.fromCharCode(65+i)}</span>
                <span style={{flex:1}}>{opt}</span>
                {locked && instant && isCorrect && <span style={{fontSize:"20px"}}>✅</span>}
                {locked && instant && isPicked && !isCorrect && <span style={{fontSize:"20px"}}>❌</span>}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function TakeQuiz({quiz: rawQuiz, student, allResponses, onDone, onSaved}) {
  const [quiz] = useState(() => makeShuffledQuiz(rawQuiz));
  const [answers,setAnswers] = useState({});
  const [submitted,setSubmitted] = useState(false);
  const [tab,setTab] = useState((quiz.passage||quiz.audioFile)?"passage":"questions");
  const [timeLeft,setTimeLeft] = useState(quiz.timer>0?quiz.timer*60:null);
  const [saving,setSaving] = useState(false);
  const [mErr,setMErr] = useState("");
  const [rating,setRating] = useState(0);
  const [score,setScore] = useState(0);
  const tRef = useRef();
  const audioElRef = useRef();
  const [listenCount,setListenCount] = useState(0);
  const [isPlaying,setIsPlaying] = useState(false);
  const [playSpeed,setPlaySpeed] = useState(1);
  const [ttsPaused,setTtsPaused] = useState(false);
  const [ttsIndex,setTtsIndex] = useState(0);
  const ttsChunksRef = useRef([]);
  const ttsIndexRef = useRef(0);
  const listenLimit = quiz.listenLimit||0;
  const listensLeft = listenLimit>0 ? Math.max(0,listenLimit-listenCount) : null;
  const canListen = listenLimit===0 || listenCount<listenLimit;
  const AC = quiz.audioControls || {seek:true,speed:true,pause:true,restart:true};
  const thresh = quiz.masteryThreshold ?? MASTERY_DEFAULT;
  const total = quiz.questions.length;
  const prev = allResponses.filter(r=>r.studentId===student.id&&r.quizId===quiz.id).length;
  const fmt = s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

  useEffect(()=>{
    if(timeLeft===null||submitted) return;
    if(timeLeft<=0){ if(Object.keys(answers).length>0){doSave();} else {onDone();} return; }
    tRef.current=setTimeout(()=>setTimeLeft(t=>t-1),1000);
    return ()=>clearTimeout(tRef.current);
  },[timeLeft,submitted]);

  function pickVoice(u){
    const voices=window.speechSynthesis.getVoices();
    const en=voices.find(v=>/en-(US|GB)/i.test(v.lang)&&/(natural|google|samantha|daniel|aria|libby)/i.test(v.name))||voices.find(v=>/en/i.test(v.lang));
    if(en)u.voice=en;
  }
  function getTTSChunks(){
    if(!ttsChunksRef.current.length){
      const text = String(quiz.passage||"").replace(/\s+/g," ").trim();
      ttsChunksRef.current = text ? (text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text]).map(x=>x.trim()).filter(Boolean) : [];
    }
    return ttsChunksRef.current;
  }
  function speakTTSFrom(index){
    const chunks=getTTSChunks();
    if(!chunks.length) return;
    const i=Math.max(0,Math.min(index,chunks.length-1));
    ttsIndexRef.current=i;
    setTtsIndex(i);
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(chunks[i]);
    u.lang="en-US"; u.rate=0.9*playSpeed; pickVoice(u);
    u.onend=()=>{
      // Continue sentence by sentence so forward/back and pause work on mobile browsers.
      if(ttsIndexRef.current < chunks.length-1){ speakTTSFrom(ttsIndexRef.current+1); }
      else { setIsPlaying(false); setTtsPaused(false); ttsIndexRef.current=0; setTtsIndex(0); }
    };
    window.speechSynthesis.speak(u);
    setIsPlaying(true); setTtsPaused(false);
  }
  const playAudio=()=>{
    if(!canListen) return;
    setMErr("");
    if(quiz.audioFile){
      const a=audioElRef.current; if(!a){setMErr("Audio is loading… tap Play again in a second.");return;}
      a.playbackRate=playSpeed;
      const pr=a.play();
      if(pr&&pr.then){
        pr.then(()=>{ setIsPlaying(true); setMErr(""); })
          .catch(()=>{ setIsPlaying(false); setMErr("Could not play the audio. Check the audio link, or your internet connection."); });
      } else { setIsPlaying(true); }
    } else {
      if(!quiz.passage)return;
      try{
        if(ttsPaused && window.speechSynthesis.paused){
          window.speechSynthesis.resume();
          setIsPlaying(true); setTtsPaused(false);
        } else {
          const start=ttsIndexRef.current||0;
          const startSpeak=()=>speakTTSFrom(start);
          if(window.speechSynthesis.getVoices().length===0){ window.speechSynthesis.onvoiceschanged=()=>{startSpeak();window.speechSynthesis.onvoiceschanged=null;}; setTimeout(startSpeak,300); }
          else startSpeak();
          setListenCount(c=>c+1);
        }
      }catch(e){ setMErr("Your device could not play the voice. Try a different browser."); }
      return;
    }
    setListenCount(c=>c+1);
  };
  const pauseAudio=()=>{
    if(quiz.audioFile){ if(audioElRef.current)audioElRef.current.pause(); }
    else { try{ window.speechSynthesis.pause(); setTtsPaused(true); }catch(e){ window.speechSynthesis.cancel(); } }
    setIsPlaying(false);
  };
  const restartAudio=()=>{
    if(!canListen) return;
    if(quiz.audioFile){ const a=audioElRef.current; if(a){a.currentTime=0;a.playbackRate=playSpeed;a.play();setIsPlaying(true);} }
    else { ttsIndexRef.current=0; setTtsIndex(0); speakTTSFrom(0); }
    setListenCount(c=>c+1);
  };
  const cycleSpeed=()=>{ const speeds=[0.5,0.75,1,1.25,1.5]; const i=speeds.indexOf(playSpeed); const next=speeds[(i+1)%speeds.length]; setPlaySpeed(next); if(quiz.audioFile&&audioElRef.current)audioElRef.current.playbackRate=next; if(!quiz.audioFile && isPlaying){ speakTTSFrom(ttsIndexRef.current); } };
  const seekAudio=(sec)=>{
    if(quiz.audioFile && audioElRef.current){ audioElRef.current.currentTime=Math.max(0,audioElRef.current.currentTime+sec); return; }
    if(!quiz.audioFile && quiz.passage){
      const chunks=getTTSChunks(); if(!chunks.length) return;
      const step=sec<0?-1:1;
      const next=Math.max(0,Math.min(chunks.length-1,(ttsIndexRef.current||0)+step));
      ttsIndexRef.current=next; setTtsIndex(next);
      if(isPlaying || ttsPaused) speakTTSFrom(next);
    }
  };
  const speak=playAudio;

  // Check if an answer is correct (handles Image Labeling write-mode text answers)
  function isCorrect(q){
    const a=answers[q.id];
    if(a===undefined) return false;
    if(quiz.type==="Listening" && quiz.listenMatch){
      return String(a).trim().toLowerCase() === String(q.correctLabel||"").trim().toLowerCase();
    }
    if(quiz.type==="Image Labeling" && quiz.labelAnswerMode==="number"){
      return String(a).trim() === String(q.correctNum||"").trim();
    }
    if(quiz.type==="Image Labeling" && quiz.labelAnswerMode==="write"){
      return String(a).trim().toLowerCase() === String(q.correctLabel||"").trim().toLowerCase();
    }
    return a===q.correct;
  }

  async function doSave(){
    clearTimeout(tRef.current);
    // Never save an empty attempt (e.g. opened then left, or timer ran out with no answers)
    if(Object.keys(answers).length===0){ onDone(); return; }
    const sc=quiz.questions.filter(q=>isCorrect(q)).length;
    setSaving(true);
    // Convert shuffled answers back to ORIGINAL option indexes so teacher stats stay correct
    const origAnswers={};
    quiz.questions.forEach(q=>{
      const sel=answers[q.id];
      if(sel===undefined)return;
      if(quiz.type==="Listening" && quiz.listenMatch){
        // Convert the picked letter back to the ORIGINAL letter so teacher stats/review stay correct
        if(quiz.matchShuffle && quiz.matchAnswers && rawQuiz.matchAnswers){
          const li=String(sel||"").trim().toLowerCase().charCodeAt(0)-97;
          const txt=quiz.matchAnswers[li];
          const oi=rawQuiz.matchAnswers.findIndex(a=>String(a).trim().toLowerCase()===String(txt||"").trim().toLowerCase());
          origAnswers[q.id]= oi>=0 ? String.fromCharCode(97+oi) : sel;
        } else origAnswers[q.id]=sel;
        return;
      }
      if(quiz.type==="Image Labeling" && (quiz.labelAnswerMode==="write"||quiz.labelAnswerMode==="number")){ origAnswers[q.id]=sel; return; }
      const selText=q.options[sel];
      const orig=rawQuiz.questions.find(oq=>oq.id===q.id);
      if(orig){const oi=orig.options.indexOf(selText);origAnswers[q.id]=oi>=0?oi:sel;}
      else origAnswers[q.id]=sel;
    });
    const entry={id:uid(),studentId:student.id,quizId:quiz.id,score:sc,totalQ:total,answers:origAnswers,attempt:prev+1,selfRating:rating,completedAt:today(),ts:Date.now()};
    await fsSet("responses",entry.id,entry);
    if(onSaved) await onSaved();
    setScore(sc);setSaving(false);setSubmitted(true);setTab("results");
  }
  async function handleSubmit(){
    if(Object.keys(answers).length<total){setMErr("Please answer all "+total+" questions.");return;}
    const sc=quiz.questions.filter(q=>isCorrect(q)).length;
    if(pct(sc,total)<thresh){setMErr("You scored "+pct(sc,total)+"% — need "+thresh+"% to submit. Review and try again! 💪");setScore(sc);return;}
    setMErr("");await doSave();
  }

  const skillData = submitted?calcSkills([{quizId:quiz.id,answers,score,totalQ:total}],[quiz]):[];
  const tabs=[...(quiz.passage?[{id:"passage",icon:"📄",label:"Passage"}]:[]),{id:"questions",icon:"❓",label:"Questions"},...(submitted?[{id:"results",icon:"📊",label:"Results"}]:[])];

  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",fontFamily:F,background:C.bg}}>
      <HDR title={quiz.title} sub={quiz.type+" · "+quiz.difficulty}
        left={<button onClick={()=>{ if(submitted){onDone();} else if(Object.keys(answers).length===0){onDone();} else if(confirm("Leave the quiz? Your answers will not be saved.")){onDone();} }} style={{background:"none",border:"none",color:"#fff",cursor:"pointer",fontSize:"22px",padding:"0 4px",lineHeight:1}}>←</button>}
        right={<>
          {timeLeft!==null && <div style={{background:timeLeft<60?"rgba(239,68,68,0.3)":"rgba(255,255,255,0.12)",borderRadius:"8px",padding:"5px 10px",color:timeLeft<60?"#fca5a5":"#fff",fontWeight:"800",fontSize:"14px",fontFamily:F}}>⏱ {fmt(timeLeft)}</div>}
          <div style={{background:"rgba(255,255,255,0.1)",borderRadius:"8px",padding:"6px 10px",textAlign:"right"}}>
            <div style={{color:C.mu,fontSize:"9px",fontFamily:F}}>Student</div>
            <div style={{color:"#fff",fontSize:"12px",fontWeight:"700",fontFamily:F}}>{student.name}</div>
          </div>
        </>}/>
      <TabBar tabs={tabs} active={tab} onChange={setTab}/>
      <div style={{flex:1,overflowY:"auto"}}>
      <div style={{maxWidth:"700px",margin:"0 auto",padding:"14px",paddingBottom:"120px"}}>
        {tab==="passage" && (quiz.passage||quiz.audioFile) && <div>
          <Card style={{marginBottom:"11px"}}>
            <strong style={{fontSize:"14px",color:C.tx,fontFamily:F,display:"block",marginBottom:"11px"}}>{quiz.type==="Listening"?"🎧 Listening Track":"📖 Reading Passage"}</strong>
            {quiz.type==="Listening"
              ? <div style={{background:"#f0f9ff",borderRadius:"9px",padding:"20px",textAlign:"center"}}>
                  <div style={{fontSize:"36px",marginBottom:"7px"}}>🎧</div>
                  {quiz.audioFile && <audio ref={audioElRef} src={quiz.audioFile} onEnded={()=>setIsPlaying(false)} preload="auto" playsInline style={{display:"none"}}/>}
                  <p style={{color:C.mu,fontSize:"12px",margin:"0 0 13px",fontFamily:F}}>{canListen?"Use the controls to listen.":"You have used all your listens."}</p>
                  <div style={{display:"flex",gap:"7px",justifyContent:"center",flexWrap:"wrap",marginBottom:"10px"}}>
                    {AC.seek && <Btn size="sm" color={C.mu} onClick={()=>seekAudio(-10)} disabled={!canListen}>⏪ 10s</Btn>}
                    {(!isPlaying || !AC.pause) ? <Btn onClick={playAudio} disabled={!canListen||(isPlaying&&!AC.pause)}>▶ Play</Btn> : <Btn color={C.w} onClick={pauseAudio}>⏸ Pause</Btn>}
                    {AC.restart && <Btn size="sm" color={C.p} onClick={restartAudio} disabled={!canListen}>🔁 Restart</Btn>}
                    {AC.seek && <Btn size="sm" color={C.mu} onClick={()=>seekAudio(10)} disabled={!canListen}>10s ⏩</Btn>}
                    {AC.speed && <Btn size="sm" color={C.pu} onClick={cycleSpeed}>⚡ {playSpeed}x</Btn>}
                  </div>
                  {!quiz.audioFile && getTTSChunks().length>1 && <p style={{color:C.mu,fontSize:"11px",margin:"0 0 6px",fontFamily:F}}>Sentence {ttsIndex+1} / {getTTSChunks().length}</p>}
                  {listensLeft!==null && <p style={{color:listensLeft>0?C.s:C.d,fontSize:"12px",fontWeight:"700",margin:0,fontFamily:F}}>🎧 Listens left: {listensLeft} / {listenLimit}</p>}
                </div>
              : <div style={{background:"#f8fafc",borderRadius:"9px",padding:"16px",border:"1px solid "+C.br}}>
                  {quiz.passage.split("\n\n").map((p,i)=><p key={i} style={{color:C.tx,fontSize:"14px",lineHeight:"1.9",margin:"0 0 11px",textAlign:"justify",fontFamily:F}}>{p}</p>)}
                </div>}
          </Card>
          <Btn size="lg" onClick={()=>setTab("questions")} style={{width:"100%"}}>Answer Questions →</Btn>
        </div>}

        {tab==="questions" && <div>
          <div style={{background:"#dbeafe",borderRadius:"9px",padding:"9px 13px",marginBottom:"12px",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:"4px"}}>
            <span style={{color:"#1e40af",fontWeight:"600",fontSize:"12px",fontFamily:F}}>{quiz.type==="Image Labeling"?"🖼️ Identify the parts":"📝 "+total+" questions"} · Pass: {thresh}%</span>
            <span style={{color:"#1e40af",fontWeight:"700",fontSize:"12px",fontFamily:F}}>{Object.keys(answers).length}/{total} answered</span>
          </div>
          {quiz.type==="Image Labeling" && quiz.labelImage && <div style={{marginBottom:"12px",textAlign:"center",position:"sticky",top:0,background:C.bg,padding:"6px 0",zIndex:5}}>
            <img src={quiz.labelImage} alt="label" style={{maxWidth:"100%",maxHeight:"300px",borderRadius:"10px",border:"2px solid "+C.br}}/>
            <p style={{fontSize:"11px",color:C.mu,margin:"5px 0 0",fontFamily:F}}>{quiz.labelAnswerMode==="number"?"Look at the numbered parts on the image, then write the correct number next to each word in the table below.":"Look at the numbered parts on the image and identify each one below."}</p>
          </div>}
          {quiz.type==="Listening" && (quiz.passage||quiz.audioFile) && <div style={{marginBottom:"12px",position:"sticky",top:0,zIndex:5,background:"#f0f9ff",borderRadius:"9px",padding:"10px 12px",border:"1px solid #bae6fd"}}>
            {quiz.audioFile && <audio ref={audioElRef} src={quiz.audioFile} onEnded={()=>setIsPlaying(false)} preload="auto" playsInline style={{display:"none"}}/>}
            <div style={{display:"flex",gap:"6px",justifyContent:"center",flexWrap:"wrap",alignItems:"center"}}>
              <span style={{fontSize:"16px"}}>🎧</span>
              {AC.seek && <Btn size="sm" color={C.mu} onClick={()=>seekAudio(-10)} disabled={!canListen}>⏪</Btn>}
              {(!isPlaying || !AC.pause) ? <Btn size="sm" onClick={playAudio} disabled={!canListen||(isPlaying&&!AC.pause)}>▶ Play</Btn> : <Btn size="sm" color={C.w} onClick={pauseAudio}>⏸</Btn>}
              {AC.restart && <Btn size="sm" color={C.p} onClick={restartAudio} disabled={!canListen}>🔁</Btn>}
              {AC.seek && <Btn size="sm" color={C.mu} onClick={()=>seekAudio(10)} disabled={!canListen}>⏩</Btn>}
              {AC.speed && <Btn size="sm" color={C.pu} onClick={cycleSpeed}>⚡ {playSpeed}x</Btn>}
              {listensLeft!==null && <span style={{color:listensLeft>0?C.s:C.d,fontSize:"11px",fontWeight:"700",fontFamily:F}}>({listensLeft} left)</span>}
              {!quiz.audioFile && getTTSChunks().length>1 && <span style={{color:C.mu,fontSize:"11px",fontWeight:"700",fontFamily:F}}>Sentence {ttsIndex+1}/{getTTSChunks().length}</span>}
            </div>

                      {submitted&&<div style={{marginTop:"6px",padding:"6px 10px",background:isC?"#f0fdf4":"#fef3c7",borderRadius:"7px",color:isC?"#166534":"#92400e",fontSize:"11px",fontFamily:F}}>{isC?"✅ Correct!":"✏️ Correct answer: "}<strong>{q.correctLabel}</strong></div>}
                    </div>
                  ) : (
                    <div style={{display:"grid",gap:"5px"}}>
                    {q.options.map((opt,i)=>{
                      const sel=answers[q.id]===i,corr=i===q.correct;
                      let bg="#f8fafc",bdr="1px solid "+C.br,col=C.tx;
                      if(submitted){if(corr){bg="#f0fdf4";bdr="2px solid "+C.s;col="#166534";}else if(sel){bg="#fef2f2";bdr="2px solid "+C.d;col="#991b1b";}}
                      else if(sel){bg="#eff6ff";bdr="2px solid "+C.p;col="#1e40af";}
                      return <button key={i} onClick={()=>!submitted&&setAnswers({...answers,[q.id]:i})}
                        style={{padding:"8px 11px",borderRadius:"8px",background:bg,border:bdr,color:col,fontSize:"13px",textAlign:"left",cursor:submitted?"default":"pointer",display:"flex",alignItems:"center",gap:"7px",fontFamily:F}}>
                        <span style={{minWidth:"19px",height:"19px",borderRadius:"50%",border:"2px solid "+(sel||(submitted&&corr)?"currentColor":C.br),display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",fontWeight:"700",flexShrink:0}}>{String.fromCharCode(65+i)}</span>
                        {opt}{submitted&&corr&&<span style={{marginLeft:"auto"}}>✅</span>}{submitted&&sel&&!corr&&<span style={{marginLeft:"auto"}}>❌</span>}
                      </button>;
                    })}
                    </div>
                  )}
                  {submitted&&isW&&quiz.type!=="Image Labeling"&&<div style={{marginTop:"6px",padding:"6px 10px",background:"#fef3c7",borderRadius:"7px",color:"#92400e",fontSize:"11px",fontFamily:F}}>✏️ Correct: <strong>{q.options[q.correct]}</strong></div>}
                </div>
              </div>
            </Card>;
          })}
          {!submitted && <Card style={{marginBottom:"9px",background:"#f8fafc"}}>
            <p style={{margin:"0 0 7px",fontSize:"12px",fontWeight:"600",color:C.tx,fontFamily:F}}>⭐ How confident did you feel?</p>
            <div style={{display:"flex",gap:"5px"}}>{[1,2,3,4,5].map(n=><button key={n} onClick={()=>setRating(n)} style={{fontSize:"19px",background:"none",border:"none",cursor:"pointer",opacity:rating>=n?1:0.25}}>{n<=rating?"⭐":"☆"}</button>)}</div>
          </Card>}
          {!submitted
            ? <Btn onClick={handleSubmit} disabled={saving} size="lg" style={{width:"100%"}} color={saving?"#94a3b8":C.md}>{saving?"Saving…":"Submit Quiz ✓"}</Btn>
            : <Btn onClick={()=>setTab("results")} size="lg" style={{width:"100%"}} color={C.s}>View Results 📊</Btn>}
        </div>}

        {tab==="results" && submitted && (()=>{
          const p=pct(score,total);
          const g=p===100?{c:C.s,bg:"#f0fdf4",l:"Perfect! 🌟"}:p>=75?{c:C.p,bg:"#eff6ff",l:"Great Job! 👍"}:p>=thresh?{c:C.w,bg:"#fffbeb",l:"Passed! 📚"}:{c:C.d,bg:"#fef2f2",l:"Keep Trying 💪"};
          return <div>
            <Card style={{background:g.bg,border:"2px solid "+g.c,textAlign:"center",marginBottom:"12px"}}>
              <div style={{fontSize:"46px",fontWeight:"900",color:g.c,lineHeight:1,fontFamily:F}}>{score}<span style={{fontSize:"18px",color:C.mu}}>/{total}</span></div>
              <div style={{fontSize:"17px",fontWeight:"700",color:g.c,margin:"4px 0",fontFamily:F}}>{g.l}</div>
              {p>=thresh?<div style={{background:C.s+"20",color:"#166534",borderRadius:"7px",padding:"4px 11px",display:"inline-block",fontSize:"11px",fontWeight:"700",fontFamily:F}}>✅ Mastery Achieved!</div>:<div style={{background:C.w+"20",color:"#92400e",borderRadius:"7px",padding:"4px 11px",display:"inline-block",fontSize:"11px",fontWeight:"700",fontFamily:F}}>📚 Need {thresh}% to pass</div>}
              <div style={{display:"flex",justifyContent:"center",gap:"9px",marginTop:"9px",flexWrap:"wrap"}}>
                {[{v:score,l:"Correct",c:C.s},{v:total-score,l:"Wrong",c:C.d},{v:p+"%",l:"Score",c:C.p}].map(s=>(
                  <div key={s.l} style={{background:C.wh,borderRadius:"8px",padding:"7px 13px",textAlign:"center"}}>
                    <div style={{fontSize:"15px",fontWeight:"800",color:s.c,fontFamily:F}}>{s.v}</div>
                    <div style={{fontSize:"10px",color:C.mu,fontFamily:F}}>{s.l}</div>
                  </div>
                ))}
              </div>
            </Card>
            {skillData.length>0 && <Card style={{marginBottom:"11px"}}><strong style={{fontSize:"12px",color:C.tx,display:"block",marginBottom:"9px",fontFamily:F}}>📚 Skill Breakdown</strong>{skillData.map(s=><SBar key={s.skill} {...s}/>)}</Card>}
            <Card style={{marginBottom:"11px",background:"#eff6ff",border:"1px solid #93c5fd",textAlign:"center"}}>
              <p style={{margin:"0 0 9px",fontSize:"13px",color:"#1e40af",fontWeight:"600",fontFamily:F}}>👀 See which answers were right or wrong</p>
              <Btn onClick={()=>setTab("questions")} style={{width:"100%"}} color={C.p}>🔍 Review My Answers</Btn>
            </Card>
            <Btn onClick={onDone} size="lg" style={{width:"100%"}} color={C.mu}>← Back to Quizzes</Btn>
          </div>;
        })()}
      </div></div>
    </div>
  );
}

// ── PROFILE EDITOR (students & teachers) ──────────────────────
function ProfileModal({user, classes, open, onClose, onSaved}) {
  const [name,setName]=useState(user.name||"");
  const [email,setEmail]=useState(user.email||"");
  const [studentId,setStudentId]=useState(user.studentId||"");
  const [classId,setClassId]=useState(user.classId||"");
  const [password,setPassword]=useState("");
  const [msg,setMsg]=useState("");
  const [saving,setSaving]=useState(false);

  useEffect(()=>{ if(open){ setName(user.name||"");setEmail(user.email||"");setStudentId(user.studentId||"");setClassId(user.classId||"");setPassword("");setMsg(""); } },[open]);

  async function save(){
    setMsg("");
    if(!name.trim()){setMsg("Name cannot be empty.");return;}
    if(user.role==="student" && !studentId.trim()){setMsg("Student ID cannot be empty.");return;}
    setSaving(true);
    try {
      const all = await fsAll("users");
      // Check duplicate Student ID (other than this user)
      if(user.role==="student" && all.find(u=>u.id!==user.id && (u.studentId||"")===studentId.trim())){setMsg("That Student ID is already used by someone else.");setSaving(false);return;}
      // Check duplicate email (other than this user)
      if(email.trim() && all.find(u=>u.id!==user.id && (u.email||"").toLowerCase()===email.trim().toLowerCase())){setMsg("That email is already used.");setSaving(false);return;}
      const updated = {...user, name:name.trim(), email:email.trim().toLowerCase()};
      if(user.role==="student"){ updated.studentId=studentId.trim(); updated.classId=classId; }
      if(password.trim()) updated.password=password.trim();
      await fsSet("users", user.id, updated);
      saveSession(updated);
      await onSaved(updated);
      setMsg("✅ Saved!");
      setTimeout(()=>{ onClose(); }, 600);
    } catch(e){ setMsg("Error saving: "+(e.message||e)); }
    setSaving(false);
  }

  const inp={width:"100%",padding:"10px 12px",borderRadius:"8px",border:"1px solid "+C.br,fontSize:"13px",outline:"none",background:"#f8fafc",color:C.tx,fontFamily:F,boxSizing:"border-box",marginBottom:"9px"};

  return (
    <Modal open={open} onClose={onClose} title="⚙️ My Profile">
      {msg && <div style={{background:msg.startsWith("✅")?"#f0fdf4":"#fef2f2",border:"1px solid "+(msg.startsWith("✅")?"#86efac":"#fca5a5"),borderRadius:"7px",padding:"8px 11px",color:msg.startsWith("✅")?"#166534":"#991b1b",fontSize:"12px",marginBottom:"10px",fontFamily:F}}>{msg}</div>}
      <Label text="Full Name *"/>
      <input value={name} onChange={e=>setName(e.target.value)} style={inp}/>
      {user.role==="student" && <>
        <Label text="Student ID *"/>
        <input value={studentId} onChange={e=>setStudentId(e.target.value)} style={inp}/>
        <Label text="Class"/>
        <select value={classId} onChange={e=>setClassId(e.target.value)} style={inp}>
          <option value="">No class</option>
          {classes.map(c=><option key={c.id} value={c.id}>{c.name}{c.grade?" ("+c.grade+")":""}</option>)}
        </select>
      </>}
      <Label text={"Email "+(user.role==="student"?"(optional)":"*")}/>
      <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="email@example.com" style={inp}/>
      <Label text="New Password (leave blank to keep current)"/>
      <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" style={inp}/>
      <Btn onClick={save} disabled={saving} style={{width:"100%",marginTop:"4px"}}>{saving?"Saving…":"💾 Save Changes"}</Btn>
    </Modal>
  );
}

// ── REVIEW PAST QUIZ (see mistakes anytime) ───────────────────
function ReviewModal({response, quiz, open, onClose}) {
  if (!open || !response || !quiz) return null;
  const p = pct(response.score, response.totalQ);
  return (
    <Modal open={open} onClose={onClose} title={"📋 Review: "+quiz.title}>
      <div style={{textAlign:"center",marginBottom:"12px",padding:"10px",background:gc(p)+"15",borderRadius:"9px"}}>
        <div style={{fontSize:"26px",fontWeight:"900",color:gc(p),fontFamily:F}}>{response.score}/{response.totalQ} <span style={{fontSize:"16px"}}>({p}%)</span></div>
        <div style={{fontSize:"11px",color:C.mu,fontFamily:F}}>{quiz.type} · {response.completedAt} · Attempt #{response.attempt}</div>
      </div>
      {quiz.questions.map((q,idx)=>{
        const sel = response.answers ? response.answers[q.id] : undefined;
        const answered = sel!==undefined;
        const isLabelNum = quiz.type==="Image Labeling" && quiz.labelAnswerMode==="number";
        const isLabelWrite = quiz.type==="Image Labeling" && quiz.labelAnswerMode==="write";
        const isMatch = quiz.type==="Listening" && quiz.listenMatch;
        let isC;
        if(isLabelNum){ const cn=q.correctNum||String(idx+1); isC=String(sel).trim()===String(cn).trim(); }
        else if(isLabelWrite){ isC=String(sel||"").trim().toLowerCase()===String(q.correctLabel||"").trim().toLowerCase(); }
        else if(isMatch){ isC=String(sel||"").trim().toLowerCase()===String(q.correctLabel||"").trim().toLowerCase(); }
        else { isC = sel===q.correct; }
        if(isLabelNum || isLabelWrite || isMatch){
          const correctVal = isLabelNum ? (q.correctNum||String(idx+1)) : q.correctLabel;
          const labelWord = isLabelNum ? (q.correctLabel||q.text) : isMatch ? ((idx+1)+". "+q.text) : ("Part "+(idx+1));
          return (
            <div key={q.id} style={{marginBottom:"10px",padding:"10px",borderRadius:"9px",border:"2px solid "+(isC?C.s:C.d),background:isC?"#f0fdf4":"#fef2f2"}}>
              <div style={{display:"flex",gap:"7px",alignItems:"center"}}>
                <span style={{minWidth:"22px",height:"22px",borderRadius:"50%",background:isC?C.s:C.d,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"700",fontSize:"11px",flexShrink:0}}>{isC?"✓":"✗"}</span>
                <div style={{flex:1,fontSize:"13px",fontFamily:F,color:C.tx}}>
                  <strong>{labelWord}</strong>
                  <div style={{fontSize:"12px",marginTop:"3px"}}>
                    {isLabelNum?"Your number: ":isMatch?"Your letter: ":"Your answer: "}<strong style={{color:isC?"#166534":"#991b1b"}}>{answered?sel:"—"}</strong>
                    {!isC && <span style={{color:"#166534"}}>{" · Correct: "}<strong>{correctVal}</strong></span>}
                  </div>
                </div>
              </div>
              {!answered && <p style={{margin:"5px 0 0",fontSize:"11px",color:C.mu,fontStyle:"italic",fontFamily:F}}>You did not answer this.</p>}
            </div>
          );
        }
        return (
          <div key={q.id} style={{marginBottom:"12px",padding:"10px",borderRadius:"9px",border:"2px solid "+(isC?C.s:C.d),background:isC?"#f0fdf4":"#fef2f2"}}>
            <div style={{display:"flex",gap:"7px",marginBottom:"6px"}}>
              <span style={{minWidth:"22px",height:"22px",borderRadius:"50%",background:isC?C.s:C.d,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"700",fontSize:"11px",flexShrink:0}}>{isC?"✓":"✗"}</span>
              <div style={{flex:1}}>
                <span style={{fontSize:"9px",background:C.p+"18",color:C.p,padding:"1px 7px",borderRadius:"999px",fontWeight:"600",fontFamily:F}}>{q.skill}</span>
                <p style={{margin:"5px 0",fontSize:"13px",fontWeight:"600",color:C.tx,lineHeight:"1.5",fontFamily:F}}>{idx+1}. {q.text}</p>
              </div>
            </div>
            <div style={{display:"grid",gap:"4px"}}>
              {q.options.map((opt,i)=>{
                const isCorrect = i===q.correct;
                const isPicked = i===sel;
                let bg="#fff",bdr="1px solid "+C.br,col=C.tx;
                if(isCorrect){bg="#dcfce7";bdr="2px solid "+C.s;col="#166534";}
                else if(isPicked){bg="#fee2e2";bdr="2px solid "+C.d;col="#991b1b";}
                return (
                  <div key={i} style={{padding:"7px 10px",borderRadius:"7px",background:bg,border:bdr,color:col,fontSize:"12px",display:"flex",alignItems:"center",gap:"6px",fontFamily:F}}>
                    <span style={{fontWeight:"700"}}>{String.fromCharCode(65+i)}.</span>
                    <span style={{flex:1}}>{opt}</span>
                    {isCorrect && <span>✅</span>}
                    {isPicked && !isCorrect && <span>❌ your answer</span>}
                  </div>
                );
              })}
            </div>
            {!answered && <p style={{margin:"5px 0 0",fontSize:"11px",color:C.mu,fontStyle:"italic",fontFamily:F}}>You did not answer this question.</p>}
          </div>
        );
      })}
      <Btn onClick={onClose} style={{width:"100%",marginTop:"4px"}} color={C.mu}>Close</Btn>
    </Modal>
  );
}

function StudentApp({user, data, onLogout, reload, directQuiz, clearDirect}) {
  const [tab,setTab] = useState("home");

  const [profileOpen,setProfileOpen] = useState(false);
  const [reviewResp,setReviewResp] = useState(null);

  const myClass = data.classes.find(c=>c.id===user.classId);
  const available = data.quizzes.filter(q=>{
    // Private quiz: only assigned students can see it
    if(q.assignedStudents && q.assignedStudents.length>0){
      if(!q.assignedStudents.includes(user.id)) return false;
    } else {
      // Otherwise use class targeting (empty = everyone)
      const forMe=!q.classIds||q.classIds.length===0||q.classIds.includes(user.classId);
      if(!forMe) return false;
    }
    const open=q.status!=="closed"&&(!q.closeDate||new Date(q.closeDate)>=new Date());
    return open;
  });
  const myAnn = data.announcements.filter(a=>!a.classIds||a.classIds.length===0||a.classIds.includes(user.classId));
  const skills = calcSkills(myResps,data.quizzes);
  const badges = calcBadges(myResps,data.quizzes);

      setAiMsg("");
    } catch(e) {
      setAiMsg("Generation failed: " + (e.message||e));
    }
    setAiLoading(false);
  }
  async function runAIFile(e) {
    const file = e.target.files[0]; e.target.value="";
    if(!file) return;
    setAiMsg(""); setErr("");
    if (!aiKey.trim()) { setAiMsg("Please enter your AI key first."); return; }
    setAiLoading(true);
    try {
      const txt = await extractFileText(file);
      if (!txt || txt.trim().length < 20) { setAiMsg("Could not read text from this file. Try a .txt file or paste the text instead."); setAiLoading(false); return; }
      setAIKey(aiKey.trim());
      const result = await generateQuizAI({apiKey:aiKey.trim(), source:txt, sourceType:"file", count:aiCount, type, difficulty:diff});
      const qs = result.questions || result;
      if (type==="Listening" && result.script) setPassage(result.script);
      setPreview(qs); setShowImport(true); setShowAI(false);
    } catch(e) {
      setAiMsg("Generation failed: " + (e.message||e));
    }
    setAiLoading(false);
  }

  function parseRows(rows){
    setErr("");
    if(!rows||!rows.length){setErr("No rows found.");return;}

    // Auto-detect skill. For Grammar/Vocab quiz types, FORCE the skill to match the type
    // (ignore any "Main Idea" etc. that came from the file or AI).
    function autoSkill(text, providedSkill) {
      return detectSkill(text, providedSkill, type);
    }

    // Try to detect a header row and map columns by name
    const first = rows[0] || [];
    const headerText = first.map(c=>String(c||"").trim().toLowerCase());
    const looksHeader = headerText.some(h => h.includes("question")||h.includes("option")||h.includes("answer")||h.includes("correct"));

    let colMap = null;
    if (looksHeader) {
      colMap = {q:-1,a:-1,b:-1,c:-1,d:-1,correct:-1,skill:-1,diff:-1};
      headerText.forEach((h,i)=>{
        if (colMap.q<0 && (h==="question"||h.includes("question text")||(h.includes("question")&&!h.includes("no")&&!h.includes("type")&&!h.includes("number"))) ) colMap.q=i;
        else if (h==="a"||h==="option a"||h.includes("option a")||h==="opt a") colMap.a=i;
        else if (h==="b"||h==="option b"||h.includes("option b")||h==="opt b") colMap.b=i;
        else if (h==="c"||h==="option c"||h.includes("option c")||h==="opt c") colMap.c=i;
        else if (h==="d"||h==="option d"||h.includes("option d")||h==="opt d") colMap.d=i;
        else if (h.includes("correct")||h.includes("answer")||h==="key") colMap.correct=i;
        else if (h.includes("skill")) colMap.skill=i;
        else if (h.includes("difficulty")||h.includes("level")) colMap.diff=i;
      });
      // If we couldn't find proper option columns by name, fall back to position
      if (colMap.q<0||colMap.a<0||colMap.b<0) colMap = null;
    }

    let startRow = looksHeader ? 1 : 0;
    const data = rows.slice(startRow).filter(r=>r&&r.length&&String(r[colMap?colMap.q:0]||"").trim());
    if(!data.length){setErr("No question rows found. Each row needs a question, 4 options, and the correct answer.");return;}

    const result=[],skipped=[];
    data.forEach((r,i)=>{
      let q,a,b,c,d,cl,sk,df;
      if (colMap) {
        q=String(r[colMap.q]||"").trim();
        a=String(r[colMap.a]||"").trim();
        b=String(r[colMap.b]||"").trim();
        c=colMap.c>=0?String(r[colMap.c]||"").trim():"";
        d=colMap.d>=0?String(r[colMap.d]||"").trim():"";
        cl=colMap.correct>=0?String(r[colMap.correct]||"A").trim().toUpperCase():"A";
        sk=colMap.skill>=0?String(r[colMap.skill]||"").trim():"";
        df=colMap.diff>=0?String(r[colMap.diff]||"").trim():"";
      } else {
        q=String(r[0]||"").trim();a=String(r[1]||"").trim();b=String(r[2]||"").trim();c=String(r[3]||"").trim();d=String(r[4]||"").trim();
        cl=String(r[5]||"A").trim().toUpperCase();sk=String(r[6]||"").trim();df=String(r[7]||"").trim();
      }
      if(!q||!a||!b||!c||!d){skipped.push(i+startRow+1);return;}
      // correct can be a letter (A-D) or a number (1-4) or the answer text
      let ci = ["A","B","C","D"].indexOf(cl);
      if (ci<0) { const n=parseInt(cl); if(n>=1&&n<=4) ci=n-1; }
      if (ci<0) { const opts=[a,b,c,d].map(x=>x.toLowerCase()); const f=opts.indexOf(cl.toLowerCase()); if(f>=0) ci=f; }
      if (ci<0) ci=0;
      result.push({id:result.length+1,text:q,options:[a,b,c,d],correct:ci,skill:autoSkill(q,sk),difficulty:DIFFICULTIES.includes(df)?df:diff});
    });
    if(!result.length){setErr("Could not read questions. Make sure your file has columns: Question, Option A, B, C, D, and Correct answer.");return;}
    if(skipped.length)setErr("Imported "+result.length+". Skipped rows "+skipped.join(", ")+" (missing data).");
    setPreview(result);setShowImport(true);
  }
  function handleFile(e){
    const file=e.target.files[0];if(!file)return;setErr("");setPreview(null);
    const isCSV=file.name.toLowerCase().endsWith(".csv");const reader=new FileReader();
    reader.onerror=()=>setErr("Could not read file. Try CSV.");
    reader.onload=ev=>{try{
      let rows=[];
      if(isCSV){const lines=ev.target.result.trim().split(/[\r\n]+/).filter(l=>l.trim());rows=lines.map(parseCsvLine);}
      else{const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellText:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:false});}
      parseRows(rows);
    }catch(ex){setErr("Import failed: "+ex.message+". Try CSV.");}};
    e.target.value="";if(isCSV)reader.readAsText(file);else reader.readAsArrayBuffer(file);
  }
  function parseCsvLine(line){const cols=[];let cur="",inQ=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"')inQ=!inQ;else if(ch===","&&!inQ){cols.push(cur.trim());cur="";}else cur+=ch;}cols.push(cur.trim());return cols;}
  function parsePaste(){
    if(!csvPaste.trim()){setErr("Paste your questions first.");return;}
    setErr("");setPreview(null);
    const lines=csvPaste.trim().split(/[\r\n]+/).filter(l=>l.trim());
    const useTab=lines[0].includes("\t");
    const rows=lines.map(l=>useTab?l.split("\t").map(x=>x.trim()):parseCsvLine(l));
    parseRows(rows);
  }
  function applyPreview(){setQuestions(preview);setPreview(null);setShowImport(false);setShowPaste(false);setCsvPaste("");}
  function save(){
    if(!title.trim()){setErr("⚠️ Add a quiz title.");window.scrollTo(0,0);return;}
    let valid;
    if(type==="Image Labeling"){
      if(!labelImage){setErr("⚠️ Add an image first (upload or paste a URL).");window.scrollTo(0,0);return;}
      // Each part needs a correct label. If choose-mode, options must be filled.
      valid=questions.filter(q=>(q.correctLabel||"").trim());
      if(!valid.length){setErr("⚠️ Add at least one word with its correct name.");return;}
      if(labelAnswerMode==="number"){
        const bad=valid.find(q=>!String(q.correctNum||"").trim());
        if(bad){setErr("⚠️ Each word needs its number (the number it matches on the image).");return;}
      }
      if(labelAnswerMode==="choose"){
        const bad=valid.find(q=>!q.options.every(o=>o.trim()));
        if(bad){setErr("⚠️ In choose mode, fill all 4 options for each part.");return;}
        // ensure correct index points to the correctLabel
        valid=valid.map(q=>{const ci=q.options.findIndex(o=>o.trim().toLowerCase()===(q.correctLabel||"").trim().toLowerCase());return {...q,correct:ci>=0?ci:0};});
      }
    } else if(type==="Listening" && listenMatch){
      const ans=matchAnswers.filter(a=>a.trim());
      if(ans.length<2){setErr("⚠️ Add at least 2 answer choices (a, b, c…).");return;}
      valid=questions.filter(q=>q.text.trim()&&String(q.correctLabel||"").trim());
      if(!valid.length){setErr("⚠️ Add at least one question with its correct letter.");return;}
      // normalize correct letter to lowercase
      valid=valid.map(q=>({...q,correctLabel:String(q.correctLabel).trim().toLowerCase()}));
    } else {
      valid=questions.filter(q=>q.text.trim()&&q.options.every(o=>o.trim()));
      if(!valid.length){setErr("⚠️ Add at least one complete question or import.");return;}
      const incomplete=questions.filter(q=>q.text.trim()||q.options.some(o=>o.trim())).filter(q=>!q.text.trim()||q.options.some(o=>!o.trim()));
      if(incomplete.length){setErr("⚠️ Some questions are incomplete.");return;}
    }
    // Safety: block oversized embedded audio (Firestore limit ~1MB per quiz)
    if(type==="Listening" && audioFile && audioFile.startsWith("data:") && audioFile.length>850000){
      setErr("⚠️ The uploaded audio is too large to save. Please use a shorter clip, or upload the audio to a website and paste its LINK instead.");window.scrollTo(0,0);return;
    }
    onSave({id:E.id||uid(),code:E.code||shortCode(),teacherId:teacher.id,title:title.trim(),type,difficulty:diff,subject,classIds,timer,masteryThreshold:thresh,allowRetake:retake,shuffle,mode,instantFeedback,gameTimerType,gameTimerSec,assignedStudents:visibility==="private"?assignedStudents:[],closeDate,passage,labelImage:type==="Image Labeling"?labelImage:"",labelAnswerMode:type==="Image Labeling"?labelAnswerMode:"",audioFile:type==="Listening"?audioFile:"",listenLimit:type==="Listening"?listenLimit:0,listenMatch:type==="Listening"?listenMatch:false,matchShuffle:type==="Listening"&&listenMatch?matchShuffle:false,matchAnswers:type==="Listening"&&listenMatch?matchAnswers.filter(a=>a.trim()):[],audioControls:type==="Listening"?audioControls:null,questions:valid,status:E.id?(E.status||"open"):"open",createdAt:E.createdAt||today()});
  }

                  <input value={opt} onChange={e=>updO(qi,oi,e.target.value)} placeholder={"Option "+String.fromCharCode(65+oi)} style={{...inp,border:q.correct===oi?"2px solid "+C.s:"1px solid "+C.br}}/>
                </div>

            <p style={{margin:"5px 0 0",fontSize:"10px",color:C.mu,fontFamily:F}}>Tap a letter to mark the correct answer</p>
